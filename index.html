    { id: 89, soal: "Bagaimana akses terhadap kesempatan ekonomi dapat mengatasi kesenjangan?", jawaban: "Mendorong akses lebih merata terhadap peluang ekonomi bagi kelompok kurang mampu, melalui program bantuan dan insentif bagi usaha kecil dan mikro (hal. 20)" },
    { id: 260, soal: "Sebutkan contoh peluang ekonomi yang aksesnya perlu diratakan bagi kelompok kurang mampu!", jawaban: "Kredit, pinjaman usaha kecil, dan akses pasar (hal. 20)" },
    { id: 90, soal: "Apa akibat infrastruktur yang tidak merata?", jawaban: "Lambatnya pengiriman barang sehingga biaya produksi naik (hal. 20)" },
    { id: 212, soal: "Berikan contoh penyediaan infrastruktur untuk mengurangi kesenjangan!", jawaban: "Pembangunan pelabuhan, sehingga kegiatan mengirim dan menerima barang dapat dilakukan dengan cepat (hal. 20)" },
    { id: 91, soal: "Bagaimana memperbanyak lapangan kerja dapat mengatasi kesenjangan?", jawaban: "Lapangan kerja adalah sumber pendapatan utama masyarakat (hal. 20)" },
    { id: 261, soal: "Apa dampak lapangan kerja yang luas terhadap kesenjangan ekonomi?", jawaban: "Dapat menekan kesenjangan secara efektif (hal. 20)" },
    { id: 213, soal: "Bagaimana subsidi dapat mengatasi kesenjangan?", jawaban: "Pemerintah memberi bantuan langsung maupun bantuan modal/alat (hal. 20)" },
    { id: 262, soal: "Apa tujuan pemerintah memberi subsidi?", jawaban: "Agar masyarakat dapat meningkatkan kegiatan ekonominya, sehingga mendorong pendapatan daerah dan mengatasi kesenjangan (hal. 20)" },
    { id: 92, soal: "Apa pengertian kebijakan fiskal?", jawaban: "Kebijakan ekonomi untuk mengarahkan kondisi perekonomian menjadi lebih baik (hal. 20)" },
    { id: 263, soal: "Dengan cara apa kebijakan fiskal mengarahkan perekonomian?", jawaban: "Dengan mengubah penerimaan dan pengeluaran pemerintah (hal. 20)" },
    { id: 214, soal: "Apa tujuan kebijakan fiskal dalam mengatasi kesenjangan?", jawaban: "Mengatasi tingkat pengangguran dan mencapai tingkat pekerjaan yang tinggi (hal. 20)" },

    // ── Hal. 21 — Kemiskinan: kondisi, definisi, jenis ──
    { id: 93, soal: "Kemiskinan di suatu negara ditandai dengan kondisi seperti apa?", jawaban: "Sebagian penduduk tidak mampu memenuhi kebutuhan dasar hidupnya (hal. 21)" },
    { id: 264, soal: "Sebutkan contoh kebutuhan dasar hidup!", jawaban: "Sandang, pangan, papan, pendidikan, dan layanan kesehatan yang layak (hal. 21)" },
    { id: 94, soal: "Kondisi kemiskinan umumnya dipengaruhi oleh apa?", jawaban: "Keterbatasan lapangan pekerjaan yang layak, rendahnya pendapatan masyarakat, serta ketimpangan pembangunan antarwilayah (hal. 21)" },
    { id: 215, soal: "Apa dampak kemiskinan jika dibiarkan?", jawaban: "Rendahnya kualitas SDM, meningkatnya masalah sosial, hingga terhambatnya pertumbuhan ekonomi nasional (hal. 21)" },
    { id: 95, soal: "Apa pengertian kemiskinan menurut Gillin?", jawaban: "Kondisi ketika seorang individu tidak dapat mempertahankan skala hidupnya yang cukup tinggi untuk memberikan efisiensi fisik serta mental, agar memungkinkan dirinya dan keluarganya menjalankan fungsi sebagaimana mestinya sesuai standar masyarakat yang baik (hal. 21)" },
    { id: 96, soal: "Apa pengertian kemiskinan menurut Giovanni (2018)?", jawaban: "Ketidakmampuan dalam memenuhi kebutuhan manusia yang beraneka ragam yang selanjutnya dapat dipandang melalui berbagai aspek (hal. 21)" },
    { id: 97, soal: "Sebutkan tiga karakteristik umum kemiskinan di Indonesia!", jawaban: "1. Sebagian besar rumah tangga berada di garis kemiskinan nasional, sehingga banyak individu rentan terhadap kemiskinan\n2. Kemiskinan tidak diukur berdasarkan garis kemiskinan yang sebenarnya, tetapi berdasarkan pendapatan\n3. Memiliki perbedaan dan luas wilayah yang signifikan (hal. 21)" },
    { id: 98, soal: "Menurut Ali Khomsan dkk, sebutkan jenis-jenis kemiskinan!", jawaban: "1. Kemiskinan absolut\n2. Kemiskinan relatif\n3. Kemiskinan kultural\n4. Kemiskinan struktural (hal. 21–22)" },
    { id: 99, soal: "Apa pengertian kemiskinan absolut (menurut Ali Khomsan dkk)?", jawaban: "Kemiskinan yang mendeskripsikan individu yang tingkat pendapatannya di bawah garis kemiskinan yang ditetapkan negara (hal. 21)" },
    { id: 265, soal: "Selain pendapatan di bawah garis kemiskinan, kemiskinan absolut juga berarti keadaan seperti apa?", jawaban: "Penghasilan individu tidak cukup untuk memenuhi kebutuhan primernya (hal. 21)" },
    { id: 100, soal: "Apa pengertian kemiskinan relatif (menurut Ali Khomsan dkk)?", jawaban: "Kemiskinan akibat kebijakan pembangunan yang belum merata sehingga belum menjangkau seluruh masyarakat (hal. 21–22)" },
    { id: 216, soal: "Dalam kemiskinan relatif, mengapa penduduk yang sudah di atas garis kemiskinan tetap terlihat miskin?", jawaban: "Karena rata-rata pendapatan penduduk daerahnya lebih tinggi (hal. 21–22)" },
    { id: 217, soal: "Kemiskinan relatif juga bisa diartikan sebagai apa?", jawaban: "Kemiskinan dari perbandingan antara penduduk dan lingkungannya (hal. 21–22)" },
    { id: 266, soal: "Berikan contoh kemiskinan relatif sebagai hasil perbandingan!", jawaban: "Stigma A lebih miskin dari B karena pendapatan B lebih tinggi (hal. 21–22)" },

    // ── Hal. 22 — Kemiskinan kultural & struktural; faktor penyebab ──
    { id: 101, soal: "Apa pengertian kemiskinan kultural?", jawaban: "Kemiskinan yang terbentuk karena kebiasaan masyarakat yang sudah menjadi budaya (hal. 22)" },
    { id: 267, soal: "Sebutkan contoh kebiasaan yang membentuk kemiskinan kultural!", jawaban: "Nilai, pemikiran, maupun cara kerja (hal. 22)" },
    { id: 218, soal: "Sebutkan contoh kemiskinan kultural!", jawaban: "Malas, etos kerja rendah, mudah menyerah pada nasib, budaya KKN, menolak kemajuan iptek, ketergantungan bantuan, perilaku konsumtif berlebihan, mencuri, memilih jalan pintas, tidak mandiri (hal. 22)" },
    { id: 102, soal: "Apa pengertian kemiskinan struktural?", jawaban: "Kemiskinan yang berasal dari struktur sosial yang tersemat pada golongan masyarakat tertentu dan memungkinkan terjadinya kondisi di mana mereka tidak dapat menggunakan sumber daya yang sebenarnya tersedia untuk mereka (hal. 22)" },
    { id: 103, soal: "Sebutkan contoh kemiskinan struktural!", jawaban: "1. Daerah dengan SDA melimpah, tetapi masyarakatnya tidak dapat menikmati kekayaan tersebut\n2. Penggusuran/pembersihan lahan oleh pemerintah sehingga masyarakat kehilangan tempat tinggal dan pekerjaan\n3. Masyarakat kehilangan pekerjaan karena SDA daerahnya dikuasai investor asing yang memakai tenaga kerja asing\n4. Negara miskin karena tidak mampu membayar utang luar negeri (hal. 22)" },
    { id: 104, soal: "Sebutkan faktor penyebab terjadinya kemiskinan!", jawaban: "1. Laju pertumbuhan penduduk yang tinggi\n2. Meningkatnya pengangguran\n3. Pendidikan yang rendah\n4. Terjadinya bencana alam\n5. Distribusi pendapatan yang tidak merata (hal. 22–23)" },
    { id: 105, soal: "Bagaimana angka kelahiran tinggi menyebabkan kemiskinan?", jawaban: "Angka kelahiran tinggi membuat laju pertumbuhan penduduk lebih besar, sehingga lapangan pekerjaan terbatas (hal. 22)" },
    { id: 219, soal: "Kapan laju pertumbuhan penduduk menyebabkan kemiskinan meningkat?", jawaban: "Jika laju pertumbuhan penduduk tidak sebanding dengan laju pertumbuhan ekonomi (hal. 22)" },
    { id: 220, soal: "Bagaimana meningkatnya pengangguran menyebabkan kemiskinan?", jawaban: "Lapangan kerja terbatas membuat pengangguran naik (hal. 22)" },
    { id: 268, soal: "Apa hubungan jumlah pengangguran dengan angka kemiskinan?", jawaban: "Semakin banyak yang menganggur, angka kemiskinan ikut meningkat (hal. 22)" },
    { id: 106, soal: "Bagaimana pendidikan yang rendah menyebabkan kemiskinan?", jawaban: "Tidak memiliki keterampilan, wawasan, dan pengetahuan yang memadai (hal. 22–23)" },
    { id: 269, soal: "Apa akibat kurangnya keterampilan dan pengetahuan karena pendidikan rendah?", jawaban: "Kalah bersaing di dunia kerja/usaha, sehingga pengangguran dan kemiskinan bertambah (hal. 22–23)" },
    { id: 221, soal: "Bagaimana bencana alam (banjir, tanah longsor, tsunami) menyebabkan kemiskinan?", jawaban: "Merusak infrastruktur, menurunkan psikologi masyarakat, dan membuat masyarakat kehilangan harta bendanya (hal. 22–23)" },

    // ── Hal. 23 — Penyebab menurut ahli, dampak, upaya penanggulangan ──
    { id: 107, soal: "Bagaimana distribusi pendapatan yang tidak merata menyebabkan kemiskinan?", jawaban: "Menyebabkan ketimpangan pada pola kepemilikan sumber daya (hal. 23)" },
    { id: 222, soal: "Masyarakat dengan sumber daya seperti apa yang umumnya berada di bawah garis kemiskinan?", jawaban: "Masyarakat yang memiliki sumber daya terbatas serta rendah (hal. 23)" },
    { id: 108, soal: "Apa penyebab kemiskinan menurut Henry George?", jawaban: "Kepemilikan pribadi serta monopoli individu atas tanah (hal. 23)" },
    { id: 223, soal: "Apa penyebab kemiskinan menurut Karl Marx?", jawaban: "Eksploitasi para pekerja oleh kaum kapitalisme (hal. 23)" },
    { id: 224, soal: "Apa penyebab kemiskinan menurut Robert Malthus?", jawaban: "Jumlah penduduk meningkat menurut deret ukur, sedangkan produksi bahan makanan hanya meningkat menurut deret hitung (hal. 23)" },
    { id: 109, soal: "Sebutkan dampak yang ditimbulkan dari kemiskinan!", jawaban: "1. Meningkatnya kriminalitas di suatu daerah (penipuan, pencurian, perampokan, pembunuhan) karena masyarakat ingin memenuhi kebutuhan pokok dengan segala upaya\n2. Akses pendidikan tertutup (biaya pendidikan tinggi sehingga kemiskinan makin parah)\n3. Meningkatnya angka pengangguran (sulit bersaing mendapat pekerjaan)\n4. Munculnya berbagai konflik di masyarakat (perlakuan berbeda memicu kecemburuan) (hal. 23)" },
    { id: 110, soal: "Sebutkan upaya penanggulangan kemiskinan!", jawaban: "1. Pembaharuan data penduduk\n2. Integrasi penyaluran bantuan sosial\n3. Mengurangi beban pengeluaran masyarakat miskin dan hampir miskin\n4. Insentif di bidang pertanian, peternakan, dan perikanan\n5. Mengelola APBN dengan cermat (hal. 23–24)" },
    { id: 111, soal: "Apa tujuan pembaharuan data penduduk dalam menanggulangi kemiskinan?", jawaban: "Melengkapi data penduduk miskin maupun rentan miskin yang dikategorikan pantas menerima bantuan sosial (hal. 23)" },
    { id: 225, soal: "Apa manfaat data penduduk miskin yang lengkap bagi penyaluran bansos?", jawaban: "Dana bantuan sosial dapat disalurkan tepat kepada masyarakat yang benar-benar membutuhkan (hal. 23)" },

    // ── Hal. 24 — Upaya penanggulangan kemiskinan lanjutan ──
    { id: 112, soal: "Mengapa diperlukan integrasi penyaluran bantuan sosial?", jawaban: "Perbedaan bentuk bansos antardaerah menimbulkan ketegangan sosial, diperparah basis data DTKS (Data Terpadu Kesejahteraan Sosial) yang belum mencakup masyarakat yang tidak terdata (hal. 23–24)" },
    { id: 226, soal: "Bagaimana cara integrasi penyaluran bantuan sosial?", jawaban: "Update data dan integrasi penyaluran bansos melalui kerja sama antarbank pemerintah (hal. 23–24)" },
    { id: 270, soal: "Apa tujuan integrasi penyaluran bantuan sosial?", jawaban: "Agar dana langsung diterima penerima, pembagian lebih mudah, dan tidak tumpang tindih (hal. 23–24)" },
    { id: 113, soal: "Empat biaya yang dikontrol pemerintah dan dapat dikurangi untuk meringankan beban masyarakat miskin dan hampir miskin adalah…", jawaban: "Tarif air untuk rumah tangga, tarif listrik, harga LPG, dan harga BBM (hal. 24)" },
    { id: 114, soal: "Bagaimana pemerintah memberi insentif di bidang pertanian, peternakan, dan perikanan?", jawaban: "Melalui skema pembelian produk oleh pemerintah serta memperbaiki jalur logistik (hal. 24)" },
    { id: 271, soal: "Apa hasil yang diharapkan dari insentif bagi petani, peternak, dan nelayan?", jawaban: "Produksi meningkat (hal. 24)" },
    { id: 227, soal: "Bagaimana insentif di bidang pertanian, peternakan, dan perikanan dapat menanggulangi kemiskinan?", jawaban: "Mengamankan ketersediaan stok pangan nasional dan menekan kenaikan harga pokok (hal. 24)" },
    { id: 272, soal: "Dengan stok pangan aman dan harga pokok terkendali, apa dampaknya bagi masyarakat hampir miskin?", jawaban: "Tetap dapat memenuhi kebutuhan pokok (hal. 24)" },
    { id: 115, soal: "Bagaimana upaya pemerintah menanggulangi kemiskinan dengan mengelola APBN secara cermat?", jawaban: "APBN dikelola cermat agar anggaran bantuan sosial bagi masyarakat menengah ke bawah dan hampir miskin dapat ditingkatkan (hal. 24)" },
    { id: 273, soal: "Selain meningkatkan anggaran bansos, apa manfaat lain APBN yang dikelola cermat?", jawaban: "Pemerintah dapat mengalokasikan dana khusus untuk masyarakat miskin dan hampir miskin agar dapat memenuhi kebutuhan pokoknya (hal. 24)" },

    // ── Hal. 25 — Ekonomi digital: definisi, manfaat, smart logistics ──
    { id: 116, soal: "Mengapa pelaku UMKM kini memasarkan produknya melalui platform digital?", jawaban: "Karena dirasa lebih praktis dan menjangkau konsumen yang lebih luas (hal. 25)" },
    { id: 228, soal: "Bagaimana perkembangan jumlah UMKM yang terhubung dengan platform digital?", jawaban: "Terus meningkat setiap tahunnya (hal. 25)" },
    { id: 117, soal: "Secara sederhana, apa pengertian ekonomi digital?", jawaban: "Kegiatan ekonomi dengan bantuan teknologi informasi komunikasi dan kecerdasan buatan (hal. 25)" },
    { id: 229, soal: "Ekonomi digital berkembang seiring apa, dan apa cirinya?", jawaban: "Seiring Revolusi Industri 4.0 yang ditandai kecerdasan buatan, teknologi komputer kuantum, dan teknologi informasi berbasis internet (hal. 25)" },
    { id: 118, soal: "Apa pengertian ekonomi digital menurut Amir Hartman?", jawaban: "Media virtual di mana bisnis, penetapan nilai, dan transaksi terjadi menggunakan internet sebagai media pertukaran (hal. 25)" },
    { id: 119, soal: "Apa kelebihan ekonomi digital?", jawaban: "Mempercepat dan mempermudah kegiatan ekonomi (hal. 25)" },
    { id: 230, soal: "Apa tuntutan ekonomi digital bagi pelaku ekonomi?", jawaban: "Pelaku ekonomi harus selalu kreatif dan cepat mengambil peluang agar tidak kehilangan kesempatan (hal. 25)" },
    { id: 120, soal: "Sebutkan manfaat ekonomi digital dalam kehidupan!", jawaban: "1. Ketersediaan informasi yang lebih besar\n2. Menghemat biaya\n3. Menurunkan hambatan (hal. 25)" },
    { id: 121, soal: "Jelaskan manfaat ekonomi digital: ketersediaan informasi yang lebih besar!", jawaban: "Internet memungkinkan konsumen mempunyai lebih banyak informasi dan pilihan, lebih mudah mencari merek terbaik yang diinginkan, serta membandingkan harga dari satu toko dengan toko lain (hal. 25)" },
    { id: 122, soal: "Bagaimana ekonomi digital membantu perusahaan menghemat sewa gedung?", jawaban: "Karena sebagian aktivitas dilakukan melalui internet (hal. 25)" },
    { id: 231, soal: "Bagaimana ekonomi digital membuat harga jual lebih murah?", jawaban: "Perusahaan dapat memotong aspek ritel dan mengirim barang langsung dari pabrik/gudang supplier atau produsen, bukan dari toko (hal. 25)" },
    { id: 274, soal: "Apa dampak pemotongan aspek ritel dalam ekonomi digital?", jawaban: "Biaya lebih rendah, sehingga harga jual lebih murah (hal. 25)" },
    { id: 123, soal: "Jelaskan manfaat ekonomi digital: menurunkan hambatan!", jawaban: "Di beberapa sektor industri, ekonomi digital memudahkan perusahaan baru untuk masuk (hal. 25)" },
    { id: 232, soal: "Dengan ide inovatif di era ekonomi digital, apa yang bisa dilakukan seseorang?", jawaban: "Menciptakan produk baru yang menantang perusahaan tradisional (hal. 25)" },
    { id: 233, soal: "Berikan contoh layanan baru yang dibawa ekonomi digital!", jawaban: "Mulai dari pesan antar bahan makanan ke rumah hingga aplikasi lainnya (hal. 25)" },
    { id: 124, soal: "Apa yang dimaksud smart logistics (logistik pintar)? (Info Khusus)", jawaban: "Pendekatan inovatif dalam pengelolaan rantai pasokan yang memanfaatkan teknologi canggih, analisis data, dan kecerdasan buatan (hal. 25)" },
    { id: 275, soal: "Apa tujuan smart logistics? (Info Khusus)", jawaban: "Meningkatkan efisiensi, visibilitas, dan pengelolaan seluruh proses pengiriman dan distribusi barang (hal. 25)" },
    { id: 234, soal: "Teknologi apa saja yang dilibatkan dalam smart logistics? (Info Khusus)", jawaban: "Internet of Things (IoT), big data analytics, kecerdasan buatan (AI), dan blockchain (hal. 25)" },
    { id: 276, soal: "Untuk apa teknologi seperti IoT, big data, AI, dan blockchain dilibatkan dalam smart logistics? (Info Khusus)", jawaban: "Untuk mengumpulkan, menganalisis, dan memberikan informasi secara real time (hal. 25)" },
    { id: 125, soal: "Sebutkan contoh bidang ekonomi digital yang berkembang di Indonesia!", jawaban: "1. Bidang transportasi\n2. Bidang kesehatan\n3. Bidang perbankan\n4. Bidang bisnis (hal. 25–26)" },
    { id: 126, soal: "Berikan contoh ekonomi digital di bidang transportasi!", jawaban: "Layanan ojek online (hal. 25)" },
    { id: 235, soal: "Bagaimana cara naik ojek DULU, sebelum ada ekonomi digital?", jawaban: "Harus datang ke pangkalan dan menunggu tukang ojek (hal. 25)" },
    { id: 277, soal: "Bagaimana cara naik ojek SEKARANG dengan adanya ekonomi digital?", jawaban: "Cukup menunggu di rumah dan bisa dijemput di tempat yang diinginkan, dengan memanfaatkan smartphone dan layanan internet (hal. 25)" },

    // ── Hal. 26 — Contoh lanjutan, tantangan, Palmira ──
    { id: 127, soal: "Berikan contoh ekonomi digital di bidang kesehatan!", jawaban: "Pertemuan dokter dan pasien kini bisa dilakukan secara virtual, tidak perlu lagi pergi ke klinik atau rumah sakit untuk mengonsultasikan keluhan (hal. 26)" },
    { id: 128, soal: "Bagaimana ekonomi digital mengubah uang di bidang perbankan?", jawaban: "Uang tetap alat pembayaran sah, tetapi bentuknya berubah menjadi digital (hal. 26)" },
    { id: 236, soal: "Berikan contoh ekonomi digital di bidang perbankan!", jawaban: "Produk dompet digital (e-banking, OVO, dll.) dan produk perbankan seperti kartu debit dan kredit untuk bertransaksi tanpa uang tunai (hal. 26)" },
    { id: 129, soal: "Bagaimana cara memulai usaha DULU, sebelum ada ekonomi digital?", jawaban: "Harus punya toko fisik (hal. 26)" },
    { id: 278, soal: "Bagaimana memulai usaha SEKARANG dengan adanya ekonomi digital?", jawaban: "Siapa pun dapat memulai usaha tanpa mengandalkan toko fisik (hal. 26)" },
    { id: 237, soal: "Apa keuntungan berwirausaha dengan berjualan online bagi orang bermodal minim?", jawaban: "Uang untuk membangun toko fisik dapat dialokasikan untuk keperluan lain atau menambah modal (hal. 26)" },
    { id: 130, soal: "Permasalahan apa yang muncul dari ekonomi digital?", jawaban: "Keamanan data pribadi dan modus penipuan daring melalui scamming (hal. 26)" },
    { id: 238, soal: "Sebutkan tantangan ekonomi digital!", jawaban: "1. Keamanan berinternet\n2. Sumber daya manusia yang kurang memadai\n3. Regulasi yang masih belum mumpuni (hal. 26)" },
    { id: 131, soal: "Jelaskan tantangan ekonomi digital dalam aspek keamanan berinternet!", jawaban: "Cyber security masih menjadi ancaman bagi sebagian besar pengguna internet di Indonesia (hal. 26)" },
    { id: 239, soal: "Mengapa dibutuhkan peningkatan keamanan berinternet dalam ekonomi digital?", jawaban: "Agar pengguna bisa mengakses semua layanan ekonomi digital tanpa khawatir peretasan dan pencurian data (hal. 26)" },
    { id: 132, soal: "Jelaskan tantangan ekonomi digital: SDM kurang memadai!", jawaban: "Kurangnya sumber daya manusia yang paham penerapan teknologi (hal. 26)" },
    { id: 279, soal: "Apa akibat rendahnya literasi digital bagi ekonomi digital?", jawaban: "Banyak sektor sulit masuk ke kancah digital (hal. 26)" },
    { id: 240, soal: "Jelaskan tantangan ekonomi digital: regulasi belum mumpuni!", jawaban: "Diperlukan regulasi yang melindungi hak penyedia layanan maupun penggunanya (hal. 26)" },
    { id: 280, soal: "Mengapa ekonomi digital kadang terhambat dari sisi regulasi?", jawaban: "Karena belum ada aturan pasti yang mengaturnya (hal. 26)" },
    { id: 133, soal: "Menurut Palmira dkk. (2020), pembangunan ekonomi digital yang inklusif memerlukan aspek pendukung apa saja?", jawaban: "Jaringan internet dan infrastruktur, akses dan pemanfaatan internet yang bijak, transformasi digital, serta jaminan sosial (hal. 26)" },
    { id: 241, soal: "Menurut Palmira dkk. (2020), apa hasilnya jika aspek pendukung ekonomi digital inklusif terpenuhi?", jawaban: "Manfaat digital dapat berkontribusi pada pertumbuhan ekonomi masyarakat (hal. 26)" },

    // ── Hal. 27–31 — Glosarium & Penilaian Sumatif Bab 1 ──
    { id: 134, soal: "Apa arti fiskal? (Glosarium)", jawaban: "Berkenaan dengan urusan pajak atau pendapatan negara (hal. 27)" },
    { id: 242, soal: "Apa arti inflasi? (Glosarium)", jawaban: "Kemerosotan nilai uang (kertas) karena banyaknya dan cepatnya uang beredar sehingga harga barang-barang naik (hal. 27)" },
    { id: 243, soal: "Apa arti ketimpangan? (Glosarium)", jawaban: "Hal yang tidak sebagaimana mestinya (seperti tidak adil, tidak beres) (hal. 27)" },
    { id: 135, soal: "Upaya pemerintah negara berkembang untuk menanggulangi permasalahan pembangunan ekonomi adalah… (Sumatif)", jawaban: "Dimudahkannya izin untuk berwirausaha (hal. 27)" },
    { id: 136, soal: "Dari komponen: (1) keuntungan perusahaan, (2) ekspor neto, (3) kompensasi pekerja, (4) pengeluaran pemerintah untuk barang & jasa, (5) konsumsi rumah tangga — mana komponen pendekatan PENGELUARAN? (Sumatif)", jawaban: "Nomor 2, 4, dan 5 (sesuai Y = C + I + G + (X − M)) (hal. 27)" },
    { id: 244, soal: "Keuntungan perusahaan dan kompensasi pekerja termasuk komponen pendekatan apa? (Sumatif)", jawaban: "Pendekatan pendapatan (hal. 27)" },
    { id: 137, soal: "Negara Z: konsumsi Rp6.000.000, investasi Rp1.000.000, ekspor neto Rp700.000, PDB Rp8.500.000. Berapa pengeluaran pemerintah? (Sumatif)", jawaban: "Y = C + I + G + (X − M)\n8.500.000 = 6.000.000 + 1.000.000 + G + 700.000\nG = Rp800.000 (hal. 28)" },
    { id: 138, soal: "Mengapa pendapatan per kapita tidak dapat secara mutlak mengukur tingkat kemakmuran suatu negara? (Sumatif)", jawaban: "Karena pendapatan per kapita adalah PDB dibagi jumlah penduduk (angka rata-rata), tetapi angka itu tidak menunjukkan pemerataan pendapatan (hal. 28)" },
    { id: 139, soal: "Agar pertumbuhan ekonomi meningkatkan standar hidup masyarakat, maka… (Sumatif)", jawaban: "Pendapatan harus didistribusikan secara merata (hal. 28)" },
    { id: 140, soal: "Keluarga di daerah terpencil tidak mampu memenuhi makanan bergizi, air bersih, tempat tinggal layak, penghasilan jauh di bawah standar minimum, tanpa akses pendidikan & kesehatan. Ini contoh kemiskinan… (Sumatif)", jawaban: "Kemiskinan absolut (hal. 28)" },
    { id: 141, soal: "Negara menerapkan pajak progresif tinggi untuk super kaya dan subsidi besar untuk pendidikan & kesehatan masyarakat miskin. Apa tujuan utamanya terkait kesenjangan ekonomi? (Sumatif)", jawaban: "Mengurangi kesenjangan pendapatan dengan redistribusi kekayaan dan peningkatan modal manusia (hal. 28)" },
    { id: 142, soal: "Ekonomi digital dapat mendorong kebutuhan ekonomi nasional apabila didukung SDM berkualitas. Hal ini menunjukkan pentingnya… (Sumatif)", jawaban: "Pendidikan dan literasi digital (hal. 28)" },
    { id: 143, soal: "Dampak kesenjangan ekonomi yang tinggi pada stabilitas sosial adalah… (Sumatif)", jawaban: "Mendorong terciptanya budaya konsumtif dan pamer di kalangan menengah atas (hal. 29)" },
    { id: 144, soal: "Data 2023: 20% penduduk berpendapatan tinggi menguasai ±46% pendapatan nasional, 40% berpendapatan rendah hanya ±18%. Pernyataan mana yang tepat tentang hubungan pertumbuhan ekonomi dan kesenjangan? (Sumatif, PG kompleks)", jawaban: "• Pertumbuhan ekonomi tidak selalu diikuti pemerataan pendapatan\n• Kesenjangan ekonomi dapat terjadi meskipun ekonomi tumbuh\n• Hasil pertumbuhan ekonomi lebih banyak dinikmati kelompok tertentu (hal. 29)" },
    { id: 145, soal: "Perbedaan pertumbuhan ekonomi antarwilayah perkotaan (industri & jasa pesat) dan perdesaan (pertanian, produktivitas rendah) menunjukkan bahwa… (Sumatif, PG kompleks)", jawaban: "• Pembangunan ekonomi yang belum merata\n• Terjadi kesenjangan ekonomi antarwilayah\n• Pertumbuhan ekonomi terkonsentrasi di wilayah tertentu (hal. 29)" },
    { id: 146, soal: "Benar atau Salah?\n1) Perbedaan akses pendidikan, lapangan kerja, dan teknologi tidak berpengaruh terhadap kesenjangan ekonomi\n2) Kesenjangan distribusi pendapatan dapat menyebabkan perbedaan kesejahteraan antarkelompok\n3) Kesenjangan ekonomi hanya berdampak pada kelompok berpendapatan rendah (Sumatif)", jawaban: "1) Salah\n2) Benar\n3) Salah (hal. 29)" },
    { id: 147, soal: "PDB Indonesia 2022 Rp19.500 triliun, 2023 Rp20.280 triliun. Benar atau Salah?\n1) Jika PDB 2024 jadi Rp21.294 triliun, pertumbuhan 2024 sekitar 5%\n2) Jika PDB 2023 hanya naik Rp500 triliun dari 2022, pertumbuhan tetap 4%\n3) Kenaikan PDB 2022 ke 2023 sebesar Rp680 triliun (Sumatif)", jawaban: "1) Benar: (21.294 − 20.280) ÷ 20.280 × 100% = 5%\n2) Salah: 500 ÷ 19.500 × 100% ≈ 2,56% (pertumbuhan asli 2023 = 780 ÷ 19.500 = 4%)\n3) Salah: kenaikannya Rp780 triliun (hal. 30)" },
    { id: 148, soal: "Data: gaji karyawan Rp24 M, investasi Rp58 M, konsumsi masyarakat Rp28 M, bunga modal Rp32 M, laba usaha Rp10 M, ekspor Rp26 M, sewa tanah Rp21 M, impor Rp28 M, konsumsi pemerintah Rp78 M. Hitung pendapatan nasional dengan pendekatan PENDAPATAN! (Sumatif)", jawaban: "Y = r + w + i + p = 21 + 24 + 32 + 10 = Rp87 miliar (hal. 30)" },
    { id: 245, soal: "Data: gaji karyawan Rp24 M, investasi Rp58 M, konsumsi masyarakat Rp28 M, bunga modal Rp32 M, laba usaha Rp10 M, ekspor Rp26 M, sewa tanah Rp21 M, impor Rp28 M, konsumsi pemerintah Rp78 M. Hitung pendapatan nasional dengan pendekatan PENGELUARAN! (Sumatif)", jawaban: "Y = C + I + G + (X − M) = 28 + 58 + 78 + (26 − 28) = Rp162 miliar (hal. 30)" },
    { id: 150, soal: "Total PDB tahun 2024 = Rp2.600 triliun dan PDB 2023 = Rp1.850 triliun. Berapa tingkat pertumbuhan ekonomi 2024 atas dasar tahun 2023? (Sumatif)", jawaban: "(2.600 − 1.850) ÷ 1.850 × 100% ≈ 40,5%\n(Catatan: hasil ini tidak ada di pilihan buku 45/55/100/135/145%, kemungkinan salah cetak) (hal. 27)" },
    { id: 151, soal: "Gambar orang bekerja di lahan secara manual. Faktor penyebab kemiskinan pada kondisi tersebut adalah… (Sumatif)", jawaban: "Keterbatasan teknologi dan modal (perkiraan, kunci tidak tersedia) (hal. 29)" },
    { id: 152, soal: "PDB 2022 Rp19.500 triliun naik menjadi Rp20.280 triliun di 2023. Mengapa pertumbuhan ekonomi belum tentu mencerminkan kesejahteraan masyarakat? (Sumatif, PG kompleks)", jawaban: "• Sebagian kelompok masyarakat masih tertinggal\n• Distribusi pendapatan tidak merata\n• PDB hanya mengukur nilai produksi\n(perkiraan, kunci tidak tersedia) (hal. 30)" },
    { id: 149, soal: "PDB Rp1.200 triliun, pendapatan neto dari luar negeri Rp50 triliun, depresiasi Rp30 triliun. Hitung produk nasional neto (NNP)! (Soal Pengayaan)", jawaban: "PNB = PDB + pendapatan neto LN = 1.200 + 50 = Rp1.250 triliun\nNNP = PNB − penyusutan = 1.250 − 30 = Rp1.220 triliun (hal. 31)" },
  ],
  // Sumber: Fathul Mu'in (syarah Qurratul 'Ain bi Muhimmatid Din) — teks di dalam kotak
  "Fiqih": [
    // ── Hal. 2 — Muqaddimah ──
    { id: 1, soal: "Apa nama kitab matan yang disyarahi oleh Fathul Mu'in?", jawaban: "Qurratul 'Ain bi Muhimmatid Din (Penyejuk Mata tentang Perkara-perkara Penting Agama) (hal. 2)" },
    { id: 89, soal: "Apa nama lengkap kitab Fathul Mu'in?", jawaban: "Fathul Mu'in bi Syarhi Qurratil 'Ain bi Muhimmatid Din (hal. 2)" },
    { id: 2, soal: "Apa tujuan penulis menyusun syarah Fathul Mu'in?", jawaban: "Menjelaskan maksud, menyempurnakan faedah, menghasilkan tujuan, dan menampakkan faedah-faedah dari kitab Qurratul 'Ain (hal. 2)" },
    { id: 3, soal: "Apa doa penulis Fathul Mu'in untuk kitabnya?", jawaban: "Semoga Allah meratakan manfaatnya bagi kalangan khusus dan umum dari saudara-saudara, dan menempatkan penulis karenanya di surga Firdaus, negeri yang aman (hal. 2)" },
    { id: 4, soal: "Kata ism (اسم) dalam basmalah berasal (musytaq) dari kata apa?", jawaban: "Dari as-sumuw (السمو) yang berarti 'tinggi', bukan dari al-wasm (الوسم) yang berarti 'tanda' (hal. 2)" },
    { id: 5, soal: "Lafaz 'Allah' adalah nama ('alam) bagi apa?", jawaban: "Nama bagi Dzat yang wajib wujud-Nya (hal. 2)" },
    { id: 90, soal: "Apa asal lafaz 'Allah'?", jawaban: "Ilāh (إله), isim jenis untuk setiap yang disembah (hal. 2)" },
    { id: 151, soal: "Setelah lafaz ilāh diberi al, apa yang terjadi?", jawaban: "Hamzahnya dibuang (hal. 2)" },
    { id: 152, soal: "Lafaz 'Allah' kemudian dipakai khusus untuk siapa?", jawaban: "Untuk Yang disembah dengan hak (hal. 2)" },
    { id: 91, soal: "Menurut kebanyakan ulama, lafaz 'Allah' adalah nama apa?", jawaban: "Al-Ismul A'zham (nama Allah yang paling agung) (hal. 2)" },
    { id: 92, soal: "Bolehkah nama 'Allah' dinamakan kepada selain-Nya?", jawaban: "Tidak boleh dinamakan kepada selain-Nya, walau secara keras kepala (hal. 2)" },
    { id: 6, soal: "Ar-Rahman dan ar-Rahim adalah sifat apa?", jawaban: "Dua sifat yang dibentuk untuk mubalaghah (makna sangat) dari kata rahima (hal. 2)" },
    { id: 93, soal: "Mana yang lebih kuat maknanya, ar-Rahman atau ar-Rahim, dan mengapa?", jawaban: "Ar-Rahman lebih kuat (ablagh), karena tambahan huruf menunjukkan tambahan makna (hal. 2)" },
    { id: 94, soal: "Apa ungkapan ulama yang menunjukkan ar-Rahman lebih kuat daripada ar-Rahim?", jawaban: "'Rahman di dunia, Rahim di akhirat' (hal. 2)" },
    { id: 7, soal: "Apa definisi al-hamd (pujian)?", jawaban: "Menyifati dengan sesuatu yang indah (al-washfu bil-jamīl) (hal. 2)" },
    { id: 8, soal: "Apa makna shalawat (ash-shalāh) dari Allah?", jawaban: "Rahmat yang disertai pengagungan (hal. 2)" },
    { id: 95, soal: "Apa makna as-salām (dalam shalawat dan salam)?", jawaban: "Penyelamatan (taslīm) dari segala penyakit dan kekurangan (hal. 2)" },
    { id: 9, soal: "Nabi Muhammad ﷺ diutus kepada siapa saja?", jawaban: "Kepada seluruh tsaqalain (jin dan manusia) secara ijmak, demikian pula malaikat menurut pendapat sejumlah ulama muhaqqiq (hal. 2)" },
    { id: 10, soal: "Nama 'Muhammad' berasal dari apa?", jawaban: "Nama yang dinukil dari isim maf'ul yang ditasydid (mudha''af), diberikan kepada orang yang banyak sifat terpujinya (hal. 2)" },
    { id: 96, soal: "Siapa yang menamai Nabi ﷺ dengan nama Muhammad?", jawaban: "Kakeknya (Abdul Muththalib), dengan ilham dari Allah (hal. 2)" },
    { id: 11, soal: "Apa definisi rasul?", jawaban: "Manusia laki-laki merdeka yang diberi wahyu syariat dan diperintah menyampaikannya (hal. 2)" },
    { id: 153, soal: "Apakah seorang rasul harus punya kitab dan menghapus syariat sebelumnya?", jawaban: "Tidak, tetap disebut rasul walaupun tidak punya kitab dan tidak menghapus syariat sebelumnya (hal. 2)" },
    { id: 154, soal: "Sebutkan contoh rasul yang tidak punya kitab dan tidak menghapus syariat sebelumnya!", jawaban: "Nabi Yusya' AS (hal. 2)" },
    { id: 97, soal: "Apa definisi nabi (bedanya dengan rasul)?", jawaban: "Manusia yang diberi wahyu syariat tetapi tidak diperintah menyampaikannya (hal. 2)" },
    { id: 98, soal: "Mana yang lebih utama, rasul atau nabi?", jawaban: "Rasul lebih utama daripada nabi secara ijmak (hal. 2)" },
    { id: 12, soal: "Berapa jumlah nabi menurut khabar yang disebut dalam Fathul Mu'in?", jawaban: "124.000 (seratus dua puluh empat ribu) (hal. 2)" },
    { id: 99, soal: "Berapa jumlah rasul menurut khabar yang disebut dalam Fathul Mu'in?", jawaban: "315 (tiga ratus lima belas) (hal. 2)" },
    { id: 13, soal: "Siapa yang dimaksud 'āl (keluarga) Nabi ﷺ?", jawaban: "Kerabat beliau yang mukmin dari Bani Hasyim dan Bani al-Muththalib (hal. 2)" },
    { id: 100, soal: "Dalam konteks doa, siapa yang dimaksud 'āl Nabi ﷺ menurut pendapat yang dipilih?", jawaban: "Setiap orang mukmin (hal. 2)" },
    { id: 155, soal: "Bagaimana kedudukan khabar tentang 'āl Nabi ﷺ = setiap orang mukmin?", jawaban: "Dha'if, tetapi pendapat ini tetap dipilih (hal. 2)" },
    { id: 156, soal: "Siapa yang menegaskan bahwa 'āl Nabi ﷺ dalam doa adalah setiap orang mukmin, dan di kitab apa?", jawaban: "Imam Nawawi, dalam Syarah Muslim (hal. 2)" },
    { id: 14, soal: "Siapa yang dimaksud shahabi (sahabat Nabi)?", jawaban: "Orang yang bertemu Nabi ﷺ dalam keadaan beriman, walaupun ia buta atau belum mumayyiz (hal. 2)" },
    { id: 15, soal: "Apa yang dimaksud mukhtashar (ringkasan)?", jawaban: "Yang sedikit lafaznya namun banyak maknanya, diambil dari kata ikhtishar (hal. 2)" },
    { id: 16, soal: "Apa pengertian fiqih secara bahasa?", jawaban: "Paham (al-fahm) (hal. 2)" },
    { id: 101, soal: "Apa pengertian fiqih secara istilah?", jawaban: "Ilmu tentang hukum-hukum syariat yang bersifat amaliah, yang digali dari dalil-dalilnya yang terperinci (hal. 2)" },
    { id: 17, soal: "Dari mana ilmu fiqih diambil (sumbernya)?", jawaban: "Dari al-Kitab (Al-Qur'an), as-Sunnah, al-Ijma', dan al-Qiyas (hal. 2)" },

    // ── Hal. 3 — Faedah fiqih, Imam Syafi'i, rujukan kitab; Bab Shalat ──
    { id: 18, soal: "Apa faedah (manfaat) mempelajari ilmu fiqih?", jawaban: "Menjalankan perintah-perintah Allah Ta'ala dan menjauhi larangan-larangan-Nya (hal. 3)" },
    { id: 19, soal: "Kitab Fathul Mu'in disusun berdasarkan mazhab siapa? Sebutkan nama lengkapnya!", jawaban: "Mazhab Imam Mujtahid Abu Abdillah Muhammad bin Idris asy-Syafi'i rahimahullah, yaitu hukum-hukum yang beliau pegang dalam berbagai masalah (hal. 3)" },
    { id: 20, soal: "Kepada siapa nasab Imam Syafi'i disandarkan (asal nama 'Syafi'i')?", jawaban: "Kepada kakeknya, Syafi' bin as-Sa'ib (hal. 3)" },
    { id: 102, soal: "Sebutkan nasab lengkap Imam Syafi'i!", jawaban: "Muhammad bin Idris bin Abbas bin Utsman bin Syafi' bin as-Sa'ib bin Ubaid bin Abdu Yazid bin Hasyim bin al-Muththalib bin Abdu Manaf (hal. 3)" },
    { id: 103, soal: "Kapan Syafi' (kakek Imam Syafi'i) masuk Islam?", jawaban: "Bersama ayahnya, as-Sa'ib, pada hari (perang) Badar (hal. 3)" },
    { id: 21, soal: "Kapan Imam Syafi'i lahir?", jawaban: "Tahun 150 H (hal. 3)" },
    { id: 104, soal: "Kapan Imam Syafi'i wafat?", jawaban: "Hari Jumat akhir bulan Rajab tahun 204 H (hal. 3)" },
    { id: 22, soal: "Dari kitab-kitab siapa matan Qurratul 'Ain diringkas (dipilih)?", jawaban: "Dari kitab-kitab mu'tamad karya:\n1. Syaikh Syihabuddin Ahmad bin Hajar al-Haitami\n2. Wajihuddin Abdurrahman bin Ziyad az-Zabidi\n3. Syaikhul Islam Zakariya al-Anshari\n4. Imam Ahmad al-Muzajjad az-Zabidi\ndan muhaqqiq muta'akhirin lainnya (hal. 3)" },
    { id: 23, soal: "Fathul Mu'in berpegang pada pendapat siapa sebagai rujukan utama mazhab?", jawaban: "Dua syaikh mazhab: Imam an-Nawawi dan Imam ar-Rafi'i (hal. 3)" },
    { id: 157, soal: "Setelah dua syaikh, Fathul Mu'in berpegang pada pendapat siapa?", jawaban: "Para muhaqqiq muta'akhirin (hal. 3)" },
    { id: 24, soal: "Apa pengertian shalat secara bahasa?", jawaban: "Doa (hal. 3)" },
    { id: 105, soal: "Apa pengertian shalat secara syara'?", jawaban: "Ucapan-ucapan dan perbuatan-perbuatan tertentu yang dibuka dengan takbir dan ditutup dengan salam (hal. 3)" },
    { id: 106, soal: "Mengapa dinamakan shalat?", jawaban: "Karena mengandung doa (hal. 3)" },
    { id: 25, soal: "Berapa shalat fardhu 'ain dalam sehari semalam?", jawaban: "Lima kali, dan ini diketahui dari agama secara pasti (dharuri) (hal. 3)" },
    { id: 107, soal: "Apa hukum orang yang mengingkari kewajiban shalat lima waktu?", jawaban: "Menjadi kafir (hal. 3)" },
    { id: 26, soal: "Apakah shalat lima waktu terkumpul pada nabi selain Nabi Muhammad ﷺ?", jawaban: "Tidak, kelima shalat itu hanya terkumpul pada Nabi Muhammad ﷺ (hal. 3)" },
    { id: 27, soal: "Kapan shalat lima waktu difardhukan?", jawaban: "Pada malam Isra', 10 tahun 3 bulan setelah kenabian, malam 27 Rajab (hal. 3)" },
    { id: 28, soal: "Mengapa shalat Subuh pada pagi hari setelah malam Isra' tidak wajib?", jawaban: "Karena belum diketahui tata caranya (kaifiyatnya) (hal. 3)" },
    { id: 29, soal: "Shalat fardhu wajib atas siapa?", jawaban: "Atas setiap muslim mukallaf (baligh dan berakal), laki-laki maupun lainnya, yang suci (hal. 3)" },
    { id: 30, soal: "Siapa saja yang tidak wajib shalat karena tidak mukallaf?", jawaban: "Kafir asli, anak kecil, orang gila, orang pingsan, dan orang mabuk yang tidak sengaja (hal. 3)" },
    { id: 108, soal: "Mengapa perempuan haid dan nifas tidak wajib shalat?", jawaban: "Karena shalatnya tidak sah (hal. 3)" },
    { id: 31, soal: "Siapa yang tetap wajib mengqadha shalat walaupun saat itu tidak shalat?", jawaban: "Orang murtad dan orang yang sengaja mabuk (hal. 3)" },
    { id: 32, soal: "Apa hukuman bagi muslim mukallaf yang meninggalkan shalat fardhu karena malas?", jawaban: "Dibunuh dengan dipenggal sebagai had (hal. 3)" },
    { id: 158, soal: "Kapan hukuman bunuh bagi orang yang meninggalkan shalat karena malas berlaku?", jawaban: "Jika ia sengaja mengeluarkan shalat dari waktu jamaknya karena malas (walau tetap meyakini kewajibannya) dan tidak bertobat setelah diminta bertobat (hal. 3)" },
    { id: 159, soal: "Apa istilah untuk meminta orang yang meninggalkan shalat agar bertobat?", jawaban: "Istitabah (hal. 3)" },
    { id: 109, soal: "Apa hukum meminta tobat (istitabah) kepada orang yang meninggalkan shalat karena malas?", jawaban: "Sunnah (hal. 3)" },
    { id: 110, soal: "Bagaimana hukum orang yang membunuh peninggal shalat (karena malas) sebelum diminta tobat?", jawaban: "Tidak wajib ganti rugi, tetapi berdosa (hal. 3)" },
    { id: 33, soal: "Bagaimana hukum orang yang meninggalkan shalat karena mengingkari kewajibannya?", jawaban: "Dibunuh sebagai orang kafir (hal. 3)" },
    { id: 111, soal: "Bagaimana perlakuan terhadap jenazah orang yang dibunuh karena mengingkari kewajiban shalat?", jawaban: "Jenazahnya tidak dimandikan dan tidak dishalatkan (hal. 3)" },
    { id: 34, soal: "Bagaimana hukum mengqadha shalat yang terlewat TANPA uzur?", jawaban: "Wajib segera diqadha (fauran) (hal. 3)" },
    { id: 112, soal: "Bagaimana hukum mengqadha shalat yang terlewat KARENA uzur (tidur, lupa)?", jawaban: "Sunnah segera diqadha (hal. 3)" },
    { id: 35, soal: "Menurut Ibnu Hajar, apa yang wajib dilakukan orang yang punya utang shalat tanpa uzur?", jawaban: "Wajib menggunakan seluruh waktunya untuk qadha (hal. 3)" },
    { id: 160, soal: "Bagi orang yang punya utang shalat tanpa uzur, waktu apa yang dikecualikan dari kewajiban qadha (menurut Ibnu Hajar)?", jawaban: "Waktu yang dibutuhkan untuk keperluan yang tidak bisa ditinggalkan (hal. 3)" },
    { id: 113, soal: "Menurut Ibnu Hajar, bagaimana hukum shalat sunnah bagi orang yang punya utang shalat tanpa uzur?", jawaban: "Haram baginya shalat sunnah (tathawwu') (hal. 3)" },
    { id: 36, soal: "Bagaimana hukum tertib dalam mengqadha shalat?", jawaban: "Sunnah tertib, misalnya Subuh diqadha sebelum Zhuhur (hal. 3)" },
    { id: 114, soal: "Bagaimana hukum mendahulukan qadha atas shalat hadhirah (yang sedang tiba waktunya)?", jawaban: "Sunnah, jika tidak khawatir hadhirah terlewat, walaupun khawatir kehilangan jamaahnya menurut pendapat mu'tamad (hal. 3)" },
    { id: 37, soal: "Kapan WAJIB mendahulukan qadha atas shalat hadhirah?", jawaban: "Jika shalat itu terlewat tanpa uzur (hal. 3)" },
    { id: 115, soal: "Kapan WAJIB mendahulukan shalat hadhirah atas qadha?", jawaban: "Jika khawatir hadhirah terlewat (sebagian rakaatnya jatuh di luar waktu) (hal. 3)" },
    { id: 38, soal: "Bagaimana hukum orang yang meninggal dan masih punya utang shalat fardhu?", jawaban: "Tidak diqadha dan tidak dibayar fidyah untuknya (hal. 3)" },
    { id: 116, soal: "Adakah pendapat yang membolehkan shalat orang yang meninggal dikerjakan untuknya?", jawaban: "Ada satu pendapat (qaul) bahwa shalat itu dikerjakan untuknya, berdasarkan khabar (hal. 3)" },
    { id: 161, soal: "Siapa ulama yang pernah mengerjakan shalat untuk sebagian kerabatnya yang meninggal?", jawaban: "Imam as-Subki (hal. 3)" },
    { id: 39, soal: "Kapan anak mumayyiz diperintah shalat?", jawaban: "Setelah sempurna 7 tahun (walau shalat qadha, dengan semua syaratnya) (hal. 3)" },
    { id: 117, soal: "Kapan anak dipukul karena meninggalkan shalat, dan bagaimana pukulannya?", jawaban: "Setelah sempurna 10 tahun, dengan pukulan yang tidak melukai (hal. 3)" },
    { id: 118, soal: "Apa dalil perintah shalat untuk anak usia 7 dan 10 tahun?", jawaban: "Hadits: 'Perintahlah anak shalat jika berusia 7 tahun, dan pukullah jika berusia 10 tahun' (hal. 3)" },
    { id: 40, soal: "Apa ciri anak disebut mumayyiz?", jawaban: "Sudah bisa makan, minum, dan beristinja sendiri (hal. 3)" },
    { id: 41, soal: "Siapa yang wajib memerintah anak mumayyiz untuk shalat?", jawaban: "Masing-masing dari kedua orang tuanya, walaupun ke atas (kakek/nenek) (hal. 3)" },
    { id: 162, soal: "Setelah orang tua, siapa yang wajib memerintah anak mumayyiz untuk shalat?", jawaban: "Washi (orang yang diberi wasiat) (hal. 3)" },
    { id: 163, soal: "Siapa yang wajib memerintah budak mumayyiz untuk shalat?", jawaban: "Pemilik budaknya (hal. 3)" },

    // ── Hal. 4 — Pendidikan anak; Fasal syarat shalat; syarat wudhu ──
    { id: 42, soal: "Apa hikmah anak diperintah shalat usia 7 tahun dan dipukul usia 10 tahun?", jawaban: "Melatih anak untuk beribadah agar terbiasa, sehingga tidak meninggalkannya (hal. 4)" },
    { id: 43, soal: "Selain memerintah shalat, apa lagi kewajiban wali terhadap anak?", jawaban: "Mencegahnya dari hal-hal yang diharamkan (hal. 4)" },
    { id: 164, soal: "Apa yang wajib diajarkan wali kepada anak selain shalat?", jawaban: "Kewajiban-kewajiban dan syariat yang tampak lainnya, serta memerintahkannya (hal. 4)" },
    { id: 165, soal: "Sebutkan contoh syariat sunnah yang juga wajib diajarkan dan diperintahkan wali kepada anak!", jawaban: "Siwak (hal. 4)" },
    { id: 119, soal: "Kapan kewajiban wali mendidik anak berakhir?", jawaban: "Ketika anak baligh dalam keadaan rasyid (cerdas mengelola agama dan harta) (hal. 4)" },
    { id: 44, soal: "Dari harta siapa biaya pengajaran anak (seperti Al-Qur'an dan adab) diambil?", jawaban: "Dari harta anak itu sendiri (hal. 4)" },
    { id: 166, soal: "Jika anak tidak punya harta, biaya pengajarannya diambil dari harta siapa?", jawaban: "Dari ayahnya, kemudian (jika tidak ada) dari ibunya (hal. 4)" },
    { id: 45, soal: "Menurut as-Sam'ani, siapa yang wajib memerintah shalat istri yang masih kecil dan punya orang tua?", jawaban: "Kedua orang tuanya, kemudian suaminya (hal. 4)" },
    { id: 120, soal: "Apakah suami juga wajib memukul istrinya (yang meninggalkan shalat)?", jawaban: "Wajib, walaupun istrinya sudah dewasa, sebagaimana ditegaskan Jamalul Islam al-Bazri (hal. 4)" },
    { id: 121, soal: "Bagaimana pendapat az-Zarkasyi tentang suami memukul istri yang meninggalkan shalat?", jawaban: "Menganggapnya sunnah secara mutlak (hal. 4)" },
    { id: 46, soal: "Apa kewajiban pertama orang tua (bahkan sebelum memerintah shalat) dalam mengajari anak mumayyiz?", jawaban: "Mengajarkan bahwa Nabi kita Muhammad ﷺ diutus di Makkah dan lahir di sana (hal. 4)" },
    { id: 122, soal: "Selain tempat lahir dan diutus, apa lagi yang wajib diajarkan pertama kali tentang Nabi ﷺ?", jawaban: "Bahwa beliau dimakamkan di Madinah dan wafat di sana (hal. 4)" },
    { id: 47, soal: "Apa pengertian syarat (dalam shalat)?", jawaban: "Sesuatu yang sahnya shalat bergantung kepadanya, tetapi bukan bagian dari shalat (hal. 4)" },
    { id: 48, soal: "Mengapa syarat shalat dibahas lebih dahulu daripada rukunnya?", jawaban: "Karena syarat lebih utama untuk didahulukan (hal. 4)" },
    { id: 167, soal: "Mengapa syarat lebih utama didahulukan daripada rukun shalat?", jawaban: "Sebab syarat wajib ada sebelum shalat dan harus terus berlangsung selama shalat (hal. 4)" },
    { id: 49, soal: "Ada berapa syarat shalat?", jawaban: "Lima (hal. 4)" },
    { id: 123, soal: "Apa syarat shalat yang pertama?", jawaban: "Suci dari hadats dan janabah (hal. 4)" },
    { id: 50, soal: "Apa pengertian thaharah secara bahasa?", jawaban: "Bersih dan lepas dari kotoran (hal. 4)" },
    { id: 124, soal: "Apa pengertian thaharah secara syara'?", jawaban: "Mengangkat larangan yang timbul akibat hadats atau najis (hal. 4)" },
    { id: 51, soal: "Apa yang dimaksud wudhū' (dengan dhammah)?", jawaban: "Penggunaan air pada anggota tubuh tertentu yang dibuka dengan niat (hal. 4)" },
    { id: 125, soal: "Apa yang dimaksud wadhū' (dengan fathah)?", jawaban: "Air yang dipakai untuk berwudhu (hal. 4)" },
    { id: 52, soal: "Kapan wudhu mulai diwajibkan?", jawaban: "Bersamaan dengan awal diwajibkannya shalat fardhu, yaitu pada malam Isra' (hal. 4)" },
    { id: 53, soal: "Ada berapa syarat wudhu? Sebutkan!", jawaban: "Lima (seperti syarat mandi):\n1. Air mutlak\n2. Air mengalir pada anggota yang dibasuh\n3. Tidak ada sesuatu pada anggota yang mengubah air secara merusak\n4. Tidak ada penghalang antara air dan anggota\n5. Masuk waktu bagi orang yang hadatsnya terus-menerus (hal. 4–5)" },
    { id: 54, soal: "Apa pengertian air mutlak?", jawaban: "Air yang bisa disebut 'air' tanpa qaid (keterangan tambahan yang mengikat) (hal. 4)" },
    { id: 126, soal: "Sebutkan contoh air yang termasuk air mutlak!", jawaban: "Air laut (keterangan 'laut' hanya sesuai kenyataan) dan air hasil uap air suci yang dididihkan (hal. 4)" },
    { id: 127, soal: "Berikan contoh air yang BUKAN air mutlak!", jawaban: "Air mawar (hanya bisa disebut dengan qaid) (hal. 4)" },
    { id: 55, soal: "Apa hukum bersuci dengan selain air mutlak?", jawaban: "Tidak bisa mengangkat hadats, tidak bisa menghilangkan najis, dan tidak menghasilkan thaharah lainnya walau sunnah (hal. 4)" },
    { id: 56, soal: "Apa syarat air mutlak agar sah untuk bersuci (terkait air musta'mal)?", jawaban: "Tidak musta'mal (bekas dipakai) dalam fardhu thaharah, selama airnya sedikit (kurang dari 2 qullah) (hal. 4)" },
    { id: 128, soal: "Fardhu thaharah apa saja yang membuat air menjadi musta'mal?", jawaban: "Mengangkat hadats kecil/besar, atau menghilangkan najis walau najis yang dimaafkan (hal. 4)" },
    { id: 168, soal: "Sebutkan contoh mengangkat hadats yang tetap membuat air musta'mal walau tanpa niat!", jawaban: "Thaharah orang Hanafi yang tidak berniat, atau anak kecil yang belum mumayyiz (diwudhukan untuk thawaf) (hal. 4)" },
    { id: 57, soal: "Jika air musta'mal dikumpulkan hingga mencapai 2 qullah, bagaimana hukumnya?", jawaban: "Menjadi suci menyucikan, sebagaimana air mutanajjis yang dikumpulkan hingga 2 qullah tanpa berubah, walaupun kemudian sedikit lagi setelah dipisah (hal. 4)" },
    { id: 129, soal: "Kapan status musta'mal berlaku pada air?", jawaban: "Hanya saat air sedikit (kurang dari 2 qullah) (hal. 4)" },
    { id: 58, soal: "Kapan air wudhu dihukumi musta'mal?", jawaban: "Setelah air terpisah dari anggota, walaupun terpisahnya secara hukum (hal. 4)" },
    { id: 169, soal: "Sebutkan contoh air wudhu yang terpisah dari anggota secara hukum!", jawaban: "Air melewati bahu atau lutut orang yang berwudhu walau kembali ke tempatnya, atau berpindah dari satu tangan ke tangan lain (hal. 4)" },
    { id: 59, soal: "Bagi orang berhadats, perpindahan air apa yang tidak membuatnya musta'mal?", jawaban: "Air berpindah dari telapak tangan ke lengan (sa'id) (hal. 4)" },
    { id: 130, soal: "Bagi orang junub, perpindahan air apa yang tidak membuatnya musta'mal?", jawaban: "Air berpindah dari kepala ke dada atau bagian yang biasa terkena percikan (hal. 4)" },
    { id: 60, soal: "Orang berwudhu memasukkan tangan ke air sedikit setelah membasuh wajah tanpa niat ightiraf (menciduk). Bagaimana status airnya?", jawaban: "Airnya menjadi musta'mal bagi selain tangannya (hal. 4)" },
    { id: 131, soal: "Setelah tangannya masuk ke air sedikit tanpa niat ightiraf, dengan apa ia boleh membasuh sisa lengannya?", jawaban: "Dengan air yang ada di tangannya saja (hal. 4)" },
    { id: 61, soal: "Kapan air mutlak tidak sah karena berubah oleh benda suci?", jawaban: "Jika berubah banyak hingga tidak bisa lagi disebut 'air', yaitu salah satu sifatnya (rasa, warna, atau bau) berubah walau secara perkiraan (taqdiri), oleh mukhalith (campuran) suci yang tidak bisa dipisahkan dan air tidak membutuhkannya (hal. 4)" },
    { id: 132, soal: "Berikan contoh mukhalith suci yang bisa mengubah air sehingga tidak sah untuk bersuci!", jawaban: "Za'faran, buah pohon, atau daun yang dilempar lalu hancur (hal. 4)" },
    { id: 62, soal: "Perubahan air apa yang tidak merusak kesucian air (tidak masalah)?", jawaban: "1. Perubahan sedikit, atau ragu apakah banyak atau sedikit\n2. Berubah karena tanah atau garam air\n3. Berubah karena mujawir (benda yang bisa dibedakan), seperti kayu gaharu, minyak, dupa (bukhur) walau wangi\n4. Berubah karena lama diam, daun yang gugur sendiri walau hancur, tanah liat, lumut di tempatnya, atau sesuatu yang air tidak bisa lepas darinya (hal. 4)" },
    { id: 63, soal: "Apa yang dimaksud mukhalith? Berikan contohnya!", jawaban: "Campuran yang tidak bisa dibedakan dari air menurut pandangan mata (misal za'faran) (hal. 4)" },
    { id: 133, soal: "Apa yang dimaksud mujawir? Berikan contohnya!", jawaban: "Benda yang bisa dibedakan bagi orang yang melihat (misal kayu gaharu, minyak) (hal. 4)" },
    { id: 64, soal: "Bagaimana hukum air banyak (2 qullah lebih) yang berubah karena najis?", jawaban: "Menjadi najis, walau perubahannya sedikit (hal. 4)" },
    { id: 65, soal: "Berapa ukuran 2 qullah menurut timbangan?", jawaban: "±500 rathl Baghdadi (hal. 4–5)" },
    { id: 134, soal: "Berapa ukuran 2 qullah pada wadah persegi?", jawaban: "1¼ dzira' panjang, lebar, dan dalamnya (dengan dzira' tangan yang sedang) (hal. 4–5)" },
    { id: 135, soal: "Berapa ukuran 2 qullah pada wadah bundar?", jawaban: "1 dzira' (dzira' manusia) di semua sisi dan dalamnya 2 dzira' (dzira' tukang kayu = 1¼ dzira' manusia) (hal. 4–5)" },

    // ── Hal. 5 — Hukum air & najis; syarat wudhu 2–5; fardhu wudhu (niat) ──
    { id: 66, soal: "Bagaimana hukum air yang diragukan sudah mencapai 2 qullah atau belum, lalu terkena najis?", jawaban: "Tidak najis, walaupun diyakini sebelumnya sedikit (hal. 5)" },
    { id: 67, soal: "Apakah wajib menjauhi najis di dalam air banyak (misal kencing di laut)?", jawaban: "Tidak wajib (hal. 5)" },
    { id: 136, soal: "Bagaimana hukum buih yang muncul dari air banyak yang terkena najis?", jawaban: "Najis jika dipastikan berasal dari najis atau dari air yang berubah sifatnya karena najis (hal. 5)" },
    { id: 68, soal: "Kapan air sedikit (kurang dari 2 qullah) menjadi najis?", jawaban: "Ketika kemasukan najis yang terlihat oleh mata normal dan tidak dimaafkan di dalam air, walau najis itu dimaafkan di dalam shalat, walaupun air tidak berubah (hal. 5)" },
    { id: 69, soal: "Apakah bangkai hewan yang darahnya tidak mengalir menajiskan air sedikit?", jawaban: "Tidak, kecuali jika mengubah air (hal. 5)" },
    { id: 170, soal: "Sebutkan contoh hewan yang darahnya tidak mengalir!", jawaban: "Kalajengking dan cicak (hal. 5)" },
    { id: 137, soal: "Apakah bangkai ular dan katak (dhifda') menajiskan air sedikit?", jawaban: "Ya, menajiskan air (hal. 5)" },
    { id: 70, soal: "Bagaimana hukum bangkai hewan yang hidup/tumbuh dari air (seperti lintah) di dalam air sedikit?", jawaban: "Tidak menajiskan air (hal. 5)" },
    { id: 71, soal: "Pendapat mazhab siapa yang dipilih banyak ulama Syafi'iyah bahwa air tidak najis kecuali berubah?", jawaban: "Mazhab Imam Malik: air tidak najis secara mutlak kecuali dengan berubah (hal. 5)" },
    { id: 72, soal: "Bagaimana cara menyucikan air SEDIKIT yang najis?", jawaban: "Dengan mencapai 2 qullah (walau dengan air mutanajjis) tanpa berubah (hal. 5)" },
    { id: 138, soal: "Bagaimana cara menyucikan air BANYAK yang najis?", jawaban: "Jika perubahannya hilang dengan sendirinya, atau dengan ditambah/dikurangi air selama sisanya tetap banyak (hal. 5)" },
    { id: 73, soal: "Apa syarat wudhu yang kedua?", jawaban: "Air mengalir pada anggota yang dibasuh (hal. 5)" },
    { id: 139, soal: "Apakah cukup hanya menyentuhkan air ke anggota wudhu tanpa mengalir?", jawaban: "Tidak cukup, karena tidak disebut 'membasuh' (ghasl) (hal. 5)" },
    { id: 74, soal: "Apa syarat wudhu yang ketiga?", jawaban: "Tidak ada sesuatu pada anggota yang mengubah air secara merusak (sampai tidak disebut air mutlak) (hal. 5)" },
    { id: 171, soal: "Sebutkan contoh benda yang mengubah air secara merusak (syarat wudhu ketiga)!", jawaban: "Za'faran dan cendana (shandal) (hal. 5)" },
    { id: 75, soal: "Apa syarat wudhu yang keempat?", jawaban: "Tidak ada penghalang antara air dan anggota yang dibasuh (hal. 5)" },
    { id: 172, soal: "Sebutkan contoh penghalang air pada anggota wudhu (syarat wudhu keempat)!", jawaban: "Kapur (nūrah), lilin, minyak beku, dan benda tinta atau inai (hal. 5)" },
    { id: 140, soal: "Apa saja yang TIDAK termasuk penghalang dalam wudhu?", jawaban: "Minyak cair walau air tidak menempel, serta bekas warna tinta dan inai yang tidak menghalangi (hal. 5)" },
    { id: 76, soal: "Bagaimana pendapat banyak ulama tentang kotoran di bawah kuku dalam wudhu?", jawaban: "Mensyaratkan tidak ada kotoran di bawah kuku yang menghalangi sampainya air (hal. 5)" },
    { id: 141, soal: "Siapa ulama yang memaafkan kotoran di bawah kuku (selain adonan) dalam wudhu?", jawaban: "Al-Ghazali, az-Zarkasyi, dan lainnya, yang memperpanjang pembahasan untuk menguatkannya (hal. 5)" },
    { id: 142, soal: "Siapa yang menunjukkan lemahnya pendapat yang memaafkan kotoran di bawah kuku?", jawaban: "Al-Adzra'i dan lainnya (hal. 5)" },
    { id: 77, soal: "Menurut fatwa al-Baghawi, kotoran apa yang menghalangi sahnya wudhu?", jawaban: "Kotoran dari debu (ghubar) (hal. 5)" },
    { id: 143, soal: "Menurut fatwa al-Baghawi, kotoran apa yang tidak menghalangi sahnya wudhu?", jawaban: "Kotoran yang berasal dari badan sendiri, yaitu keringat yang membeku (hal. 5)" },
    { id: 78, soal: "Apa syarat wudhu yang kelima?", jawaban: "Masuk waktu shalat (minimal dugaan kuat sudah masuk) (hal. 5)" },
    { id: 173, soal: "Syarat wudhu kelima (masuk waktu shalat) berlaku bagi siapa?", jawaban: "Bagi orang yang hadatsnya terus-menerus (dāimul hadats) (hal. 5)" },
    { id: 174, soal: "Sebutkan contoh orang yang hadatsnya terus-menerus (dāimul hadats)!", jawaban: "Penderita salisul baul dan perempuan mustahadhah (hal. 5)" },
    { id: 144, soal: "Bolehkah orang yang hadatsnya terus-menerus berwudhu sebelum masuk waktu shalat?", jawaban: "Tidak boleh, sebagaimana tayamum (hal. 5)" },
    { id: 79, soal: "Apa kewajiban orang yang hadatsnya terus-menerus (salis/mustahadhah) terkait wudhu dan shalat?", jawaban: "Berwudhu untuk setiap shalat fardhu, mencuci kemaluan, mengganti kapas dan pembalut walau tidak bergeser dari tempatnya, serta segera shalat setelah wudhu (hal. 5)" },
    { id: 175, soal: "Kewajiban wudhu untuk setiap shalat fardhu bagi dāimul hadats disamakan dengan apa?", jawaban: "Dengan tayamum (sama-sama wajib diulang untuk setiap shalat fardhu) (hal. 5)" },
    { id: 145, soal: "Bolehkah orang yang hadatsnya terus-menerus menunda shalat setelah wudhu?", jawaban: "Boleh menunda untuk kemaslahatan shalat, seperti menunggu jamaah atau pergi ke masjid (hal. 5)" },
    { id: 80, soal: "Khatib yang hadatsnya terus-menerus harus berwudhu berapa kali saat Jumat?", jawaban: "Dua wudhu (atau dua tayamum): satu untuk dua khutbah dan satu lagi setelahnya untuk shalat Jumat (hal. 5)" },
    { id: 81, soal: "Ada berapa fardhu wudhu?", jawaban: "Enam (hal. 5)" },
    { id: 146, soal: "Apa fardhu wudhu yang pertama?", jawaban: "Niat (hal. 5)" },
    { id: 82, soal: "Bagaimana bentuk niat wudhu yang sah?", jawaban: "1. Niat wudhu, atau menunaikan (adā') fardhu wudhu\n2. Niat mengangkat hadats (bagi selain dāimul hadats), termasuk pada wudhu yang diperbarui\n3. Niat bersuci dari hadats\n4. Niat istibahah (dibolehkannya) sesuatu yang membutuhkan wudhu, seperti shalat dan menyentuh mushaf (hal. 5)" },
    { id: 83, soal: "Apakah sah niat wudhu dengan niat 'agar boleh membaca Al-Qur'an'?", jawaban: "Tidak sah, karena membaca Al-Qur'an hanya disunnahkan wudhu (hal. 5)" },
    { id: 147, soal: "Sebutkan contoh perbuatan yang hanya disunnahkan wudhu (tidak cukup dijadikan niat istibahah)!", jawaban: "Membaca Al-Qur'an atau hadits, masuk masjid, dan ziarah kubur (hal. 5)" },
    { id: 84, soal: "Apa dalil asal wajibnya niat?", jawaban: "Hadits: 'Innamal a'mālu bin-niyyāt' (Sesungguhnya amal itu tergantung niatnya), maksudnya sahnya amal tergantung niat (hal. 5)" },
    { id: 85, soal: "Kapan niat wudhu wajib dilakukan?", jawaban: "Wajib bersamaan (qiran) dengan basuhan pertama bagian wajah (hal. 5)" },
    { id: 86, soal: "Bagaimana jika niat wudhu dilakukan di TENGAH membasuh wajah?", jawaban: "Cukup, tetapi wajib mengulang basuhan wajah yang sebelum niat (hal. 5)" },
    { id: 148, soal: "Bagaimana jika niat wudhu dilakukan SEBELUM membasuh wajah?", jawaban: "Tidak cukup jika niatnya tidak berlanjut sampai membasuh wajah (hal. 5)" },
    { id: 87, soal: "Kapan sunnah madhmadhah (berkumur) terlewat terkait niat?", jawaban: "Jika saat berkumur ikut terbasuh sebagian wajah (seperti merah bibir) setelah niat (hal. 5)" },
    { id: 149, soal: "Mengapa sunnah berkumur terlewat jika saat itu ikut terbasuh merah bibir setelah niat?", jawaban: "Karena basuhan itu terhitung awal membasuh wajah (hal. 5)" },
    { id: 88, soal: "Bagaimana cara niat wudhu yang lebih utama (aulā)?", jawaban: "Memisahkan niat sunnah wudhu dan niat fardhu wudhu (hal. 5)" },
    { id: 176, soal: "Pada cara niat wudhu yang lebih utama, kapan berniat sunnah wudhu?", jawaban: "Ketika membasuh kedua telapak tangan, berkumur, dan istinsyaq (hal. 5)" },
    { id: 177, soal: "Pada cara niat wudhu yang lebih utama, kapan berniat fardhu wudhu?", jawaban: "Ketika membasuh wajah (hal. 5)" },
    { id: 150, soal: "Apa keuntungan memisahkan niat sunnah dan fardhu wudhu?", jawaban: "Tidak terlewat keutamaan menghadirkan niat dari awal dan keutamaan berkumur (hal. 5)" },
  ],

  "Tauhid": [
    // Sumber: Kifayatul 'Awam (al-Fudhali) — matan di luar kotak (hamisy), syarah dalam kotak: Tahqiqul Maqam (al-Bajuri)
    { id: 1, soal: "Matan kitab Tauhid (Kifayatul 'Awam) dibuka dengan bacaan apa?", jawaban: "Basmalah: بسم الله الرحمن الرحيم (hal. 2)" },
    { id: 2, soal: "Setelah basmalah, mushannif melanjutkan dengan bacaan apa?", jawaban: "Hamdalah: الحمد لله (segala puji bagi Allah) (hal. 3)" },
    { id: 3, soal: "Dalam hamdalah pembuka kitab, Allah dipuji dengan sifat apa?", jawaban: "المنفرد بالإيجاد — Yang Maha Esa (sendirian) dalam mewujudkan/menciptakan segala sesuatu (hal. 4)" },
    { id: 4, soal: "Kepada siapa shalawat dan salam ditujukan dalam muqaddimah kitab?", jawaban: "Kepada Sayyidina Muhammad ﷺ: والصلاة والسلام على سيدنا محمد (hal. 5–6)" },
    { id: 5, soal: "Dengan sebutan apa Nabi Muhammad ﷺ disifati dalam muqaddimah kitab?", jawaban: "أفضل العباد — hamba (makhluk) yang paling utama (hal. 7)" },
    { id: 6, soal: "Setelah Nabi Muhammad ﷺ, shalawat dalam muqaddimah juga ditujukan kepada siapa?", jawaban: "Kepada keluarga beliau: وعلى آله (hal. 7)" },
    { id: 7, soal: "Dalam muqaddimah, para sahabat Nabi ﷺ disifati dengan sebutan apa?", jawaban: "أولى البهجة والرشاد — pemilik keindahan (keceriaan) dan petunjuk/kebenaran (hal. 8)" },
    { id: 8, soal: "Siapa nama lengkap pengarang matan Kifayatul 'Awam?", jawaban: "Muhammad bin asy-Syafi'i al-Fudhali asy-Syafi'i (hal. 9)" },
    { id: 9, soal: "Pengarang Kifayatul 'Awam bermazhab apa dalam fiqih?", jawaban: "Mazhab Syafi'i (nisbah الشافعي di akhir namanya) (hal. 9)" },
    { id: 10, soal: "Dengan sebutan apa mushannif menyebut dirinya dalam muqaddimah?", jawaban: "العبد الفقير إلى رحمة ربه المتعالي — hamba yang butuh rahmat Tuhannya Yang Maha Tinggi (hal. 9)" },
    { id: 11, soal: "Apa sebab mushannif menulis kitab Kifayatul 'Awam?", jawaban: "Diminta oleh sebagian saudara (ikhwan) untuk menyusun sebuah risalah tentang tauhid, lalu ia memenuhinya (hal. 9–10)" },
    { id: 12, soal: "Dalam menyusun kitabnya, mushannif mengikuti metode siapa?", jawaban: "Al-'Allamah Syekh as-Sanusi dalam menetapkan (taqrir) dalil-dalil/barahin (hal. 10)" },
    { id: 13, soal: "Apa perbedaan cara mushannif dengan Syekh as-Sanusi dalam menyampaikan dalil?", jawaban: "Mushannif mendatangkan dalil langsung di samping madlul-nya (akidah yang dibuktikan) dan menambah penjelasan (hal. 11)" },
    { id: 14, soal: "Mengapa mushannif menambah penjelasan dalam kitabnya?", jawaban: "Karena ia tahu kemampuan pemahaman penuntut ilmu ini masih terbatas (hal. 11)" },
    { id: 15, soal: "Bagaimana mushannif menyifati risalah (kitab) yang ia tulis?", jawaban: "Risalah yang bermanfaat (مفيدة) dan bagus dalam menetapkan isinya (مجيدة) (hal. 11)" },
    { id: 16, soal: "Apa nama lengkap kitab yang diberikan oleh mushannif?", jawaban: "كفاية العوام فيما يجب عليهم من علم الكلام — Kifayatul 'Awam fima Yajibu 'alaihim min 'Ilmil Kalam (hal. 11)" },
    { id: 17, soal: "Apa arti nama kitab Kifayatul 'Awam fima Yajibu 'alaihim min 'Ilmil Kalam?", jawaban: "Kecukupan bagi orang awam tentang apa yang wajib atas mereka dari ilmu kalam (hal. 11)" },
    { id: 18, soal: "Apa doa mushannif untuk kitabnya?", jawaban: "Memohon kepada Allah Ta'ala agar kitab ini memberi manfaat (hal. 12)" },
    { id: 19, soal: "Dengan kalimat apa mushannif menutup doanya di muqaddimah?", jawaban: "وهو حسبي ونعم الوكيل — Dia-lah yang mencukupiku dan sebaik-baik tempat berserah (hal. 12)" },
    { id: 20, soal: "Berapa jumlah akidah yang wajib diketahui oleh setiap muslim?", jawaban: "50 akidah (خمسين عقيدة) (hal. 14)" },
    { id: 21, soal: "Selain mengetahui 50 akidah, apa lagi yang wajib diketahui setiap muslim?", jawaban: "Wajib mengetahui dalil untuk setiap akidah tersebut, baik dalil ijmali (global) maupun tafshili (terperinci) (hal. 14–15)" },
    { id: 22, soal: "Menurut sebagian ulama, dalil apa yang disyaratkan untuk diketahui dalam akidah?", jawaban: "Dalil tafshili (terperinci) (hal. 15)" },
    { id: 23, soal: "Menurut jumhur (mayoritas ulama), dalil apa yang sudah cukup untuk setiap akidah dari 50 akidah?", jawaban: "Dalil ijmali (global) sudah cukup (hal. 15–16)" },
    { id: 24, soal: "Sebutkan contoh dalil tafshili tentang wujud Allah!", jawaban: "Ditanya 'apa dalil wujud Allah?', ia menjawab 'makhluk-makhluk ini', lalu ia mampu menjawab pertanyaan lanjutannya (hal. 15–16)" },
    { id: 27, soal: "Dalam contoh dalil tafshili, pertanyaan lanjutan apa yang harus mampu dijawab?", jawaban: "'Makhluk menunjukkan wujud Allah dari segi imkan-nya atau dari segi wujudnya setelah tiada?' (hal. 15–16)" },
    { id: 25, soal: "Dari dua segi apa makhluk menjadi dalil atas wujud Allah Ta'ala?", jawaban: "Dari segi imkan-nya (makhluk itu bisa ada dan bisa tiada) dan dari segi wujudnya setelah sebelumnya tidak ada (hal. 16)" },
    { id: 26, soal: "Kapan jawaban \"makhluk-makhluk ini\" (sebagai dalil wujud Allah) disebut dalil ijmali?", jawaban: "Ketika ia tidak bisa menjawab lanjutan pertanyaan dan tidak tahu apakah dari segi imkan atau dari segi wujud setelah tiada (hal. 16)" },
  ],
  "Nahwu": [
    // Sumber: al-Kawakib ad-Durriyyah syarh Mutammimah al-Ajurrumiyyah — teks di dalam kotak
    { id: 1, soal: "Kitab nahwu ini (al-Kawakib ad-Durriyyah) merupakan syarah dari kitab apa?", jawaban: "Mutammimah al-Ajurrumiyyah (hal. 3)" },
    { id: 2, soal: "Siapa pengarang kitab Mutammimah al-Ajurrumiyyah?", jawaban: "Syekh Muhammad bin Muhammad ar-Ru'aini, terkenal dengan sebutan al-Haththab (hal. 3)" },
    { id: 3, soal: "Apa sebab pensyarah menulis al-Kawakib ad-Durriyyah?", jawaban: "Diminta oleh sebagian pelajar yang cerdas (hudzdzāqut thullāb) untuk mensyarah Mutammimah (hal. 3)" },
    { id: 4, soal: "Syarah seperti apa yang diminta para pelajar kepada pensyarah?", jawaban: "Syarah yang menguraikan makna, membetulkan susunan lafaz, mengi'rab contoh-contohnya, dan membuka bagian yang sulit (hal. 3)" },
    { id: 5, soal: "Dengan cara apa syarah al-Kawakib ad-Durriyyah ditulis?", jawaban: "Dengan cara ringkas (sabīlul ījāz) dan menghindari teka-teki/ungkapan yang membingungkan (hal. 3)" },
    { id: 6, soal: "Awalnya, pensyarah merujuk para pelajar kepada syarah siapa?", jawaban: "Syarah al-'Allamah 'Afifuddin Abdullah bin Ahmad al-Fakihi (hal. 3)" },
    { id: 7, soal: "Apa nama syarah Mutammimah karya al-Fakihi?", jawaban: "Al-Fawākih al-Janiyyah (hal. 3)" },
    { id: 8, soal: "Mengapa pensyarah awalnya menunda permintaan para pelajar?", jawaban: "Karena ia tidak tahu ada orang lain yang mensyarah Mutammimah selain al-Fakihi (hal. 3)" },
    { id: 9, soal: "Mengapa pensyarah akhirnya mulai menulis syarahnya?", jawaban: "Karena ada kebutuhan menyingkap i'rab contoh-contoh (amtsilah) dan syawāhid kitab Mutammimah (hal. 3)" },
    { id: 10, soal: "Bagi siapa syarah al-Kawakib ad-Durriyyah bermanfaat?", jawaban: "Pemula (mubtadi') mendapat manfaat, dan orang yang sudah mahir (muntahī) tidak merasa cukup tanpanya (hal. 3)" },
    { id: 11, soal: "Apa nama lengkap syarah ini?", jawaban: "Al-Kawākib ad-Durriyyah Syarḥ Mutammimah al-Ājurrūmiyyah (hal. 3)" },
    { id: 12, soal: "Dengan cara apa pensyarah meriwayatkan kitab Mutammimah?", jawaban: "Dengan ijazah umum (ijāzah 'āmmah) (hal. 3)" },
    { id: 13, soal: "Dari siapa pensyarah mendapat ijazah umum kitab Mutammimah?", jawaban: "Dari gurunya, Syaikhul Islam al-Hasan bin Abdul Bari al-Ahdal (hal. 3)" },
    { id: 14, soal: "Sanad periwayatan Mutammimah berujung pada siapa?", jawaban: "Syekh Yahya bin Muhammad al-Haththab, dari ayahnya sang pengarang, Muhammad bin Muhammad al-Haththab (hal. 3)" },
    { id: 15, soal: "Huruf ح pada nama al-Haththab ditulis dengan huruf apa?", jawaban: "Dengan ha' muhmalah (ح tanpa titik) (hal. 3)" },
    { id: 16, soal: "Menurut al-'Aqiq al-Yamani, siapakah Bani Haththab?", jawaban: "Keluarga terkenal di Makkah (hal. 3)" },
    { id: 17, soal: "Menurut al-'Aqiq al-Yamani, Bani Haththab dikenal sebagai ahli apa?", jawaban: "Ahli ibadah, zuhud, ma'rifat, dan kesalehan (hal. 3)" },
    { id: 18, soal: "Mengapa pengarang membuka kitabnya dengan basmalah?", jawaban: "Meneladani Al-Qur'an (hal. 3)" },
    { id: 19, soal: "Selain Al-Qur'an, kitab apa saja yang dibuka dengan basmalah?", jawaban: "Seluruh kitab samawi (hal. 3)" },
    { id: 20, soal: "Apa dalil bahwa seluruh kitab samawi dibuka dengan basmalah?", jawaban: "Khabar Jibril: basmalah adalah pembuka setiap kitab (hal. 3–4)" },
    { id: 21, soal: "Bagaimana hadits tentang perkara penting yang tidak dimulai dengan basmalah?", jawaban: "Setiap perkara penting (dzī bāl) yang tidak dimulai dengan bismillāhirraḥmānirraḥīm maka ia aqtha' (hal. 4)" },
    { id: 22, soal: "Apa arti aqtha' dalam hadits basmalah?", jawaban: "Kurang, tidak sempurna, sehingga sedikit berkahnya (hal. 4)" },
    { id: 23, soal: "Al-Fakihi tidak menyebut basmalah dalam syarahnya. Matannya dimulai dengan apa?", jawaban: "Dengan hamdalah (hal. 4)" },
    { id: 24, soal: "Jika pengarang Mutammimah tidak menulis basmalah, mengapa itu dianggap cukup?", jawaban: "Karena memulai (ibtidā') bisa tercapai dengan hamdalah, bahkan dengan setiap dzikir (hal. 4)" },
    { id: 25, soal: "Sebutkan contoh dzikir selain basmalah dan hamdalah yang bisa dipakai untuk memulai!", jawaban: "Dua syahadat, serta shalawat dan salam kepada Nabi Muhammad ﷺ (hal. 4)" },
    { id: 26, soal: "Menurut sebagian ulama, berapa hal yang sebaiknya disebut setiap orang yang memulai karya tulis?", jawaban: "Delapan hal (hal. 4)" },
    { id: 27, soal: "Sebutkan delapan hal yang sebaiknya disebut di awal karya tulis!", jawaban: "Basmalah, hamdalah, shalawat-salam atas Rasulullah ﷺ, dua syahadat, nama dirinya, nama kitab, isyarat tujuan kitab, dan lafaz ammā ba'du (hal. 4)" },
    { id: 28, soal: "Mengapa diduga pengarang Mutammimah tidak melalaikan basmalah?", jawaban: "Karena semua naskah kitab asalnya (al-Ajurrumiyyah) memuat basmalah (hal. 4)" },
    { id: 29, soal: "Apakah pengarang al-Ajurrumiyyah memulai dengan hamdalah setelah basmalah?", jawaban: "Tidak (hal. 4)" },
    { id: 30, soal: "Selain pengarang al-Ajurrumiyyah, siapa yang juga tidak memulai dengan hamdalah setelah basmalah, dan dalam kitab apa?", jawaban: "Ibnu Hisyam, dalam Qathrun Nada, Syudzurudz Dzahab, dan al-Jami' (hal. 4)" },
    { id: 31, soal: "Menurut al-'Alawi, apa alasan pertama pengarang tidak menulis hamdalah setelah basmalah?", jawaban: "Mungkin ia sudah mengucapkannya secara lisan saat memulai (hal. 4)" },
    { id: 32, soal: "Menurut al-'Alawi, mengapa basmalah saja sudah mencukupi tanpa hamdalah?", jawaban: "Karena makna hamd sudah terkandung dalam basmalah (hamd = menyifati dengan keindahan secara mengagungkan) (hal. 4)" },
    { id: 33, soal: "Menurut al-'Alawi, apa alasan tawadhu' pengarang tidak menulis hamdalah?", jawaban: "Ia menganggap kitabnya tidak seperti kitab-kitab salaf sehingga tidak perlu dimulai dengan cara mereka (hal. 4)" },
    { id: 34, soal: "Siapa yang mengisyaratkan alasan tawadhu' itu dalam hasyiyahnya?", jawaban: "Al-Hindi (hal. 4)" },
    { id: 35, soal: "Bagaimana hadits tentang perkara penting yang tidak dimulai dengan hamdalah?", jawaban: "Setiap perkara penting yang tidak dimulai dengan ḥamdillāh maka ia aqtha' (dalam riwayat lain: ajdzam) (hal. 4)" },
    { id: 36, soal: "Siapa yang meriwayatkan hadits hamdalah, dan siapa yang menghasankannya?", jawaban: "Diriwayatkan Abu Dawud, dihasankan Ibnu Shalah (hal. 4)" },
    { id: 37, soal: "Apa arti ajdzam dalam hadits hamdalah?", jawaban: "Kurang berkahnya atau hilang berkahnya (hal. 4)" },
    { id: 38, soal: "Apa pengertian hamd secara bahasa (lughatan)?", jawaban: "Pujian dengan lisan atas keindahan yang ikhtiyari (atas pilihan sendiri) (hal. 4)" },
    { id: 39, soal: "Apakah hamd secara bahasa harus sebagai balasan atas nikmat?", jawaban: "Tidak, baik sebagai balasan nikmat maupun tidak (hal. 4)" },
    { id: 40, soal: "Apa pengertian syukur secara bahasa?", jawaban: "Perbuatan yang lahir dari pengagungan kepada pemberi nikmat karena ia memberi nikmat (hal. 4)" },
    { id: 41, soal: "Apa hubungan syukur lughawi dengan hamd 'urfi?", jawaban: "Sama: keduanya perbuatan yang lahir dari pengagungan pemberi nikmat, dengan lisan maupun lainnya (hal. 4)" },
    { id: 42, soal: "Apa pengertian syukur secara 'urf (istilah)?", jawaban: "Hamba menggunakan seluruh nikmat Allah untuk tujuan ia diciptakan (hal. 4)" },
    { id: 43, soal: "Sebutkan contoh nikmat yang harus digunakan sesuai tujuannya dalam syukur 'urfi!", jawaban: "Pendengaran dan penglihatan, digunakan untuk shalat, puasa, mendengar ilmu, dan sebagainya (hal. 4)" },
    { id: 44, soal: "Apa pengertian madh (pujian) secara bahasa?", jawaban: "Pujian dengan lisan atas keindahan yang tidak ikhtiyari (hal. 4)" },
    { id: 45, soal: "Sebutkan contoh keindahan tidak ikhtiyari yang dipuji dengan madh!", jawaban: "Indahnya mutiara, tinggi badan, dan jernihnya warna kulit (hal. 4)" },
    { id: 46, soal: "Apa pengertian madh secara 'urf?", jawaban: "Sesuatu yang menunjukkan kekhususan orang yang dipuji dengan suatu keutamaan (hal. 4)" },
    { id: 47, soal: "Berikan contoh madh secara 'urf!", jawaban: "Memuji Zaid karena tubuhnya ramping dan senyumnya indah (hal. 4)" },
    { id: 48, soal: "Kalimat hamdalah termasuk jumlah khabariyyah atau insya'iyyah?", jawaban: "Khabariyyah secara lafaz, insya'iyyah secara makna (hal. 4)" },
    { id: 49, soal: "Mengapa hamdalah disebut insya'iyyah secara makna?", jawaban: "Karena maksudnya mewujudkan pujian kepada Allah, bukan sekadar memberi kabar (hal. 4)" },
    { id: 50, soal: "Selain hamdalah, jumlah apa yang juga khabariyyah lafaznya dan insya'iyyah maknanya?", jawaban: "Shalawat-salam dan basmalah (hal. 4)" },
    { id: 51, soal: "Apa arti rabb dalam rabbil 'ālamīn?", jawaban: "Mālik (pemilik) (hal. 4)" },
    { id: 52, soal: "Apa arti al-'ālamīn?", jawaban: "Seluruh makhluk: manusia, jin, malaikat, dan lainnya (hal. 4)" },
    { id: 53, soal: "Mengapa al-'ālamīn dijamak dengan ya' dan nun?", jawaban: "Karena menggolongkan yang berakal ('uqalā') atas yang lainnya (hal. 4)" },
    { id: 54, soal: "Menurut an-Nawawi dalam Syarah Muslim, apa arti al-'ālam?", jawaban: "Nama untuk semua makhluk, yaitu segala sesuatu selain Allah (hal. 4)" },
    { id: 55, soal: "Menurut an-Nawawi, al-'ālamīn khusus untuk siapa?", jawaban: "Yang berakal: manusia, jin, dan malaikat (hal. 4)" },
    { id: 56, soal: "Apa arti ash-shalāh dalam shalawat kepada Nabi?", jawaban: "Rahmat yang disertai pengagungan (hal. 4)" },
    { id: 57, soal: "Apa arti as-salām dalam shalawat kepada Nabi?", jawaban: "At-taḥiyyah (penghormatan) (hal. 4)" },
    { id: 58, soal: "Apa arti as-sayyid?", jawaban: "Orang yang memimpin kaumnya, yaitu lebih utama dari mereka dengan ilmu, kemuliaan, atau kepemimpinan (hal. 4)" },
    { id: 59, soal: "Apa dalil Nabi ﷺ adalah sayyid seluruh makhluk?", jawaban: "Ijma', dan sabda beliau: anā sayyidu waladi Ādam wa lā fakhr (hal. 4)" },
    { id: 60, soal: "Apa asal kata sayyid?", jawaban: "Sayyiwid (fathah sin, sukun ya') (hal. 4)" },
    { id: 61, soal: "Bagaimana proses sayyiwid menjadi sayyid?", jawaban: "Waw dan ya' berkumpul dan yang pertama sukun, maka waw diganti ya' lalu diidghamkan ke ya' (hal. 4)" },
    { id: 62, soal: "Bagaimana hukum menyebut sayyid untuk selain Allah?", jawaban: "Boleh tanpa makruh, baik ma'rifah maupun nakirah (hal. 4)" },
    { id: 63, soal: "Apa dalil bolehnya menyebut sayyid untuk selain Allah?", jawaban: "Firman Allah tentang Nabi Yahya: sayyidan wa ḥaṣūrā, dan hadits: inna ibnī hādzā sayyid (hal. 4)" },
    { id: 64, soal: "Bagaimana hukum menyebut sayyidinā dalam shalawat kepada Nabi Muhammad ﷺ?", jawaban: "Lebih utama daripada membuangnya (hal. 4)" },
    { id: 65, soal: "Mengapa menyebut sayyidinā dalam shalawat lebih utama?", jawaban: "Karena di dalamnya ada pengagungan terhadap tingginya kedudukan Nabi ﷺ (hal. 4)" },
    { id: 66, soal: "Bagaimana i'rab aṣ-ṣalātu was-salāmu 'alā sayyidinā menurut pensyarah?", jawaban: "Aṣ-ṣalātu mubtada', was-salāmu ma'thuf kepadanya, dan 'alā sayyidinā khabar yang berta'alluq dengan kā'inān (hal. 4)" },
    { id: 67, soal: "Menurut al-Fakihi, 'alā sayyidinā berta'alluq dengan apa?", jawaban: "Dengan as-salām saja (padahal maknanya juga dituntut untuk ash-shalāh) (hal. 4)" },
    { id: 68, soal: "Mengapa pendapat al-Fakihi tentang ta'alluq 'alā sayyidinā dianggap keliru (wahm)?", jawaban: "Karena ia menjadikannya bab tanāzu', padahal bukan (hal. 5)" },
    { id: 69, soal: "Lafaz Muḥammadin dalam shalawat dibaca jar sebagai apa?", jawaban: "'Athaf bayan atau badal (hal. 5)" },
    { id: 70, soal: "Mengapa lafaz Muhammad tidak boleh menjadi na't (sifat)?", jawaban: "Karena Muhammad adalah 'alam, dan 'alam tidak boleh disifatkan dengannya (hal. 5)" },
    { id: 71, soal: "Nama Muhammad dipindah (manqūl) dari bentuk apa?", jawaban: "Dari isim maf'ul fi'il yang ditasydid (mudha''af) untuk mubalaghah (hal. 5)" },
    { id: 72, soal: "Mengapa Nabi ﷺ dinamai Muhammad?", jawaban: "Karena banyaknya sifat beliau yang terpuji (hal. 5)" },
    { id: 73, soal: "Apa nama Nabi ﷺ di bumi?", jawaban: "Muhammad (hal. 5)" },
    { id: 370, soal: "Apa nama masyhur Nabi ﷺ di langit?", jawaban: "Ahmad (hal. 5)" },
    { id: 74, soal: "Apakah ada orang yang dinamai Ahmad sebelum Nabi ﷺ?", jawaban: "Tidak ada (hal. 5)" },
    { id: 371, soal: "Nama apa yang sudah dipakai beberapa orang sebelum kelahiran Nabi ﷺ?", jawaban: "Muhammad (hal. 5)" },
    { id: 75, soal: "Bagaimana hukum memberi nama dengan nama-nama Nabi ﷺ?", jawaban: "Dianjurkan (yanbaghī) (hal. 5)" },
    { id: 76, soal: "Apa isi hadits qudsi tentang orang yang bernama dengan nama Nabi ﷺ?", jawaban: "Allah berfirman: Demi kemuliaan dan keagungan-Ku, Aku tidak akan mengazab dengan neraka seseorang yang bernama dengan namamu (hal. 5)" },
    { id: 77, soal: "Dalam riwayat lain, Allah bersumpah tidak memasukkan neraka orang yang bernama apa?", jawaban: "Ahmad atau Muhammad (hal. 5)" },
    { id: 78, soal: "Ada yang berkata tidak ada hadits sahih tentang keutamaan nama Muhammad. Bagaimana tanggapan pensyarah?", jawaban: "Tidak menafikan, karena kumpulan riwayatnya dari banyak jalur saling menguatkan sehingga layak menjadi sandaran istihbab (hal. 5)" },
    { id: 79, soal: "Siapa yang dimaksud āl (keluarga) Nabi ﷺ?", jawaban: "Kerabat beliau yang mukmin dari Bani Hasyim dan Bani al-Muththalib (hal. 5)" },
    { id: 80, soal: "Hasyim dan al-Muththalib adalah anak siapa?", jawaban: "Abdu Manaf (hal. 5)" },
    { id: 81, soal: "Lafaz āl termasuk jenis kata apa?", jawaban: "Isim jamak yang tidak punya mufrad dari lafaznya (hal. 5)" },
    { id: 82, soal: "Apa asal lafaz āl?", jawaban: "Ahl (hal. 5)" },
    { id: 83, soal: "Bagaimana proses ahl menjadi āl?", jawaban: "Ha' diganti hamzah, lalu hamzah diganti alif (hal. 5)" },
    { id: 84, soal: "Lafaz āl hanya dipakai untuk siapa?", jawaban: "Untuk orang-orang mulia (asyrāf), beda dengan ahl yang dipakai untuk orang mulia maupun lainnya (hal. 5)" },
    { id: 85, soal: "Berikan contoh bahwa āl tidak dipakai untuk orang biasa!", jawaban: "Tidak dikatakan Āl al-Iskāfī (keluarga tukang sepatu) (hal. 5)" },
    { id: 86, soal: "Mengapa boleh dikatakan Āl Fir'aun?", jawaban: "Karena Fir'aun digambarkan berupa orang mulia (secara duniawi) (hal. 5)" },
    { id: 87, soal: "Lafaz ṣaḥb termasuk jenis kata apa?", jawaban: "Isim jamak dari ṣāḥib, yang bermakna shahabi (hal. 5)" },
    { id: 88, soal: "Apa definisi shahabi?", jawaban: "Orang yang berjumpa Nabi ﷺ setelah kenabian semasa hidup beliau dalam keadaan mukmin, dan wafat dalam keadaan itu (hal. 5)" },
    { id: 89, soal: "Menurut pendapat yang ashah, apakah orang buta, anak belum mumayyiz, malaikat, dan jin bisa termasuk shahabi?", jawaban: "Ya, termasuk (hal. 5)" },
    { id: 90, soal: "Mana yang lebih utama: shahabat, atau āl yang bukan shahabat?", jawaban: "Shahabat lebih utama (hal. 5)" },
    { id: 91, soal: "Mengapa āl didahulukan atas shahabat dalam shalawat?", jawaban: "Karena shalawat atas āl ada nashnya, sedangkan atas shahabat dengan qiyas (hal. 5)" },
    { id: 92, soal: "Lafaz ajma'īn dalam shalawat berfungsi sebagai apa?", jawaban: "Ta'kid, untuk faedah mencakup semua āl dan shahabat tanpa pengecualian (hal. 5)" },
    { id: 93, soal: "Apa isyarat dari lafaz ajma'īn untuk para shahabat?", jawaban: "Semua shahabat adil, dan celaan terhadap sebagian mereka tidak diterima (hal. 5)" },
    { id: 94, soal: "Apa dalil bahwa āl Nabi berhak mendapat shalawat?", jawaban: "Hadits kaifa nuṣallī 'alaik: Nabi mengajarkan Allāhumma ṣalli 'alā Muḥammad wa 'alā āli Muḥammad (hal. 5)" },
    { id: 95, soal: "Dalam hadits kaifa nushalli 'alaik, Nabi tidak mengatakan āl yang bertakwa. Apa kesimpulannya?", jawaban: "Shalawat adalah hak āl Nabi bagaimanapun keadaan mereka (hal. 5)" },
    { id: 96, soal: "Bagaimana isi syair Imam Syafi'i tentang ahlul bait?", jawaban: "Wahai ahlul bait Rasulullah, mencintai kalian adalah kewajiban dari Allah yang Dia turunkan dalam Al-Qur'an (hal. 5)" },
    { id: 97, soal: "Menurut syair Imam Syafi'i, bagaimana keadaan orang yang tidak bershalawat kepada ahlul bait?", jawaban: "Tidak ada shalat baginya (lā ṣalāta lah) (hal. 5)" },
    { id: 98, soal: "Bagaimana hukum orang yang meninggalkan shalawat atas āl Nabi?", jawaban: "Meninggalkan keutamaan yang agung dan sunnah yang besar (hal. 5)" },
    { id: 99, soal: "Apa fungsi kalimat wa ba'du?", jawaban: "Dipakai untuk berpindah dari satu gaya bahasa (uslub) ke uslub lain (hal. 5)" },
    { id: 100, soal: "Waw pada wa ba'du adalah pengganti dari apa?", jawaban: "Pengganti ammā syarthiyyah (hal. 5)" },
    { id: 101, soal: "Mengapa setelah wa ba'du wajib ada fa'?", jawaban: "Karena waw-nya pengganti ammā syarthiyyah (hal. 5)" },
    { id: 102, soal: "Ammā pada ammā ba'du adalah pengganti dari apa?", jawaban: "Pengganti mahmā syarthiyyah beserta fi'ilnya (hal. 5)" },
    { id: 103, soal: "Lafaz ba'du termasuk jenis kata apa?", jawaban: "Zharaf yang selalu idhafah (hal. 5)" },

    { id: 221, soal: "Bagaimana bencana alam (banjir, tanah longsor, tsunami) menyebabkan kemiskinan?", jawaban: "Merusak infrastruktur, menurunkan psikologi masyarakat, dan membuat masyarakat kehilangan harta bendanya (hal. 22–23)" },

    // ── Hal. 23 — Penyebab menurut ahli, dampak, upaya penanggulangan ──
    { id: 107, soal: "Bagaimana distribusi pendapatan yang tidak merata menyebabkan kemiskinan?", jawaban: "Menyebabkan ketimpangan pada pola kepemilikan sumber daya (hal. 23)" },
    { id: 222, soal: "Masyarakat dengan sumber daya seperti apa yang umumnya berada di bawah garis kemiskinan?", jawaban: "Masyarakat yang memiliki sumber daya terbatas serta rendah (hal. 23)" },
    { id: 108, soal: "Apa penyebab kemiskinan menurut Henry George?", jawaban: "Kepemilikan pribadi serta monopoli individu atas tanah (hal. 23)" },
    { id: 223, soal: "Apa penyebab kemiskinan menurut Karl Marx?", jawaban: "Eksploitasi para pekerja oleh kaum kapitalisme (hal. 23)" },
    { id: 224, soal: "Apa penyebab kemiskinan menurut Robert Malthus?", jawaban: "Jumlah penduduk meningkat menurut deret ukur, sedangkan produksi bahan makanan hanya meningkat menurut deret hitung (hal. 23)" },
    { id: 109, soal: "Sebutkan dampak yang ditimbulkan dari kemiskinan!", jawaban: "1. Meningkatnya kriminalitas di suatu daerah (penipuan, pencurian, perampokan, pembunuhan) karena masyarakat ingin memenuhi kebutuhan pokok dengan segala upaya\n2. Akses pendidikan tertutup (biaya pendidikan tinggi sehingga kemiskinan makin parah)\n3. Meningkatnya angka pengangguran (sulit bersaing mendapat pekerjaan)\n4. Munculnya berbagai konflik di masyarakat (perlakuan berbeda memicu kecemburuan) (hal. 23)" },
    { id: 110, soal: "Sebutkan upaya penanggulangan kemiskinan!", jawaban: "1. Pembaharuan data penduduk\n2. Integrasi penyaluran bantuan sosial\n3. Mengurangi beban pengeluaran masyarakat miskin dan hampir miskin\n4. Insentif di bidang pertanian, peternakan, dan perikanan\n5. Mengelola APBN dengan cermat (hal. 23–24)" },
    { id: 111, soal: "Apa tujuan pembaharuan data penduduk dalam menanggulangi kemiskinan?", jawaban: "Melengkapi data penduduk miskin maupun rentan miskin yang dikategorikan pantas menerima bantuan sosial (hal. 23)" },
    { id: 225, soal: "Apa manfaat data penduduk miskin yang lengkap bagi penyaluran bansos?", jawaban: "Dana bantuan sosial dapat disalurkan tepat kepada masyarakat yang benar-benar membutuhkan (hal. 23)" },

    // ── Hal. 24 — Upaya penanggulangan kemiskinan lanjutan ──
    { id: 112, soal: "Mengapa diperlukan integrasi penyaluran bantuan sosial?", jawaban: "Perbedaan bentuk bansos antardaerah menimbulkan ketegangan sosial, diperparah basis data DTKS (Data Terpadu Kesejahteraan Sosial) yang belum mencakup masyarakat yang tidak terdata (hal. 23–24)" },
    { id: 226, soal: "Bagaimana cara integrasi penyaluran bantuan sosial, dan apa tujuannya?", jawaban: "Update data dan integrasi penyaluran bansos melalui kerja sama antarbank pemerintah, agar dana langsung diterima penerima, pembagian lebih mudah, dan tidak tumpang tindih (hal. 23–24)" },
    { id: 113, soal: "Empat biaya yang dikontrol pemerintah dan dapat dikurangi untuk meringankan beban masyarakat miskin dan hampir miskin adalah…", jawaban: "Tarif air untuk rumah tangga, tarif listrik, harga LPG, dan harga BBM (hal. 24)" },
    { id: 114, soal: "Bagaimana pemerintah memberi insentif di bidang pertanian, peternakan, dan perikanan?", jawaban: "Meningkatkan insentif bagi petani, peternak, dan nelayan melalui skema pembelian produk oleh pemerintah serta memperbaiki jalur logistik, sehingga produksi meningkat (hal. 24)" },
    { id: 227, soal: "Bagaimana insentif di bidang pertanian, peternakan, dan perikanan dapat menanggulangi kemiskinan?", jawaban: "Mengamankan ketersediaan stok pangan nasional, menekan kenaikan harga pokok, sehingga masyarakat hampir miskin tetap dapat memenuhi kebutuhan pokok (hal. 24)" },
    { id: 115, soal: "Bagaimana upaya pemerintah menanggulangi kemiskinan dengan mengelola APBN secara cermat?", jawaban: "APBN dikelola cermat agar anggaran bantuan sosial bagi masyarakat menengah ke bawah dan hampir miskin dapat ditingkatkan, serta pemerintah dapat mengalokasikan dana khusus untuk masyarakat miskin dan hampir miskin agar dapat memenuhi kebutuhan pokoknya (hal. 24)" },

    // ── Hal. 25 — Ekonomi digital: definisi, manfaat, smart logistics ──
    { id: 116, soal: "Mengapa pelaku UMKM kini memasarkan produknya melalui platform digital?", jawaban: "Karena dirasa lebih praktis dan menjangkau konsumen yang lebih luas (hal. 25)" },
    { id: 228, soal: "Bagaimana perkembangan jumlah UMKM yang terhubung dengan platform digital?", jawaban: "Terus meningkat setiap tahunnya (hal. 25)" },
    { id: 117, soal: "Secara sederhana, apa pengertian ekonomi digital?", jawaban: "Kegiatan ekonomi dengan bantuan teknologi informasi komunikasi dan kecerdasan buatan (hal. 25)" },
    { id: 229, soal: "Ekonomi digital berkembang seiring apa, dan apa cirinya?", jawaban: "Seiring Revolusi Industri 4.0 yang ditandai kecerdasan buatan, teknologi komputer kuantum, dan teknologi informasi berbasis internet (hal. 25)" },
    { id: 118, soal: "Apa pengertian ekonomi digital menurut Amir Hartman?", jawaban: "Media virtual di mana bisnis, penetapan nilai, dan transaksi terjadi menggunakan internet sebagai media pertukaran (hal. 25)" },
    { id: 119, soal: "Apa kelebihan ekonomi digital?", jawaban: "Mempercepat dan mempermudah kegiatan ekonomi (hal. 25)" },
    { id: 230, soal: "Apa tuntutan ekonomi digital bagi pelaku ekonomi?", jawaban: "Pelaku ekonomi harus selalu kreatif dan cepat mengambil peluang agar tidak kehilangan kesempatan (hal. 25)" },
    { id: 120, soal: "Sebutkan manfaat ekonomi digital dalam kehidupan!", jawaban: "1. Ketersediaan informasi yang lebih besar\n2. Menghemat biaya\n3. Menurunkan hambatan (hal. 25)" },
    { id: 121, soal: "Jelaskan manfaat ekonomi digital: ketersediaan informasi yang lebih besar!", jawaban: "Internet memungkinkan konsumen mempunyai lebih banyak informasi dan pilihan, lebih mudah mencari merek terbaik yang diinginkan, serta membandingkan harga dari satu toko dengan toko lain (hal. 25)" },
    { id: 122, soal: "Bagaimana ekonomi digital membantu perusahaan menghemat sewa gedung?", jawaban: "Karena sebagian aktivitas dilakukan melalui internet (hal. 25)" },
    { id: 231, soal: "Bagaimana ekonomi digital membuat harga jual lebih murah?", jawaban: "Perusahaan dapat memotong aspek ritel dan mengirim barang langsung dari pabrik/gudang supplier atau produsen, bukan dari toko, sehingga biaya lebih rendah dan harga jual lebih murah (hal. 25)" },
    { id: 123, soal: "Jelaskan manfaat ekonomi digital: menurunkan hambatan!", jawaban: "Di beberapa sektor industri, ekonomi digital memudahkan perusahaan baru untuk masuk (hal. 25)" },
    { id: 232, soal: "Dengan ide inovatif di era ekonomi digital, apa yang bisa dilakukan seseorang?", jawaban: "Menciptakan produk baru yang menantang perusahaan tradisional (hal. 25)" },
    { id: 233, soal: "Berikan contoh layanan baru yang dibawa ekonomi digital!", jawaban: "Mulai dari pesan antar bahan makanan ke rumah hingga aplikasi lainnya (hal. 25)" },
    { id: 124, soal: "Apa yang dimaksud smart logistics (logistik pintar)? (Info Khusus)", jawaban: "Pendekatan inovatif dalam pengelolaan rantai pasokan yang memanfaatkan teknologi canggih, analisis data, dan kecerdasan buatan untuk meningkatkan efisiensi, visibilitas, dan pengelolaan seluruh proses pengiriman dan distribusi barang (hal. 25)" },
    { id: 234, soal: "Teknologi apa saja yang dilibatkan dalam smart logistics, dan untuk apa? (Info Khusus)", jawaban: "Internet of Things (IoT), big data analytics, kecerdasan buatan (AI), dan blockchain, untuk mengumpulkan, menganalisis, dan memberikan informasi secara real time (hal. 25)" },
    { id: 125, soal: "Sebutkan contoh bidang ekonomi digital yang berkembang di Indonesia!", jawaban: "1. Bidang transportasi\n2. Bidang kesehatan\n3. Bidang perbankan\n4. Bidang bisnis (hal. 25–26)" },
    { id: 126, soal: "Berikan contoh ekonomi digital di bidang transportasi!", jawaban: "Layanan ojek online (hal. 25)" },
    { id: 235, soal: "Bagaimana perbedaan naik ojek dulu dan sekarang dengan adanya ekonomi digital?", jawaban: "Dulu orang harus datang ke pangkalan dan menunggu tukang ojek; sekarang cukup menunggu di rumah dan bisa dijemput di tempat yang diinginkan dengan memanfaatkan smartphone dan layanan internet (hal. 25)" },

    // ── Hal. 26 — Contoh lanjutan, tantangan, Palmira ──
    { id: 127, soal: "Berikan contoh ekonomi digital di bidang kesehatan!", jawaban: "Pertemuan dokter dan pasien kini bisa dilakukan secara virtual, tidak perlu lagi pergi ke klinik atau rumah sakit untuk mengonsultasikan keluhan (hal. 26)" },
    { id: 128, soal: "Bagaimana ekonomi digital mengubah uang di bidang perbankan?", jawaban: "Uang tetap alat pembayaran sah, tetapi bentuknya berubah menjadi digital (hal. 26)" },
    { id: 236, soal: "Berikan contoh ekonomi digital di bidang perbankan!", jawaban: "Produk dompet digital (e-banking, OVO, dll.) dan produk perbankan seperti kartu debit dan kredit untuk bertransaksi tanpa uang tunai (hal. 26)" },
    { id: 129, soal: "Bagaimana ekonomi digital memengaruhi cara memulai usaha?", jawaban: "Dulu memulai usaha harus punya toko fisik; sekarang siapa pun dapat memulai usaha tanpa mengandalkan toko fisik (hal. 26)" },
    { id: 237, soal: "Apa keuntungan berwirausaha dengan berjualan online bagi orang bermodal minim?", jawaban: "Uang untuk membangun toko fisik dapat dialokasikan untuk keperluan lain atau menambah modal (hal. 26)" },
    { id: 130, soal: "Permasalahan apa yang muncul dari ekonomi digital?", jawaban: "Keamanan data pribadi dan modus penipuan daring melalui scamming (hal. 26)" },
    { id: 238, soal: "Sebutkan tantangan ekonomi digital!", jawaban: "1. Keamanan berinternet\n2. Sumber daya manusia yang kurang memadai\n3. Regulasi yang masih belum mumpuni (hal. 26)" },
    { id: 131, soal: "Jelaskan tantangan ekonomi digital dalam aspek keamanan berinternet!", jawaban: "Cyber security masih menjadi ancaman bagi sebagian besar pengguna internet di Indonesia (hal. 26)" },
    { id: 239, soal: "Mengapa dibutuhkan peningkatan keamanan berinternet dalam ekonomi digital?", jawaban: "Agar pengguna bisa mengakses semua layanan ekonomi digital tanpa khawatir peretasan dan pencurian data (hal. 26)" },
    { id: 132, soal: "Jelaskan tantangan ekonomi digital: SDM kurang memadai!", jawaban: "Kurangnya sumber daya manusia yang paham penerapan teknologi; rendahnya literasi digital membuat banyak sektor sulit masuk ke kancah digital (hal. 26)" },
    { id: 240, soal: "Jelaskan tantangan ekonomi digital: regulasi belum mumpuni!", jawaban: "Diperlukan regulasi yang melindungi hak penyedia layanan maupun penggunanya, namun ekonomi digital kadang terhambat karena belum ada aturan pasti yang mengaturnya (hal. 26)" },
    { id: 133, soal: "Menurut Palmira dkk. (2020), pembangunan ekonomi digital yang inklusif memerlukan aspek pendukung apa saja?", jawaban: "Jaringan internet dan infrastruktur, akses dan pemanfaatan internet yang bijak, transformasi digital, serta jaminan sosial (hal. 26)" },
    { id: 241, soal: "Menurut Palmira dkk. (2020), apa hasilnya jika aspek pendukung ekonomi digital inklusif terpenuhi?", jawaban: "Manfaat digital dapat berkontribusi pada pertumbuhan ekonomi masyarakat (hal. 26)" },

    // ── Hal. 27–31 — Glosarium & Penilaian Sumatif Bab 1 ──
    { id: 134, soal: "Apa arti fiskal? (Glosarium)", jawaban: "Berkenaan dengan urusan pajak atau pendapatan negara (hal. 27)" },
    { id: 242, soal: "Apa arti inflasi? (Glosarium)", jawaban: "Kemerosotan nilai uang (kertas) karena banyaknya dan cepatnya uang beredar sehingga harga barang-barang naik (hal. 27)" },
    { id: 243, soal: "Apa arti ketimpangan? (Glosarium)", jawaban: "Hal yang tidak sebagaimana mestinya (seperti tidak adil, tidak beres) (hal. 27)" },
    { id: 135, soal: "Upaya pemerintah negara berkembang untuk menanggulangi permasalahan pembangunan ekonomi adalah… (Sumatif)", jawaban: "Dimudahkannya izin untuk berwirausaha (hal. 27)" },
    { id: 136, soal: "Dari komponen: (1) keuntungan perusahaan, (2) ekspor neto, (3) kompensasi pekerja, (4) pengeluaran pemerintah untuk barang & jasa, (5) konsumsi rumah tangga — mana komponen pendekatan PENGELUARAN? (Sumatif)", jawaban: "Nomor 2, 4, dan 5 (sesuai Y = C + I + G + (X − M)) (hal. 27)" },
    { id: 244, soal: "Keuntungan perusahaan dan kompensasi pekerja termasuk komponen pendekatan apa? (Sumatif)", jawaban: "Pendekatan pendapatan (hal. 27)" },
    { id: 137, soal: "Negara Z: konsumsi Rp6.000.000, investasi Rp1.000.000, ekspor neto Rp700.000, PDB Rp8.500.000. Berapa pengeluaran pemerintah? (Sumatif)", jawaban: "Y = C + I + G + (X − M)\n8.500.000 = 6.000.000 + 1.000.000 + G + 700.000\nG = Rp800.000 (hal. 28)" },
    { id: 138, soal: "Mengapa pendapatan per kapita tidak dapat secara mutlak mengukur tingkat kemakmuran suatu negara? (Sumatif)", jawaban: "Karena pendapatan per kapita adalah PDB dibagi jumlah penduduk (angka rata-rata), tetapi angka itu tidak menunjukkan pemerataan pendapatan (hal. 28)" },
    { id: 139, soal: "Agar pertumbuhan ekonomi meningkatkan standar hidup masyarakat, maka… (Sumatif)", jawaban: "Pendapatan harus didistribusikan secara merata (hal. 28)" },
    { id: 140, soal: "Keluarga di daerah terpencil tidak mampu memenuhi makanan bergizi, air bersih, tempat tinggal layak, penghasilan jauh di bawah standar minimum, tanpa akses pendidikan & kesehatan. Ini contoh kemiskinan… (Sumatif)", jawaban: "Kemiskinan absolut (hal. 28)" },
    { id: 141, soal: "Negara menerapkan pajak progresif tinggi untuk super kaya dan subsidi besar untuk pendidikan & kesehatan masyarakat miskin. Apa tujuan utamanya terkait kesenjangan ekonomi? (Sumatif)", jawaban: "Mengurangi kesenjangan pendapatan dengan redistribusi kekayaan dan peningkatan modal manusia (hal. 28)" },
    { id: 142, soal: "Ekonomi digital dapat mendorong kebutuhan ekonomi nasional apabila didukung SDM berkualitas. Hal ini menunjukkan pentingnya… (Sumatif)", jawaban: "Pendidikan dan literasi digital (hal. 28)" },
    { id: 143, soal: "Dampak kesenjangan ekonomi yang tinggi pada stabilitas sosial adalah… (Sumatif)", jawaban: "Mendorong terciptanya budaya konsumtif dan pamer di kalangan menengah atas (hal. 29)" },
    { id: 144, soal: "Data 2023: 20% penduduk berpendapatan tinggi menguasai ±46% pendapatan nasional, 40% berpendapatan rendah hanya ±18%. Pernyataan mana yang tepat tentang hubungan pertumbuhan ekonomi dan kesenjangan? (Sumatif, PG kompleks)", jawaban: "• Pertumbuhan ekonomi tidak selalu diikuti pemerataan pendapatan\n• Kesenjangan ekonomi dapat terjadi meskipun ekonomi tumbuh\n• Hasil pertumbuhan ekonomi lebih banyak dinikmati kelompok tertentu (hal. 29)" },
    { id: 145, soal: "Perbedaan pertumbuhan ekonomi antarwilayah perkotaan (industri & jasa pesat) dan perdesaan (pertanian, produktivitas rendah) menunjukkan bahwa… (Sumatif, PG kompleks)", jawaban: "• Pembangunan ekonomi yang belum merata\n• Terjadi kesenjangan ekonomi antarwilayah\n• Pertumbuhan ekonomi terkonsentrasi di wilayah tertentu (hal. 29)" },
    { id: 146, soal: "Benar atau Salah?\n1) Perbedaan akses pendidikan, lapangan kerja, dan teknologi tidak berpengaruh terhadap kesenjangan ekonomi\n2) Kesenjangan distribusi pendapatan dapat menyebabkan perbedaan kesejahteraan antarkelompok\n3) Kesenjangan ekonomi hanya berdampak pada kelompok berpendapatan rendah (Sumatif)", jawaban: "1) Salah\n2) Benar\n3) Salah (hal. 29)" },
    { id: 147, soal: "PDB Indonesia 2022 Rp19.500 triliun, 2023 Rp20.280 triliun. Benar atau Salah?\n1) Jika PDB 2024 jadi Rp21.294 triliun, pertumbuhan 2024 sekitar 5%\n2) Jika PDB 2023 hanya naik Rp500 triliun dari 2022, pertumbuhan tetap 4%\n3) Kenaikan PDB 2022 ke 2023 sebesar Rp680 triliun (Sumatif)", jawaban: "1) Benar: (21.294 − 20.280) ÷ 20.280 × 100% = 5%\n2) Salah: 500 ÷ 19.500 × 100% ≈ 2,56% (pertumbuhan asli 2023 = 780 ÷ 19.500 = 4%)\n3) Salah: kenaikannya Rp780 triliun (hal. 30)" },
    { id: 148, soal: "Data: gaji karyawan Rp24 M, investasi Rp58 M, konsumsi masyarakat Rp28 M, bunga modal Rp32 M, laba usaha Rp10 M, ekspor Rp26 M, sewa tanah Rp21 M, impor Rp28 M, konsumsi pemerintah Rp78 M. Hitung pendapatan nasional dengan pendekatan PENDAPATAN! (Sumatif)", jawaban: "Y = r + w + i + p = 21 + 24 + 32 + 10 = Rp87 miliar (hal. 30)" },
    { id: 245, soal: "Data: gaji karyawan Rp24 M, investasi Rp58 M, konsumsi masyarakat Rp28 M, bunga modal Rp32 M, laba usaha Rp10 M, ekspor Rp26 M, sewa tanah Rp21 M, impor Rp28 M, konsumsi pemerintah Rp78 M. Hitung pendapatan nasional dengan pendekatan PENGELUARAN! (Sumatif)", jawaban: "Y = C + I + G + (X − M) = 28 + 58 + 78 + (26 − 28) = Rp162 miliar (hal. 30)" },
    { id: 150, soal: "Total PDB tahun 2024 = Rp2.600 triliun dan PDB 2023 = Rp1.850 triliun. Berapa tingkat pertumbuhan ekonomi 2024 atas dasar tahun 2023? (Sumatif)", jawaban: "(2.600 − 1.850) ÷ 1.850 × 100% ≈ 40,5%\n(Catatan: hasil ini tidak ada di pilihan buku 45/55/100/135/145%, kemungkinan salah cetak) (hal. 27)" },
    { id: 151, soal: "Gambar orang bekerja di lahan secara manual. Faktor penyebab kemiskinan pada kondisi tersebut adalah… (Sumatif)", jawaban: "Keterbatasan teknologi dan modal (perkiraan, kunci tidak tersedia) (hal. 29)" },
    { id: 152, soal: "PDB 2022 Rp19.500 triliun naik menjadi Rp20.280 triliun di 2023. Mengapa pertumbuhan ekonomi belum tentu mencerminkan kesejahteraan masyarakat? (Sumatif, PG kompleks)", jawaban: "• Sebagian kelompok masyarakat masih tertinggal\n• Distribusi pendapatan tidak merata\n• PDB hanya mengukur nilai produksi\n(perkiraan, kunci tidak tersedia) (hal. 30)" },
    { id: 149, soal: "PDB Rp1.200 triliun, pendapatan neto dari luar negeri Rp50 triliun, depresiasi Rp30 triliun. Hitung produk nasional neto (NNP)! (Soal Pengayaan)", jawaban: "PNB = PDB + pendapatan neto LN = 1.200 + 50 = Rp1.250 triliun\nNNP = PNB − penyusutan = 1.250 − 30 = Rp1.220 triliun (hal. 31)" },
  ],
  // Sumber: Fathul Mu'in (syarah Qurratul 'Ain bi Muhimmatid Din) — teks di dalam kotak
  "Fiqih": [
    // ── Hal. 2 — Muqaddimah ──
    { id: 1, soal: "Apa nama kitab matan yang disyarahi oleh Fathul Mu'in?", jawaban: "Qurratul 'Ain bi Muhimmatid Din (Penyejuk Mata tentang Perkara-perkara Penting Agama) (hal. 2)" },
    { id: 89, soal: "Apa nama lengkap kitab Fathul Mu'in?", jawaban: "Fathul Mu'in bi Syarhi Qurratil 'Ain bi Muhimmatid Din (hal. 2)" },
    { id: 2, soal: "Apa tujuan penulis menyusun syarah Fathul Mu'in?", jawaban: "Menjelaskan maksud, menyempurnakan faedah, menghasilkan tujuan, dan menampakkan faedah-faedah dari kitab Qurratul 'Ain (hal. 2)" },
    { id: 3, soal: "Apa doa penulis Fathul Mu'in untuk kitabnya?", jawaban: "Semoga Allah meratakan manfaatnya bagi kalangan khusus dan umum dari saudara-saudara, dan menempatkan penulis karenanya di surga Firdaus, negeri yang aman (hal. 2)" },
    { id: 4, soal: "Kata ism (اسم) dalam basmalah berasal (musytaq) dari kata apa?", jawaban: "Dari as-sumuw (السمو) yang berarti 'tinggi', bukan dari al-wasm (الوسم) yang berarti 'tanda' (hal. 2)" },
    { id: 5, soal: "Lafaz 'Allah' adalah nama ('alam) bagi apa?", jawaban: "Nama bagi Dzat yang wajib wujud-Nya (hal. 2)" },
    { id: 90, soal: "Apa asal lafaz 'Allah'?", jawaban: "Asalnya ilāh (إله), isim jenis untuk setiap yang disembah; lalu diberi al dan hamzahnya dibuang, kemudian dipakai khusus untuk Yang disembah dengan hak (hal. 2)" },
    { id: 91, soal: "Menurut kebanyakan ulama, lafaz 'Allah' adalah nama apa?", jawaban: "Al-Ismul A'zham (nama Allah yang paling agung) (hal. 2)" },
    { id: 92, soal: "Bolehkah nama 'Allah' dinamakan kepada selain-Nya?", jawaban: "Tidak boleh dinamakan kepada selain-Nya, walau secara keras kepala (hal. 2)" },
    { id: 6, soal: "Ar-Rahman dan ar-Rahim adalah sifat apa?", jawaban: "Dua sifat yang dibentuk untuk mubalaghah (makna sangat) dari kata rahima (hal. 2)" },
    { id: 93, soal: "Mana yang lebih kuat maknanya, ar-Rahman atau ar-Rahim, dan mengapa?", jawaban: "Ar-Rahman lebih kuat (ablagh), karena tambahan huruf menunjukkan tambahan makna (hal. 2)" },
    { id: 94, soal: "Apa ungkapan ulama yang menunjukkan ar-Rahman lebih kuat daripada ar-Rahim?", jawaban: "'Rahman di dunia, Rahim di akhirat' (hal. 2)" },
    { id: 7, soal: "Apa definisi al-hamd (pujian)?", jawaban: "Menyifati dengan sesuatu yang indah (al-washfu bil-jamīl) (hal. 2)" },
    { id: 8, soal: "Apa makna shalawat (ash-shalāh) dari Allah?", jawaban: "Rahmat yang disertai pengagungan (hal. 2)" },
    { id: 95, soal: "Apa makna as-salām (dalam shalawat dan salam)?", jawaban: "Penyelamatan (taslīm) dari segala penyakit dan kekurangan (hal. 2)" },
    { id: 9, soal: "Nabi Muhammad ﷺ diutus kepada siapa saja?", jawaban: "Kepada seluruh tsaqalain (jin dan manusia) secara ijmak, demikian pula malaikat menurut pendapat sejumlah ulama muhaqqiq (hal. 2)" },
    { id: 10, soal: "Nama 'Muhammad' berasal dari apa?", jawaban: "Nama yang dinukil dari isim maf'ul yang ditasydid (mudha''af), diberikan kepada orang yang banyak sifat terpujinya (hal. 2)" },
    { id: 96, soal: "Siapa yang menamai Nabi ﷺ dengan nama Muhammad?", jawaban: "Kakeknya (Abdul Muththalib), dengan ilham dari Allah (hal. 2)" },
    { id: 11, soal: "Apa definisi rasul?", jawaban: "Manusia laki-laki merdeka yang diberi wahyu syariat dan diperintah menyampaikannya, walaupun tidak punya kitab dan tidak menghapus syariat sebelumnya (seperti Nabi Yusya' AS) (hal. 2)" },
    { id: 97, soal: "Apa definisi nabi (bedanya dengan rasul)?", jawaban: "Manusia yang diberi wahyu syariat tetapi tidak diperintah menyampaikannya (hal. 2)" },
    { id: 98, soal: "Mana yang lebih utama, rasul atau nabi?", jawaban: "Rasul lebih utama daripada nabi secara ijmak (hal. 2)" },
    { id: 12, soal: "Berapa jumlah nabi menurut khabar yang disebut dalam Fathul Mu'in?", jawaban: "124.000 (seratus dua puluh empat ribu) (hal. 2)" },
    { id: 99, soal: "Berapa jumlah rasul menurut khabar yang disebut dalam Fathul Mu'in?", jawaban: "315 (tiga ratus lima belas) (hal. 2)" },
    { id: 13, soal: "Siapa yang dimaksud 'āl (keluarga) Nabi ﷺ?", jawaban: "Kerabat beliau yang mukmin dari Bani Hasyim dan Bani al-Muththalib (hal. 2)" },
    { id: 100, soal: "Dalam konteks doa, siapa yang dimaksud 'āl Nabi ﷺ menurut pendapat yang dipilih?", jawaban: "Setiap orang mukmin. Pendapat ini dipilih walau khabarnya dha'if; Imam Nawawi menegaskannya dalam Syarah Muslim (hal. 2)" },
    { id: 14, soal: "Siapa yang dimaksud shahabi (sahabat Nabi)?", jawaban: "Orang yang bertemu Nabi ﷺ dalam keadaan beriman, walaupun ia buta atau belum mumayyiz (hal. 2)" },
    { id: 15, soal: "Apa yang dimaksud mukhtashar (ringkasan)?", jawaban: "Yang sedikit lafaznya namun banyak maknanya, diambil dari kata ikhtishar (hal. 2)" },
    { id: 16, soal: "Apa pengertian fiqih secara bahasa?", jawaban: "Paham (al-fahm) (hal. 2)" },
    { id: 101, soal: "Apa pengertian fiqih secara istilah?", jawaban: "Ilmu tentang hukum-hukum syariat yang bersifat amaliah, yang digali dari dalil-dalilnya yang terperinci (hal. 2)" },
    { id: 17, soal: "Dari mana ilmu fiqih diambil (sumbernya)?", jawaban: "Dari al-Kitab (Al-Qur'an), as-Sunnah, al-Ijma', dan al-Qiyas (hal. 2)" },

    // ── Hal. 3 — Faedah fiqih, Imam Syafi'i, rujukan kitab; Bab Shalat ──
    { id: 18, soal: "Apa faedah (manfaat) mempelajari ilmu fiqih?", jawaban: "Menjalankan perintah-perintah Allah Ta'ala dan menjauhi larangan-larangan-Nya (hal. 3)" },
    { id: 19, soal: "Kitab Fathul Mu'in disusun berdasarkan mazhab siapa? Sebutkan nama lengkapnya!", jawaban: "Mazhab Imam Mujtahid Abu Abdillah Muhammad bin Idris asy-Syafi'i rahimahullah, yaitu hukum-hukum yang beliau pegang dalam berbagai masalah (hal. 3)" },
    { id: 20, soal: "Kepada siapa nasab Imam Syafi'i disandarkan (asal nama 'Syafi'i')?", jawaban: "Kepada kakeknya, Syafi' bin as-Sa'ib (hal. 3)" },
    { id: 102, soal: "Sebutkan nasab lengkap Imam Syafi'i!", jawaban: "Muhammad bin Idris bin Abbas bin Utsman bin Syafi' bin as-Sa'ib bin Ubaid bin Abdu Yazid bin Hasyim bin al-Muththalib bin Abdu Manaf (hal. 3)" },
    { id: 103, soal: "Kapan Syafi' (kakek Imam Syafi'i) masuk Islam?", jawaban: "Bersama ayahnya, as-Sa'ib, pada hari (perang) Badar (hal. 3)" },
    { id: 21, soal: "Kapan Imam Syafi'i lahir?", jawaban: "Tahun 150 H (hal. 3)" },
    { id: 104, soal: "Kapan Imam Syafi'i wafat?", jawaban: "Hari Jumat akhir bulan Rajab tahun 204 H (hal. 3)" },
    { id: 22, soal: "Dari kitab-kitab siapa matan Qurratul 'Ain diringkas (dipilih)?", jawaban: "Dari kitab-kitab mu'tamad karya:\n1. Syaikh Syihabuddin Ahmad bin Hajar al-Haitami\n2. Wajihuddin Abdurrahman bin Ziyad az-Zabidi\n3. Syaikhul Islam Zakariya al-Anshari\n4. Imam Ahmad al-Muzajjad az-Zabidi\ndan muhaqqiq muta'akhirin lainnya (hal. 3)" },
    { id: 23, soal: "Fathul Mu'in berpegang pada pendapat siapa sebagai rujukan utama mazhab?", jawaban: "Pada apa yang ditetapkan oleh dua syaikh mazhab: Imam an-Nawawi dan Imam ar-Rafi'i, kemudian para muhaqqiq muta'akhirin (hal. 3)" },
    { id: 24, soal: "Apa pengertian shalat secara bahasa?", jawaban: "Doa (hal. 3)" },
    { id: 105, soal: "Apa pengertian shalat secara syara'?", jawaban: "Ucapan-ucapan dan perbuatan-perbuatan tertentu yang dibuka dengan takbir dan ditutup dengan salam (hal. 3)" },
    { id: 106, soal: "Mengapa dinamakan shalat?", jawaban: "Karena mengandung doa (hal. 3)" },
    { id: 25, soal: "Berapa shalat fardhu 'ain dalam sehari semalam?", jawaban: "Lima kali, dan ini diketahui dari agama secara pasti (dharuri) (hal. 3)" },
    { id: 107, soal: "Apa hukum orang yang mengingkari kewajiban shalat lima waktu?", jawaban: "Menjadi kafir (hal. 3)" },
    { id: 26, soal: "Apakah shalat lima waktu terkumpul pada nabi selain Nabi Muhammad ﷺ?", jawaban: "Tidak. Kelima shalat ini tidak terkumpul pada nabi selain Nabi Muhammad ﷺ (hal. 3)" },
    { id: 27, soal: "Kapan shalat lima waktu difardhukan?", jawaban: "Pada malam Isra', 10 tahun 3 bulan setelah kenabian, malam 27 Rajab (hal. 3)" },
    { id: 28, soal: "Mengapa shalat Subuh pada pagi hari setelah malam Isra' tidak wajib?", jawaban: "Karena belum diketahui tata caranya (kaifiyatnya) (hal. 3)" },
    { id: 29, soal: "Shalat fardhu wajib atas siapa?", jawaban: "Atas setiap muslim mukallaf (baligh dan berakal), laki-laki maupun lainnya, yang suci (hal. 3)" },
    { id: 30, soal: "Siapa saja yang tidak wajib shalat karena tidak mukallaf?", jawaban: "Kafir asli, anak kecil, orang gila, orang pingsan, dan orang mabuk yang tidak sengaja (hal. 3)" },
    { id: 108, soal: "Mengapa perempuan haid dan nifas tidak wajib shalat?", jawaban: "Karena shalatnya tidak sah (hal. 3)" },
    { id: 31, soal: "Siapa yang tetap wajib mengqadha shalat walaupun saat itu tidak shalat?", jawaban: "Orang murtad dan orang yang sengaja mabuk (hal. 3)" },
    { id: 32, soal: "Apa hukuman bagi muslim mukallaf yang meninggalkan shalat fardhu karena malas?", jawaban: "Dibunuh dengan dipenggal sebagai had, jika ia sengaja mengeluarkan shalat dari waktu jamaknya karena malas walau tetap meyakini kewajibannya, dan tidak bertobat setelah diminta bertobat (istitabah) (hal. 3)" },
    { id: 109, soal: "Apa hukum meminta tobat (istitabah) kepada orang yang meninggalkan shalat karena malas?", jawaban: "Sunnah (hal. 3)" },
    { id: 110, soal: "Bagaimana hukum orang yang membunuh peninggal shalat (karena malas) sebelum diminta tobat?", jawaban: "Tidak wajib ganti rugi, tetapi berdosa (hal. 3)" },
    { id: 33, soal: "Bagaimana hukum orang yang meninggalkan shalat karena mengingkari kewajibannya?", jawaban: "Dibunuh sebagai orang kafir (hal. 3)" },
    { id: 111, soal: "Bagaimana perlakuan terhadap jenazah orang yang dibunuh karena mengingkari kewajiban shalat?", jawaban: "Jenazahnya tidak dimandikan dan tidak dishalatkan (hal. 3)" },
    { id: 34, soal: "Bagaimana hukum mengqadha shalat yang terlewat TANPA uzur?", jawaban: "Wajib segera diqadha (fauran) (hal. 3)" },
    { id: 112, soal: "Bagaimana hukum mengqadha shalat yang terlewat KARENA uzur (tidur, lupa)?", jawaban: "Sunnah segera diqadha (hal. 3)" },
    { id: 35, soal: "Menurut Ibnu Hajar, apa yang wajib dilakukan orang yang punya utang shalat tanpa uzur?", jawaban: "Wajib menggunakan seluruh waktunya untuk qadha, kecuali waktu yang dibutuhkan untuk keperluan yang tidak bisa ditinggalkan (hal. 3)" },
    { id: 113, soal: "Menurut Ibnu Hajar, bagaimana hukum shalat sunnah bagi orang yang punya utang shalat tanpa uzur?", jawaban: "Haram baginya shalat sunnah (tathawwu') (hal. 3)" },
    { id: 36, soal: "Bagaimana hukum tertib dalam mengqadha shalat?", jawaban: "Sunnah tertib, misalnya Subuh diqadha sebelum Zhuhur (hal. 3)" },
    { id: 114, soal: "Bagaimana hukum mendahulukan qadha atas shalat hadhirah (yang sedang tiba waktunya)?", jawaban: "Sunnah, jika tidak khawatir hadhirah terlewat, walaupun khawatir kehilangan jamaahnya menurut pendapat mu'tamad (hal. 3)" },
    { id: 37, soal: "Kapan WAJIB mendahulukan qadha atas shalat hadhirah?", jawaban: "Jika shalat itu terlewat tanpa uzur (hal. 3)" },
    { id: 115, soal: "Kapan WAJIB mendahulukan shalat hadhirah atas qadha?", jawaban: "Jika khawatir hadhirah terlewat (sebagian rakaatnya jatuh di luar waktu) (hal. 3)" },
    { id: 38, soal: "Bagaimana hukum orang yang meninggal dan masih punya utang shalat fardhu?", jawaban: "Tidak diqadha dan tidak dibayar fidyah untuknya (hal. 3)" },
    { id: 116, soal: "Adakah pendapat yang membolehkan shalat orang yang meninggal dikerjakan untuknya?", jawaban: "Ada satu pendapat (qaul) bahwa shalat itu dikerjakan untuknya, berdasarkan khabar; Imam as-Subki pernah melakukannya untuk sebagian kerabatnya (hal. 3)" },
    { id: 39, soal: "Kapan anak mumayyiz diperintah shalat?", jawaban: "Setelah sempurna 7 tahun (walau shalat qadha, dengan semua syaratnya) (hal. 3)" },
    { id: 117, soal: "Kapan anak dipukul karena meninggalkan shalat, dan bagaimana pukulannya?", jawaban: "Setelah sempurna 10 tahun, dengan pukulan yang tidak melukai (hal. 3)" },
    { id: 118, soal: "Apa dalil perintah shalat untuk anak usia 7 dan 10 tahun?", jawaban: "Hadits: 'Perintahlah anak shalat jika berusia 7 tahun, dan pukullah jika berusia 10 tahun' (hal. 3)" },
    { id: 40, soal: "Apa ciri anak disebut mumayyiz?", jawaban: "Sudah bisa makan, minum, dan beristinja sendiri (hal. 3)" },
    { id: 41, soal: "Siapa yang wajib memerintah anak mumayyiz untuk shalat?", jawaban: "Masing-masing dari kedua orang tuanya, walaupun ke atas (kakek/nenek), lalu washi (orang yang diberi wasiat), dan pemilik budak terhadap budaknya (hal. 3)" },

    // ── Hal. 4 — Pendidikan anak; Fasal syarat shalat; syarat wudhu ──
    { id: 42, soal: "Apa hikmah anak diperintah shalat usia 7 tahun dan dipukul usia 10 tahun?", jawaban: "Melatih anak untuk beribadah agar terbiasa, sehingga tidak meninggalkannya (hal. 4)" },
    { id: 43, soal: "Selain memerintah shalat, apa lagi kewajiban wali terhadap anak?", jawaban: "Mencegahnya dari hal-hal yang diharamkan, mengajarinya kewajiban-kewajiban dan syariat yang tampak lainnya, walaupun sunnah seperti siwak, serta memerintahkannya (hal. 4)" },
    { id: 119, soal: "Kapan kewajiban wali mendidik anak berakhir?", jawaban: "Ketika anak baligh dalam keadaan rasyid (cerdas mengelola agama dan harta) (hal. 4)" },
    { id: 44, soal: "Dari harta siapa biaya pengajaran anak (seperti Al-Qur'an dan adab) diambil?", jawaban: "Dari harta anak itu sendiri, kemudian (jika tidak ada) dari ayahnya, kemudian dari ibunya (hal. 4)" },
    { id: 45, soal: "Menurut as-Sam'ani, siapa yang wajib memerintah shalat istri yang masih kecil dan punya orang tua?", jawaban: "Kedua orang tuanya, kemudian suaminya (hal. 4)" },
    { id: 120, soal: "Apakah suami juga wajib memukul istrinya (yang meninggalkan shalat)?", jawaban: "Wajib, walaupun istrinya sudah dewasa, sebagaimana ditegaskan Jamalul Islam al-Bazri (hal. 4)" },
    { id: 121, soal: "Bagaimana pendapat az-Zarkasyi tentang suami memukul istri yang meninggalkan shalat?", jawaban: "Menganggapnya sunnah secara mutlak (hal. 4)" },
    { id: 46, soal: "Apa kewajiban pertama orang tua (bahkan sebelum memerintah shalat) dalam mengajari anak mumayyiz?", jawaban: "Mengajarkan bahwa Nabi kita Muhammad ﷺ diutus di Makkah dan lahir di sana (hal. 4)" },
    { id: 122, soal: "Selain tempat lahir dan diutus, apa lagi yang wajib diajarkan pertama kali tentang Nabi ﷺ?", jawaban: "Bahwa beliau dimakamkan di Madinah dan wafat di sana (hal. 4)" },
    { id: 47, soal: "Apa pengertian syarat (dalam shalat)?", jawaban: "Sesuatu yang sahnya shalat bergantung kepadanya, tetapi bukan bagian dari shalat (hal. 4)" },
    { id: 48, soal: "Mengapa syarat shalat dibahas lebih dahulu daripada rukunnya?", jawaban: "Karena syarat lebih utama untuk didahulukan, sebab syarat wajib didahulukan sebelum shalat dan harus terus berlangsung selama shalat (hal. 4)" },
    { id: 49, soal: "Ada berapa syarat shalat?", jawaban: "Lima (hal. 4)" },
    { id: 123, soal: "Apa syarat shalat yang pertama?", jawaban: "Suci dari hadats dan janabah (hal. 4)" },
    { id: 50, soal: "Apa pengertian thaharah secara bahasa?", jawaban: "Bersih dan lepas dari kotoran (hal. 4)" },
    { id: 124, soal: "Apa pengertian thaharah secara syara'?", jawaban: "Mengangkat larangan yang timbul akibat hadats atau najis (hal. 4)" },
    { id: 51, soal: "Apa yang dimaksud wudhū' (dengan dhammah)?", jawaban: "Penggunaan air pada anggota tubuh tertentu yang dibuka dengan niat (hal. 4)" },
    { id: 125, soal: "Apa yang dimaksud wadhū' (dengan fathah)?", jawaban: "Air yang dipakai untuk berwudhu (hal. 4)" },
    { id: 52, soal: "Kapan wudhu mulai diwajibkan?", jawaban: "Bersamaan dengan awal diwajibkannya shalat fardhu, yaitu pada malam Isra' (hal. 4)" },
    { id: 53, soal: "Ada berapa syarat wudhu? Sebutkan!", jawaban: "Lima (seperti syarat mandi):\n1. Air mutlak\n2. Air mengalir pada anggota yang dibasuh\n3. Tidak ada sesuatu pada anggota yang mengubah air secara merusak\n4. Tidak ada penghalang antara air dan anggota\n5. Masuk waktu bagi orang yang hadatsnya terus-menerus (hal. 4–5)" },
    { id: 54, soal: "Apa pengertian air mutlak?", jawaban: "Air yang bisa disebut 'air' tanpa qaid (keterangan tambahan yang mengikat) (hal. 4)" },
    { id: 126, soal: "Sebutkan contoh air yang termasuk air mutlak!", jawaban: "Air laut (keterangan 'laut' hanya sesuai kenyataan) dan air hasil uap air suci yang dididihkan (hal. 4)" },
    { id: 127, soal: "Berikan contoh air yang BUKAN air mutlak!", jawaban: "Air mawar (hanya bisa disebut dengan qaid) (hal. 4)" },
    { id: 55, soal: "Apa hukum bersuci dengan selain air mutlak?", jawaban: "Tidak bisa mengangkat hadats, tidak bisa menghilangkan najis, dan tidak menghasilkan thaharah lainnya walau sunnah (hal. 4)" },
    { id: 56, soal: "Apa syarat air mutlak agar sah untuk bersuci (terkait air musta'mal)?", jawaban: "Tidak musta'mal (bekas dipakai) dalam fardhu thaharah, selama airnya sedikit (kurang dari 2 qullah) (hal. 4)" },
    { id: 128, soal: "Fardhu thaharah apa saja yang membuat air menjadi musta'mal?", jawaban: "Mengangkat hadats kecil/besar (walau dari orang Hanafi yang tidak berniat, atau anak kecil yang belum mumayyiz untuk thawaf) atau menghilangkan najis walau najis yang dimaafkan (hal. 4)" },
    { id: 57, soal: "Jika air musta'mal dikumpulkan hingga mencapai 2 qullah, bagaimana hukumnya?", jawaban: "Menjadi suci menyucikan, sebagaimana air mutanajjis yang dikumpulkan hingga 2 qullah tanpa berubah, walaupun kemudian sedikit lagi setelah dipisah (hal. 4)" },
    { id: 129, soal: "Kapan status musta'mal berlaku pada air?", jawaban: "Hanya saat air sedikit (kurang dari 2 qullah) (hal. 4)" },
    { id: 58, soal: "Kapan air wudhu dihukumi musta'mal?", jawaban: "Setelah air terpisah dari anggota, walaupun terpisahnya secara hukum, misalnya air melewati bahu atau lutut orang yang berwudhu walau kembali ke tempatnya, atau berpindah dari satu tangan ke tangan lain (hal. 4)" },
    { id: 59, soal: "Bagi orang berhadats, perpindahan air apa yang tidak membuatnya musta'mal?", jawaban: "Air berpindah dari telapak tangan ke lengan (sa'id) (hal. 4)" },
    { id: 130, soal: "Bagi orang junub, perpindahan air apa yang tidak membuatnya musta'mal?", jawaban: "Air berpindah dari kepala ke dada atau bagian yang biasa terkena percikan (hal. 4)" },
    { id: 60, soal: "Orang berwudhu memasukkan tangan ke air sedikit setelah membasuh wajah tanpa niat ightiraf (menciduk). Bagaimana status airnya?", jawaban: "Airnya menjadi musta'mal bagi selain tangannya (hal. 4)" },
    { id: 131, soal: "Setelah tangannya masuk ke air sedikit tanpa niat ightiraf, dengan apa ia boleh membasuh sisa lengannya?", jawaban: "Dengan air yang ada di tangannya saja (hal. 4)" },
    { id: 61, soal: "Kapan air mutlak tidak sah karena berubah oleh benda suci?", jawaban: "Jika berubah banyak hingga tidak bisa lagi disebut 'air', yaitu salah satu sifatnya (rasa, warna, atau bau) berubah walau secara perkiraan (taqdiri), oleh mukhalith (campuran) suci yang tidak bisa dipisahkan dan air tidak membutuhkannya (hal. 4)" },
    { id: 132, soal: "Berikan contoh mukhalith suci yang bisa mengubah air sehingga tidak sah untuk bersuci!", jawaban: "Za'faran, buah pohon, atau daun yang dilempar lalu hancur (hal. 4)" },
    { id: 62, soal: "Perubahan air apa yang tidak merusak kesucian air (tidak masalah)?", jawaban: "1. Perubahan sedikit, atau ragu apakah banyak atau sedikit\n2. Berubah karena tanah atau garam air\n3. Berubah karena mujawir (benda yang bisa dibedakan), seperti kayu gaharu, minyak, dupa (bukhur) walau wangi\n4. Berubah karena lama diam, daun yang gugur sendiri walau hancur, tanah liat, lumut di tempatnya, atau sesuatu yang air tidak bisa lepas darinya (hal. 4)" },
    { id: 63, soal: "Apa yang dimaksud mukhalith? Berikan contohnya!", jawaban: "Campuran yang tidak bisa dibedakan dari air menurut pandangan mata (misal za'faran) (hal. 4)" },
    { id: 133, soal: "Apa yang dimaksud mujawir? Berikan contohnya!", jawaban: "Benda yang bisa dibedakan bagi orang yang melihat (misal kayu gaharu, minyak) (hal. 4)" },
    { id: 64, soal: "Bagaimana hukum air banyak (2 qullah lebih) yang berubah karena najis?", jawaban: "Menjadi najis, walau perubahannya sedikit (hal. 4)" },
    { id: 65, soal: "Berapa ukuran 2 qullah menurut timbangan?", jawaban: "±500 rathl Baghdadi (hal. 4–5)" },
    { id: 134, soal: "Berapa ukuran 2 qullah pada wadah persegi?", jawaban: "1¼ dzira' panjang, lebar, dan dalamnya (dengan dzira' tangan yang sedang) (hal. 4–5)" },
    { id: 135, soal: "Berapa ukuran 2 qullah pada wadah bundar?", jawaban: "1 dzira' (dzira' manusia) di semua sisi dan dalamnya 2 dzira' (dzira' tukang kayu = 1¼ dzira' manusia) (hal. 4–5)" },

    // ── Hal. 5 — Hukum air & najis; syarat wudhu 2–5; fardhu wudhu (niat) ──
    { id: 66, soal: "Bagaimana hukum air yang diragukan sudah mencapai 2 qullah atau belum, lalu terkena najis?", jawaban: "Tidak najis, walaupun diyakini sebelumnya sedikit (hal. 5)" },
    { id: 67, soal: "Apakah wajib menjauhi najis di dalam air banyak (misal kencing di laut)?", jawaban: "Tidak wajib (hal. 5)" },
    { id: 136, soal: "Bagaimana hukum buih yang muncul dari air banyak yang terkena najis?", jawaban: "Najis jika dipastikan berasal dari najis atau dari air yang berubah sifatnya karena najis (hal. 5)" },
    { id: 68, soal: "Kapan air sedikit (kurang dari 2 qullah) menjadi najis?", jawaban: "Ketika kemasukan najis yang terlihat oleh mata normal dan tidak dimaafkan di dalam air, walau najis itu dimaafkan di dalam shalat, walaupun air tidak berubah (hal. 5)" },
    { id: 69, soal: "Apakah bangkai hewan yang darahnya tidak mengalir menajiskan air sedikit? Berikan contohnya!", jawaban: "Tidak, kecuali jika mengubah air. Contohnya kalajengking dan cicak (hal. 5)" },
    { id: 137, soal: "Apakah bangkai ular dan katak (dhifda') menajiskan air sedikit?", jawaban: "Ya, menajiskan air (hal. 5)" },
    { id: 70, soal: "Bagaimana hukum bangkai hewan yang hidup/tumbuh dari air (seperti lintah) di dalam air sedikit?", jawaban: "Tidak menajiskan air (hal. 5)" },
    { id: 71, soal: "Pendapat mazhab siapa yang dipilih banyak ulama Syafi'iyah bahwa air tidak najis kecuali berubah?", jawaban: "Mazhab Imam Malik: air tidak najis secara mutlak kecuali dengan berubah (hal. 5)" },
    { id: 72, soal: "Bagaimana cara menyucikan air SEDIKIT yang najis?", jawaban: "Dengan mencapai 2 qullah (walau dengan air mutanajjis) tanpa berubah (hal. 5)" },
    { id: 138, soal: "Bagaimana cara menyucikan air BANYAK yang najis?", jawaban: "Jika perubahannya hilang dengan sendirinya, atau dengan ditambah/dikurangi air selama sisanya tetap banyak (hal. 5)" },
    { id: 73, soal: "Apa syarat wudhu yang kedua?", jawaban: "Air mengalir pada anggota yang dibasuh (hal. 5)" },
    { id: 139, soal: "Apakah cukup hanya menyentuhkan air ke anggota wudhu tanpa mengalir?", jawaban: "Tidak cukup, karena tidak disebut 'membasuh' (ghasl) (hal. 5)" },
    { id: 74, soal: "Apa syarat wudhu yang ketiga? Berikan contohnya!", jawaban: "Tidak ada sesuatu pada anggota yang mengubah air secara merusak (sampai tidak disebut air mutlak), seperti za'faran dan cendana (shandal) (hal. 5)" },
    { id: 75, soal: "Apa syarat wudhu yang keempat? Sebutkan contoh penghalangnya!", jawaban: "Tidak ada penghalang antara air dan anggota yang dibasuh. Contoh: kapur (nūrah), lilin, minyak beku, dan benda tinta atau inai (hal. 5)" },
    { id: 140, soal: "Apa saja yang TIDAK termasuk penghalang dalam wudhu?", jawaban: "Minyak cair walau air tidak menempel, serta bekas warna tinta dan inai yang tidak menghalangi (hal. 5)" },
    { id: 76, soal: "Bagaimana pendapat banyak ulama tentang kotoran di bawah kuku dalam wudhu?", jawaban: "Mensyaratkan tidak ada kotoran di bawah kuku yang menghalangi sampainya air (hal. 5)" },
    { id: 141, soal: "Siapa ulama yang memaafkan kotoran di bawah kuku (selain adonan) dalam wudhu?", jawaban: "Al-Ghazali, az-Zarkasyi, dan lainnya, yang memperpanjang pembahasan untuk menguatkannya (hal. 5)" },
    { id: 142, soal: "Siapa yang menunjukkan lemahnya pendapat yang memaafkan kotoran di bawah kuku?", jawaban: "Al-Adzra'i dan lainnya (hal. 5)" },
    { id: 77, soal: "Menurut fatwa al-Baghawi, kotoran apa yang menghalangi sahnya wudhu?", jawaban: "Kotoran dari debu (ghubar) (hal. 5)" },
    { id: 143, soal: "Menurut fatwa al-Baghawi, kotoran apa yang tidak menghalangi sahnya wudhu?", jawaban: "Kotoran yang berasal dari badan sendiri, yaitu keringat yang membeku (hal. 5)" },
    { id: 78, soal: "Apa syarat wudhu yang kelima, dan berlaku bagi siapa?", jawaban: "Masuk waktu shalat (minimal dugaan kuat sudah masuk), bagi orang yang hadatsnya terus-menerus (dāimul hadats) seperti penderita salisul baul dan perempuan mustahadhah (hal. 5)" },
    { id: 144, soal: "Bolehkah orang yang hadatsnya terus-menerus berwudhu sebelum masuk waktu shalat?", jawaban: "Tidak boleh, sebagaimana tayamum (hal. 5)" },

/* ════════════════════════════════════════════════════════════════
   SRS — port dari nihongo-cards (lib/srs/algorithm.ts, SM-2 satu arah)
   ════════════════════════════════════════════════════════════════ */
const EASE_INIT = 2.5, EASE_MIN = 1.3, EASE_MAX = 4.0;
const EASY_BONUS = 1.3, SUSAH_FACTOR = 0.6;
const EASE_DELTA_LUPA = -0.20, EASE_DELTA_SUSAH = -0.15, EASE_DELTA_OKE = +0.15;
const RELEARN_OKE_FACTOR = 0.5, RELEARN_GAMPANG_FACTOR = 0.7;

/** 'YYYY-MM-DD' di zona waktu PERANGKAT (bukan toISOString yang UTC). */
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function todayStr() { return localDateStr(new Date()); }
function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + Math.max(1, days));
  return localDateStr(d);
}
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function newCard() {
  return { state: 'new', due_date: todayStr(), interval: 0, ease_factor: EASE_INIT, lapses: 0, reps: 0 };
}

function computeNextSM2(card, rating) {
  const base = { reps: card.reps + 1 };
  if (card.state === 'new' || card.state === 'learning') {
    if (rating === 'lupa' || rating === 'susah') return { ...base, state: 'learning', due_date: addDays(1), interval: 0 };
    if (rating === 'oke') return { ...base, state: 'review', due_date: addDays(1), interval: 1 };
    return { ...base, state: 'review', due_date: addDays(4), interval: 4 };
  }
  if (card.state === 'review') {
    if (rating === 'lupa') return {
      ...base, state: 'relearning', due_date: addDays(1), interval: 1,
      ease_factor: clamp(card.ease_factor + EASE_DELTA_LUPA, EASE_MIN, EASE_MAX),
      lapses: card.lapses + 1,
    };
    if (rating === 'susah') {
      const ni = Math.max(1, Math.ceil(card.interval * SUSAH_FACTOR));
      return { ...base, state: 'review', due_date: addDays(ni), interval: ni,
        ease_factor: clamp(card.ease_factor + EASE_DELTA_SUSAH, EASE_MIN, EASE_MAX) };
    }
    if (rating === 'oke') {
      const ni = Math.ceil(card.interval * card.ease_factor);
      return { ...base, state: 'review', due_date: addDays(ni), interval: ni };
    }
    const ni = Math.ceil(card.interval * card.ease_factor * EASY_BONUS);
    return { ...base, state: 'review', due_date: addDays(ni), interval: ni,
      ease_factor: clamp(card.ease_factor + EASE_DELTA_OKE, EASE_MIN, EASE_MAX) };
  }
  // relearning
  if (rating === 'lupa' || rating === 'susah') return { ...base, state: 'relearning', due_date: addDays(1), interval: 1 };
  if (rating === 'oke') {
    const ni = Math.max(1, Math.ceil(card.interval * RELEARN_OKE_FACTOR));
    return { ...base, state: 'review', due_date: addDays(ni), interval: ni };
  }
  const ni = Math.max(1, Math.ceil(card.interval * RELEARN_GAMPANG_FACTOR));
  return { ...base, state: 'review', due_date: addDays(ni), interval: ni };
}

function previewIntervals(card) {
  if (!card || card.state === 'new' || card.state === 'learning')
    return { lupa: 'besok', oke: '1 hr', gampang: '4 hr' };
  if (card.state === 'review') return {
    lupa: 'besok',
    oke: `${Math.ceil(card.interval * card.ease_factor)} hr`,
    gampang: `${Math.ceil(card.interval * card.ease_factor * EASY_BONUS)} hr`,
  };
  return { lupa: 'besok', oke: '1 hr', gampang: '2 hr' };
}

/** Label pil di sidebar, sama dengan dueDateLabel() nihongo-cards. */
function dueDateLabel(due) {
  const today = todayStr();
  if (due <= today) return 'Hari ini';
  if (due === addDays(1)) return 'Besok';
  const [y1, m1, d1] = today.split('-').map(Number);
  const [y2, m2, d2] = due.split('-').map(Number);
  return `${Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000)} hr`;
}

const RATINGS = [
  { key: 'lupa',    label: '❌ Lupa',         cls: 'rate-btn--lupa' },
  { key: 'oke',     label: '✅ Oke',          cls: 'rate-btn--oke' },
  { key: 'gampang', label: '⭐ Sangat Mudah', cls: 'rate-btn--gampang' },
];
const STATE_LABEL = { new: 'Baru', learning: 'Belajar', review: 'Review', relearning: 'Ulang' };

/* ════════════════════════════════════════════════════════════════
   STORAGE (localStorage)
   ════════════════════════════════════════════════════════════════ */
const KEY_CARDS = 'fp_srs_cards';     // { "Mapel:id": {state, due_date, …} }
const KEY_SESSION = 'fp_session';     // { mapel, queue:[id], total, retry:[id] }
const KEY_CONFIG = 'fp_config';       // { perMapel: { [mapel]: { newPerSession, reviewPerSession } } }
const KEY_LAST_BACKUP = 'fp_last_backup'; // 'YYYY-MM-DD' backup terakhir
const BACKUP_STALE_DAYS = 7;
const DEFAULT_CONFIG = { newPerSession: 10, reviewPerSession: 20 };
// config = { perMapel: { [mapel]: { newPerSession, reviewPerSession } } } — mapel tanpa entri pakai DEFAULT_CONFIG.

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error('Gagal menyimpan', e); }
}

let cards = load(KEY_CARDS, {});
let config = normalizeConfig(load(KEY_CONFIG, {}));

function clampCount(v, fallback) {
  const n = typeof v === 'number' ? v : parseInt(v, 10);
  return Number.isFinite(n) ? Math.max(0, Math.min(999, Math.floor(n))) : fallback;
}
/** Bentuk lama { newPerSession, reviewPerSession } (global) diabaikan → semua mapel mulai dari default (2A). */
function normalizeConfig(raw) {
  const perMapel = {};
  const src = raw && typeof raw.perMapel === 'object' && raw.perMapel ? raw.perMapel : {};
  for (const [m, c] of Object.entries(src)) {
    if (!c || typeof c !== 'object') continue;
    perMapel[m] = {
      newPerSession: clampCount(c.newPerSession, DEFAULT_CONFIG.newPerSession),
      reviewPerSession: clampCount(c.reviewPerSession, DEFAULT_CONFIG.reviewPerSession),
    };
  }
  return { perMapel };
}
const cfgFor = (mapel) => config.perMapel[mapel] ?? DEFAULT_CONFIG;
let session = null;   // { mapel, queue:[id], total }
let flipped = false;
let today = todayStr();
let search = '';
const openMapel = new Set();

const cardKey = (mapel, id) => `${mapel}:${id}`;
const getCard = (mapel, id) => cards[cardKey(mapel, id)] ?? null;
const itemOf = (mapel, id) => (DATA[mapel] || []).find((it) => it.id === id) ?? null;

/* ════════════════════════════════════════════════════════════════
   ANTRIAN — hanya kartu jatuh tempo + kartu baru (sisanya tidak disentuh)
   ════════════════════════════════════════════════════════════════ */
/** Kartu review yang due_date <= hari ini, paling telat dulu, dipotong jatah. */
function getDueIds(mapel, max) {
  if (max <= 0) return [];
  return (DATA[mapel] || [])
    .map((it) => ({ id: it.id, c: getCard(mapel, it.id) }))
    .filter(({ c }) => c && c.state !== 'new' && c.due_date <= today)
    .sort((a, b) => (a.c.due_date < b.c.due_date ? -1 : a.c.due_date > b.c.due_date ? 1 : 0))
    .slice(0, max)
    .map(({ id }) => id);
}
/** Kartu yang belum pernah dijawab, berurutan dari atas, dipotong jatah. */
function getNewIds(mapel, max) {
  if (max <= 0) return [];
  const out = [];
  for (const it of DATA[mapel] || []) {
    const c = getCard(mapel, it.id);
    if (!c || c.state === 'new') { out.push(it.id); if (out.length >= max) break; }
  }
  return out;
}
function mapelStats(mapel) {
  const cfg = cfgFor(mapel);
  const due = getDueIds(mapel, cfg.reviewPerSession);
  const fresh = getNewIds(mapel, cfg.newPerSession);
  const learned = (DATA[mapel] || []).filter((it) => { const c = getCard(mapel, it.id); return c && c.state !== 'new'; }).length;
  return { due, fresh, learned, total: (DATA[mapel] || []).length };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ════════════════════════════════════════════════════════════════
   SESI
   ════════════════════════════════════════════════════════════════ */
function startSession(mapel) {
  const { due, fresh } = mapelStats(mapel);
  const queue = shuffle([...due, ...fresh]);
  if (queue.length === 0) return;
  session = { mapel, queue, total: queue.length, retry: [] };
  flipped = false;
  save(KEY_SESSION, session);
  closeSidebar();
  renderAll(true);
}

function endSession() {
  session = null;
  flipped = false;
  localStorage.removeItem(KEY_SESSION);
  renderAll(true);
}

function answer(rating) {
  if (!session || !flipped) return;
  const id = session.queue[0];
  const { mapel } = session;
  const isRetry = session.retry.includes(id);

  // Hanya jawaban PERTAMA yang menentukan jadwal SRS. Kartu ulangan = latihan murni.
  if (!isRetry) {
    const before = getCard(mapel, id) ?? newCard();
    cards[cardKey(mapel, id)] = { ...before, ...computeNextSM2(before, rating) };
    save(KEY_CARDS, cards);
    if (persistGranted === false) requestPersist(); // browser lebih mau memberi izin setelah ada interaksi
  }

  if (rating === 'lupa') {
    // Lupa → lempar ke belakang antrian, muncul lagi sebelum sesi kelar (jadwal besok tetap tercatat).
    session.queue = [...session.queue.slice(1), id];
    if (!isRetry) session.retry = [...session.retry, id];
  } else {
    // Oke / Sangat Mudah → keluar dari sesi.
    session.queue = session.queue.slice(1);
    session.retry = session.retry.filter((x) => x !== id);
  }
  if (session.queue.length === 0) { endSession(); return; }
  save(KEY_SESSION, session);
  flipped = false;
  renderAll(true);
}

function flip() {
  if (!session) return;
  flipped = !flipped;
  renderCard(false);
  renderActions();
}

/** Pulihkan sesi setelah refresh — buang id yang sudah tidak ada di DATA. */
function restoreSession() {
  const s = load(KEY_SESSION, null);
  if (!s || !DATA[s.mapel] || !Array.isArray(s.queue)) { localStorage.removeItem(KEY_SESSION); return; }
  const queue = s.queue.filter((id) => itemOf(s.mapel, id));
  if (queue.length === 0) { localStorage.removeItem(KEY_SESSION); return; }
  const retry = Array.isArray(s.retry) ? s.retry.filter((id) => queue.includes(id)) : [];
  session = { mapel: s.mapel, queue, total: Math.max(s.total || 0, queue.length), retry };
}

/* ════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) n.append(c);
  return n;
}

function renderDashboard() {
  let fresh = 0, due = 0;
  for (const m of Object.keys(DATA)) { const s = mapelStats(m); fresh += s.fresh.length; due += s.due.length; }
  const total = fresh + due;
  const box = $('dash');
  box.replaceChildren(el('div', { class: 'dash-title' }, '⏱️ Hari Ini — semua mapel'));
  if (total === 0) {
    box.append(el('div', { class: 'dash-empty' },
      el('strong', {}, '🎉 Sesi hari ini selesai!'),
      el('span', {}, 'Kartu berikutnya dalam'),
      el('span', { class: 'dash-countdown', id: 'countdown' }, midnightCountdown()),
    ));
  } else {
    box.append(el('div', { class: 'dash-stats' },
      el('div', { class: 'dash-stat dash-stat--new' }, el('span', { class: 'dash-val' }, String(fresh)), el('span', { class: 'dash-lbl' }, 'Kartu Baru')),
      el('div', { class: 'dash-div' }),
      el('div', { class: 'dash-stat dash-stat--rev' }, el('span', { class: 'dash-val' }, String(due)), el('span', { class: 'dash-lbl' }, 'Review')),
      el('div', { class: 'dash-div' }),
      el('div', { class: 'dash-stat dash-stat--tot' }, el('span', { class: 'dash-val' }, String(total)), el('span', { class: 'dash-lbl' }, 'Total')),
    ));
  }
}

function matches(it) {
  if (!search) return true;
  return `${it.soal} ${it.jawaban}`.toLowerCase().includes(search);
}

function renderMapelList() {
  const list = $('mapelList');
  list.replaceChildren();
  const currentId = session ? session.queue[0] : null;
  for (const mapel of Object.keys(DATA)) {
    const items = DATA[mapel].filter(matches);
    if (search && items.length === 0) continue;
    const { due, fresh, learned, total } = mapelStats(mapel);
    const todaySet = new Set(fresh);
    const n = due.length + fresh.length;
    const isOpen = search ? true : openMapel.has(mapel);

    const startBtn = session ? null : el('button', {
      class: 'mapel-start',
      disabled: n === 0,
      'aria-label': n ? `Mulai belajar ${mapel}, ${n} kartu` : `${mapel}: tidak ada kartu hari ini`,
      onclick: () => startSession(mapel),
    }, n ? `▶ Mulai (${n})` : '✓ Beres');

    const section = el('div', { class: `mapel${isOpen ? ' open' : ''}` },
      el('div', { class: 'mapel-head' },
        el('button', {
          class: 'mapel-toggle',
          'aria-expanded': String(isOpen),
          onclick: () => { openMapel.has(mapel) ? openMapel.delete(mapel) : openMapel.add(mapel); renderMapelList(); },
        },
          el('span', { class: 'mapel-title' },
            el('span', { class: 'mapel-name' }, mapel),
            el('span', { class: 'mapel-count' }, `${learned}/${total} Soal`),
          ),
          el('span', { class: 'chev', 'aria-hidden': 'true' }, '▼'),
        ),
        session ? null : el('button', {
          class: 'mapel-cfg',
          'aria-label': `Setelan jumlah kartu ${mapel}`,
          title: 'Setelan jumlah kartu',
          onclick: () => openMapelCfg(mapel),
        }, '⚙'),
        startBtn,
      ),
    );

    if (isOpen) {
      const box = el('div', { class: 'mapel-items' });
      if (items.length === 0) box.append(el('div', { class: 'mapel-empty' }, 'Mapel ini masih kosong'));
      for (const it of items) {
        const c = getCard(mapel, it.id);
        const inSrs = !!c && c.state !== 'new';
        const label = inSrs ? dueDateLabel(c.due_date) : 'Baru';
        const pillCls = label === 'Baru' ? ' pill--new' : label === 'Hari ini' ? ' pill--due' : '';
        const isCur = session && session.mapel === mapel && currentId === it.id;
        const rowCls = 'row' + (inSrs ? ' row--srs' : todaySet.has(it.id) ? ' row--today' : '') + (isCur ? ' row--current' : '');
        box.append(el('div', { class: rowCls },
          el('div', { class: 'row-text' },
            el('span', { class: 'row-soal', dir: 'auto', title: it.soal }, it.soal),
            el('span', { class: 'row-jawab', dir: 'auto', title: it.jawaban }, String(it.jawaban).replace(/\s*\n\s*/g, ' · ')),
          ),
          el('span', { class: 'pill' + pillCls }, label),
        ));
      }
      section.append(box);
    }
    list.append(section);
  }
  if (!list.children.length) list.append(el('div', { class: 'mapel-empty' }, search ? 'Tidak ada soal yang cocok' : 'Belum ada materi di DATA'));
}

function renderFooter() {
  const foot = $('sbFoot');
  if (session) {
    foot.replaceChildren(el('button', {
      class: 'btn btn--danger',
      onclick: () => confirmDialog(
        'Selesai belajar?',
        'Kartu yang sudah kamu nilai tetap tersimpan. Yang dibuang cuma sisa antrean sesi ini.',
        endSession,
      ),
    }, '⏹ Selesai Belajar'));
  } else {
    const nudge = backupNudgeText();
    foot.replaceChildren(
      nudge ? el('button', { class: 'backup-nudge', onclick: openSettings }, nudge) : '',
      el('p', { class: 'sb-note' }, 'Tekan ▶ Mulai di mapel yang mau dipelajari'),
    );
  }
}

function renderProgress() {
  const p = $('progress');
  if (!session) { p.replaceChildren(); return; }
  const done = session.total - session.queue.length;
  const nRetry = session.retry.length;
  p.replaceChildren('⚡ ', el('b', {}, `${done} / ${session.total}`), ` · ${session.mapel}`,
    nRetry ? el('span', { class: 'retry-count' }, ` · 🔁 ${nRetry} diulang`) : '');
}

function renderCard(resetAnim) {
  const card = $('card');
  if (resetAnim) card.classList.add('no-anim');
  card.classList.toggle('flipped', !!session && flipped);
  const front = $('front'), back = $('back');

  if (!session) {
    const anyLeft = Object.keys(DATA).some((m) => { const s = mapelStats(m); return s.due.length + s.fresh.length > 0; });
    front.replaceChildren(el('div', { class: 'empty' },
      el('div', { class: 'empty-icon' }, anyLeft ? '🎯' : '🎉'),
      el('h2', {}, anyLeft ? 'Siap belajar?' : 'Semua beres hari ini!'),
      el('p', {}, anyLeft
        ? 'Buka daftar mapel, lalu tekan ▶ Mulai di mapel yang mau kamu pelajari.'
        : 'Tidak ada kartu untuk direview hari ini. Kembali besok ya ✅'),
    ));
    back.replaceChildren();
  } else {
    const id = session.queue[0];
    const it = itemOf(session.mapel, id);
    const c = getCard(session.mapel, id);
    const state = c ? c.state : 'new';
    const top = () => el('div', { class: 'face-top' },
      el('span', { class: 'tag' }, session.mapel),
      el('span', { class: `tag tag--state-${state}` }, STATE_LABEL[state]),
      session.retry.includes(id) ? el('span', { class: 'tag tag--retry' }, '🔁 Ulangan') : null,
    );
    front.replaceChildren(top(),
      el('div', { class: 'face-body' },
        el('div', { class: 'face-label' }, 'Soal'),
        el('div', { class: 'face-text', dir: 'auto' }, it.soal),
      ),
      el('div', { class: 'face-hint' }, 'Ketuk kartu untuk melihat jawaban'),
    );
    back.replaceChildren(top(),
      el('div', { class: 'face-body' },
        el('div', { class: 'face-text face-text--q', dir: 'auto' }, it.soal),
        el('div', { class: 'face-label' }, 'Jawaban'),
        el('div', { class: 'face-text', dir: 'auto' }, it.jawaban),
      ),
    );
  }
  if (resetAnim) { void card.offsetWidth; card.classList.remove('no-anim'); }
}

function renderActions() {
  const box = $('actions');
  if (!session) { box.replaceChildren(); return; }
  if (!flipped) {
    box.replaceChildren(
      el('button', { class: 'flip-btn', onclick: flip }, '🔄 Balik Kartu'),
      el('div', { class: 'kbd-hint' }, el('kbd', {}, 'Spasi'), ' balik kartu'),
    );
    return;
  }
  const c = getCard(session.mapel, session.queue[0]);
  const isRetry = session.retry.includes(session.queue[0]);
  // Kartu ulangan tidak mengubah jadwal → tampilkan arti tombolnya, bukan interval.
  const hints = isRetry
    ? { lupa: 'ulang lagi', oke: 'selesai', gampang: 'selesai' }
    : previewIntervals(c);
  box.replaceChildren(
    el('div', { class: 'rate-row', role: 'group', 'aria-label': 'Nilai hafalan' },
      RATINGS.map((r) => el('button', {
        class: `rate-btn ${r.cls}`,
        'aria-label': `${r.label.replace(/^\S+\s/, '')}, ${isRetry ? hints[r.key] : `ulang ${hints[r.key]}`}`,
        onclick: () => answer(r.key),
      }, el('span', {}, r.label), el('span', { class: 'rate-int' }, hints[r.key]))),
    ),
    el('div', { class: 'kbd-hint' }, el('kbd', {}, '1'), ' ', el('kbd', {}, '2'), ' ', el('kbd', {}, '3'), ' nilai · ', el('kbd', {}, 'Spasi'), ' balik lagi'),
  );
}

function renderWarnings() {
  const problems = [];
  for (const [mapel, items] of Object.entries(DATA)) {
    const seen = new Set();
    for (const it of items) {
      if (it.id == null) problems.push(`${mapel}: ada soal tanpa id ("${String(it.soal).slice(0, 30)}…")`);
      else if (seen.has(it.id)) problems.push(`${mapel}: id ${it.id} dipakai lebih dari sekali`);
      seen.add(it.id);
    }
  }
  $('warnBox').replaceChildren(problems.length
    ? el('div', { class: 'warn', role: 'alert' }, '⚠️ Data bermasalah — progres kartu bisa ketuker:', el('br'), problems.join(' · '))
    : '');
}

function renderAll(resetAnim = false) {
  renderDashboard();
  renderMapelList();
  renderFooter();
  renderProgress();
  renderCard(resetAnim);
  renderActions();
}

/* ════════════════════════════════════════════════════════════════
   TENGAH MALAM — hari berganti → antrian dihitung ulang
   ════════════════════════════════════════════════════════════════ */
function midnightCountdown() {
  const now = new Date();
  const mid = new Date(now); mid.setHours(24, 0, 0, 0);
  const diff = mid - now;
  const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
  return [h, m, s].map((x) => String(x).padStart(2, '0')).join(':');
}
function checkDayChange() {
  const t = todayStr();
  if (t !== today) { today = t; renderAll(); }
}
setInterval(() => {
  checkDayChange();
  const cd = $('countdown');
  if (cd) cd.textContent = midnightCountdown();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayChange(); });

/* ════════════════════════════════════════════════════════════════
   UI: sidebar, dialog, pengaturan, keyboard
   ════════════════════════════════════════════════════════════════ */
function openSidebar() { $('app').classList.add('sb-open'); }
function closeSidebar() { $('app').classList.remove('sb-open'); }
$('btnMenu').addEventListener('click', openSidebar);
$('backdrop').addEventListener('click', closeSidebar);
$('card').addEventListener('click', flip);
$('search').addEventListener('input', (e) => { search = e.target.value.trim().toLowerCase(); renderMapelList(); });

let confirmAction = null;
function confirmDialog(title, text, onYes, { yesLabel = 'Ya', infoOnly = false } = {}) {
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  $('confirmYes').textContent = infoOnly ? 'Oke' : yesLabel;
  $('confirmYes').className = infoOnly ? 'btn btn--primary' : 'btn btn--danger';
  $('confirmNo').hidden = infoOnly;
  confirmAction = onYes;
  $('confirmBg').hidden = false;
  (infoOnly ? $('confirmYes') : $('confirmNo')).focus();
}
function closeConfirm() { $('confirmBg').hidden = true; confirmAction = null; }
$('confirmNo').addEventListener('click', closeConfirm);
$('confirmYes').addEventListener('click', () => { const fn = confirmAction; closeConfirm(); fn && fn(); });
$('confirmBg').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeConfirm(); });

function renderResetList() {
  const list = $('resetList');
  list.replaceChildren();
  for (const mapel of Object.keys(DATA)) {
    const learned = mapelStats(mapel).learned;
    list.append(el('div', { class: 'reset-item' },
      el('span', {}, `${mapel} (${learned} dipelajari)`),
      el('button', {
        disabled: learned === 0,
        onclick: () => confirmDialog(`Reset progres ${mapel}?`, 'Semua kartu di mapel ini kembali jadi Baru. Tidak bisa dibatalkan.', () => {
          for (const k of Object.keys(cards)) if (k.startsWith(`${mapel}:`)) delete cards[k];
          save(KEY_CARDS, cards);
          if (session && session.mapel === mapel) endSession(); else renderAll();
          renderResetList();
        }),
      }, 'Reset'),
    ));
  }
}
function openSettings() {
  renderResetList();
  renderBackupStatus();
  renderPersistStatus();
  $('settingsBg').hidden = false;
  $('settingsClose').focus();
}
function closeSettings() {
  $('settingsBg').hidden = true;
}

/* ── Setelan jumlah kartu per mapel ── */
let cfgMapel = null;
function openMapelCfg(mapel) {
  cfgMapel = mapel;
  const c = cfgFor(mapel);
  $('mapelCfgTitle').textContent = `⚙ Setelan ${mapel}`;
  $('cfgNew').value = c.newPerSession;
  $('cfgRev').value = c.reviewPerSession;
  $('mapelCfgBg').hidden = false;
  $('cfgNew').focus();
  $('cfgNew').select();
}
function closeMapelCfg() { $('mapelCfgBg').hidden = true; cfgMapel = null; }
function saveMapelCfg() {
  if (!cfgMapel) return closeMapelCfg();
  config.perMapel[cfgMapel] = {
    newPerSession: clampCount($('cfgNew').value, DEFAULT_CONFIG.newPerSession),
    reviewPerSession: clampCount($('cfgRev').value, DEFAULT_CONFIG.reviewPerSession),
  };
  save(KEY_CONFIG, config);
  closeMapelCfg();
  renderAll();
}
$('mapelCfgSave').addEventListener('click', saveMapelCfg);
$('mapelCfgCancel').addEventListener('click', closeMapelCfg);
$('mapelCfgBg').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeMapelCfg(); });
$('btnSettings').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('settingsBg').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSettings(); });

document.addEventListener('keydown', (e) => {
  if (!$('confirmBg').hidden) { if (e.key === 'Escape') closeConfirm(); return; }
  if (!$('mapelCfgBg').hidden) {
    if (e.key === 'Escape') closeMapelCfg();
    else if (e.key === 'Enter' && e.target instanceof HTMLInputElement) saveMapelCfg();
    return;
  }
  if (!$('settingsBg').hidden) { if (e.key === 'Escape') closeSettings(); return; }
  if (e.target instanceof HTMLInputElement) return;
  if (e.key === 'Escape') { closeSidebar(); return; }
  if (!session) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); return; }
  if (!flipped) return;
  const r = { '1': 'lupa', '2': 'oke', '3': 'gampang' }[e.key];
  if (r) { e.preventDefault(); answer(r); }
});

/* ════════════════════════════════════════════════════════════════
   BACKUP & RESTORE — satu-satunya pengaman kalau data browser dihapus
   ════════════════════════════════════════════════════════════════ */
function daysSince(dateStr) {
  const [y1, m1, d1] = dateStr.split('-').map(Number);
  const [y2, m2, d2] = todayStr().split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function lastBackupLabel() {
  const last = localStorage.getItem(KEY_LAST_BACKUP);
  if (!last) return null;
  const d = daysSince(last);
  return d <= 0 ? 'hari ini' : d === 1 ? 'kemarin' : `${d} hari lalu`;
}
/** Teks pengingat di sidebar — null kalau belum perlu diingatkan. */
function backupNudgeText() {
  if (Object.keys(cards).length === 0) return null; // belum ada progres, belum ada yang perlu diamankan
  const last = localStorage.getItem(KEY_LAST_BACKUP);
  if (!last) return '💾 Progres belum pernah di-backup';
  return daysSince(last) >= BACKUP_STALE_DAYS ? `💾 Backup terakhir ${lastBackupLabel()}` : null;
}
function renderBackupStatus() {
  const s = $('backupStatus');
  const label = lastBackupLabel();
  const stale = !!backupNudgeText();
  s.className = 'backup-status' + (stale ? ' backup-status--stale' : '');
  s.textContent = label
    ? `Backup terakhir: ${label}. Simpan file backup di Drive/WA biar aman.`
    : 'Belum pernah backup. Simpan file backup di Drive/WA biar aman.';
}

function exportBackup() {
  const payload = {
    app: 'flashcard-pelajaran',
    version: 1,
    exportedAt: new Date().toISOString(),
    cards,
    config,
  };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `flashcard-backup-${todayStr()}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  localStorage.setItem(KEY_LAST_BACKUP, todayStr());
  renderBackupStatus();
  renderFooter();
}

const VALID_STATES = new Set(['new', 'learning', 'review', 'relearning']);
function isValidCard(c) {
  return c && typeof c === 'object'
    && VALID_STATES.has(c.state)
    && /^\d{4}-\d{2}-\d{2}$/.test(c.due_date)
    && [c.interval, c.ease_factor, c.lapses, c.reps].every((n) => typeof n === 'number' && Number.isFinite(n));
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { data = null; }
    if (!data || data.app !== 'flashcard-pelajaran' || typeof data.cards !== 'object' || data.cards === null) {
      confirmDialog('File tidak valid', 'Ini bukan file backup Flashcard Pelajaran. Pilih file flashcard-backup-….json.', () => {}, { infoOnly: true });
      return;
    }
    const valid = Object.entries(data.cards).filter(([, c]) => isValidCard(c));
    const date = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : 'tanggal tidak diketahui';
    confirmDialog(
      'Restore backup?',
      `Backup ${date} berisi ${valid.length} kartu. Progres yang ada sekarang akan DIGANTI dengan isi backup ini.`,
      () => {
        cards = Object.fromEntries(valid);
        save(KEY_CARDS, cards);
        if (data.config && typeof data.config === 'object') {
          config = normalizeConfig(data.config);
          save(KEY_CONFIG, config);
        }
        // File yang barusan di-restore = salinan aman, jadi hitung sebagai backup.
        localStorage.setItem(KEY_LAST_BACKUP, todayStr());
        if (session) endSession(); else renderAll();
        renderBackupStatus();
        renderResetList();
      },
      { yesLabel: 'Ganti Progres' },
    );
  };
  reader.readAsText(file);
}

$('btnExport').addEventListener('click', exportBackup);
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importBackup(f);
  e.target.value = ''; // supaya file yang sama bisa dipilih lagi
});

/* ════════════════════════════════════════════════════════════════
   PENYIMPANAN PERMANEN — minta browser tidak membuang data saat memori penuh
   ════════════════════════════════════════════════════════════════ */
let persistGranted = null; // null = tidak didukung
async function requestPersist() {
  if (!navigator.storage || !navigator.storage.persist) return;
  try {
    persistGranted = await navigator.storage.persisted();
    if (!persistGranted) persistGranted = await navigator.storage.persist();
  } catch { persistGranted = null; }
  renderPersistStatus();
}
function renderPersistStatus() {
  $('persistStatus').textContent = persistGranted === null
    ? '🔒 Penyimpanan permanen: tidak didukung browser ini — andalkan backup.'
    : persistGranted
      ? '🔒 Penyimpanan permanen: aktif (data tidak dibuang saat memori penuh).'
      : '🔓 Penyimpanan permanen: belum diizinkan browser. Biasanya aktif sendiri setelah sering dipakai.';
}

/* ── Mulai ── */
restoreSession();
if (!session) openMapel.add(Object.keys(DATA)[0]);
renderWarnings();
renderAll(true);
requestPersist();
</script>
</body>

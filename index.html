    { id: 84, soal: "Jelaskan contoh ketidaksetaraan ras dan etnik pada kasus politik Apartheid di Afrika Selatan!", jawaban: "Ras kulit putih secara jumlah lebih sedikit dibandingkan kulit hitam, tetapi posisi mereka adalah kelompok dominan yang memiliki pengaruh dan kendali terhadap berbagai aspek kehidupan masyarakat", halaman: 14 },

    // ── Hal. 15 — Ketidaksetaraan gender ──
    { id: 85, soal: "Apa yang dimaksud gender, dan bagaimana gender terbentuk?", jawaban: "Karakteristik laki-laki dan perempuan yang didasari oleh pemahaman, keyakinan, atau konstruksi sosial budaya masyarakat. Terbentuk karena pengaruh nilai, norma, kepercayaan, dan budaya melalui proses sosialisasi", halaman: 15 },
    { id: 86, soal: "Ketidaksetaraan gender termasuk isu dalam agenda apa?", jawaban: "Tujuan Pembangunan Berkelanjutan atau SDGs, artinya isu kesetaraan gender menjadi masalah sosial yang menjadi perhatian dunia", halaman: 15 },
    { id: 87, soal: "Apa pengertian ketidaksetaraan gender?", jawaban: "Fenomena sosial di mana orang tidak diperlakukan secara setara berdasarkan gender", halaman: 15 },
    { id: 88, soal: "Sebutkan faktor penyebab ketidaksetaraan gender!", jawaban: "1. Adanya norma dan budaya patriarki, yaitu sistem yang lebih mengutamakan laki-laki dan membatasi peran perempuan\n2. Pandangan bahwa perbedaan fisik menentukan peran sosial\n3. Adanya stereotipe gender, yaitu anggapan yang tertanam tentang peran laki-laki dan perempuan", halaman: 15 },
    { id: 89, soal: "Sebutkan bentuk-bentuk ketidaksetaraan gender!", jawaban: "1. Subordinasi\n2. Marginalisasi\n3. Stereotipe\n4. Beban ganda\n5. Kekerasan", halaman: 15 },
    { id: 90, soal: "Apa yang dimaksud subordinasi dalam ketidaksetaraan gender?", jawaban: "Sikap menempatkan satu gender di posisi yang lebih rendah dan dianggap kurang penting", halaman: 15 },
    { id: 91, soal: "Apa yang dimaksud marginalisasi dalam ketidaksetaraan gender?", jawaban: "Peminggiran dari akses sumber daya ekonomi dan kesempatan", halaman: 15 },
    { id: 92, soal: "Apa yang dimaksud stereotipe dalam ketidaksetaraan gender? Berikan contohnya!", jawaban: "Pelabelan atau penandaan terhadap suatu kelompok tertentu yang sering kali merugikan dan menimbulkan ketidakadilan. Contoh pelabelan yang membatasi potensi: perempuan lemah atau hanya untuk urusan domestik", halaman: 15 },
    { id: 93, soal: "Apa yang dimaksud beban ganda dalam ketidaksetaraan gender? Berikan contohnya!", jawaban: "Beban kerja yang lebih panjang dan lebih banyak pada salah satu gender. Contoh: perempuan dianggap memelihara dan rajin sehingga pekerjaan domestik menjadi tanggung jawabnya; meskipun bekerja di luar rumah, tetap dituntut menjalankan dan menomorsatukan pekerjaan rumah tangga, sehingga menanggung pekerjaan domestik dan produktif secara tidak proporsional", halaman: 15 },
    { id: 94, soal: "Apa yang dimaksud kekerasan dalam ketidaksetaraan gender? Berikan contohnya!", jawaban: "Serangan terhadap fisik maupun integritas mental psikologis seseorang. Kekerasan terhadap perempuan sering identik dengan kekerasan berbasis gender. Contoh: kekerasan dalam rumah tangga yang lekat dengan anggapan bahwa perempuan berkedudukan lebih rendah dari laki-laki", halaman: 15 },
    { id: 95, soal: "Sebutkan dampak negatif ketidaksetaraan gender!", jawaban: "1. Menghambat kemajuan individu dan masyarakat di berbagai sektor (pendidikan, kesehatan, ekonomi)\n2. Menyebabkan perempuan memiliki partisipasi kerja lebih rendah, upah lebih rendah, dan risiko kesehatan lebih tinggi", halaman: 15 },

    // ── Hal. 16 — Intoleransi; korupsi, kolusi, dan nepotisme ──
    { id: 96, soal: "Apa pengertian intoleransi menurut Cohen?", jawaban: "Tindakan yang disengaja oleh aktor dengan berprinsip menahan diri dari campur tangan (menentang) perilaku mereka dalam situasi keragaman, sekalipun aktor percaya dia memiliki kekuatan untuk mengganggu", halaman: 16 },
    { id: 97, soal: "Bagaimana pandangan Charles A. Ellwood mengenai intoleransi?", jawaban: "Intoleransi merupakan sikap yang berbahaya karena menjadi sumber perpecahan bagi masyarakat", halaman: 16 },
    { id: 98, soal: "Secara umum, apa pengertian intoleransi?", jawaban: "Ketidakmauan atau ketidakmampuan seseorang untuk menerima keberadaan perbedaan dalam lingkungannya (kebalikan dari semua prinsip dalam toleransi)", halaman: 16 },
    { id: 99, soal: "Sebutkan tiga komponen intoleransi!", jawaban: "1. Ketidakmampuan menahan diri tidak suka kepada orang lain\n2. Sikap mencampuri dan/atau menentang sikap atau keyakinan orang lain\n3. Sengaja mengganggu orang lain", halaman: 16 },
    { id: 100, soal: "Apa penyebab intoleransi, dan berkaitan dengan apa?", jawaban: "Biasanya disebabkan oleh pandangan yang ekstrem, seperti menganggap pemahamannya paling benar. Intoleransi juga berkaitan dengan eksklusivisme. Sikap ini cenderung mengabaikan kepentingan orang lain dan lebih mementingkan kepercayaan kelompok sendiri", halaman: 16 },
    { id: 101, soal: "Sebutkan contoh sikap intoleransi!", jawaban: "1. Membeda-bedakan orang atau diskriminasi terhadap suku, agama, gender, ras, dll.\n2. Tidak menghormati dan menghargai hak milik orang lain\n3. Memaksakan kehendak orang lain\n4. Mengganggu kebebasan orang lain dalam memiliki keyakinan politik, kelompok, dan memilih agama\n5. Membenci dan menyakiti perasaan orang lain yang berbeda pandangan\n6. Mementingkan kelompok sendiri atau menganggapnya lebih baik\n7. Tidak mau bergaul dan bersikap tidak baik kepada orang yang keyakinannya berbeda", halaman: 16 },
    { id: 102, soal: "Bagaimana cara menyikapi intoleransi?", jawaban: "1. Membangun kesadaran melalui introspeksi diri\n2. Penegakan hukum dan HAM\n3. Membiasakan diri dengan perbedaan dan keterbukaan informasi\n4. Moderasi beragama", halaman: 16 },
    { id: 103, soal: "Apa yang dimaksud moderasi beragama?", jawaban: "Cara pandang, sikap, dan perilaku yang selalu mengambil poros di tengah-tengah, selalu bertindak adil, dan tidak ekstrem dalam beragama (moderasi = sikap memilih jalan tengah, adil dan berimbang, tidak berlebih-lebihan). Moderasi beragama merupakan kunci tercipta toleransi dan kerukunan", halaman: 16 },
    { id: 104, soal: "Sebutkan tanda-tanda perilaku yang moderat!", jawaban: "Cinta tanah air, punya toleransi tinggi, antikekerasan, dan akomodatif terhadap budaya lokal", halaman: 16 },
    { id: 105, soal: "Apa pengertian korupsi, apa bentuknya, dan apa tujuannya?", jawaban: "Tindak penyelewengan atau penyalahgunaan yang dapat merugikan. Bentuknya berupa penggelapan uang serta penyalahgunaan wewenang, sarana, dan jabatan oleh seseorang ataupun kelompok. Bertujuan menguntungkan kepentingan pribadi atau golongannya sendiri", halaman: 16 },
    { id: 106, soal: "Apa pengertian kolusi?", jawaban: "Permufakatan atau kerja sama secara melawan hukum antarpenyelenggara negara, atau antara penyelenggara negara dan pihak lain yang merugikan orang lain, masyarakat, dan/atau negara", halaman: 16 },
    { id: 107, soal: "Apa pengertian nepotisme?", jawaban: "Perbuatan/tindakan atau pengambilan keputusan secara subjektif dengan terlebih dahulu mengangkat atau memberikan jalan dalam bentuk apa pun bagi keluarga/kelompok/golongannya untuk suatu kedudukan atau jabatan tertentu", halaman: 16 },
    { id: 108, soal: "Bagaimana cara menghindari dan ikut memberantas korupsi?", jawaban: "Menghindarkan diri dari sikap yang mengarah pada korupsi, misalnya membiasakan diri disiplin, tanggung jawab, jujur, dan amanah. Ikut memberantas korupsi dengan mencegah dan melaporkannya kepada pihak berwenang", halaman: 16 },

    // ── Hal. 17 — Penyalahgunaan NAPZA; hubungan seks pranikah ──
    { id: 109, soal: "Mengapa penyalahgunaan NAPZA atau narkoba disebut penyimpangan perilaku?", jawaban: "Karena melanggar norma hukum yang berlaku di masyarakat", halaman: 17 },
    { id: 110, soal: "Dalam bidang apa narkoba biasanya digunakan secara benar, dan bagaimana aturannya?", jawaban: "Dalam bidang kedokteran, diatur dalam seperangkat peraturan yang sifatnya formal. Penggunaannya harus di bawah pengawasan ketat, misalnya oleh dokter sebagai pengobatan atau pembiusan", halaman: 17 },
    { id: 111, soal: "Sebutkan alasan banyak orang menyalahgunakan narkoba menurut beberapa penelitian!", jawaban: "1. Melupakan masalah atau kesulitan hidupnya meski sementara\n2. Menghilangkan rasa takut (merasa jadi pribadi yang berani)\n3. Menghilangkan rasa malu atau meningkatkan kepercayaan diri\n4. Sebagai gaya hidup (life style)\n5. Awalnya hanya coba-coba, lama-kelamaan ketagihan", halaman: 17 },
    { id: 112, soal: "Sebutkan dampak langsung penyalahgunaan NAPZA!", jawaban: "1. Dampak kejiwaan: depresi mental, gangguan jiwa berat, dan tindak kejahatan lain\n2. Dampak terhadap tubuh: gangguan jantung, otak, kulit, tulang, pembuluh darah, paru-paru, sistem saraf dan pencernaan, dll.", halaman: 17 },
    { id: 113, soal: "Sebutkan dampak tidak langsung penyalahgunaan NAPZA!", jawaban: "Keluar uang banyak untuk perawatan dan pengobatan, dikucilkan masyarakat, keluarga menanggung malu, hilangnya kesempatan studi, tidak dipercaya, dan berlawanan dengan ajaran agama", halaman: 17 },
    { id: 114, soal: "Perubahan apa saja yang terjadi pada masa pubertas remaja?", jawaban: "Biologis: organ-organ reproduksi mulai matang dan bagian tubuh lainnya mulai berkembang\nPsikologis: perubahan emosi, sikap mental, sensitivitas, dan mulai mencari jati diri", halaman: 17 },
    { id: 115, soal: "Perilaku seks pranikah melanggar norma apa saja?", jawaban: "Norma hukum (dapat dijerat hukum pidana perzinaan), norma agama, dan norma sosial", halaman: 17 },
    { id: 116, soal: "Sebutkan faktor yang menyebabkan remaja melakukan hubungan seks pranikah!", jawaban: "1. Pengaruh media sosial, seperti konten pornografi dan informasi yang tidak terfilter dari internet atau media elektronik\n2. Pemahaman agama yang kurang\n3. Pengetahuan dan pendidikan seks yang kurang\n4. Kurangnya perhatian dan pengawasan orang tua\n5. Lingkungan atau pergaulan yang salah", halaman: 17 },
    { id: 117, soal: "Sebutkan dampak perilaku seks pranikah bagi pelakunya!", jawaban: "1. Pengucilan (eksklusi sosial), stigmatisasi dari masyarakat, hingga terputusnya pendidikan akibat kehamilan tidak diinginkan\n2. Risiko tinggi penularan Penyakit Menular Seksual (PMS) seperti HIV/AIDS, sifilis, dan gonore, serta risiko komplikasi akibat aborsi ilegal\n3. Timbulnya perasaan bersalah, depresi, stres, dan rendahnya harga diri", halaman: 17 },
    { id: 118, soal: "Apa yang harus dilakukan remaja agar terhindar dari perilaku seks pranikah?", jawaban: "Pandai memilih lingkungan pertemanan yang baik, tidak mudah percaya dengan orang lain, serta membentengi diri dengan keimanan dan ketekunan dalam meraih cita-cita", halaman: 17 },

    // ── Hal. 18 — Pengaruh negatif media sosial; pencemaran lingkungan; Hari Energi Sedunia ──
    { id: 119, soal: "Sebutkan dampak positif adanya media sosial!", jawaban: "1. Dapat dengan cepat dan mudah mengakses dan membagikan informasi\n2. Berkembangnya marketplace\n3. Berkembangnya economic sharing resources", halaman: 18 },
    { id: 120, soal: "Sebutkan dampak negatif media sosial terkait berita, beserta akibatnya!", jawaban: "Tersebarnya hoaks (berita bohong), false news (berita yang salah), dan fake news (berita palsu). Akibatnya banyak orang menyerap informasi keliru yang memengaruhi persepsi dan tindakannya, misalnya menjadi intoleran dan ikut menyebarkan ujaran kebencian, serta berisiko tertipu hingga kehilangan harta benda", halaman: 18 },
    { id: 121, soal: "Apa dampak penggunaan media sosial yang berlebihan secara fisik dan mental?", jawaban: "Fisik: memengaruhi penglihatan, insomnia, dan fungsi tubuh lain karena aktivitas gerak yang minim\nMental: kecanduan sehingga meningkatkan kecemasan diri, misalnya takut ketinggalan berita terkini, cemas mengenai komentar orang lain, dan selalu ingin diperhatikan orang lain", halaman: 18 },
    { id: 122, soal: "Kapan pencemaran lingkungan menjadi masalah sosial, dan apa penyebabnya?", jawaban: "Secara jangka panjang bisa menjadi masalah sosial jika sudah terlalu mengganggu kehidupan orang banyak. Disebabkan masalah sampah dan limbah industri, serta perilaku manusia itu sendiri", halaman: 18 },
    { id: 123, soal: "Sebutkan dampak pencemaran lingkungan!", jawaban: "1. Mengganggu kesehatan tubuh manusia (racun, zat kimia, radiasi yang masuk ke tubuh)\n2. Kepunahan flora dan fauna akibat habitat yang terus berkurang dan tercemar\n3. Ketahanan pangan dan ekonomi terganggu akibat penurunan kesuburan dan cuaca ekstrem\n4. Keseimbangan alam terganggu (pemanasan global dan perubahan iklim)", halaman: 18 },
    { id: 124, soal: "Mengapa sampah menjadi masalah serius bagi masyarakat kota dan daerah padat penduduk?", jawaban: "Karena masyarakat kota dan daerah padat penduduk menghasilkan banyak sekali sampah akibat banyaknya proses produksi dan konsumsi. Bagi masyarakat perdesaan, sampah mungkin belum menjadi masalah serius", halaman: 18 },
    { id: 125, soal: "Siapa yang bertanggung jawab mengelola sampah?", jawaban: "Pemerintah yang diwakili oleh Dinas Kebersihan", halaman: 18 },
    { id: 126, soal: "Sampah yang menumpuk dapat menjadi sumber penyakit menular apa saja?", jawaban: "Muntaber, penyakit kulit, dan gangguan pernapasan", halaman: 18 },
    { id: 127, soal: "Apa akibat kebiasaan membuang sampah ke sungai dan saluran air?", jawaban: "Saluran menjadi mampet sehingga sering terjadi banjir saat hujan lebat. Banjir skala besar mengganggu kehidupan kota karena aktivitas terhenti; banyak orang terpaksa mengungsi atau kehilangan harta benda", halaman: 18 },
    { id: 128, soal: "Kapan Hari Energi Sedunia diperingati, dan untuk apa?", jawaban: "Setiap tanggal 22 Oktober, untuk meningkatkan kesadaran tentang masalah terkait energi global serta pentingnya membuat dan mengimplementasikan kebijakan yang meningkatkan efisiensi energi dan melestarikan sumber daya alam", halaman: 18 },
    { id: 129, soal: "Kapan Hari Energi Sedunia pertama kali dicanangkan, dan apa tujuannya?", jawaban: "22 Juli 2012 di World Energy Forum 2012. Tujuannya menunjukkan dampak dari pilihan energi yang dibuat terkait produksi dan penggunaannya terhadap lingkungan secara luas", halaman: 18 },

    // ── Hal. 19 — Gerakan sadar lingkungan; penelitian berbasis pemecahan masalah sosial ──
    { id: 130, soal: "Mengapa perlu dilakukan gerakan sadar lingkungan, dan apa saja contohnya?", jawaban: "Karena kerusakan lingkungan tidak terlepas dari campur tangan manusia, dan alam bukan untuk dinikmati hari ini saja tetapi diwariskan untuk generasi selanjutnya. Contoh:\n1. Mengurangi penggunaan sampah plastik\n2. Mengurangi penggunaan kendaraan pribadi\n3. Melakukan gerakan hemat energi\n4. Menggunakan produk ramah lingkungan dalam kehidupan sehari-hari", halaman: 19 },
    { id: 131, soal: "Apa pengertian pemecahan masalah?", jawaban: "Proses kognitif perilaku mandiri individu atau kelompok dengan mencoba mengidentifikasi atau menemukan solusi yang efektif atas masalah tertentu yang dihadapi dalam kehidupan sehari-hari. Dilakukan secara sadar dan rasional, serta berorientasi pada tujuan untuk mengubah situasi yang bermasalah menjadi lebih baik", halaman: 19 },
    { id: 132, soal: "Suatu permasalahan sosial di masyarakat membutuhkan proses penyelesaian seperti apa?", jawaban: "Proses penyelesaian yang sistematis melalui penelitian sosial", halaman: 19 },
    { id: 133, soal: "Apa yang dimaksud penelitian sosial, dan apa yang diberikannya?", jawaban: "Pada prinsipnya, serangkaian langkah sistematis dan ilmiah yang dirancang untuk memperoleh suatu kebenaran. Penelitian sosial memberikan solusi secara praktis ataupun teoretis terkait penanganan permasalahan sosial dalam masyarakat", halaman: 19 },
    { id: 134, soal: "Apa yang dimaksud penelitian berbasis pemecahan masalah sosial, dan apa tujuan utamanya?", jawaban: "Jenis penelitian yang fokus pada identifikasi, analisis, dan penyelesaian masalah sosial di dalam masyarakat. Tujuan utamanya menghasilkan pemahaman mendalam tentang akar permasalahan sosial dan mengembangkan solusi yang dapat diimplementasikan untuk meningkatkan kondisi sosial", halaman: 19 },
    { id: 135, soal: "Sebutkan langkah-langkah penelitian dalam pemecahan masalah sosial (berdasarkan bagan)!", jawaban: "1. Permasalahan sosial dalam masyarakat\n2. Mengidentifikasi dan merumuskan fokus masalah (bolak-balik dengan membaca berbagai literatur, yang didahului prasurvei lapangan)\n3. Membuat desain penelitian\n4. Mengumpulkan data\n5. Menganalisis data\n6. Melaporkan data/mengomunikasikan hasil penelitian\n7. Rekomendasi penyelesaian masalah (kembali ke permasalahan sosial dalam masyarakat)", halaman: 19 },
    { id: 136, soal: "Apa yang dilakukan pada tahap awal penelitian sosial (mengidentifikasi dan merumuskan fokus masalah)?", jawaban: "Merefleksikan permasalahan sosial di lingkungan sekitar ataupun menelusurinya melalui berbagai sumber. Berdasarkan latar belakang tersebut, dirumuskan fokus penelitian dalam bentuk pertanyaan, yaitu pertanyaan penelitian yang terkait dengan fenomena atau objek yang ingin diteliti serta tujuan yang ingin dicapai", halaman: 19 },

    // ── Hal. 20 — Objek penelitian, studi pustaka, desain, pengumpulan & analisis data ──
    { id: 137, soal: "Objek penelitian dapat berupa apa, dan bagaimana peneliti menelitinya?", jawaban: "Berupa manusia atau grup program. Peneliti melakukan investigasi terhadap objek yang diteliti dengan menggunakan berbagai macam metode pengumpulan data untuk menjawab pertanyaan penelitian yang muncul", halaman: 20 },
    { id: 138, soal: "Pertanyaan penelitian kualitatif menekankan pada apa?", jawaban: "Kerangka konsep yang holistik dalam lingkungan sosialnya, di mana penelitian berlangsung. Peneliti terdorong memahami fenomena secara menyeluruh, sehingga perlu memahami konteks dan melakukan analisis yang holistik. Laporannya biasanya disertai sintesis dan kesimpulan dari peneliti", halaman: 20 },
    { id: 139, soal: "Mengapa peneliti melakukan studi pustaka, dan apa fungsi tinjauan pustaka?", jawaban: "Untuk mencari dan melihat apakah telah dilakukan penelitian serupa serta bagaimana hasil akhirnya; bahan yang didapat menjadi acuan untuk mencapai tujuan penelitian. Tinjauan pustaka merupakan wacana bagi peneliti untuk menentukan pertanyaan penelitian serta menjadi titik awal mencari informasi terkait pertanyaan penelitian", halaman: 20 },
    { id: 140, soal: "Bagaimana syarat kasus yang dipilih dalam penelitian?", jawaban: "Tiap kasus memiliki keunikan tersendiri dan kasus yang dipilih dapat merepresentasikan sebagian besar populasi. Masalah yang diangkat dapat dilihat berdasarkan kesamaan geografi, tipe yang sama, atau parameter lain yang sama", halaman: 20 },
    { id: 141, soal: "Apa yang dilakukan pada tahap mendesain penyelidikan masalah?", jawaban: "Setelah menentukan fokus masalah, peneliti mendalami kembali literatur dan teori yang sesuai untuk menganalisis fenomena yang dipilih, kemudian mendesain metode penelitian yang relevan untuk menyelidiki hingga menganalisis data", halaman: 20 },
    { id: 142, soal: "Apa yang dimaksud unit (subjek) penelitian, dan apa landasan menentukannya?", jawaban: "Unit (subjek) yang akan diteliti, dapat berupa individu, keluarga, organisasi, ataupun kejadian tertentu. Tujuan yang jelas dari suatu penelitian menjadi landasan dalam menentukan subjek/sampel yang akan dipilih", halaman: 20 },
    { id: 143, soal: "Hal penting apa yang perlu diingat dalam desain penelitian studi kasus?", jawaban: "Adanya suatu kesatuan yang holistik pada desain ini: penelitian mengevaluasi suatu fenomena sebagai suatu kesatuan dilihat dari perspektif secara global (individu atau grup)", halaman: 20 },
    { id: 144, soal: "Mengapa instrumen pengumpulan data perlu diteliti, dipelajari, dan dianalisis lebih mendalam?", jawaban: "Agar tercipta validitas penelitian yang baik. Instrumen harus sesuai dengan tujuan penelitian, dan kesimpulan dari penelitian terdahulu dapat dijadikan informasi dalam mendesain instrumen yang sesuai dengan pertanyaan penelitian", halaman: 20 },
    { id: 145, soal: "Apa akibat instrumen penelitian yang tidak valid, dan bagaimana mencegahnya?", jawaban: "Menimbulkan hasil yang tidak sesuai dengan tujuan penelitian sehingga menimbulkan bias. Untuk itu peneliti perlu memperhatikan evidence ataupun penelitian terdahulu sebagai acuan dalam menentukan instrumen", halaman: 20 },
    { id: 146, soal: "Sebutkan metode dalam penelitian kasus!", jawaban: "Survei, interview, dan observasi", halaman: 20 },
    { id: 147, soal: "Metode apa yang sering digunakan dalam penelitian sosial untuk mencapai kualitas data yang lebih mendalam?", jawaban: "Wawancara mendalam (in depth interview). Metode pengumpulan data yang sering digunakan yaitu wawancara mendalam dan kuesioner", halaman: 20 },
    { id: 148, soal: "Penelitian kualitatif berfokus pada apa, dan didasarkan pada apa?", jawaban: "Tidak berfokus pada kuantitas data, tetapi pada kualitas data yang diperoleh. Didasarkan pada interpretasi atau pengertian akan suatu fenomena dari subjek/partisipan yang terlibat dalam penelitian", halaman: 20 },
    { id: 149, soal: "Sebutkan langkah-langkah analisis data dalam penelitian kualitatif!", jawaban: "1. Mengumpulkan semua data dan menyajikannya dalam bentuk transkrip\n2. Reduksi/eliminasi jawaban informan yang tidak relevan dan mengelompokkannya berdasarkan konsep tertentu, serta memeriksa kembali kelengkapan informasi tiap informan\n3. Menyajikan hasil temuan lapangan dalam bentuk matriks atau bagan\n4. Menarik kesimpulan dan mengaitkannya dengan teori", halaman: "20–21" },

    // ── Hal. 21 — Laporan penelitian; upaya mengatasi masalah sosial ──
    { id: 150, soal: "Hasil akhir penelitian umumnya dibuat dalam bentuk apa? Sebutkan saran Denzin dan Lincoln untuk laporan akhir penelitian!", jawaban: "Dalam bentuk tulisan. Saran Denzin dan Lincoln:\n1. Mendeskripsikan masalah atau isu penelitian sehingga diperoleh konsep yang jelas dari tujuan penelitian\n2. Mendeskripsikan secara detail konteks dan lokasi penelitian sehingga pembaca memperoleh gambaran jelas dan dapat menjadi bahan penelitian selanjutnya\n3. Menjabarkan secara lengkap proses penelitian kasus, dari perumusan masalah sampai analisis dan hasil akhir\n4. Mendiskusikan hasil akhir penelitian sehingga diperoleh gambaran dan pemahaman yang jelas mengenai fenomena yang diteliti", halaman: 21 },
    { id: 151, soal: "Apa yang dimaksud kerangka laporan penelitian, dan apa gunanya?", jawaban: "Gambaran atau rangkaian pembuatan laporan penelitian. Berguna untuk mempermudah penulisan laporan penelitian", halaman: 21 },
    { id: 152, soal: "Sebutkan bentuk upaya untuk mengatasi masalah sosial dalam masyarakat!", jawaban: "1. Upaya preventif\n2. Upaya kuratif\n3. Upaya campuran", halaman: 21 },
    { id: 153, soal: "Apa yang dimaksud upaya preventif? Berikan contohnya!", jawaban: "Upaya yang dilakukan untuk mencegah terjadinya masalah sosial. Contoh: sosialisasi, edukasi, pengawasan, dan meningkatkan kerja sama antarpihak", halaman: 21 },
    { id: 154, soal: "Apa yang dimaksud upaya kuratif? Berikan contohnya!", jawaban: "Penanganan setelah kejadian. Contoh: pendampingan/konseling, penegakan hukum, dan rehabilitasi", halaman: 21 },
    { id: 155, soal: "Apa yang dimaksud upaya campuran?", jawaban: "Kombinasi pencegahan dan penanganan setelah terjadi masalah sosial", halaman: 21 },

    // ── Hal. 22–27 — Glosarium & Penilaian Sumatif Bab 1 ──
    { id: 156, soal: "Apa arti norma? (Glosarium)", jawaban: "Aturan, ukuran, atau kaidah yang dipakai sebagai tolok ukur untuk menilai atau memperbandingkan sesuatu", halaman: 22 },
    { id: 157, soal: "Apa arti sosialisasi? (Glosarium)", jawaban: "Upaya memasyarakatkan sesuatu sehingga menjadi dikenal, dipahami, dihayati oleh masyarakat; permasyarakatan", halaman: 22 },
    { id: 158, soal: "Mana yang termasuk masalah sosial (berdampak pada masyarakat luas): asap pabrik yang menyebabkan gangguan pernapasan, pelaku tabrak lari tertangkap, anak mengambil uang orang tua, atau anak berbohong karena takut dimarahi? (Sumatif)", jawaban: "Asap pabrik yang pekat dapat menyebabkan gangguan pernapasan, karena dampaknya dirasakan masyarakat luas (yang lain masalah pribadi)", halaman: 22 },
    { id: 159, soal: "Permasalahan sosial dapat digolongkan menjadi masalah nyata dan tersembunyi. Manakah contoh masalah yang NYATA: rasa tidak puas pada kebijakan, keinginan cepat kaya, malas bekerja keras, atau tingkat pendidikan masyarakat masih rendah? (Sumatif)", jawaban: "Tingkat pendidikan masyarakat masih rendah, karena dapat diamati dan diukur secara langsung (yang lain berupa sikap/keinginan yang tersembunyi)", halaman: 22 },
    { id: 160, soal: "Sikap apa yang harus dimiliki untuk mencegah keretakan sosial akibat berita bohong (hoaks)? (Sumatif)", jawaban: "Membandingkan informasi yang diperoleh dengan sumber tepercaya lain sebelum disebarkan", halaman: 23 },
    { id: 161, soal: "Setelah pemilu, banyak orang mengidap gangguan jiwa akibat tidak terpilih menjadi anggota DPR. Ini masalah sosial dari faktor apa? (Sumatif)", jawaban: "Faktor psikologis", halaman: 23 },
    { id: 162, soal: "Contoh kejahatan white collar crime (kejahatan kerah putih) adalah… (Sumatif)", jawaban: "Korupsi", halaman: 23 },
    { id: 163, soal: "Contoh masalah sosial yang berkaitan dengan remaja adalah… (Sumatif)", jawaban: "Membolos, apatisme, dan bullying", halaman: 23 },
    { id: 164, soal: "Perbedaan kepentingan antarkelompok dalam masyarakat dapat mengakibatkan… (Sumatif)", jawaban: "Hubungan antaranggota masyarakat retak", halaman: 23 },
    { id: 165, soal: "Menurut teori pelabelan, suatu kondisi sosial kelompok/masyarakat dianggap bermasalah apabila… (Sumatif)", jawaban: "Seseorang atau kelompok memberi stigma buruk terhadap anggota masyarakat lainnya", halaman: 24 },
    { id: 166, soal: "Faktor penyebab korupsi, kolusi, dan nepotisme (KKN) yang paling sesuai adalah… (Sumatif)", jawaban: "Sikap tamak atau serakah untuk mendapatkan sesuatu dengan cara ilegal", halaman: 24 },
    { id: 167, soal: "Dari pernyataan: (1) pendapatan per kapita rendah, (2) persebaran penduduk tidak merata, (3) penerapan program usaha kecil mandiri, (4) pembangunan tidak merata, (5) stabilitas politik akuntabel — mana yang menjadi faktor pendorong munculnya kemiskinan? (Sumatif)", jawaban: "Nomor 1, 2, dan 4", halaman: 24 },
    { id: 168, soal: "Kehamilan remaja dikaitkan dengan rendahnya pendidikan dan kemiskinan. Upaya preventif yang relevan untuk kasus ini adalah… (Sumatif)", jawaban: "Mengintegrasikan pendidikan seks untuk remaja dalam kurikulum", halaman: 24 },
    { id: 169, soal: "Urutkan tahapan penelitian: (1) mencari topik, (2) memilih metode, (3) mempresentasikan hasil, (4) merumuskan masalah, (5) membuat laporan, (6) mengumpulkan & mengolah data! (Sumatif)", jawaban: "1 → 4 → 2 → 6 → 5 → 3\n(mencari topik, merumuskan masalah, memilih metode, mengumpulkan & mengolah data, membuat laporan, mempresentasikan hasil)", halaman: 25 },
    { id: 170, soal: "Peneliti harus bersikap objektif. Apa artinya? (Sumatif)", jawaban: "Dapat memisahkan keinginan sendiri dalam data (data tidak dipengaruhi kepentingan/pendapat pribadi peneliti)", halaman: 25 },
    { id: 171, soal: "Urutan langkah penelitian dalam pemecahan masalah sosial adalah… (Sumatif)", jawaban: "Merumuskan tujuan → mendesain langkah → mengambil data → analisis → merumuskan rekomendasi", halaman: 25 },
    { id: 172, soal: "Kasus bullying viral, kenakalan remaja, pengangguran, kesenjangan pendapatan perkotaan, dan demo ricuh. Pernyataan mana yang benar tentang gejala masalah sosialnya? (Sumatif, PG kompleks)", jawaban: "Benar:\n• Perundungan dan kenakalan remaja adalah gejala sosial yang disebabkan perubahan nilai dan norma\n• Kesenjangan ekonomi dan pengangguran termasuk masalah sosial karena menimbulkan ketidakstabilan dan ketidakpuasan\n• Demo ricuh adalah manifestasi masalah sosial akibat ketidaksesuaian antara harapan dan kenyataan sosial\nSalah: masalah sosial tidak berdampak signifikan pada integrasi; penyebab hanya biologis & psikologis", halaman: 25 },
    { id: 173, soal: "Warga asli desa membatasi interaksi dengan pendatang beda suku, menolak melibatkan mereka dalam adat, dan mempersulit akses bansos. Apa bentuk/dampak eksklusi sosialnya? (Sumatif, PG kompleks)", jawaban: "• Terjadi diskriminasi berdasarkan suku dan budaya\n• Kelompok pendatang mengalami marginalisasi dari kehidupan masyarakat umum\n• Adanya pembatasan akses terhadap sumber daya dan partisipasi sosial\n(Bukan: konflik fisik terbuka, bukan asimilasi)", halaman: 26 },
    { id: 174, soal: "Kasus desa yang mengucilkan pendatang — Benar atau Salah?\n1) Membatasi interaksi & akses bansos = diskriminasi dan eksklusi sosial\n2) Menolak melibatkan pendatang dalam adat berpotensi menghambat integrasi sosial\n3) Situasi tersebut menunjukkan asimilasi budaya yang harmonis (Sumatif)", jawaban: "1) Benar\n2) Benar\n3) Salah", halaman: 26 },
    { id: 176, soal: "Penyebab utama kenakalan remaja dari lingkungan keluarga adalah… (Sumatif)", jawaban: "Kemiskinan keluarga (perkiraan, kunci tidak tersedia)", halaman: 23 },
    { id: 177, soal: "Orang kaya selalu diutamakan dalam fasilitas & pelayanan kesehatan, sedangkan masyarakat miskin hanya menikmati pelayanan ala kadarnya. Ini ketidakadilan dalam aspek… (Sumatif)", jawaban: "Diskriminasi (perkiraan, kunci tidak tersedia)", halaman: 23 },
    { id: 178, soal: "Subsidi untuk masyarakat kurang mampu sering salah sasaran atau diselewengkan. Dampak permasalahan sosial tersebut adalah… (Sumatif)", jawaban: "Memicu konflik antara masyarakat miskin, kaya, dan pemerintah (perkiraan, kunci tidak tersedia)", halaman: 24 },
    { id: 179, soal: "Sebelum sekolah, Herman dinasihati ibunya agar memakai helm dan membawa STNK serta SIM. Tindakan ibu Herman merupakan bentuk pengendalian sosial… (Sumatif)", jawaban: "Preventif, karena dilakukan sebelum terjadi pelanggaran (perkiraan; dari sisi caranya juga termasuk persuasif)", halaman: 24 },
    { id: 180, soal: "Berikut yang TIDAK termasuk cara menanggulangi permasalahan sosial: meningkatkan kesadaran sosial, membentuk SDM andal, meningkatkan mutu & pemerataan pendidikan, meningkatkan pemerataan pembangunan, atau membangun komunikasi yang efektif? (Sumatif)", jawaban: "Membangun komunikasi yang efektif (perkiraan, kunci tidak tersedia)", halaman: 25 },
    { id: 181, soal: "Penanganan masalah sosial tidak hanya menekankan pada dorongan terhadap perubahan, tetapi juga harus memperhatikan… (Sumatif)", jawaban: "Dampak negatif yang akan terjadi (perkiraan, kunci tidak tersedia)", halaman: 25 },
    { id: 182, soal: "Unggahan viral berisi perdebatan sengit, data tidak valid, ancaman fisik; di sisi lain tagar #PeduliSesama berhasil menggalang dana tapi dipertanyakan keabsahan donaturnya. Pernyataan yang tepat tentang pengaruh media sosial terhadap masalah sosial? (Sumatif, PG kompleks)", jawaban: "• Media sosial mempercepat penyebaran informasi, baik yang valid maupun hoaks, memicu konflik sosial dan polarisasi\n• Kemudahan berbagi konten dapat mendorong aksi sosial positif seperti penggalangan dana, namun juga berpotensi merusak reputasi dan memicu cyberbullying\n(perkiraan, kunci tidak tersedia)", halaman: 26 },
    { id: 175, soal: "Kasus sampah Desa Sukamaju (penelitian kualitatif → rekomendasi TPS & pelatihan kompos) — Benar atau Salah?\n1) Penelitian bertujuan memahami fenomena secara ilmiah dan merumuskan solusi, bukan sekadar mengumpulkan data\n2) Masalah sampah itu masalah sosial karena hanya memengaruhi sebagian kecil individu dan tidak berdampak pada lingkungan\n3) Temuan kebutuhan TPS & pelatihan kompos adalah bagian analisis data sebagai dasar rekomendasi (Sumatif)", jawaban: "1) Benar\n2) Salah (justru berdampak luas: banjir dan bau)\n3) Benar", halaman: 27 },
  ],

  // Sumber: TNT Ekonomi XI (GPP) Semester 1 — Bab 1 Pertumbuhan Ekonomi dan Kemiskinan
  "Ekonomi": [
    // ── Hal. 7 — Apersepsi ──
    { id: 1, soal: "Pertumbuhan ekonomi seperti apa yang lebih efektif dalam mengurangi kemiskinan (apersepsi Bab 1)?", jawaban: "Pertumbuhan yang disertai peningkatan kesempatan kerja, penguatan UMKM, dan akses masyarakat terhadap pendidikan serta layanan kesehatan. Sebaliknya, jika didorong sektor padat modal yang tidak banyak menyerap tenaga kerja, penurunan kemiskinan cenderung berjalan lambat", halaman: 7 },

    // ── Hal. 8 — Definisi, manfaat, tujuan & faktor pendapatan nasional ──
    { id: 2, soal: "Apa pengertian pendapatan nasional?", jawaban: "Pendapatan yang diterima oleh semua orang dalam satu negara; nilai barang dan jasa yang diproduksi masyarakat suatu negara dalam satu periode waktu tertentu. Dengan kata lain, nilai bersih dari semua kegiatan ekonomi suatu negara selama satu tahun yang diukur dengan satuan mata uang tertentu", halaman: 8 },
    { id: 3, soal: "Sebutkan hal-hal yang perlu diperhatikan dari pengertian pendapatan nasional!", jawaban: "1. Nilai total barang dan jasa akhir (untuk menghindari penghitungan berganda/double counting)\n2. Suatu perekonomian (batasan suatu negara atau penduduk dari suatu negara)\n3. Suatu periode (agar perhitungan dapat dibandingkan, umumnya selama satu tahun)", halaman: 8 },
    { id: 4, soal: "Sebutkan manfaat pendapatan nasional bagi suatu negara!", jawaban: "1. Mengetahui dan menganalisis struktur ekonomi suatu negara (industri, agraris, atau jasa)\n2. Membandingkan keadaan perekonomian dari waktu ke waktu\n3. Membandingkan perekonomian antarnegara di dunia\n4. Pedoman bagi pemerintah untuk mengambil kebijakan pembangunan ekonomi nasional", halaman: 8 },
    { id: 5, soal: "Sebutkan tujuan penghitungan pendapatan nasional!", jawaban: "1. Memperoleh taksiran nilai barang dan jasa secara akurat\n2. Mengetahui perekonomian suatu negara\n3. Membantu membuat rencana dan melaksanakan program pembangunan berjangka guna mencapai tujuan pembangunan nasional\n4. Menganalisis faktor-faktor yang memengaruhi kemajuan ekonomi suatu negara", halaman: 8 },
    { id: 6, soal: "Sebutkan faktor-faktor yang memengaruhi pendapatan nasional!", jawaban: "1. Keseluruhan permintaan dan penawaran (aggregate demand and supply)\n2. Investasi\n3. Konsumsi dan tabungan", halaman: 8 },
    { id: 7, soal: "Apa yang dimaksud aggregate demand dan aggregate supply?", jawaban: "Aggregate demand: keseluruhan permintaan masyarakat terhadap barang maupun jasa pada tingkat harga tertentu\nAggregate supply: keseluruhan penawaran barang maupun jasa yang ditawarkan produsen pada tingkat harga tertentu\nKeduanya dapat meningkatkan pendapatan nasional", halaman: 8 },
    { id: 8, soal: "Bagaimana investasi memengaruhi pendapatan nasional?", jawaban: "Investasi berdampak besar terhadap pertambahan pendapatan nasional. Peningkatan investasi dalam negeri akan meningkatkan produksi nasional, yang memengaruhi tingkat pendapatan nasional selama periode tertentu", halaman: 8 },
    { id: 9, soal: "Apa yang dimaksud konsumsi dan tabungan, dan bagaimana pengaruhnya terhadap pendapatan nasional?", jawaban: "Konsumsi: bagian pendapatan masyarakat yang digunakan untuk membeli barang dan jasa sebagai pemenuhan kebutuhan hidup\nTabungan: pendapatan masyarakat yang tidak dibelanjakan untuk konsumsi\nNaiknya konsumsi dan tabungan dapat meningkatkan pendapatan nasional", halaman: 8 },

    // ── Hal. 9 — Metode penghitungan pendapatan nasional ──
    { id: 10, soal: "Penghitungan pendapatan nasional dapat dilakukan dengan tiga pendekatan, yaitu…", jawaban: "1. Pendekatan produksi (nilai tambah)\n2. Pendekatan penerimaan (pendapatan)\n3. Pendekatan pengeluaran", halaman: 9 },
    { id: 11, soal: "Bagaimana cara menghitung pendapatan nasional dengan pendekatan penerimaan? Tuliskan rumusnya!", jawaban: "Menjumlahkan semua balas jasa yang diterima pemilik faktor-faktor produksi.\nY = r + w + i + p\nY = pendapatan nasional, r = sewa tanah, w = upah/gaji, i = pendapatan bunga, p = laba/keuntungan", halaman: 9 },
    { id: 12, soal: "Bagaimana cara menghitung pendapatan nasional dengan pendekatan pengeluaran? Tuliskan rumusnya!", jawaban: "Menjumlahkan semua pengeluaran yang dilakukan para pelaku atau rumah tangga ekonomi.\nY = C + I + G + (X − M)\nC = konsumsi, I = investasi, G = pengeluaran pemerintah, X = ekspor, M = impor", halaman: 9 },
    { id: 13, soal: "Bagaimana cara menghitung pendapatan nasional dengan pendekatan produksi? Tuliskan rumusnya!", jawaban: "Menjumlahkan nilai tambah (value added) dari seluruh faktor produksi selama satu periode tertentu.\nY = (Q₁ × P₁) + (Q₂ × P₂) + … + (Qₙ × Pₙ)\nQ = jumlah barang, P = harga barang", halaman: "9–10" },

    // ── Hal. 10 — Komponen pendapatan nasional (PDB, PNB, NNP, NNI) ──
    { id: 14, soal: "Apa pengertian Produk Domestik Bruto (PDB) atau Gross Domestic Product (GDP)?", jawaban: "Jumlah seluruh produksi barang dan jasa yang dihasilkan suatu negara selama satu tahun, termasuk yang dihasilkan orang asing dan perusahaan asing yang beroperasi di dalam negeri. Barang dan jasa dari warga negara itu yang bekerja di luar negeri (misalnya TKI/TKW) tidak termasuk", halaman: 10 },
    { id: 15, soal: "Sebutkan tiga sektor dalam komposisi lapangan usaha yang termasuk dalam perhitungan PDB!", jawaban: "1. Sektor primer: pertanian, perikanan, dan pertambangan\n2. Sektor sekunder: manufaktur, listrik, gas, air bersih, dan bangunan/konstruksi\n3. Sektor tersier: perdagangan, perbankan, dan jasa", halaman: 10 },
    { id: 16, soal: "Apa pengertian Produk Nasional Bruto (PNB) atau Gross National Product (GNP), dan bagaimana rumusnya?", jawaban: "Seluruh produk barang dan jasa yang dihasilkan masyarakat suatu negara dalam satu tahun, termasuk yang dihasilkan warga negara tersebut yang berada di luar negeri.\nRumus: PNB = PDB + pendapatan neto terhadap luar negeri (pendapatan WNI di luar negeri ditambah, pendapatan WNA di dalam negeri dikurangi)", halaman: 10 },
    { id: 17, soal: "Apa pengertian Produk Nasional Neto (NNP), dan bagaimana rumusnya?", jawaban: "Nilai pasar semua benda dan jasa yang dihasilkan dalam jangka waktu satu tahun dikurangi penyusutan untuk mengganti barang-barang modal (depreciation).\nNNP = PNB − penyusutan barang modal", halaman: 10 },
    { id: 18, soal: "Apa pengertian Pendapatan Nasional Neto (NNI), dan bagaimana rumusnya?", jawaban: "Jumlah seluruh penerimaan yang diterima masyarakat dalam periode tertentu (biasanya satu tahun), setelah dikurangi pajak tidak langsung.\nNNI = NNP − pajak tidak langsung", halaman: "10–11" },

    // ── Hal. 11 — PI, DI, pendapatan per kapita ──
    { id: 19, soal: "Apa pengertian Personal Income (PI), dan bagaimana rumusnya?", jawaban: "Semua pendapatan yang diterima oleh semua individu atau rumah tangga di suatu negara secara kolektif (tidak semua pendapatan dibagikan karena ada komponen yang ditahan).\nPI = (NNI + transfer payment + pendapatan bunga) − (iuran jaminan sosial + iuran asuransi + laba ditahan + pajak perseroan)", halaman: 11 },
    { id: 20, soal: "Apa pengertian Disposable Income (DI), dan bagaimana rumusnya?", jawaban: "Pendapatan yang siap digunakan masyarakat setelah dikurangi pajak langsung.\nDI = PI − pajak langsung", halaman: 11 },
    { id: 21, soal: "Apa yang dimaksud pajak langsung? Berikan contohnya!", jawaban: "Pajak yang pembebanannya tidak dapat dilimpahkan kepada orang lain. Contoh: pajak penghasilan (PPh)", halaman: 11 },
    { id: 22, soal: "Apa pengertian pendapatan per kapita?", jawaban: "Pendapatan rata-rata penduduk pada suatu negara di waktu tertentu", halaman: 11 },
    { id: 23, soal: "Bagaimana hubungan jumlah penduduk dan pendapatan nasional terhadap pendapatan per kapita?", jawaban: "Jumlah penduduk: berbanding terbalik (penduduk tinggi → per kapita rendah, dan sebaliknya)\nPendapatan nasional: sebanding (pendapatan nasional tinggi → per kapita besar, dan sebaliknya)", halaman: 11 },
    { id: 24, soal: "Tuliskan rumus pendapatan per kapita!", jawaban: "Pendapatan per kapita = Pendapatan nasional bruto ÷ Jumlah penduduk", halaman: 11 },
    { id: 25, soal: "Sebutkan fungsi pendapatan per kapita bagi negara!", jawaban: "1. Mencerminkan situasi ekonomi masyarakat dan negara dalam waktu tertentu\n2. Dasar pengambilan kebijakan di masa mendatang\n3. Mengetahui tingkat kemakmuran negara dan masyarakatnya\n4. Mengukur kelancaran pelaksanaan aktivitas ekonomi negara", halaman: 11 },
    { id: 26, soal: "Sebutkan manfaat menghitung pendapatan per kapita!", jawaban: "1. Memastikan kekayaan suatu daerah atau sebaliknya\n2. Dimanfaatkan pengusaha untuk menentukan daerah/wilayah sasaran pasarnya\n3. Menilai keterjangkauan harga rata-rata di daerah", halaman: 11 },

    // ── Hal. 12 — Latihan; definisi pertumbuhan ekonomi ──
    { id: 27, soal: "Diketahui: laba pengusaha Rp75 triliun, bunga modal Rp35 triliun, sewa tanah Rp40 triliun, upah tenaga kerja Rp150 triliun. Berapa pendapatan nasional dengan metode pendapatan? (Mari Berlatih)", jawaban: "Y = r + w + i + p\nY = 40 + 150 + 35 + 75 = Rp300 triliun", halaman: 12 },
    { id: 28, soal: "Tahun 2025, negara X: GNP Rp600 triliun, penduduk 150 juta jiwa. Negara Y: GNP Rp400 triliun, penduduk 80 juta jiwa. Negara mana yang lebih sejahtera? (Mari Berlatih)", jawaban: "Pendapatan per kapita X = 600 triliun ÷ 150 juta = Rp4.000.000\nPendapatan per kapita Y = 400 triliun ÷ 80 juta = Rp5.000.000\nJadi negara Y lebih sejahtera", halaman: 12 },
    { id: 29, soal: "Apa yang digambarkan pertumbuhan ekonomi dalam analisis ekonomi makro, dan mengapa analisisnya penting?", jawaban: "Menggambarkan perubahan positif dalam kinerja perekonomian suatu negara selama periode tertentu. Penting karena menjadi dasar penilaian kondisi ekonomi suatu negara, termasuk kemampuan menciptakan lapangan kerja dan meningkatkan taraf hidup masyarakat", halaman: 12 },
    { id: 30, soal: "Pertumbuhan menunjukkan perubahan apa, dan apa maksud 'kematangan' di dalamnya?", jawaban: "Perubahan secara kuantitatif: jika output perekonomian makin bertambah dari waktu ke waktu, telah terjadi pertumbuhan. Pertumbuhan juga menunjukkan perubahan ke arah kematangan, yaitu perubahan kualitatif seperti sikap, kelembagaan, dan perubahan struktural yang saling terkait dan saling memengaruhi", halaman: 12 },
    { id: 31, soal: "Apa pengertian pertumbuhan ekonomi menurut Schumpeter?", jawaban: "Peningkatan output masyarakat yang disebabkan semakin banyaknya jumlah faktor produksi yang digunakan dalam proses produksi tanpa perubahan teknologi produksi itu sendiri", halaman: 12 },
    { id: 32, soal: "Apa pengertian pertumbuhan ekonomi menurut Simon Kuznets?", jawaban: "Kenaikan kapasitas dalam jangka panjang dari negara yang bersangkutan untuk menyediakan berbagai barang ekonomi bagi penduduknya", halaman: 12 },
    { id: 33, soal: "Jadi, apa pengertian pertumbuhan ekonomi (economic growth)?", jawaban: "Perkembangan kegiatan dalam perekonomian yang menyebabkan barang dan jasa yang diproduksi dalam masyarakat bertambah dan kemakmuran masyarakat meningkat dalam jangka panjang", halaman: 12 },

    // ── Hal. 13 — Teori pertumbuhan ekonomi; faktor barang modal ──
    { id: 34, soal: "Perkembangan pertumbuhan ekonomi ditandai dengan apa?", jawaban: "Kenaikan GDP (Gross Domestic Product) suatu negara, tanpa memandang kenaikan itu lebih besar atau lebih kecil dari pertumbuhan penduduk, dan tanpa memandang apakah ada perubahan dalam struktur perekonomian atau tidak", halaman: 13 },
    { id: 35, soal: "Apakah pertumbuhan ekonomi (economic growth) sama dengan pembangunan ekonomi (economic development)?", jawaban: "Tidak. Keduanya memiliki arti yang berbeda, walaupun sama-sama menjelaskan tentang perkembangan ekonomi suatu negara", halaman: 13 },
    { id: 36, soal: "Sebutkan teori-teori pertumbuhan ekonomi!", jawaban: "1. Teori jumlah penduduk optimal\n2. Teori Schumpeter\n3. Teori pertumbuhan neo-klasik\n4. Teori Harrod-Domar", halaman: 13 },
    { id: 37, soal: "Jelaskan teori jumlah penduduk optimal! Apa yang harus dilakukan agar penambahan tenaga kerja dapat meningkatkan output?", jawaban: "Berlakunya the law of diminishing returns menyebabkan tidak semua penduduk dapat dilibatkan dalam proses produksi; jika dipaksakan akan menurunkan output. Agar penambahan tenaga kerja dapat meningkatkan output, harus dilakukan investasi barang modal dan sumber daya manusia yang menunda terjadinya gejala the law of diminishing returns", halaman: 13 },
    { id: 38, soal: "Menurut teori Schumpeter, pertumbuhan ekonomi disebabkan oleh apa?", jawaban: "Inovasi dan pengusaha. Inovasi berarti perbaikan teknologi dalam arti luas, misalnya penemuan produk baru dan pembukaan pasar baru. Inovasi menyangkut perbaikan kuantitatif dari sistem ekonomi yang bersumber dari kreativitas para wirausahanya", halaman: 13 },
    { id: 39, soal: "Apa fokus pembahasan teori pertumbuhan neo-klasik?", jawaban: "Akumulasi stok barang modal dan keterkaitannya dengan keputusan masyarakat untuk menabung atau melakukan investasi", halaman: 13 },
    { id: 40, soal: "Sebutkan asumsi-asumsi teori pertumbuhan neo-klasik!", jawaban: "1. Tingkat teknologi dianggap konstan (tidak ada kemajuan teknologi)\n2. Tingkat depresiasi dianggap konstan\n3. Tidak ada perdagangan luar negeri atau aliran keluar masuk barang modal\n4. Tidak ada sektor pemerintah\n5. Tingkat pertambahan penduduk (tenaga kerja) juga dianggap konstan", halaman: 13 },
    { id: 41, soal: "Siapa yang mengembangkan teori Harrod-Domar, dan apa pokok pandangannya?", jawaban: "Dikembangkan secara terpisah dalam periode yang bersamaan oleh E. S. Domar dan R. F. Harrod. Keduanya melihat pentingnya investasi terhadap pertumbuhan ekonomi, sebab investasi meningkatkan stok barang modal yang memungkinkan peningkatan output. Sumber dana domestik untuk investasi berasal dari bagian produksi (pendapatan nasional) yang ditabung", halaman: 13 },
    { id: 42, soal: "Sebutkan asumsi yang digunakan dalam teori Harrod-Domar!", jawaban: "1. Semua barang modal dalam perekonomian sudah sepenuhnya digunakan\n2. Perekonomian hanya terdiri atas dua sektor, yaitu rumah tangga dan perusahaan\n3. Tabungan rumah tangga sebanding dengan pendapatan nasional (fungsi tabungan dimulai dari titik nol)\n4. Rasio modal produksi (Capital Output Ratio/COR), yaitu perbandingan pertambahan modal dan pertambahan produksi, adalah tetap", halaman: 13 },
    { id: 43, soal: "Sebutkan faktor-faktor yang memengaruhi pertumbuhan ekonomi!", jawaban: "1. Barang modal\n2. Tenaga kerja\n3. Teknologi\n4. Uang\n5. Manajemen\n6. Kewirausahaan (entrepreneurship)\n7. Informasi", halaman: "13–14" },
    { id: 44, soal: "Bagaimana barang modal memengaruhi pertumbuhan ekonomi?", jawaban: "Stok barang modal harus ditambah melalui investasi. Pertumbuhan baru dimungkinkan jika investasi neto lebih besar dari nol; jika sama dengan nol, perekonomian hanya dapat berproduksi pada tingkat sebelumnya", halaman: 13 },

    // ── Hal. 14 — Faktor pertumbuhan lainnya; pengukuran pertumbuhan ekonomi ──
    { id: 45, soal: "Bagaimana tenaga kerja dan teknologi memengaruhi pertumbuhan ekonomi?", jawaban: "Tenaga kerja: di negara sedang berkembang masih merupakan faktor produksi yang sangat dominan; penambahan tenaga kerja umumnya sangat berpengaruh terhadap peningkatan output\nTeknologi: penggunaan teknologi yang semakin tinggi sangat memacu pertumbuhan ekonomi, jika hanya dilihat dari peningkatan output", halaman: 14 },
    { id: 46, soal: "Bagaimana uang memengaruhi pertumbuhan ekonomi?", jawaban: "Dalam perekonomian modern, uang memegang peranan dan fungsi sentral. Semakin banyak uang yang digunakan dalam proses produksi, makin besar output. Tetapi dengan jumlah uang yang sama, dapat dihasilkan output lebih besar jika penggunaannya efisien", halaman: 14 },
    { id: 47, soal: "Bagaimana manajemen memengaruhi pertumbuhan ekonomi?", jawaban: "Manajemen adalah peralatan yang sangat dibutuhkan untuk mengelola perekonomian modern, terutama yang mengandalkan mekanisme pasar. Perekonomian yang tidak terlalu mengandalkan teknologi tinggi, namun dengan manajemen yang baik, mampu mempertahankan tingkat pertumbuhan ekonomi yang tinggi", halaman: 14 },
    { id: 48, soal: "Bagaimana kewirausahaan dan informasi memengaruhi pertumbuhan ekonomi?", jawaban: "Kewirausahaan: pengusaha memiliki perkiraan matang bahwa input yang dikombinasikan akan menghasilkan barang/jasa yang dibutuhkan masyarakat; kemampuan mengombinasikan input disebut kemampuan inovasi\nInformasi: syarat pasar berfungsi efisien adalah informasi yang sempurna dan seimbang; semakin banyak, benar, dan seimbang arus informasi, pelaku ekonomi dapat mengambil keputusan lebih cepat dan lebih baik", halaman: 14 },
    { id: 49, soal: "Untuk mengukur pertumbuhan ekonomi, nilai PDB apa yang digunakan, dan mengapa?", jawaban: "PDB berdasarkan harga konstan (PDB riil), sehingga angka pertumbuhan yang dihasilkan merupakan pertumbuhan riil yang terjadi karena tambahan produksi, bukan karena pengaruh perubahan harga", halaman: 14 },
    { id: 50, soal: "Apa tujuan utama penghitungan pertumbuhan ekonomi, dan dari mana ukuran baik/buruknya dilihat?", jawaban: "Melihat apakah kondisi perekonomian semakin membaik. Ukuran baik atau buruk dapat dilihat dari struktur produksi maupun dari sisi pengeluaran. Dari struktur produksi dapat diketahui apakah ada sektor yang terlalu tinggi atau terlalu lambat pertumbuhannya", halaman: 14 },
    { id: 51, soal: "Tuliskan rumus tingkat pertumbuhan ekonomi jika selang waktunya hanya satu periode!", jawaban: "Gₜ = (PDBₜ − PDBₜ₋₁) ÷ PDBₜ₋₁ × 100%\nGₜ = pertumbuhan ekonomi periode t (triwulanan/tahunan)\nPDBₜ = PDB periode t (harga konstan)\nPDBₜ₋₁ = PDB satu periode sebelumnya", halaman: 14 },
    { id: 52, soal: "Berdasarkan data PDB Indonesia (2023: 1.579,6; 2024: 1.656,8; 2025: 1.749,5 triliun rupiah), berapa tingkat pertumbuhan ekonomi 2024, 2025, dan rata-ratanya?", jawaban: "2024: (1.656,8 − 1.579,6) ÷ 1.579,6 × 100% = 4,9%\n2025: (1.749,5 − 1.656,8) ÷ 1.656,8 × 100% = 5,6%\nRata-rata 2023–2025: 5,25% per tahun", halaman: "14–15" },

    // ── Hal. 15 — Rumus multi-periode; latihan; kesenjangan ekonomi ──
    { id: 53, soal: "Tuliskan persamaan pertumbuhan ekonomi jika interval waktunya lebih dari satu periode!", jawaban: "PDBₜ = PDB₀ (1 + r)ᵗ\nPDBₜ = PDB periode t\nPDB₀ = PDB periode awal\nr = tingkat pertumbuhan\nt = jarak periode", halaman: 15 },
    { id: 54, soal: "PDB negara Y tahun 2024 sebesar Rp75 triliun, tahun 2025 meningkat menjadi Rp81 triliun. Berapa tingkat pertumbuhan ekonomi negara Y? (Mari Berlatih)", jawaban: "G = (81 − 75) ÷ 75 × 100% = 8%", halaman: 15 },
    { id: 55, soal: "Mengapa ketimpangan distribusi pendapatan menjadi masalah serius di Indonesia?", jawaban: "Meskipun pertumbuhan ekonomi terus meningkat, hasil pembangunan belum dirasakan merata oleh seluruh lapisan masyarakat. Sebagian menikmati pendapatan tinggi serta akses baik ke pendidikan dan kesehatan, sementara sebagian lain masih hidup dengan pendapatan rendah dan fasilitas terbatas", halaman: 15 },
    { id: 56, soal: "Kesenjangan ekonomi tidak hanya berkaitan dengan perbedaan pendapatan, tetapi juga dengan…", jawaban: "Ketidakmerataan kesempatan dan kualitas hidup masyarakat", halaman: 15 },
    { id: 57, soal: "Bagaimana upaya pemerintah untuk mengurangi kesenjangan ekonomi?", jawaban: "Pemerataan pembangunan infrastruktur, peningkatan akses pendidikan dan kesehatan, serta penciptaan lapangan kerja yang merata di berbagai daerah", halaman: 15 },

    // ── Hal. 16 — Pengertian & penyebab kesenjangan ekonomi ──
    { id: 58, soal: "Kesenjangan ekonomi (kesenjangan pendapatan) mengacu pada apa?", jawaban: "Persebaran ukuran ekonomi di antara individu dalam kelompok, kelompok dalam populasi, atau antarnegara", halaman: 16 },
    { id: 59, soal: "Apa pengertian kesenjangan ekonomi menurut Max Weber?", jawaban: "Salah satu tindakan sosial akan menilai ketimpangan sosial sebagai hasil dari perbedaan kepentingan masing-masing individu yang diekspresikan dalam sistem perilaku dan tindakan", halaman: 16 },
    { id: 60, soal: "Apa pengertian kesenjangan ekonomi menurut Robert Chambers?", jawaban: "Suatu gejala yang timbul dalam masyarakat karena adanya perbedaan batas kemampuan finansial dan yang lainnya di antara masyarakat yang hidup di suatu wilayah tertentu", halaman: 16 },
    { id: 61, soal: "Jadi, apa pengertian kesenjangan ekonomi, dan apa tiga ukurannya menurut para ekonom?", jawaban: "Kondisi tidak seimbang yang terjadi di masyarakat berdasarkan aspek ekonomi, terlihat dari tidak seimbangnya pendapatan masyarakat. Tiga ukurannya: kekayaan, pendapatan, dan konsumsi", halaman: 16 },
    { id: 62, soal: "Sebutkan faktor yang memengaruhi kesenjangan ekonomi!", jawaban: "1. Pendapatan yang tidak merata\n2. Kondisi demografi\n3. Kurangnya lapangan kerja\n4. Pembangunan yang tidak merata\n5. Kondisi pendidikan", halaman: "16–17" },
    { id: 63, soal: "Bagaimana pendapatan yang tidak merata menyebabkan kesenjangan ekonomi?", jawaban: "Tingkat pendapatan antardaerah berbeda, misalnya upah perdesaan dan perkotaan tidak sama. Masyarakat perkotaan/industri berkesempatan mendapat upah lebih tinggi dibanding perdesaan. Pendapatan tinggi memudahkan pemenuhan kebutuhan, sedangkan pendapatan rendah menyulitkan", halaman: 16 },
    { id: 64, soal: "Bagaimana kondisi demografi memengaruhi kesenjangan ekonomi? Berikan contohnya!", jawaban: "Kondisi dan komposisi penduduk (jumlah penduduk usia produktif) tiap daerah berbeda. Contoh: banyak masyarakat merantau ke Pulau Jawa karena dianggap memberi peluang kerja layak, sehingga persebaran penduduk cenderung terpusat di Pulau Jawa", halaman: 16 },
    { id: 65, soal: "Sebutkan penyebab tingginya angka pengangguran!", jawaban: "1. Jumlah angkatan kerja terlalu tinggi di satu wilayah, sedangkan lapangan kerja yang tersedia sangat minim\n2. Rendahnya kualitas sumber daya manusia (lapangan kerja tersedia, tetapi tidak ada SDM yang memenuhi kompetensi)", halaman: 16 },
    { id: 66, soal: "Bagaimana kurangnya lapangan kerja memengaruhi kesenjangan ekonomi?", jawaban: "Ketidaksesuaian jumlah lapangan kerja dengan peminatnya menyebabkan masalah ekonomi; sempitnya lapangan kerja memunculkan pengangguran. Jika suatu daerah tidak mampu menciptakan lapangan kerja, kesenjangan ekonomi semakin besar", halaman: 16 },

    // ── Hal. 17 — Pembangunan, pendidikan; ketimpangan pendapatan ──
    { id: 67, soal: "Bagaimana pembangunan yang tidak merata menimbulkan kesenjangan ekonomi?", jawaban: "Pembangunan infrastruktur yang merata membuat masyarakat di setiap wilayah dapat berkegiatan ekonomi dengan efisien. Jika tidak merata, rendahnya kemampuan pelaku ekonomi mengakibatkan rendahnya pendapatan, memicu ketidakmampuan memenuhi kebutuhan, sehingga timbul kesenjangan ekonomi", halaman: 17 },
    { id: 68, soal: "Bagaimana kondisi pendidikan memengaruhi kesenjangan ekonomi?", jawaban: "Pendidikan adalah elevator untuk meningkatkan kualitas hidup. Kualitas pendidikan tiap daerah berbeda karena perbedaan fasilitas dan mutu, sehingga menghasilkan perbedaan kualitas SDM. SDM berkualitas menjadi modal menghasilkan standar ekonomi yang tinggi", halaman: 17 },
    { id: 69, soal: "Apa pengertian ketimpangan pendapatan?", jawaban: "Perbedaan pendapatan yang dihasilkan masyarakat sehingga terjadi perbedaan pendapatan yang mencolok dalam masyarakat", halaman: 17 },
    { id: 70, soal: "Bagaimana tingkat ketimpangan pendapatan di negara berkembang dibanding negara maju?", jawaban: "Di negara berkembang, ketimpangan lebih besar terjadi di negara yang baru memulai pembangunannya. Di negara maju atau berpendapatan lebih tinggi, pendapatan cenderung lebih merata atau tingkat ketimpangannya rendah", halaman: 17 },
    { id: 71, soal: "Menurut Sukirno, ada dua konsep pengukuran ketimpangan pendapatan. Jelaskan!", jawaban: "1. Ketimpangan absolut: konsep pengukuran ketimpangan yang menggunakan parameter dengan suatu nilai mutlak\n2. Ketimpangan relatif: konsep pengukuran ketimpangan distribusi pendapatan yang membandingkan pendapatan seseorang/sekelompok anggota masyarakat dengan total pendapatan masyarakat secara keseluruhan", halaman: 17 },
    { id: 72, soal: "Mengapa ketimpangan pendapatan menjadi dimensi penting untuk mengukur kesejahteraan negara menurut Bank Dunia?", jawaban: "Karena implikasinya pada kemampuan untuk mengurangi kemiskinan", halaman: 17 },
    { id: 73, soal: "Menurut Hajiji (2010), ketimpangan pendapatan ditentukan oleh apa?", jawaban: "Tingkat pembangunan suatu negara, heterogenitas etnis, serta adanya kediktatoran dan pemerintahan yang gagal di suatu negara", halaman: 17 },
    { id: 74, soal: "Sebutkan delapan faktor penyebab ketimpangan pendapatan menurut Arsyad (2010)!", jawaban: "1. Pertumbuhan penduduk yang tinggi → pendapatan per kapita menurun\n2. Ketidakmerataan pembangunan antardaerah\n3. Investasi sangat banyak dalam proyek padat modal (capital intensive), sehingga pengangguran bertambah\n4. Inflasi (pendapatan uang bertambah tanpa diikuti pertambahan produksi secara proporsional)\n5. Rendahnya mobilitas sosial\n6. Kebijakan industri substitusi impor yang menaikkan harga barang industri untuk melindungi golongan kapitalis\n7. Memburuknya nilai tukar (term of trade) negara sedang berkembang terhadap negara maju\n8. Hancurnya industri kerajinan rakyat (pertukangan, industri rumah tangga, dll.)", halaman: "17–18" },

    // ── Hal. 18 — Distribusi pendapatan; koefisien Gini ──
    { id: 75, soal: "Apa pengertian distribusi pendapatan?", jawaban: "Suatu ukuran yang digunakan untuk melihat penyebaran pendapatan ataupun pemerataan hasil pembangunan di suatu daerah ataupun negara", halaman: 18 },
    { id: 76, soal: "Sebutkan tujuan penerapan konsep distribusi pendapatan!", jawaban: "1. Memberikan hak dan keadilan bagi setiap warga negara untuk menikmati fasilitas yang sama dan setara\n2. Meningkatkan taraf hidup masyarakat sehingga dapat membangun kesejahteraan umum\n3. Menumbuhkan rasa solidaritas dan sosial yang tinggi antarmasyarakat, seperti penyaluran bantuan\n4. Menurunkan risiko kriminalitas (perampokan, penipuan, pencucian uang) karena setiap orang mampu memenuhi kebutuhannya", halaman: 18 },
    { id: 77, soal: "Sebutkan faktor-faktor yang memengaruhi distribusi pendapatan!", jawaban: "1. Perubahan perdagangan internasional dan perpindahan pekerjaan ke negara dengan biaya tenaga kerja lebih rendah\n2. Otomatisasi dan inovasi yang mengubah struktur pekerjaan dan memengaruhi pendapatan\n3. Diskriminasi yang berujung pada perbedaan pendapatan antara gender dan ras\n4. Tingkat pendidikan yang lebih tinggi sering dikaitkan dengan pendapatan yang lebih tinggi", halaman: 18 },
    { id: 78, soal: "Sebutkan indikator untuk mengetahui ketimpangan distribusi pendapatan!", jawaban: "Koefisien Gini dan kurva Lorenz", halaman: 18 },
    { id: 79, soal: "Apa itu koefisien Gini, dan bagaimana membaca nilainya?", jawaban: "Koefisien atau angka untuk menunjukkan tingkat ketimpangan distribusi pendapatan, bernilai 0 sampai 1.\n0 = distribusi pendapatan merata sempurna\n1 = tidak merata secara sempurna (hanya satu pihak yang menerima seluruh pendapatan nasional)", halaman: 18 },
    { id: 80, soal: "Sebutkan manfaat koefisien (indeks) Gini!", jawaban: "1. Mengukur tingkat ketidakmerataan distribusi pendapatan penduduk di berbagai sektor dan negara\n2. Menunjukkan perubahan distribusi pendapatan suatu negara selama periode tertentu (peningkatan atau penurunan ketimpangan)\n3. Menunjukkan ketidaksetaraan melalui alat analisis rasio seperti pendapatan per kapita dan produk domestik bruto", halaman: 18 },

    // ── Hal. 19 — Kurva Lorenz, klasifikasi Bank Dunia, dampak & upaya kesenjangan ──
    { id: 81, soal: "Apa pengertian kurva Lorenz?", jawaban: "Kurva yang menunjukkan hubungan antara persentase pendapatan dengan persentase penerima pendapatan selama kurun waktu tertentu (biasanya diukur dalam waktu setahun)", halaman: 19 },
    { id: 82, soal: "Bagaimana membaca kurva Lorenz?", jawaban: "Kurva terletak di bujur sangkar: sisi tegak = persentase kumulatif pendapatan nasional, sisi dasar = persentase kumulatif penduduk.\nSemakin dekat ke diagonal (garis kemerataan sempurna/semakin lurus) → distribusi pendapatan semakin merata\nSemakin jauh dari diagonal (semakin lengkung) → distribusi semakin timpang atau tidak merata", halaman: 19 },
    { id: 83, soal: "Bagaimana Bank Dunia mengukur ketimpangan pendapatan, dan apa tiga klasifikasinya?", jawaban: "Dengan menghitung persentase jumlah pendapatan kelompok berpendapatan rendah dibanding total pendapatan penduduk:\n1. Ketimpangan tinggi: 40% penduduk berpendapatan rendah menerima < 12% total pendapatan\n2. Ketimpangan sedang: menerima 12%–17%\n3. Ketimpangan rendah: menerima > 17%", halaman: 19 },
    { id: 84, soal: "Bagaimana dampak kesenjangan ekonomi secara ekonomi dan secara sosial?", jawaban: "Secara ekonomi: menghambat pertumbuhan karena mengurangi daya beli sebagian masyarakat\nSecara sosial: memicu konflik, menurunkan kepercayaan sosial, dan melemahkan solidaritas komunitas", halaman: 19 },
    { id: 85, soal: "Sebutkan dampak kesenjangan ekonomi!", jawaban: "1. Meningkatnya angka pengangguran dan kemiskinan\n2. Meningkatnya angka kriminalitas\n3. Target pasar yang tidak menentu\n4. Susah mencari karyawan yang berkualitas, karena latar belakang pendidikan", halaman: 19 },
    { id: 86, soal: "Upaya mengurangi kesenjangan ekonomi melibatkan reformasi struktural seperti apa?", jawaban: "Penguatan sistem perpajakan, peningkatan akses terhadap pendidikan, dan kebijakan yang mendukung pemerataan kesempatan ekonomi", halaman: 19 },
    { id: 87, soal: "Sebutkan upaya mengatasi kesenjangan ekonomi!", jawaban: "1. Menjadikan pendidikan sebagai prioritas\n2. Akses terhadap kesempatan ekonomi\n3. Menyediakan infrastruktur yang memadai\n4. Memperbanyak jumlah lapangan kerja\n5. Subsidi\n6. Menerapkan kebijakan fiskal\n(Upaya ini bukan hanya tugas pemerintah, tetapi juga masyarakat)", halaman: "19–20" },
    { id: 88, soal: "Mengapa menjadikan pendidikan sebagai prioritas dapat mengatasi kesenjangan ekonomi?", jawaban: "Karena salah satu penyebab kesenjangan adalah pendidikan yang tidak merata, maka solusinya meningkatkan kualitas pendidikan yang merata. Pendidikan merupakan faktor penting untuk memperkuat fondasi perekonomian", halaman: 19 },

    // ── Hal. 20 — Upaya lanjutan; latihan ──
    { id: 89, soal: "Bagaimana akses terhadap kesempatan ekonomi dapat mengatasi kesenjangan?", jawaban: "Mendorong akses lebih merata terhadap peluang ekonomi seperti kredit, pinjaman usaha kecil, dan akses pasar bagi kelompok kurang mampu, melalui program bantuan dan insentif bagi usaha kecil dan mikro", halaman: 20 },
    { id: 90, soal: "Bagaimana penyediaan infrastruktur yang memadai dapat mengurangi kesenjangan? Berikan contohnya!", jawaban: "Infrastruktur yang tidak merata menyebabkan lambatnya pengiriman barang sehingga biaya produksi naik. Contoh: pembangunan pelabuhan, sehingga kegiatan mengirim dan menerima barang dapat dilakukan dengan cepat", halaman: 20 },
    { id: 91, soal: "Bagaimana memperbanyak lapangan kerja dan subsidi dapat mengatasi kesenjangan?", jawaban: "Lapangan kerja: sumber pendapatan utama masyarakat; lapangan kerja yang luas dapat menekan kesenjangan secara efektif\nSubsidi: bantuan langsung maupun bantuan modal/alat dari pemerintah agar masyarakat dapat meningkatkan kegiatan ekonominya, sehingga mendorong pendapatan daerah dan mengatasi kesenjangan", halaman: 20 },
    { id: 92, soal: "Apa pengertian kebijakan fiskal, dan apa tujuannya dalam mengatasi kesenjangan?", jawaban: "Kebijakan ekonomi untuk mengarahkan kondisi perekonomian menjadi lebih baik dengan jalan mengubah penerimaan dan pengeluaran pemerintah. Tujuannya mengatasi tingkat pengangguran dan mencapai tingkat pekerjaan yang tinggi", halaman: 20 },

    // ── Hal. 21 — Kemiskinan: kondisi, definisi, jenis ──
    { id: 93, soal: "Kemiskinan di suatu negara ditandai dengan kondisi seperti apa?", jawaban: "Sebagian penduduk tidak mampu memenuhi kebutuhan dasar hidupnya, seperti sandang, pangan, papan, pendidikan, dan layanan kesehatan yang layak", halaman: 21 },
    { id: 94, soal: "Kondisi kemiskinan umumnya dipengaruhi oleh apa, dan apa dampaknya jika dibiarkan?", jawaban: "Dipengaruhi keterbatasan lapangan pekerjaan yang layak, rendahnya pendapatan masyarakat, serta ketimpangan pembangunan antarwilayah. Jika dibiarkan: rendahnya kualitas SDM, meningkatnya masalah sosial, hingga terhambatnya pertumbuhan ekonomi nasional", halaman: 21 },
    { id: 95, soal: "Apa pengertian kemiskinan menurut Gillin?", jawaban: "Kondisi ketika seorang individu tidak dapat mempertahankan skala hidupnya yang cukup tinggi untuk memberikan efisiensi fisik serta mental, agar memungkinkan dirinya dan keluarganya menjalankan fungsi sebagaimana mestinya sesuai standar masyarakat yang baik", halaman: 21 },
    { id: 96, soal: "Apa pengertian kemiskinan menurut Giovanni (2018)?", jawaban: "Ketidakmampuan dalam memenuhi kebutuhan manusia yang beraneka ragam yang selanjutnya dapat dipandang melalui berbagai aspek", halaman: 21 },
    { id: 97, soal: "Sebutkan tiga karakteristik umum kemiskinan di Indonesia!", jawaban: "1. Sebagian besar rumah tangga berada di garis kemiskinan nasional, sehingga banyak individu rentan terhadap kemiskinan\n2. Kemiskinan tidak diukur berdasarkan garis kemiskinan yang sebenarnya, tetapi berdasarkan pendapatan\n3. Memiliki perbedaan dan luas wilayah yang signifikan", halaman: 21 },
    { id: 98, soal: "Menurut Ali Khomsan dkk, sebutkan jenis-jenis kemiskinan!", jawaban: "1. Kemiskinan absolut\n2. Kemiskinan relatif\n3. Kemiskinan kultural\n4. Kemiskinan struktural", halaman: "21–22" },
    { id: 99, soal: "Apa pengertian kemiskinan absolut (menurut Ali Khomsan dkk)?", jawaban: "Kemiskinan yang mendeskripsikan individu yang tingkat pendapatannya di bawah garis kemiskinan yang ditetapkan negara, atau keadaan individu yang penghasilannya tidak cukup untuk memenuhi kebutuhan primernya", halaman: 21 },
    { id: 100, soal: "Apa pengertian kemiskinan relatif (menurut Ali Khomsan dkk)?", jawaban: "Kemiskinan akibat kebijakan pembangunan yang belum merata sehingga belum menjangkau seluruh masyarakat. Penduduk yang sudah di atas garis kemiskinan tetap terlihat miskin karena rata-rata pendapatan penduduk daerahnya lebih tinggi. Bisa juga diartikan kemiskinan dari perbandingan antara penduduk dan lingkungannya (misalnya stigma A lebih miskin dari B karena pendapatan B lebih tinggi)", halaman: "21–22" },

    // ── Hal. 22 — Kemiskinan kultural & struktural; faktor penyebab ──
    { id: 101, soal: "Apa pengertian kemiskinan kultural? Berikan contohnya!", jawaban: "Kemiskinan yang terbentuk karena kebiasaan masyarakat yang sudah menjadi budaya (nilai, pemikiran, maupun cara kerja). Contoh: malas, etos kerja rendah, mudah menyerah pada nasib, budaya KKN, menolak kemajuan iptek, ketergantungan bantuan, perilaku konsumtif berlebihan, mencuri, memilih jalan pintas, tidak mandiri", halaman: 22 },
    { id: 102, soal: "Apa pengertian kemiskinan struktural?", jawaban: "Kemiskinan yang berasal dari struktur sosial yang tersemat pada golongan masyarakat tertentu dan memungkinkan terjadinya kondisi di mana mereka tidak dapat menggunakan sumber daya yang sebenarnya tersedia untuk mereka", halaman: 22 },
    { id: 103, soal: "Sebutkan contoh kemiskinan struktural!", jawaban: "1. Daerah dengan SDA melimpah, tetapi masyarakatnya tidak dapat menikmati kekayaan tersebut\n2. Penggusuran/pembersihan lahan oleh pemerintah sehingga masyarakat kehilangan tempat tinggal dan pekerjaan\n3. Masyarakat kehilangan pekerjaan karena SDA daerahnya dikuasai investor asing yang memakai tenaga kerja asing\n4. Negara miskin karena tidak mampu membayar utang luar negeri", halaman: 22 },
    { id: 104, soal: "Sebutkan faktor penyebab terjadinya kemiskinan!", jawaban: "1. Laju pertumbuhan penduduk yang tinggi\n2. Meningkatnya pengangguran\n3. Pendidikan yang rendah\n4. Terjadinya bencana alam\n5. Distribusi pendapatan yang tidak merata", halaman: "22–23" },
    { id: 105, soal: "Bagaimana laju pertumbuhan penduduk yang tinggi dan meningkatnya pengangguran menyebabkan kemiskinan?", jawaban: "Angka kelahiran tinggi membuat laju pertumbuhan penduduk lebih besar, sehingga lapangan pekerjaan terbatas. Jika laju pertumbuhan penduduk tidak sebanding dengan laju pertumbuhan ekonomi, kemiskinan meningkat. Lapangan kerja terbatas membuat pengangguran naik; semakin banyak yang menganggur, angka kemiskinan ikut meningkat", halaman: 22 },
    { id: 106, soal: "Bagaimana pendidikan yang rendah dan bencana alam menyebabkan kemiskinan?", jawaban: "Pendidikan rendah: tidak memiliki keterampilan, wawasan, dan pengetahuan memadai, sehingga kalah bersaing di dunia kerja/usaha, pengangguran dan kemiskinan bertambah\nBencana alam (banjir, tanah longsor, tsunami): merusak infrastruktur, menurunkan psikologi masyarakat, dan membuat masyarakat kehilangan harta bendanya", halaman: "22–23" },

    // ── Hal. 23 — Penyebab menurut ahli, dampak, upaya penanggulangan ──
    { id: 107, soal: "Bagaimana distribusi pendapatan yang tidak merata menyebabkan kemiskinan?", jawaban: "Menyebabkan ketimpangan pada pola kepemilikan sumber daya. Masyarakat yang memiliki sumber daya terbatas serta rendah umumnya berada di bawah garis kemiskinan", halaman: 23 },
    { id: 108, soal: "Apa penyebab kemiskinan menurut Henry George, Karl Marx, dan Robert Malthus?", jawaban: "Henry George: kepemilikan pribadi serta monopoli individu atas tanah\nKarl Marx: eksploitasi para pekerja oleh kaum kapitalisme\nRobert Malthus: jumlah penduduk meningkat menurut deret ukur, sedangkan produksi bahan makanan hanya meningkat menurut deret hitung", halaman: 23 },
    { id: 109, soal: "Sebutkan dampak yang ditimbulkan dari kemiskinan!", jawaban: "1. Meningkatnya kriminalitas di suatu daerah (penipuan, pencurian, perampokan, pembunuhan) karena masyarakat ingin memenuhi kebutuhan pokok dengan segala upaya\n2. Akses pendidikan tertutup (biaya pendidikan tinggi sehingga kemiskinan makin parah)\n3. Meningkatnya angka pengangguran (sulit bersaing mendapat pekerjaan)\n4. Munculnya berbagai konflik di masyarakat (perlakuan berbeda memicu kecemburuan)", halaman: 23 },
    { id: 110, soal: "Sebutkan upaya penanggulangan kemiskinan!", jawaban: "1. Pembaharuan data penduduk\n2. Integrasi penyaluran bantuan sosial\n3. Mengurangi beban pengeluaran masyarakat miskin dan hampir miskin\n4. Insentif di bidang pertanian, peternakan, dan perikanan\n5. Mengelola APBN dengan cermat", halaman: "23–24" },
    { id: 111, soal: "Apa tujuan pembaharuan data penduduk dalam menanggulangi kemiskinan?", jawaban: "Melengkapi data penduduk miskin maupun rentan miskin yang dikategorikan pantas menerima bantuan sosial, sehingga dana bantuan sosial dapat disalurkan tepat kepada masyarakat yang benar-benar membutuhkan", halaman: 23 },

    // ── Hal. 24 — Upaya penanggulangan kemiskinan lanjutan ──
    { id: 112, soal: "Mengapa diperlukan integrasi penyaluran bantuan sosial, dan bagaimana caranya?", jawaban: "Perbedaan bentuk bansos antardaerah menimbulkan ketegangan sosial, diperparah basis data DTKS (Data Terpadu Kesejahteraan Sosial) yang belum mencakup masyarakat yang tidak terdata. Caranya: update data dan integrasi penyaluran bansos melalui kerja sama antarbank pemerintah, agar dana langsung diterima penerima, pembagian lebih mudah, dan tidak tumpang tindih", halaman: "23–24" },
    { id: 113, soal: "Empat biaya yang dikontrol pemerintah dan dapat dikurangi untuk meringankan beban masyarakat miskin dan hampir miskin adalah…", jawaban: "Tarif air untuk rumah tangga, tarif listrik, harga LPG, dan harga BBM", halaman: 24 },
    { id: 114, soal: "Bagaimana insentif di bidang pertanian, peternakan, dan perikanan dapat menanggulangi kemiskinan?", jawaban: "Pemerintah meningkatkan insentif bagi petani, peternak, dan nelayan melalui skema pembelian produk oleh pemerintah serta memperbaiki jalur logistik, sehingga produksi meningkat. Hal ini mengamankan ketersediaan stok pangan nasional, menekan kenaikan harga pokok, sehingga masyarakat hampir miskin tetap dapat memenuhi kebutuhan pokok", halaman: 24 },
    { id: 115, soal: "Bagaimana upaya pemerintah menanggulangi kemiskinan dengan mengelola APBN secara cermat?", jawaban: "APBN dikelola cermat agar anggaran bantuan sosial bagi masyarakat menengah ke bawah dan hampir miskin dapat ditingkatkan, serta pemerintah dapat mengalokasikan dana khusus untuk masyarakat miskin dan hampir miskin agar dapat memenuhi kebutuhan pokoknya", halaman: 24 },

    // ── Hal. 25 — Ekonomi digital: definisi, manfaat, smart logistics ──
    { id: 116, soal: "Mengapa pelaku UMKM kini memasarkan produknya melalui platform digital?", jawaban: "Karena dirasa lebih praktis dan menjangkau konsumen yang lebih luas. Jumlah UMKM yang terhubung dengan platform digital terus meningkat setiap tahunnya", halaman: 25 },
    { id: 117, soal: "Secara sederhana, apa pengertian ekonomi digital, dan seiring apa ia berkembang?", jawaban: "Kegiatan ekonomi dengan bantuan teknologi informasi komunikasi dan kecerdasan buatan. Berkembang seiring Revolusi Industri 4.0 yang ditandai kecerdasan buatan, teknologi komputer kuantum, dan teknologi informasi berbasis internet", halaman: 25 },
    { id: 118, soal: "Apa pengertian ekonomi digital menurut Amir Hartman?", jawaban: "Media virtual di mana bisnis, penetapan nilai, dan transaksi terjadi menggunakan internet sebagai media pertukaran", halaman: 25 },
    { id: 119, soal: "Apa kelebihan ekonomi digital, dan apa tuntutannya bagi pelaku ekonomi?", jawaban: "Kelebihan: mempercepat dan mempermudah kegiatan ekonomi\nTuntutan: pelaku ekonomi harus selalu kreatif dan cepat mengambil peluang agar tidak kehilangan kesempatan", halaman: 25 },
    { id: 120, soal: "Sebutkan manfaat ekonomi digital dalam kehidupan!", jawaban: "1. Ketersediaan informasi yang lebih besar\n2. Menghemat biaya\n3. Menurunkan hambatan", halaman: 25 },
    { id: 121, soal: "Jelaskan manfaat ekonomi digital: ketersediaan informasi yang lebih besar!", jawaban: "Internet memungkinkan konsumen mempunyai lebih banyak informasi dan pilihan, lebih mudah mencari merek terbaik yang diinginkan, serta membandingkan harga dari satu toko dengan toko lain", halaman: 25 },
    { id: 122, soal: "Jelaskan manfaat ekonomi digital: menghemat biaya!", jawaban: "Membantu perusahaan menghemat sewa gedung karena sebagian aktivitas dilakukan melalui internet. Perusahaan juga dapat memotong aspek ritel dan mengirim barang langsung dari pabrik/gudang supplier atau produsen, bukan dari toko, sehingga biaya lebih rendah dan harga jual lebih murah", halaman: 25 },
    { id: 123, soal: "Jelaskan manfaat ekonomi digital: menurunkan hambatan!", jawaban: "Di beberapa sektor industri, ekonomi digital memudahkan perusahaan baru untuk masuk. Dengan ide inovatif, seseorang bisa menciptakan produk baru yang menantang perusahaan tradisional. Ekonomi digital membawa banyak layanan baru, mulai dari pesan antar bahan makanan ke rumah hingga aplikasi lainnya", halaman: 25 },
    { id: 124, soal: "Apa yang dimaksud smart logistics, dan teknologi apa saja yang dilibatkan? (Info Khusus)", jawaban: "Logistik pintar: pendekatan inovatif dalam pengelolaan rantai pasokan yang memanfaatkan teknologi canggih, analisis data, dan kecerdasan buatan untuk meningkatkan efisiensi, visibilitas, dan pengelolaan seluruh proses pengiriman dan distribusi barang. Teknologinya: Internet of Things (IoT), big data analytics, kecerdasan buatan (AI), dan blockchain, untuk mengumpulkan, menganalisis, dan memberikan informasi secara real time", halaman: 25 },
    { id: 125, soal: "Sebutkan contoh bidang ekonomi digital yang berkembang di Indonesia!", jawaban: "1. Bidang transportasi\n2. Bidang kesehatan\n3. Bidang perbankan\n4. Bidang bisnis", halaman: "25–26" },
    { id: 126, soal: "Berikan contoh ekonomi digital di bidang transportasi!", jawaban: "Layanan ojek online. Dulu orang harus datang ke pangkalan dan menunggu tukang ojek; sekarang cukup menunggu di rumah dan bisa dijemput di tempat yang diinginkan dengan memanfaatkan smartphone dan layanan internet", halaman: 25 },

    // ── Hal. 26 — Contoh lanjutan, tantangan, Palmira ──
    { id: 127, soal: "Berikan contoh ekonomi digital di bidang kesehatan!", jawaban: "Pertemuan dokter dan pasien kini bisa dilakukan secara virtual, tidak perlu lagi pergi ke klinik atau rumah sakit untuk mengonsultasikan keluhan", halaman: 26 },
    { id: 128, soal: "Berikan contoh ekonomi digital di bidang perbankan!", jawaban: "Uang tetap alat pembayaran sah, tetapi bentuknya berubah menjadi digital. Contoh: produk dompet digital (e-banking, OVO, dll.) dan produk perbankan seperti kartu debit dan kredit untuk bertransaksi tanpa uang tunai", halaman: 26 },
    { id: 129, soal: "Bagaimana ekonomi digital memengaruhi bidang bisnis?", jawaban: "Dulu memulai usaha harus punya toko fisik; sekarang siapa pun dapat memulai usaha tanpa mengandalkan toko fisik. Orang bermodal minim dapat berwirausaha dengan berjualan online, sehingga uang untuk membangun toko fisik dapat dialokasikan untuk keperluan lain atau menambah modal", halaman: 26 },
    { id: 130, soal: "Permasalahan apa yang muncul dari ekonomi digital, dan sebutkan tantangannya!", jawaban: "Permasalahan: keamanan data pribadi dan modus penipuan daring melalui scamming.\nTantangan:\n1. Keamanan berinternet\n2. Sumber daya manusia yang kurang memadai\n3. Regulasi yang masih belum mumpuni", halaman: 26 },
    { id: 131, soal: "Jelaskan tantangan ekonomi digital dalam aspek keamanan berinternet!", jawaban: "Cyber security masih menjadi ancaman bagi sebagian besar pengguna internet di Indonesia. Dibutuhkan peningkatan keamanan agar pengguna bisa mengakses semua layanan ekonomi digital tanpa khawatir peretasan dan pencurian data", halaman: 26 },
    { id: 132, soal: "Jelaskan tantangan ekonomi digital: SDM kurang memadai dan regulasi belum mumpuni!", jawaban: "SDM: kurangnya sumber daya manusia yang paham penerapan teknologi; rendahnya literasi digital membuat banyak sektor sulit masuk ke kancah digital\nRegulasi: diperlukan regulasi yang melindungi hak penyedia layanan maupun penggunanya, namun ekonomi digital kadang terhambat karena belum ada aturan pasti yang mengaturnya", halaman: 26 },
    { id: 133, soal: "Menurut Palmira dkk. (2020), pembangunan ekonomi digital yang inklusif memerlukan aspek pendukung apa saja?", jawaban: "Jaringan internet dan infrastruktur, akses dan pemanfaatan internet yang bijak, transformasi digital, serta jaminan sosial. Dengan demikian, manfaat digital dapat berkontribusi pada pertumbuhan ekonomi masyarakat", halaman: 26 },

    // ── Hal. 27–31 — Glosarium & Penilaian Sumatif Bab 1 ──
    { id: 134, soal: "Apa arti fiskal, inflasi, dan ketimpangan? (Glosarium)", jawaban: "Fiskal: berkenaan dengan urusan pajak atau pendapatan negara\nInflasi: kemerosotan nilai uang (kertas) karena banyaknya dan cepatnya uang beredar sehingga harga barang-barang naik\nKetimpangan: hal yang tidak sebagaimana mestinya (seperti tidak adil, tidak beres)", halaman: 27 },
    { id: 135, soal: "Upaya pemerintah negara berkembang untuk menanggulangi permasalahan pembangunan ekonomi adalah… (Sumatif)", jawaban: "Dimudahkannya izin untuk berwirausaha", halaman: 27 },
    { id: 136, soal: "Dari komponen: (1) keuntungan perusahaan, (2) ekspor neto, (3) kompensasi pekerja, (4) pengeluaran pemerintah untuk barang & jasa, (5) konsumsi rumah tangga — mana komponen pendekatan pengeluaran? (Sumatif)", jawaban: "Nomor 2, 4, dan 5 (sesuai Y = C + I + G + (X − M))\nNomor 1 dan 3 termasuk pendekatan pendapatan", halaman: 27 },

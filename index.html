<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard Pelajaran</title>
<style>
:root {
  --c-bg: #0f1117;
  --c-surface: #161925;
  --c-surface-2: #1d2131;
  --c-border: rgba(255,255,255,0.08);
  --c-text: #cbd5e1;
  --c-text-bright: #e2e8f0;
  --c-text-muted: #9aa4ba;
  --c-text-dim: #808899;
  --c-accent-rgb: 102, 126, 234;
  --c-accent: rgb(var(--c-accent-rgb));
  --c-accent-soft: #a5b4fc;
  --c-primary: #a78bfa;
  --c-primary-rgb: 167, 139, 250;
  --c-success: #6ee7b7;
  --c-danger: #f87171;
  --c-blue: #60a5fa;
  --c-blue-rgb: 96, 165, 250;
  --c-yellow-rgb: 234, 179, 8;
  --sidebar-w: 340px;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Naskh Arabic", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--c-accent-soft); outline-offset: 2px; }

/* ── Layout ───────────────────────────────────────── */
.app { display: flex; height: 100dvh; }
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-surface);
  border-right: 1px solid var(--c-border);
  z-index: 20;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  overflow-y: auto;
}
.backdrop { display: none; }

/* ── Sidebar header ───────────────────────────────── */
.sb-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 12px 10px;
}
.sb-title {
  flex: 1;
  font-weight: 800;
  font-size: 1rem;
  color: var(--c-accent-soft);
}
.icon-btn {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 10px;
  border: 1px solid var(--c-border);
  background: var(--c-surface-2);
  font-size: 1rem;
}
.icon-btn:hover { border-color: rgba(var(--c-accent-rgb), 0.5); }
.sb-search { padding: 0 12px 6px; }
.sb-search input {
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--c-border);
  background: var(--c-bg);
  color: var(--c-text-bright);
  font: inherit;
  font-size: 0.85rem;
}
.sb-search input::placeholder { color: var(--c-text-dim); }
.sb-body { flex: 1; overflow-y: auto; padding-bottom: 12px; }

/* ── Dashboard ────────────────────────────────────── */
.dash {
  margin: 6px 12px 10px;
  padding: 12px 14px;
  background: rgba(var(--c-accent-rgb), 0.07);
  border: 1px solid rgba(var(--c-accent-rgb), 0.2);
  border-radius: var(--radius);
}
.dash-title { font-size: 0.78rem; font-weight: 800; color: var(--c-accent-soft); margin-bottom: 10px; }
.dash-stats { display: flex; align-items: center; }
.dash-stat { flex: 1; text-align: center; }
.dash-val { display: block; font-size: 1.1rem; font-weight: 800; line-height: 1.1; }
.dash-lbl { font-size: 0.62rem; font-weight: 600; color: var(--c-text-dim); text-transform: uppercase; letter-spacing: 0.2px; }
.dash-stat--new .dash-val { color: var(--c-success); }
.dash-stat--rev .dash-val { color: var(--c-accent-soft); }
.dash-stat--tot .dash-val { color: #fcd34d; }
.dash-div { width: 1px; height: 28px; background: rgba(var(--c-accent-rgb), 0.2); }
.dash-empty { text-align: center; display: flex; flex-direction: column; gap: 3px; }
.dash-empty strong { color: var(--c-success); font-size: 0.82rem; }
.dash-empty span { font-size: 0.7rem; color: var(--c-text-dim); }
.dash-countdown { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--c-text-muted); font-size: 0.85rem; }

/* ── Mapel accordion ──────────────────────────────── */
.mapel { margin: 0 12px 8px; border: 1px solid var(--c-border); border-radius: var(--radius); background: var(--c-surface-2); overflow: hidden; }
.mapel-head { display: flex; align-items: stretch; }
.mapel-toggle {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 11px 12px;
  background: none; border: 0; text-align: left;
}
.mapel-title { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.mapel-name { max-width: 100%; font-weight: 700; color: var(--c-text-bright); font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mapel-count {
  flex-shrink: 0;
  font-size: 0.68rem; font-weight: 700;
  padding: 2px 8px; border-radius: 999px;
  background: rgba(var(--c-accent-rgb), 0.12); color: var(--c-accent-soft);
}
.chev { margin-left: auto; color: var(--c-text-dim); transition: transform 0.2s; font-size: 0.75rem; }
.mapel.open .chev { transform: rotate(180deg); }
.mapel-start {
  flex-shrink: 0;
  margin: 7px 8px 7px 0;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid rgba(var(--c-accent-rgb), 0.45);
  background: linear-gradient(135deg, rgba(var(--c-accent-rgb), 0.3), rgba(var(--c-primary-rgb), 0.3));
  color: var(--c-text-bright);
  font-size: 0.75rem; font-weight: 700;
  white-space: nowrap;
}
.mapel-cfg {
  flex-shrink: 0;
  width: 32px;
  margin: 7px 6px 7px 0;
  border-radius: 9px;
  border: 1px solid var(--c-border);
  background: transparent;
  font-size: 0.85rem;
}
.mapel-cfg:hover { border-color: rgba(var(--c-accent-rgb), 0.5); }
.mapel-start:hover:not(:disabled) { border-color: var(--c-accent-soft); }
.mapel-start:disabled { background: transparent; border-color: var(--c-border); color: var(--c-text-dim); }
.mapel-items { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.mapel-empty { padding: 8px; font-size: 0.78rem; color: var(--c-text-dim); text-align: center; }

.row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.02);
}
.row-text { flex: 1; min-width: 0; }
.row-soal, .row-jawab { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-soal { font-size: 0.82rem; color: var(--c-text-bright); }
.row-jawab { font-size: 0.72rem; color: var(--c-text-dim); margin-top: 1px; }
.row--today { background: rgba(var(--c-yellow-rgb), 0.06); border-color: rgba(var(--c-yellow-rgb), 0.25); }
.row--today .row-soal { color: #fde047; }
.row--srs { background: rgba(var(--c-primary-rgb), 0.07); border-color: rgba(var(--c-primary-rgb), 0.2); }
.row--current { border-color: var(--c-accent-soft); }
.pill {
  flex-shrink: 0;
  font-size: 0.64rem; font-weight: 700;
  padding: 2px 7px; border-radius: 999px;
  background: rgba(255,255,255,0.06); color: var(--c-text-muted);
  white-space: nowrap;
}
.pill--new { background: rgba(110,231,183,0.12); color: var(--c-success); }
.pill--due { background: rgba(248,113,113,0.14); color: var(--c-danger); }

.sb-foot { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--c-border); }
.sb-note { font-size: 0.72rem; color: var(--c-text-dim); text-align: center; margin: 0; }
.btn {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--c-border);
  background: var(--c-surface-2);
  font-weight: 700; font-size: 0.85rem;
}
.btn--danger { border-color: rgba(248,113,113,0.4); color: var(--c-danger); background: rgba(248,113,113,0.08); }
.btn--danger:hover { background: rgba(248,113,113,0.16); }
.btn--primary { border-color: rgba(var(--c-accent-rgb), 0.5); background: linear-gradient(135deg, var(--c-accent), var(--c-primary)); color: #fff; }

/* ── Main ─────────────────────────────────────────── */
.topbar {
  width: 100%; max-width: 640px;
  display: flex; align-items: center; gap: 10px;
  min-height: 40px;
  margin-bottom: 12px;
}
.menu-btn { display: none; }
.progress { flex: 1; font-size: 0.85rem; font-weight: 700; color: var(--c-text-muted); }
.progress b { color: var(--c-text-bright); }
.retry-count { color: #fcd34d; }

.card-wrap { width: 100%; max-width: 640px; perspective: 1400px; }
.card {
  position: relative;
  width: 100%;
  min-height: min(52dvh, 420px);
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
  cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }
.card.no-anim { transition: none; }
.face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column;
  padding: 22px 22px 18px;
  border-radius: 18px;
  border: 1px solid rgba(var(--c-accent-rgb), 0.22);
  background: linear-gradient(160deg, #1b1f30, #141724);
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  overflow-y: auto;
}
.face--back { transform: rotateY(180deg); border-color: rgba(var(--c-primary-rgb), 0.3); }
.face-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; }
.tag {
  font-size: 0.68rem; font-weight: 700;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(var(--c-accent-rgb), 0.14); color: var(--c-accent-soft);
}
.tag--state-new { background: rgba(110,231,183,0.12); color: var(--c-success); }
.tag--state-learning, .tag--state-relearning { background: rgba(248,113,113,0.12); color: var(--c-danger); }
.tag--state-review { background: rgba(var(--c-blue-rgb), 0.12); color: var(--c-blue); }
.tag--retry { background: rgba(var(--c-yellow-rgb), 0.14); color: #fcd34d; }
.tag--page { margin-left: auto; background: rgba(var(--c-yellow-rgb), 0.12); color: #fcd34d; }
.face-body {
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  gap: 14px;
  padding: 18px 0;
}
.face-label { font-size: 0.7rem; font-weight: 700; color: var(--c-text-dim); text-transform: uppercase; letter-spacing: 0.6px; text-align: center; }
.face-text {
  font-size: clamp(1.05rem, 2.6vw, 1.35rem);
  line-height: 1.6;
  color: var(--c-text-bright);
  text-align: center;
  white-space: pre-line;
  overflow-wrap: anywhere;
}
.face-text--q { font-size: clamp(0.95rem, 2.2vw, 1.05rem); color: var(--c-text-muted); padding-bottom: 14px; border-bottom: 1px dashed var(--c-border); }
.face-hint { font-size: 0.72rem; color: var(--c-text-dim); text-align: center; }

.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; height: 100%;
}
.empty-icon { font-size: 2.4rem; }
.empty h2 { margin: 0; font-size: 1.1rem; color: var(--c-text-bright); }
.empty p { margin: 0; font-size: 0.85rem; color: var(--c-text-muted); max-width: 360px; line-height: 1.5; }

.actions { width: 100%; max-width: 640px; margin-top: 16px; }
.flip-btn {
  width: 100%; min-height: 56px;
  border-radius: 12px;
  border: 1px solid rgba(var(--c-accent-rgb), 0.45);
  background: linear-gradient(135deg, rgba(var(--c-accent-rgb), 0.28), rgba(var(--c-primary-rgb), 0.28));
  color: var(--c-text-bright);
  font-weight: 700; font-size: 0.95rem;
}
.flip-btn:hover { border-color: var(--c-accent-soft); }
.rate-row { display: flex; gap: 8px; }
.rate-btn {
  flex: 1; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border-radius: 12px; border: 1px solid;
  font-weight: 700; font-size: 0.85rem;
}
.rate-int { font-size: 0.68rem; font-weight: 600; opacity: 0.75; }
.rate-btn--lupa { background: rgba(245,87,108,0.12); border-color: rgba(245,87,108,0.3); color: var(--c-danger); }
.rate-btn--lupa:hover { background: rgba(245,87,108,0.22); border-color: rgba(245,87,108,0.6); }
.rate-btn--oke { background: rgba(var(--c-blue-rgb), 0.1); border-color: rgba(var(--c-blue-rgb), 0.25); color: var(--c-blue); }
.rate-btn--oke:hover { background: rgba(var(--c-blue-rgb), 0.2); border-color: rgba(var(--c-blue-rgb), 0.5); }
.rate-btn--gampang { background: rgba(67,233,123,0.12); border-color: rgba(67,233,123,0.3); color: var(--c-success); }
.rate-btn--gampang:hover { background: rgba(67,233,123,0.22); border-color: rgba(67,233,123,0.6); }
.kbd-hint { margin-top: 10px; font-size: 0.7rem; color: var(--c-text-dim); text-align: center; }
.kbd-hint kbd { font-family: inherit; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--c-border); background: var(--c-surface-2); }

.warn {
  width: 100%; max-width: 640px;
  margin-bottom: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(248,113,113,0.35);
  background: rgba(248,113,113,0.08);
  color: var(--c-danger);
  font-size: 0.78rem;
  line-height: 1.5;
}

/* ── Modal ────────────────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(5,6,10,0.7);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-bg[hidden] { display: none; }
#confirmBg { z-index: 60; } /* selalu di atas Pengaturan */
.modal {
  width: 100%; max-width: 400px;
  max-height: 90dvh; overflow-y: auto;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 16px;
  padding: 18px;
}
.modal h3 { margin: 0 0 6px; color: var(--c-text-bright); font-size: 1rem; }
.modal p { margin: 0 0 14px; font-size: 0.85rem; color: var(--c-text-muted); line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--c-border); }
.field label { font-size: 0.85rem; }
.field small { display: block; font-size: 0.7rem; color: var(--c-text-dim); }
.field input {
  width: 80px; padding: 8px 10px;
  border-radius: 8px; border: 1px solid var(--c-border);
  background: var(--c-bg); color: var(--c-text-bright);
  font: inherit; text-align: center;
}
.reset-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.reset-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.82rem; }
.reset-item button { padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.35); background: rgba(248,113,113,0.08); color: var(--c-danger); font-size: 0.75rem; font-weight: 700; }
.backup-btns { display: flex; gap: 8px; }
.backup-status { margin: 6px 0 10px !important; font-size: 0.8rem !important; }
.backup-status--stale { color: #fcd34d !important; }
.persist-status { margin: 10px 0 0 !important; font-size: 0.72rem !important; color: var(--c-text-dim) !important; }
.backup-nudge {
  width: 100%;
  margin-bottom: 8px;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid rgba(var(--c-yellow-rgb), 0.3);
  background: rgba(var(--c-yellow-rgb), 0.07);
  color: #fcd34d;
  font-size: 0.74rem; font-weight: 600;
  text-align: left;
}
.backup-nudge:hover { border-color: rgba(var(--c-yellow-rgb), 0.55); }
.modal-section { margin-top: 16px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--c-text-dim); }

/* ── Mobile ───────────────────────────────────────── */
@media (max-width: 899px) {
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(88vw, var(--sidebar-w));
    transform: translateX(-100%);
    transition: transform 0.25s ease;
  }
  .app.sb-open .sidebar { transform: none; }
  .app.sb-open .backdrop { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,0.5); }
  .menu-btn { display: inline-flex; }
  .main { padding: 12px; }
  .face { padding: 18px 16px 14px; }
  .rate-row { gap: 6px; }
  .rate-btn { font-size: 0.74rem; padding: 0 4px; white-space: nowrap; }
}
/* Layar sentuh: petunjuk keyboard tidak relevan */
@media (hover: none) and (pointer: coarse) {
  .kbd-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .sidebar, .chev { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Daftar mapel">
    <div class="sb-header">
      <span class="sb-title">📚 Flashcard Pelajaran</span>
      <button class="icon-btn" id="btnSettings" aria-label="Pengaturan" title="Pengaturan">⚙️</button>
    </div>
    <div class="sb-search"><input id="search" type="search" placeholder="Cari soal / jawaban…" autocomplete="off"></div>
    <div class="sb-body">
      <div class="dash" id="dash" role="status" aria-live="polite"></div>
      <div id="mapelList"></div>
    </div>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="Buka daftar mapel">☰</button>
      <div class="progress" id="progress"></div>
    </div>
    <div id="warnBox"></div>
    <div class="card-wrap">
      <div class="card" id="card" tabindex="-1">
        <div class="face face--front" id="front"></div>
        <div class="face face--back" id="back"></div>
      </div>
    </div>
    <div class="actions" id="actions"></div>
  </main>
</div>

<!-- Konfirmasi -->
<div class="modal-bg" id="confirmBg" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn" id="confirmNo">Batal</button>
      <button class="btn btn--danger" id="confirmYes">Ya</button>
    </div>
  </div>
</div>

<!-- Pengaturan -->
<div class="modal-bg" id="settingsBg" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">⚙️ Pengaturan</h3>
    <div class="modal-section">Backup progres</div>
    <p class="backup-status" id="backupStatus"></p>
    <div class="backup-btns">
      <button class="btn" id="btnExport">💾 Backup</button>
      <button class="btn" id="btnImport">📂 Restore</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <p class="persist-status" id="persistStatus"></p>
    <div class="modal-section">Reset progres</div>
    <div class="reset-list" id="resetList"></div>
    <div class="modal-actions">
      <button class="btn btn--primary" id="settingsClose">Tutup</button>
    </div>
  </div>
</div>

<!-- Setelan per mapel -->
<div class="modal-bg" id="mapelCfgBg" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mapelCfgTitle">
    <h3 id="mapelCfgTitle"></h3>
    <div class="modal-section">Jumlah kartu per sesi</div>
    <div class="field">
      <label for="cfgNew">Kartu baru<small>Diambil berurutan dari atas</small></label>
      <input id="cfgNew" type="number" min="0" max="999" inputmode="numeric">
    </div>
    <div class="field">
      <label for="cfgRev">Review<small>Kartu yang jatuh tempo hari ini</small></label>
      <input id="cfgRev" type="number" min="0" max="999" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn" id="mapelCfgCancel">Batal</button>
      <button class="btn btn--primary" id="mapelCfgSave">Simpan</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   DATA MATERI
   Format per mapel: { id, soal, jawaban, halaman }
   - `id` WAJIB unik di dalam satu mapel dan JANGAN diubah setelah dipakai:
     progres SRS disimpan berdasarkan "Mapel:id". Benerin typo soal/jawaban aman.
   - Urutan array = urutan kartu baru yang akan muncul.
   ════════════════════════════════════════════════════════════════ */
const DATA = {
  // Sumber: TNT Geografi XI (GPP) Semester 1
  "Geografi": [
    // ── Hal. 8 — Letak Indonesia secara astronomis ──
    { id: 1, soal: "Letak suatu wilayah memengaruhi hal apa saja di dalamnya?", jawaban: "1. Iklim\n2. Kondisi topografi\n3. Potensi sumber daya alam", halaman: 8 },
    { id: 2, soal: "Letak suatu wilayah dapat dilihat dari aspek apa saja?", jawaban: "1. Astronomis\n2. Geografis\n3. Geologis", halaman: 8 },
    { id: 3, soal: "Apa pengertian letak astronomis?", jawaban: "Letak suatu wilayah di bumi berdasarkan garis lintang dan garis bujur yang menunjukkan letak secara tepat berdasarkan sistem koordinat geografi", halaman: 8 },
    { id: 4, soal: "Letak astronomis dikenal juga dengan sebutan…", jawaban: "Letak absolut", halaman: 8 },
    { id: 5, soal: "Di mana letak astronomis Indonesia?", jawaban: "Di antara 6°LU – 11°LS dan 95°BT – 141°BT", halaman: 8 },
    { id: 6, soal: "Apa batas wilayah TIMUR Indonesia berdasarkan letak astronomis, dan di koordinat berapa?", jawaban: "Sungai Fly, pada 141°05'BT", halaman: 8 },
    { id: 7, soal: "Apa batas wilayah SELATAN Indonesia berdasarkan letak astronomis, dan di koordinat berapa?", jawaban: "Pulau Rote, pada 11°15'LS", halaman: 8 },
    { id: 8, soal: "Apa batas wilayah BARAT Indonesia berdasarkan letak astronomis, dan di koordinat berapa?", jawaban: "Pulau Benggala, pada 95°58'BT", halaman: 8 },
    { id: 9, soal: "Apa batas wilayah UTARA Indonesia berdasarkan letak astronomis, dan di koordinat berapa?", jawaban: "Pulau Weh, pada 6°08'LU", halaman: 8 },
    { id: 10, soal: "Pengaruh letak astronomis bagi Indonesia dapat dilihat dari dua hal, yaitu…", jawaban: "1. Iklim\n2. Pembagian waktu", halaman: 8 },
    { id: 11, soal: "Sebutkan pengaruh letak astronomis terhadap iklim Indonesia!", jawaban: "1. Beriklim tropis dengan rata-rata suhu dan kelembapan udara yang tinggi\n2. Penyinaran matahari berlangsung sepanjang tahun\n3. Memiliki hutan hujan tropis yang luas", halaman: 8 },
    { id: 12, soal: "Berapa lama durasi penyinaran matahari di Indonesia dan apa akibatnya?", jawaban: "Sekitar 12 jam sepanjang tahun, sehingga suhu udara tinggi (> 18°)", halaman: 8 },
    { id: 13, soal: "Pembagian waktu di Indonesia terdiri atas…", jawaban: "1. WIB (Waktu Indonesia Barat)\n2. WITA (Waktu Indonesia Tengah)\n3. WIT (Waktu Indonesia Timur)", halaman: 8 },
    { id: 14, soal: "Bumi berputar 360° dalam 24 jam. Berapa menit waktu yang dibutuhkan bumi untuk berotasi 1°?", jawaban: "4 menit\n(1.440 menit ÷ 360° = 4 menit)", halaman: 8 },
    { id: 15, soal: "Setiap satu jam, bumi berotasi sebesar…", jawaban: "15°", halaman: 8 },
    { id: 16, soal: "Ada berapa wilayah waktu di dunia, dan berapa selisih waktu antarwilayah yang berdampingan?", jawaban: "24 wilayah waktu, dengan selisih 1 jam", halaman: 8 },
    { id: 17, soal: "Apa garis bujur patokan WIT dan berapa selisih waktunya dari GMT?", jawaban: "135°BT, 9 jam lebih awal dari GMT", halaman: 8 },
    { id: 18, soal: "Daerah mana saja yang termasuk wilayah WIT?", jawaban: "Kepulauan Maluku, Papua, dan pulau-pulau kecil di sekitarnya", halaman: 8 },
    { id: 19, soal: "Apa garis bujur patokan WITA dan berapa selisih waktunya dari GMT?", jawaban: "120°BT, 8 jam lebih awal dari GMT", halaman: 8 },
    { id: 20, soal: "Daerah mana saja yang termasuk wilayah WITA?", jawaban: "Kalimantan Selatan, Kalimantan Timur, Bali, NTT, NTB, Sulawesi, dan pulau-pulau kecil di sekitarnya", halaman: 8 },
    { id: 21, soal: "Apa garis bujur patokan WIB dan berapa selisih waktunya dari GMT?", jawaban: "105°BT, 7 jam lebih awal dari GMT", halaman: 8 },
    { id: 22, soal: "Daerah mana saja yang termasuk wilayah WIB?", jawaban: "Sumatra, Jawa, Kalimantan Barat, Kalimantan Tengah, dan pulau-pulau kecil di sekitarnya", halaman: 8 },
    { id: 23, soal: "Sebutkan keuntungan letak astronomis Indonesia!", jawaban: "1. Memiliki hutan hujan tropis yang luas\n2. Memiliki beraneka ragam flora dan fauna\n3. Tanahnya terhindar dari angin topan\n4. Tanah yang subur\n5. Kaya akan wisata alam", halaman: 8 },

    // ── Hal. 9 — Letak Indonesia secara geografis ──
    { id: 24, soal: "Apa pengertian letak geografis?", jawaban: "Letak suatu daerah dilihat dari kenyataannya di bumi atau posisi daerah tersebut pada bumi dibandingkan dengan posisi daerah lain", halaman: 9 },
    { id: 25, soal: "Letak geografis disebut juga letak apa, dan mengapa?", jawaban: "Letak relatif, karena posisinya ditentukan oleh fenomena-fenomena geografis yang membatasinya, misalnya gunung, sungai, lautan, benua, dan samudra", halaman: 9 },
    { id: 26, soal: "Secara geografis, Indonesia terletak di antara…", jawaban: "Dua benua: Benua Asia dan Benua Australia\nDua samudra: Samudra Hindia dan Samudra Pasifik", halaman: 9 },
    { id: 27, soal: "Secara geografis, sebelah BARAT Indonesia berbatasan dengan…", jawaban: "Samudra Hindia", halaman: 9 },
    { id: 28, soal: "Secara geografis, sebelah UTARA Indonesia berbatasan dengan…", jawaban: "Malaysia, Singapura, Filipina, dan Laut Tiongkok Selatan", halaman: 9 },
    { id: 29, soal: "Secara geografis, sebelah TIMUR Indonesia berbatasan dengan…", jawaban: "Papua Nugini, Timor Leste, dan Samudra Pasifik", halaman: 9 },
    { id: 30, soal: "Secara geografis, sebelah SELATAN Indonesia berbatasan dengan…", jawaban: "Australia, Timor Leste, dan Samudra Hindia", halaman: 9 },
    { id: 31, soal: "Indonesia memiliki dua musim. Apa saja, dan apa penyebabnya?", jawaban: "Musim hujan dan musim kemarau, karena pengaruh angin monsun", halaman: 9 },
    { id: 32, soal: "Angin monsun barat berembus dari mana menuju ke mana?", jawaban: "Dari arah Asia menuju Australia melalui Samudra Hindia", halaman: 9 },
    { id: 33, soal: "Angin monsun barat terjadi pada periode bulan apa, dan Indonesia mengalami musim apa?", jawaban: "Oktober – April, Indonesia mengalami musim penghujan", halaman: 9 },
    { id: 34, soal: "Saat angin monsun barat, matahari berada di mana?", jawaban: "Di belahan bumi bagian selatan atau 23,5°LS, kemudian bergerak menuju arah khatulistiwa", halaman: 9 },
    { id: 35, soal: "Saat angin monsun barat, bagaimana kondisi tekanan udara dan suhu di Australia dan di Asia?", jawaban: "Australia: mendapat sinar matahari maksimal → tekanan udara rendah, suhu relatif tinggi\nAsia: sedang musim dingin → suhu rendah, tekanan udara tinggi", halaman: 9 },
    { id: 36, soal: "Angin monsun timur berembus dari mana menuju ke mana?", jawaban: "Dari Australia menuju arah Asia melalui Indonesia", halaman: 9 },
    { id: 37, soal: "Angin monsun timur terjadi pada periode bulan apa, dan Indonesia mengalami musim apa?", jawaban: "April – Oktober, Indonesia mengalami musim kemarau", halaman: 9 },
    { id: 38, soal: "Saat angin monsun timur, matahari berada di mana?", jawaban: "Di belahan bumi bagian utara atau 23,5°LU", halaman: 9 },
    { id: 39, soal: "Saat angin monsun timur, bagaimana kondisi tekanan udara dan suhu di Asia dan di Australia?", jawaban: "Asia: mendapat sinar matahari maksimal → tekanan udara relatif rendah, suhu relatif tinggi\nAustralia: sedang musim dingin → suhu relatif rendah, tekanan udara relatif tinggi", halaman: 9 },
    { id: 40, soal: "Mengapa angin monsun timur membuat curah hujan di Indonesia sedikit?", jawaban: "Kandungan uap air yang dibawanya relatif rendah, karena angin tersebut hanya melewati beberapa laut yang sempit", halaman: 9 },
    { id: 41, soal: "Indonesia berada pada jalur silang apa, dan apa dampaknya?", jawaban: "Jalur silang lalu lintas pelayaran dan perdagangan dunia. Posisi ini memungkinkan masuknya pengaruh peradaban dan kebudayaan dari negara lain", halaman: 9 },
    { id: 42, soal: "Mengapa Indonesia memiliki geopolitik yang strategis?", jawaban: "Karena berada di antara negara-negara besar yang berpengaruh dalam berbagai bidang, seperti perdagangan, teknologi, persenjataan, dan sebagainya", halaman: 9 },
    { id: 43, soal: "Indonesia adalah negara maritim yang berbentuk…", jawaban: "Kepulauan (archipelagic state)", halaman: 9 },
    { id: 44, soal: "Kondisi Indonesia sebagai negara kepulauan memberikan keuntungan menjadi…", jawaban: "Poros maritim dunia", halaman: 9 },
    { id: 45, soal: "Apa pengertian poros maritim?", jawaban: "Gagasan strategis yang diwujudkan untuk menjamin konektivitas antarpulau, pengembangan industri perkapalan dan perikanan, perbaikan transportasi laut, serta fokus pada keamanan maritim", halaman: 9 },

    // ── Hal. 10 — Poros maritim dunia, keuntungan & dampak negatif letak geografis ──
    { id: 46, soal: "Sebutkan program-program utama dalam upaya mewujudkan Indonesia sebagai poros maritim dunia!", jawaban: "1. Penegakan kedaulatan wilayah laut NKRI\n2. Revitalisasi sektor ekonomi kelautan\n3. Penguatan dan pengembangan konektivitas maritim\n4. Rehabilitasi kerusakan lingkungan dan konservasi biodiversity\n5. Peningkatan kualitas dan kuantitas sumber daya manusia kelautan", halaman: 10 },
    { id: 47, soal: "Pembangunan poros maritim dunia harus dibarengi dengan…", jawaban: "Pembangunan pusat-pusat pertumbuhan ekonomi baru di sepanjang wilayah pesisir alur laut kepulauan Indonesia, pulau-pulau kecil, dan wilayah perbatasan", halaman: 10 },
    { id: 48, soal: "Apa tujuan pembangunan pusat-pusat pertumbuhan ekonomi baru di wilayah pesisir, pulau kecil, dan perbatasan?", jawaban: "1. Meningkatkan kesejahteraan rakyat\n2. Menghasilkan produk dan jasa kelautan yang bernilai ekonomi\n3. Meningkatkan kontribusi sektor kelautan perikanan bagi perekonomian\n4. Menciptakan lapangan kerja dalam jumlah besar", halaman: 10 },
    { id: 49, soal: "Apa pilar PERTAMA dalam mewujudkan Indonesia sebagai poros maritim dunia?", jawaban: "Pembangunan kembali budaya maritim Indonesia", halaman: 10 },
    { id: 50, soal: "Apa pilar KEDUA dalam mewujudkan Indonesia sebagai poros maritim dunia?", jawaban: "Berkomitmen dalam menjaga dan mengelola sumber daya laut dengan fokus membangun kedaulatan pangan laut melalui pengembangan industri perikanan, dengan menempatkan nelayan sebagai pilar utama", halaman: 10 },
    { id: 51, soal: "Apa pilar KETIGA dalam mewujudkan Indonesia sebagai poros maritim dunia?", jawaban: "Komitmen mendorong pengembangan infrastruktur dan konektivitas maritim dengan membangun tol laut, pelabuhan laut, logistik, industri perkapalan, serta pariwisata maritim", halaman: 10 },
    { id: 52, soal: "Apa pilar KEEMPAT dalam mewujudkan Indonesia sebagai poros maritim dunia?", jawaban: "Diplomasi maritim yang mengajak semua mitra Indonesia untuk bekerja sama pada bidang kelautan", halaman: 10 },
    { id: 53, soal: "Apa pilar KELIMA dalam mewujudkan Indonesia sebagai poros maritim dunia?", jawaban: "Membangun kekuatan pertahanan maritim", halaman: 10 },
    { id: 54, soal: "Apa dua aspek penting dalam pembangunan poros maritim dunia?", jawaban: "1. Aspek kemaritiman dan ekonomi kelautan (sebagai aspek unggulan dan andalan)\n2. Aspek komponen tata kelola yang baik", halaman: 10 },
    { id: 55, soal: "Pembangunan dan pengembangan pada aspek kemaritiman dan ekonomi kelautan meliputi apa saja?", jawaban: "Tol laut, mineral dasar laut, sumber daya perikanan, migas lepas pantai, wisata bahari, dan industri maritim", halaman: 10 },
    { id: 56, soal: "Aspek komponen tata kelola yang baik dalam mewujudkan poros maritim dunia meliputi apa saja?", jawaban: "Sumber daya manusia, budaya bahari, iptek kelautan, kualitas kelautan, daya dukung lingkungan laut, pengawasan laut, penataan ruang laut, pengaturan alur laut, serta pertahanan dan keamanan laut", halaman: 10 },
    { id: 57, soal: "Sebutkan keuntungan letak geografis Indonesia!", jawaban: "1. Berada di lintas perdagangan internasional\n2. Menjadi negara agraris\n3. Ketersediaan tanah yang subur\n4. Keberagaman budaya yang tinggi", halaman: 10 },
    { id: 58, soal: "Dua selat di Indonesia yang menjadi jalur pelayaran dunia yang ramai adalah…", jawaban: "Selat Sunda dan Selat Karimata", halaman: 10 },
    { id: 59, soal: "Mengapa letak geografis menjadikan Indonesia negara agraris?", jawaban: "Indonesia dilalui dua angin monsun yang mengakibatkan musim hujan dan musim kemarau. Kedua musim tersebut menjadikan cuaca dan iklim potensial untuk pengembangan pertanian berbagai macam tanaman", halaman: 10 },
    { id: 60, soal: "Apa yang berperan penting dalam menciptakan tanah yang subur di Indonesia?", jawaban: "Curah hujan yang menyebar di seluruh wilayah Indonesia, dari kategori kering hingga sangat basah", halaman: 10 },
    { id: 61, soal: "Mengapa letak geografis menyebabkan keberagaman budaya di Indonesia tinggi?", jawaban: "Posisi geografis yang luas menyebabkan keragaman budaya penduduk juga luas. Posisi lalu lintas internasional membuat banyak kapal negara luar singgah, sehingga terjadi akulturasi budaya dan suku bangsa", halaman: 10 },
    { id: 62, soal: "Sebutkan dampak negatif letak geografis Indonesia!", jawaban: "1. Persaingan global yang cukup sulit dikendalikan\n2. Eksplorasi sumber daya alam Indonesia secara besar-besaran\n3. Munculnya pasar-pasar gelap akibat jalur perdagangan lintas internasional\n4. Semakin konsumtif terhadap barang-barang produk asing", halaman: 10 },

    // ── Hal. 11 — Letak Indonesia secara geologis ──
    { id: 63, soal: "Apa pengertian letak geologis?", jawaban: "Letak suatu wilayah yang dilihat dari jenis keadaan batu-batuan yang ada di permukaan bumi dan jalur pegunungan", halaman: 11 },
    { id: 64, soal: "Letak geologis Indonesia dapat dilihat dari sudut apa saja?", jawaban: "1. Formasi geologinya\n2. Keadaan batuannya\n3. Jalur-jalur pegunungannya", halaman: 11 },
    { id: 65, soal: "Dilihat dari formasi geologinya, kepulauan Indonesia dibagi menjadi…", jawaban: "Tiga zona geologi, atau pertemuan tiga lempeng litosfer", halaman: 11 },
    { id: 66, soal: "Berdasarkan formasi geologi, bagian UTARA Indonesia berbatasan dengan apa?", jawaban: "Tameng Asia dan perluasannya ke arah selatan yang tenggelam di bawah permukaan air laut, dikenal dengan Paparan Sunda", halaman: 11 },
    { id: 67, soal: "Berdasarkan formasi geologi, bagian BARAT dan SELATAN Indonesia dibatasi oleh apa?", jawaban: "Benua Gondwana (terdiri atas India, dasar Samudra Hindia, Australia) dan perluasannya ke arah utara yang tenggelam di bawah permukaan air, yakni Paparan Sahul (disebut Lempeng Indo-Australia)", halaman: 11 },
    { id: 68, soal: "Berdasarkan formasi geologi, bagian TIMUR Indonesia dibatasi oleh apa?", jawaban: "Dasar Samudra Pasifik (disebut Lempeng Dasar Samudra Pasifik) yang meluas ke arah barat daya", halaman: 11 },
    { id: 69, soal: "Dilihat dari keadaan batuannya, wilayah Indonesia terbagi menjadi tiga wilayah, yaitu…", jawaban: "1. Dataran Indonesia Timur (Paparan Sahul)\n2. Dataran Indonesia Barat (Paparan Sunda)\n3. Wilayah peralihan (bagian tengah)", halaman: 11 },
    { id: 70, soal: "Paparan Sahul merupakan bagian dari lempeng apa, dan menghubungkan apa?", jawaban: "Bagian dari Lempeng Australia, menghubungkan Benua Australia dengan Pulau Papua", halaman: 11 },
    { id: 71, soal: "Paparan Sunda berada di bagian mana dari lempeng apa, dan terdiri atas apa?", jawaban: "Berada di bagian tenggara Lempeng Eurasia, terdiri atas pulau dan kawasan laut dangkal", halaman: 11 },
    { id: 72, soal: "Paparan Sunda terhubung dengan benua apa dan membentang meliputi wilayah mana saja?", jawaban: "Terhubung dengan Benua Asia, membentang dari Pulau Kalimantan hingga Pulau Jawa, termasuk Semenanjung Malaysia, Sumatra, Jawa, Madura, Bali, dan pulau-pulau kecil lainnya", halaman: 11 },
    { id: 73, soal: "Dilihat dari jalur pegunungannya, Indonesia terletak pada pertemuan dua rangkaian pegunungan muda, yaitu…", jawaban: "1. Rangkaian Pegunungan Mediterania (Sirkum Mediterania)\n2. Rangkaian Pegunungan Pasifik (Sirkum Pasifik)", halaman: 11 },
    { id: 74, soal: "Pegunungan Sirkum Mediterania memanjang dari mana hingga ke mana?", jawaban: "Dari wilayah Alpen di Eropa, Himalaya di Asia, hingga pegunungan di Pulau Sumatra dan Jawa", halaman: 11 },
    { id: 75, soal: "Pegunungan Sirkum Pasifik disebut juga…", jawaban: "Cincin Api Pasifik", halaman: 11 },
    { id: 76, soal: "Pegunungan Sirkum Pasifik memanjang dari mana hingga ke mana?", jawaban: "Dari Amerika hingga Selandia Baru: Pegunungan Andes di Amerika Selatan, Amerika Utara, Jepang, Filipina, Sulawesi, Banda, hingga Selandia Baru", halaman: 11 },
    { id: 77, soal: "Letak Indonesia secara geologis berpengaruh secara…", jawaban: "Vulkanis, topografis, dan tektonis", halaman: 11 },
    { id: 78, soal: "Sebutkan pengaruh letak geologis Indonesia!", jawaban: "1. Membentuk rangkaian pegunungan muda yang aktif\n2. Terbentuk topografi yang bervariasi\n3. Memunculkan fenomena gempa bumi", halaman: 11 },
    { id: 79, soal: "Rangkaian Sirkum Mediterania dan Sirkum Pasifik di Indonesia membentuk dua busur pegunungan, yaitu…", jawaban: "Busur dalam (inner arc) dan busur luar (outer arc)", halaman: 11 },
    { id: 80, soal: "Apa sifat busur dalam (inner arc) dan busur luar (outer arc)?", jawaban: "Busur dalam: aktif (vulkanik)\nBusur luar: tidak aktif", halaman: 11 },
    { id: 81, soal: "Pegunungan busur dalam memanjang dari mana hingga ke mana?", jawaban: "Dari Bukit Barisan di Pulau Sumatra menuju Jawa, Bali, Nusa Tenggara hingga Maluku, membentuk jalur gunung api", halaman: 11 },
    { id: 82, soal: "Topografi wilayah Indonesia yang kompleks berupa apa saja?", jawaban: "Dataran rendah, dataran tinggi, gunung, dan pegunungan", halaman: 11 },
    { id: 83, soal: "Bagaimana perbedaan iklim di dataran rendah dengan dataran tinggi, gunung, dan pegunungan di Indonesia?", jawaban: "Dataran rendah: beriklim tropis, rata-rata suhunya hangat\nDataran tinggi, gunung, dan pegunungan: beriklim subtropis atau sedang, suhu udara sejuk atau dingin", halaman: 11 },
    { id: 84, soal: "Kondisi iklim yang bervariasi akibat topografi menyebabkan…", jawaban: "Beragamnya budi daya pertanian dan wisata", halaman: 11 },
    { id: 85, soal: "Mengapa Indonesia menjadi negara rawan gempa bumi, tsunami, dan gunung berapi?", jawaban: "Karena letak tektonik wilayah Indonesia di antara pertemuan tiga lempeng litosfer", halaman: 11 },
    { id: 86, soal: "Urutkan provinsi dengan kejadian gempa bumi terbanyak di Indonesia!", jawaban: "1. Maluku\n2. Sulawesi Tengah\n3. Maluku Utara\n4. Nusa Tenggara Barat\n5. Nusa Tenggara Timur", halaman: 11 },
    { id: 87, soal: "Wilayah Indonesia yang jarang mengalami gempa bumi adalah…", jawaban: "Kalimantan", halaman: 11 },

    // ── Hal. 12 — Pengertian & klasifikasi sumber daya alam ──
    { id: 88, soal: "Keberagaman sumber daya alam Indonesia dipengaruhi oleh…", jawaban: "Letak negara Indonesia yang memiliki posisi strategis", halaman: 12 },
    { id: 89, soal: "Apa pengertian sumber daya alam?", jawaban: "Semua bahan yang ditemukan manusia di alam yang dapat dipakai untuk kepentingan hidupnya", halaman: 12 },
    { id: 90, soal: "Sebutkan sifat-sifat sumber daya alam secara umum!", jawaban: "1. Penyebarannya tidak merata di bumi\n2. Potensinya pada suatu daerah belum diketahui secara saksama\n3. Dapat mengalami daur ulang (recycling)", halaman: 12 },
    { id: 91, soal: "Sumber daya alam dapat diklasifikasikan berdasarkan…", jawaban: "Jenis, sifat, dan potensinya", halaman: 12 },
    { id: 92, soal: "Berdasarkan jenisnya, sumber daya alam dibedakan menjadi…", jawaban: "1. Sumber daya alam nonhayati (abiotik)\n2. Sumber daya alam hayati (biotik)", halaman: 12 },
    { id: 93, soal: "Apa pengertian sumber daya alam abiotik (nonhayati)?", jawaban: "Sumber daya alam fisik yang berbentuk benda mati di lingkungan", halaman: 12 },
    { id: 94, soal: "Sebutkan contoh sumber daya alam abiotik!", jawaban: "Mineral, batuan, udara, air, dan tanah", halaman: 12 },
    { id: 95, soal: "Sumber daya alam abiotik dibagi menjadi dua, yaitu…", jawaban: "1. Dapat diperbarui (air dan udara)\n2. Tidak dapat diperbarui (mineral)", halaman: 12 },

    // ── Hal. 13 — SDA hayati, sifat, potensi; potensi SDA kehutanan ──
    { id: 96, soal: "Sumber daya alam hayati (biotik) berupa apa, dan apa contohnya?", jawaban: "Berupa makhluk hidup (tumbuhan dan hewan). Contoh: tanaman pertanian, hewan liar, pakan ternak, hutan, dan hewan peliharaan", halaman: 13 },
    { id: 97, soal: "Mengapa sumber daya hayati (biotik) termasuk renewable resources?", jawaban: "Karena dapat terus meregenerasi dan memproduksi selama kondisi lingkungan tetap baik dan menguntungkan", halaman: 13 },
    { id: 98, soal: "Berdasarkan sifatnya, sumber daya alam dibedakan menjadi…", jawaban: "1. Sumber daya alam tidak dapat diperbarui (unrenewable resources)\n2. Sumber daya alam dapat diperbarui (renewable resources)", halaman: 13 },
    { id: 99, soal: "Apa pengertian sumber daya alam tidak dapat diperbarui (unrenewable resources)?", jawaban: "Sumber daya alam yang akan habis dan tidak tersedia lagi setelah dikonsumsi atau dipakai selama kurun waktu tertentu", halaman: 13 },
    { id: 100, soal: "Sebutkan contoh sumber daya alam yang tidak dapat diperbarui!", jawaban: "1. Mineral logam: timah, bijih besi, emas, nikel\n2. Mineral nonlogam: marmer, kapur, fosfat\n3. Sumber daya alam energi: minyak bumi, gas bumi, batu bara", halaman: 13 },
    { id: 101, soal: "Apa pengertian sumber daya alam dapat diperbarui (renewable resources)?", jawaban: "Sumber daya alam yang ketika persediaannya habis dapat diproduksi kembali dalam periode waktu yang singkat melalui proses mekanis, kimia, maupun fisika", halaman: 13 },
    { id: 102, soal: "Sebutkan contoh sumber daya alam yang dapat diperbarui!", jawaban: "Air, tumbuhan, hewan, dan kesuburan tanah", halaman: 13 },
    { id: 103, soal: "Berdasarkan potensinya, sumber daya alam terdiri dari tiga bagian, yaitu…", jawaban: "1. Sumber daya alam materi\n2. Sumber daya alam energi\n3. Sumber daya alam ruang", halaman: 13 },
    { id: 104, soal: "Apa yang dimaksud sumber daya alam materi, dan apa contohnya?", jawaban: "Sumber daya yang dapat dimanfaatkan bentuk fisiknya. Contoh: kayu, emas, besi, dan batu", halaman: 13 },
    { id: 105, soal: "Apa yang dimaksud sumber daya alam energi, dan apa contohnya?", jawaban: "Sumber daya yang dimanfaatkan energinya. Contoh: energi pasang surut, sinar matahari, gas bumi, dan minyak bumi", halaman: 13 },
    { id: 106, soal: "Apa yang dimaksud sumber daya alam ruang?", jawaban: "Sumber daya yang berbentuk ruang, digunakan untuk tempat tinggal dan beraktivitas manusia", halaman: 13 },
    { id: 107, soal: "Mengapa potensi sumber daya alam yang dimiliki Indonesia sangat banyak?", jawaban: "Karena Indonesia merupakan negara kepulauan dan negara maritim dengan wilayah perairan yang sangat luas", halaman: 13 },
    { id: 108, soal: "Selain produksi kayu, apa saja potensi hutan yang penting bagi kehidupan manusia?", jawaban: "1. Menyediakan udara yang kaya oksigen\n2. Menyediakan air tawar yang jernih\n3. Menyediakan plasma nutfah yang penting untuk bahan obat-obatan", halaman: 13 },
    { id: 109, soal: "Berdasarkan laporan BPS, berapa luas tutupan hutan Indonesia dan di mana tutupan paling besar?", jawaban: "101,22 juta hektare, tutupan paling besar berada di Papua", halaman: 13 },
    { id: 110, soal: "Hutan di Indonesia dapat dibedakan berdasarkan…", jawaban: "Jenis dan fungsinya", halaman: 13 },
    { id: 111, soal: "Hutan musim disebut juga hutan homogen. Mengapa?", jawaban: "Karena tumbuhannya hanya terdiri atas satu jenis pohon", halaman: 13 },

    // ── Hal. 14 — Jenis-jenis hutan ──
    { id: 112, soal: "Sebutkan ciri-ciri hutan musim!", jawaban: "1. Pohonnya jarang\n2. Ketinggian pohon antara 12–35 meter\n3. Pada musim kemarau daunnya meranggas (berguguran), pada musim penghujan bersemi", halaman: "13–14" },
    { id: 113, soal: "Sebutkan contoh hutan musim!", jawaban: "Hutan jati, hutan cemara, dan hutan pinus", halaman: 14 },
    { id: 114, soal: "Di mana hutan musim banyak terdapat di Indonesia?", jawaban: "Di daerah Indonesia bagian tengah, seperti Jawa Tengah, Jawa Timur, sampai Nusa Tenggara", halaman: 14 },
    { id: 115, soal: "Apa pengertian hutan hujan tropis?", jawaban: "Hutan rimba yang memiliki pohon-pohon yang lebat", halaman: 14 },
    { id: 116, soal: "Hutan hujan tropis terdapat di daerah yang seperti apa?", jawaban: "Daerah yang memiliki curah hujan tinggi dengan temperatur udara yang juga tinggi sepanjang tahun", halaman: 14 },
    { id: 117, soal: "Tanaman apa saja yang tumbuh di hutan hujan tropis?", jawaban: "Anggrek, cendawan, rotan, serta liana", halaman: 14 },
    { id: 118, soal: "Hutan hujan tropis disebut juga hutan heterogen. Mengapa?", jawaban: "Karena ditumbuhi oleh berbagai jenis tumbuhan", halaman: 14 },
    { id: 119, soal: "Sebutkan ciri-ciri hutan hujan tropis!", jawaban: "1. Keadaan di dalam hutan gelap dan lembap karena sinar matahari tidak dapat menembus rimbunnya daun\n2. Banyak tumbuhan menjalar, seperti rotan dan anggrek\n3. Pohon-pohonnya besar, tinggi, dan rapat\n4. Berdaun lebar dan menghijau sepanjang tahun", halaman: 14 },
    { id: 120, soal: "Di mana hutan hujan tropis banyak terdapat di Indonesia?", jawaban: "Pulau Sumatra, Kalimantan, dan Papua", halaman: 14 },
    { id: 121, soal: "Apa pengertian sabana?", jawaban: "Daerah padang rumput yang luas dengan diselingi adanya pepohonan atau semak-semak di sekitarnya", halaman: 14 },
    { id: 122, soal: "Sabana terdapat di daerah yang seperti apa, dan cocok dimanfaatkan untuk apa?", jawaban: "Daerah yang memiliki curah hujan rendah. Sabana yang luas sangat cocok untuk peternakan", halaman: 14 },
    { id: 123, soal: "Di mana sabana banyak terdapat di Indonesia?", jawaban: "Di daerah Nusa Tenggara dan Dataran Tinggi Aceh", halaman: 14 },
    { id: 124, soal: "Apa pengertian stepa, dan biasanya ditemukan di daerah seperti apa?", jawaban: "Padang rumput yang sangat luas. Biasanya ditemukan di daerah yang mengalami musim kemarau panjang dan memiliki curah hujan rendah", halaman: 14 },
    { id: 125, soal: "Mengapa di stepa hanya tanaman rumput yang dapat tumbuh?", jawaban: "Karena curah hujannya sangat rendah, sedangkan tanaman rumput tidak memerlukan banyak air", halaman: 14 },
    { id: 126, soal: "Di mana stepa banyak terdapat di Indonesia?", jawaban: "Di daerah Nusa Tenggara, terutama Nusa Tenggara Timur", halaman: 14 },
    { id: 127, soal: "Di mana hutan rawa banyak terdapat di Indonesia?", jawaban: "Sumatra bagian timur, Kalimantan Barat, Kalimantan Selatan, Kalimantan Tengah, dan Jawa bagian utara", halaman: 14 },
    { id: 128, soal: "Hutan rawa dibedakan menjadi…", jawaban: "1. Hutan rawa air tawar\n2. Hutan rawa gambut", halaman: 14 },
    { id: 129, soal: "Bagaimana hasil kayu dari hutan rawa air tawar, dan apa kelebihannya?", jawaban: "Hasil kayunya kurang baik, namun tanahnya dapat digunakan untuk pertanian", halaman: 14 },
    { id: 130, soal: "Hutan rawa gambut dapat menghasilkan…", jawaban: "Berbagai macam kayu, salah satunya kayu ramin", halaman: 14 },
    { id: 131, soal: "Tundra disebut juga hutan apa, dan seperti apa kondisinya?", jawaban: "Hutan lumut, terdiri atas pepohonan yang ditumbuhi lumut", halaman: 14 },
    { id: 132, soal: "Tundra banyak ditemukan di mana, dan bagaimana kondisi udaranya?", jawaban: "Di pegunungan-pegunungan yang tinggi dan letaknya sangat tinggi dari permukaan laut, sehingga udaranya sangat lembap dan suhunya rendah sekali", halaman: 14 },
    { id: 133, soal: "Sebutkan contoh lokasi tundra (hutan lumut) di Indonesia!", jawaban: "Pegunungan tinggi di Papua, Sumatra, Kalimantan, Sulawesi, dan Jawa", halaman: 14 },

    // ── Hal. 15 — Hutan berdasarkan fungsinya, hasil hutan, gaharu ──
    { id: 134, soal: "Berdasarkan fungsinya, hutan dibedakan menjadi…", jawaban: "1. Hutan produksi\n2. Hutan lindung\n3. Hutan konservasi", halaman: 15 },
    { id: 135, soal: "Apa pengertian hutan produksi?", jawaban: "Kawasan hutan yang berfungsi untuk memproduksi atau mengeksploitasi hasil hutan", halaman: 15 },
    { id: 136, soal: "Sebutkan ciri-ciri hutan produksi!", jawaban: "1. Berada dalam pengawasan ketat\n2. Terdapat satu jenis tanaman\n3. Dipergunakan untuk konsumtif\n4. Memiliki wilayah cukup luas\n5. Dikelola perusahaan swasta atau pemerintah", halaman: 15 },
    { id: 137, soal: "Mengapa hutan sering disebut emas hijau?", jawaban: "Karena kayu memiliki nilai ekonomis yang tinggi. Potensi hasil hutan ini sangat penting dalam meningkatkan devisa negara", halaman: 15 },
    { id: 138, soal: "Kayu jati banyak dihasilkan di…", jawaban: "Jawa Tengah", halaman: 15 },
    { id: 139, soal: "Kayu cendana banyak dihasilkan di…", jawaban: "Nusa Tenggara Timur", halaman: 15 },
    { id: 140, soal: "Kayu keruing, meranti, dan agathis banyak dihasilkan di…", jawaban: "Papua, Sulawesi, dan Kalimantan", halaman: 15 },
    { id: 141, soal: "Kayu rasamala dan akasia banyak dihasilkan di…", jawaban: "Jawa Barat", halaman: 15 },
    { id: 142, soal: "Rotan banyak dihasilkan di…", jawaban: "Kalimantan, Sumatra Utara, dan Sumatra Barat", halaman: 15 },
    { id: 143, soal: "Sebutkan hasil hutan nonkayu!", jawaban: "Buah-buahan, getah dan resin, madu, rotan, terpentin, minyak kayu putih, damar, sagu, sutra, dan lain-lain", halaman: 15 },
    { id: 144, soal: "Apa pengertian hutan lindung?", jawaban: "Hutan yang dilindungi agar fungsinya sebagai penyangga kehidupan terjaga dan terpelihara", halaman: 15 },
    { id: 145, soal: "Apa fungsi hutan lindung?", jawaban: "Melindungi suatu daerah atau wilayah dari bencana alam, seperti tanah longsor, kekeringan, banjir bandang, dan bencana ekologis lainnya", halaman: 15 },
    { id: 146, soal: "Apa pengertian hutan konservasi?", jawaban: "Hutan yang berfungsi sebagai cadangan kebutuhan pengawetan ekosistem dan keanekaragaman hayati", halaman: 15 },
    { id: 147, soal: "Hutan konservasi terdiri dari tiga macam, yaitu…", jawaban: "1. Kawasan hutan suaka alam\n2. Kawasan hutan pelestarian alam\n3. Taman buru", halaman: 15 },
    { id: 148, soal: "Apa yang dimaksud kawasan hutan suaka alam?", jawaban: "Hutan dengan ciri khas tertentu yang mempunyai fungsi pokok sebagai pengawasan pengawetan keanekaragaman tumbuhan dan satwa beserta ekosistemnya. Selain itu, juga berfungsi sebagai wilayah sistem penyangga kehidupan", halaman: 15 },
    { id: 149, soal: "Apa yang dimaksud kawasan hutan pelestarian alam?", jawaban: "Hutan dengan ciri khas tertentu yang mempunyai fungsi pokok perlindungan sistem penyangga kehidupan, pengawetan keanekaragaman jenis tumbuhan dan satwa, serta pemanfaatan secara lestari sumber daya alam hayati dan ekosistemnya", halaman: 15 },
    { id: 150, soal: "Apa yang dimaksud taman buru?", jawaban: "Kawasan hutan yang ditetapkan sebagai tempat wisata berburu", halaman: 15 },
    { id: 151, soal: "Apa itu gaharu?", jawaban: "Kayu berwarna kehitaman dan mengandung resin khas yang dihasilkan oleh sejumlah spesies pohon dari genus Aquilaria, terutama A. malaccensis", halaman: 15 },
    { id: 152, soal: "Resin gaharu digunakan dalam industri apa, dan mengapa?", jawaban: "Industri wangi-wangian (parfum dan setanggi), karena berbau harum", halaman: 15 },
    { id: 153, soal: "Sejak kapan dan ke mana saja gaharu diperdagangkan dari Kepulauan Nusantara?", jawaban: "Sejak lebih dari 2000 tahun yang lalu, ke India, Persia, Jazirah Arab, Mesir, hingga Afrika Timur", halaman: 15 },
    { id: 154, soal: "Dalam dunia perdagangan, gaharu bernilai tinggi dan gaharu bernilai jual rendah disebut apa?", jawaban: "Nilai tinggi: gaharu beringin\nNilai jual rendah: gaharu buaya", halaman: 15 },
    { id: 155, soal: "Kualitas gaharu ditentukan oleh apa saja?", jawaban: "1. Jenis tanaman penghasilnya\n2. Banyaknya kandungan resin dalam jaringan kayunya\n3. Apakah dari pohon liar atau dibudidayakan (gaharu dari alam liar berkualitas lebih tinggi dan lebih mahal)", halaman: 15 },

    // ── Hal. 16 — Fungsi hutan, potensi kelautan, mangrove, perikanan ──
    { id: 156, soal: "Mengapa hutan di lingkungan sekitar harus dijaga dan dilestarikan?", jawaban: "Karena manusia dan hutan saling membutuhkan", halaman: 16 },
    { id: 157, soal: "Sebutkan fungsi-fungsi hutan di Indonesia!", jawaban: "1. Fungsi pertahanan (strategis)\n2. Mencegah erosi (orologis)\n3. Mengatur tata air (hidrologis)\n4. Mengatur iklim (klimatologis)\n5. Fungsi keindahan (estetika)", halaman: 16 },
    { id: 158, soal: "Apa yang dimaksud fungsi strategis (pertahanan) hutan?", jawaban: "Fungsi hutan untuk keperluan pertahanan bila terjadi perang", halaman: 16 },
    { id: 159, soal: "Apa yang dimaksud fungsi orologis hutan?", jawaban: "Mencegah erosi, yaitu menahan hanyutnya bunga tanah dan erosi serta melindungi permukaan tanah lapisan atas (top soil)", halaman: 16 },
    { id: 160, soal: "Apa yang dimaksud fungsi hidrologis hutan?", jawaban: "Mengatur tata air, yaitu sebagai penyimpan air dan mengatur beredarnya air tanah atau mata air", halaman: 16 },
    { id: 161, soal: "Apa yang dimaksud fungsi klimatologis hutan?", jawaban: "Mengatur iklim, yaitu agar kelembapan udara tetap, suhu udara tidak terlalu tinggi, dan penguapan air tanah berkurang karena tertutup oleh hutan", halaman: 16 },
    { id: 162, soal: "Apa yang dimaksud fungsi estetika hutan?", jawaban: "Fungsi keindahan, yaitu hutan dinikmati pemandangannya karena keindahannya untuk rekreasi", halaman: 16 },
    { id: 163, soal: "Mengapa Indonesia dijuluki negara maritim?", jawaban: "Karena sebagian besar wilayahnya berupa perairan, yaitu mencakup 2/3 dari keseluruhan wilayah Indonesia", halaman: 16 },
    { id: 164, soal: "Berapa luas perairan laut Indonesia dan panjang garis pantainya?", jawaban: "Perairan laut seluas 5,9 juta km² dengan garis pantai sepanjang 95.161 km", halaman: 16 },
    { id: 165, soal: "Potensi sumber daya kelautan dikelompokkan menjadi dua jenis, yaitu…", jawaban: "1. Sumber daya alam kelautan dapat diperbarui\n2. Sumber daya alam kelautan tidak dapat diperbarui", halaman: 16 },
    { id: 166, soal: "Potensi sumber daya alam kelautan yang dapat diperbarui terdiri atas…", jawaban: "Potensi kelautan, hutan mangrove, dan potensi bioteknologi", halaman: 16 },
    { id: 167, soal: "Sebutkan contoh potensi sumber daya alam kelautan yang tidak dapat diperbarui!", jawaban: "Tambang dasar laut, seperti aluminium, mangan, tembaga, timah, dan sebagainya", halaman: 16 },
    { id: 168, soal: "Apa pengertian hutan mangrove?", jawaban: "Hutan bakau, yaitu tipe hutan yang berada di daerah pasang surut air laut", halaman: 16 },
    { id: 169, soal: "Hutan mangrove bermanfaat dalam segi apa saja?", jawaban: "Ekologis, penguatan ekonomi, dan biologis", halaman: 16 },
    { id: 170, soal: "Apa manfaat hutan mangrove dari segi ekologis?", jawaban: "Mencegah erosi, abrasi air laut, mengolah limbah beracun, dan lainnya", halaman: 16 },
    { id: 171, soal: "Apa manfaat hutan mangrove dari segi ekonomi?", jawaban: "Sebagai sumber penghasil kayu, tempat wisata, bahan bangunan, dan lainnya", halaman: 16 },
    { id: 172, soal: "Apa manfaat hutan mangrove dari segi biologis?", jawaban: "Sebagai sumber plasma nutfah, tempat pemijahan dan perkembangbiakan ikan, kerang, kepiting, serta perkembangbiakan satwa burung", halaman: 16 },
    { id: 173, soal: "Di mana persebaran hutan mangrove di Indonesia?", jawaban: "Tidak merata, terdapat di Pulau Papua, Sumatra, Kalimantan, Sulawesi, Jawa, Bali, dan Nusa Tenggara", halaman: 16 },
    { id: 174, soal: "Berapa angka potensi lestari perikanan laut Indonesia?", jawaban: "6,4 juta ton per tahun", halaman: 16 },
    { id: 175, soal: "Wilayah perairan Indonesia sebagian besar memiliki potensi perikanan jenis apa?", jawaban: "Perikanan pelagis", halaman: 16 },
    { id: 176, soal: "Di Indonesia bagian barat, berapa rata-rata kedalaman laut dan jenis ikan apa yang banyak ditemukan?", jawaban: "Rata-rata kedalaman 75 meter, banyak ditemukan ikan pelagis kecil", halaman: 16 },
    { id: 177, soal: "Jenis ikan apa yang banyak ditemukan di kawasan Indonesia Timur?", jawaban: "Ikan pelagis besar, seperti cakalang dan tuna", halaman: 16 },
    { id: 178, soal: "Di pantai utara Pulau Jawa, masyarakat mengembangkan usaha budi daya apa?", jawaban: "Budi daya ikan bandeng dan udang", halaman: 16 },
    { id: 179, soal: "Banyak sedikitnya jumlah ikan di suatu kawasan perairan dipengaruhi oleh faktor apa?", jawaban: "Suhu dan kedalaman laut", halaman: 16 },
  ],

  // Sumber: TNT Sosiologi XI (GPP) Semester 1 — Bab 1 Masalah Sosial
  "Sosiologi": [
    // ── Hal. 7 — Apersepsi ──
    { id: 1, soal: "Sebutkan contoh masalah sosial yang terjadi di lingkungan sekitar (apersepsi Bab 1)!", jawaban: "1. Banyaknya anak kecil yang seharusnya masih bermain bersama teman-temannya justru menjadi pengamen di jalanan untuk mencari uang\n2. Kesenjangan kehidupan di wilayah perkotaan dan pinggiran kota", halaman: 7 },

    // ── Hal. 8 — Pengertian masalah sosial ──
    { id: 2, soal: "Gejala sosial muncul karena…", jawaban: "Adanya interaksi dan hubungan sosial dalam masyarakat", halaman: 8 },
    { id: 3, soal: "Gejala sosial seperti apa yang nantinya menimbulkan permasalahan sosial?", jawaban: "Gejala sosial yang berakibat negatif", halaman: 8 },
    { id: 4, soal: "Apa yang menjadi parameter untuk menentukan suatu permasalahan sosial?", jawaban: "Nilai dan norma yang berlaku di tengah masyarakat", halaman: 8 },
    { id: 5, soal: "Kapan masalah sosial terjadi?", jawaban: "Saat muncul kondisi sosial yang dianggap membahayakan oleh sebagian masyarakat dan memerlukan penyelesaian", halaman: 8 },
    { id: 6, soal: "Apa pengertian masalah sosial menurut Coleman dan Cressey?", jawaban: "Suatu gejala (fenomena) sosial yang mempunyai dimensi atau aspek kajian yang sangat luas atau kompleks dan dapat ditinjau dari berbagai perspektif (sudut pandang atau teori)", halaman: 8 },
    { id: 7, soal: "Apa pengertian masalah sosial menurut Martin S. Weinberg?", jawaban: "Situasi yang dinyatakan sebagai sesuatu yang bertentangan dengan nilai-nilai oleh warga masyarakat yang cukup signifikan, di mana mereka sepakat dibutuhkan suatu tindakan untuk mengubah situasi tersebut", halaman: 8 },
    { id: 8, soal: "Apa pengertian masalah sosial menurut Soetomo?", jawaban: "Suatu kondisi yang tidak diinginkan terjadi oleh sebagian besar dari warga masyarakat", halaman: 8 },
    { id: 9, soal: "Apa pengertian masalah sosial menurut Soerjono Soekanto?", jawaban: "Suatu ketidaksesuaian antara unsur-unsur kebudayaan atau masyarakat yang membahayakan kehidupan kelompok sosial", halaman: 8 },
    { id: 10, soal: "Apa pengertian masalah sosial menurut Rubington dan Weinberg?", jawaban: "Suatu kondisi yang dinyatakan tidak sesuai dengan nilai-nilai yang dianut oleh sebagian warga yang sepakat bahwa suatu kegiatan bersama diperlukan untuk mengubah kondisi itu", halaman: 8 },
    { id: 11, soal: "Kapan masalah pribadi dapat menjadi masalah sosial? Berikan contohnya!", jawaban: "Apabila banyak orang memiliki pengalaman yang sama, sehingga berpengaruh terhadap kondisi sosial masyarakat yang lebih luas. Contoh: kemiskinan yang dialami oleh banyak keluarga karena pengangguran", halaman: 8 },
    { id: 12, soal: "Ada dua elemen penting terkait masalah sosial, yaitu…", jawaban: "Elemen subjektif dan elemen objektif", halaman: 8 },
    { id: 13, soal: "Apa yang dimaksud elemen subjektif dari masalah sosial, dan mengapa disebut subjektif?", jawaban: "Menyangkut keyakinan bahwa kondisi sosial tertentu berbahaya bagi masyarakat dan harus diatasi. Bersifat subjektif karena masyarakat memiliki relativitas pandangan hidup, nilai, norma, budaya, dan suatu aturan", halaman: 8 },
    { id: 14, soal: "Apa yang dimaksud elemen objektif dari masalah sosial?", jawaban: "Menyangkut keberadaan suatu kondisi sosial. Kesadaran sosial, pengalaman hidup, dan pengakuan publik menjadi elemen objektif dalam menentukan masalah sosial", halaman: 8 },
    { id: 15, soal: "Sebutkan ciri-ciri permasalahan sosial!", jawaban: "1. Dirasakan oleh banyak orang\n2. Memerlukan suatu pemecahan\n3. Menimbulkan kondisi yang tidak menyenangkan\n4. Pemecahannya harus secara keseluruhan atau kolektif", halaman: 8 },

    // ── Hal. 9 — Faktor penyebab & tahapan terjadinya masalah sosial ──
    { id: 16, soal: "Sebutkan empat faktor penyebab terjadinya masalah sosial!", jawaban: "1. Faktor ekonomi\n2. Faktor budaya\n3. Faktor biologis\n4. Faktor psikologi", halaman: 9 },
    { id: 17, soal: "Jelaskan faktor ekonomi sebagai penyebab masalah sosial!", jawaban: "Berkaitan erat dengan kemiskinan atau pengangguran yang membuat hidup dalam kesulitan. Kemiskinan meningkatkan angka kriminalitas dan tunawisma di kota besar", halaman: 9 },
    { id: 18, soal: "Jelaskan faktor budaya sebagai penyebab masalah sosial!", jawaban: "Dipicu karena adanya ketidaksesuaian pelaksanaan norma, nilai, dan kepentingan sosial akibat adanya proses perubahan sosial dan pola masyarakat yang heterogen atau multikultural", halaman: 9 },
    { id: 19, soal: "Jelaskan faktor biologis sebagai penyebab masalah sosial, beserta contohnya!", jawaban: "Masalah kesehatan atau gangguan fisik yang memengaruhi interaksi sosial, akibat ketidaksesuaian keadaan lingkungan yang berpotensi menimbulkan ketidakstabilan kondisi biologis masyarakat. Contoh: wabah penyakit menular, virus penyakit baru, dan makanan beracun", halaman: 9 },
    { id: 20, soal: "Jelaskan faktor psikologi sebagai penyebab masalah sosial!", jawaban: "Berhubungan dengan pola pikir suatu masyarakat atau pribadi tertentu yang bersinggungan dengan tatanan kehidupan sosial. Juga muncul jika beban hidup berat dirasakan masyarakat (khususnya di perkotaan): pekerjaan menumpuk → stres → luapan emosi → memicu konflik antaranggota masyarakat", halaman: 9 },
    { id: 21, soal: "Sebutkan faktor-faktor psikologi yang menyebabkan masalah sosial!", jawaban: "1. Masih belum dewasa, belum dapat membedakan benar dan salah\n2. Lingkungan dan teman yang tidak baik\n3. Keyakinan terhadap agama dan negara yang lemah\n4. Orang tua yang kurang memperhatikan anaknya", halaman: 9 },
    { id: 22, soal: "Sebutkan tahapan terjadinya masalah sosial!", jawaban: "1. Kemunculan isu (emergence)\n2. Pengajuan klaim (claims making)\n3. Legitimasi (legitimatizing)\n4. Pembentukan opini publik\n5. Penyusunan strategi alternatif\n6. Evaluasi dan reaksi", halaman: 9 },
    { id: 23, soal: "Apa yang terjadi pada tahap kemunculan isu (emergence)?", jawaban: "Tahap awal di mana individu atau kelompok mulai merasakan adanya ketidakpuasan atau kondisi yang tidak sesuai dengan nilai dan norma masyarakat", halaman: 9 },
    { id: 24, soal: "Apa yang terjadi pada tahap pengajuan klaim (claims making)?", jawaban: "Kelompok yang merasa dirugikan mulai menyuarakan keluhan mereka secara publik untuk meyakinkan pihak lain bahwa kondisi tersebut adalah masalah yang harus segera ditangani", halaman: 9 },
    { id: 25, soal: "Apa yang terjadi pada tahap legitimasi (legitimatizing)?", jawaban: "Masalah mulai mendapat pengakuan dari lembaga resmi, pemerintah, atau media massa, sehingga tidak lagi dianggap sebagai masalah individu melainkan masalah sosial yang nyata", halaman: 9 },
    { id: 26, soal: "Apa yang terjadi pada tahap pembentukan opini publik?", jawaban: "Terjadi perdebatan luas di masyarakat mengenai penyebab dan solusi dari masalah tersebut, yang sering kali melibatkan berbagai kelompok kepentingan", halaman: 9 },
    { id: 27, soal: "Apa yang terjadi pada tahap penyusunan strategi alternatif?", jawaban: "Pihak berwenang atau kelompok aktivis mulai merumuskan kebijakan, program, atau langkah konkret untuk mengatasi atau mengurangi dampak dari masalah tersebut", halaman: 9 },
    { id: 28, soal: "Apa yang terjadi pada tahap evaluasi dan reaksi?", jawaban: "Efektivitas solusi yang telah dijalankan dinilai kembali. Jika solusi dianggap gagal, klaim baru mungkin diajukan kembali untuk mencari strategi yang lebih baik", halaman: 9 },

    // ── Hal. 10 — Perspektif sosiologi mengenai masalah sosial ──
    { id: 29, soal: "Bagaimana masalah sosial di tingkat lokal dapat menjadi masalah sosial global?", jawaban: "Masalah sosial di tingkat lokal yang terjadi di berbagai wilayah akhirnya akan menjadi masalah sosial global. Akumulasi masalah di berbagai belahan dunia menjadi isu global yang perlu ditangani bersama", halaman: 10 },
    { id: 30, soal: "Tiga teori dasar sosiologi yang menjadi sudut pandang untuk menjelaskan masalah sosial adalah…", jawaban: "1. Perspektif fungsionalis\n2. Perspektif konflik\n3. Perspektif interaksionis", halaman: 10 },
    { id: 31, soal: "Jelaskan perspektif fungsionalis dalam memandang masalah sosial!", jawaban: "Semua bagian masyarakat mempunyai fungsinya masing-masing dan saling bekerja sama membangun tatanan sosial yang stabil dan harmonis. Masyarakat dianggap seperti tubuh manusia yang memiliki organ dengan tugasnya masing-masing. Jika satu elemen tidak berfungsi dengan baik → ketidakteraturan → masalah sosial. Jadi, masalah sosial terjadi karena disfungsi lembaga-lembaga sosial dalam masyarakat", halaman: 10 },
    { id: 32, soal: "Jelaskan perspektif konflik dalam memandang masalah sosial!", jawaban: "Melihat masyarakat sebagai arena memperebutkan kepentingan. Setiap kelompok punya tujuan, nilai, dan kepentingan yang berbeda; ketika kepentingan itu saling bertabrakan, muncullah masalah sosial. Memandang masyarakat pada level makro-meso, seperti kelompok-kelompok sosial yang selalu bersaing dan bertentangan", halaman: 10 },
    { id: 33, soal: "Jelaskan perspektif interaksionis dalam memandang masalah sosial!", jawaban: "Manusia tidak hanya bereaksi terhadap situasi sosial, tetapi menafsirkan dan memberi makna pada setiap tindakan dan simbol (misalnya senyuman bisa berarti keramahan atau sindiran). Perilaku sosial lahir dari makna simbolik yang dibangun dan disepakati bersama melalui interaksi. Cara orang memaknai suatu tindakan memengaruhi tindakannya — di sinilah akar banyak permasalahan sosial", halaman: 10 },
    { id: 34, soal: "Perspektif interaksionis digunakan pada tingkat apa, dan mengapa bersifat subjektif?", jawaban: "Tingkat mikro, yakni interaksi antarindividu dalam kelompok masyarakat. Bersifat subjektif karena melihat individu dalam sistem masyarakat", halaman: 10 },
    { id: 35, soal: "Menurut perspektif fungsionalis, mengapa perundungan di sekolah terjadi?", jawaban: "Karena disfungsi regulasi, ketahanan, dan pengawasan lembaga pendidikan yang lemah", halaman: 10 },
    { id: 36, soal: "Menurut perspektif konflik, mengapa perundungan di sekolah terjadi?", jawaban: "Karena adanya dominasi/tekanan antara kelompok berpengaruh terhadap kelompok yang lebih lemah", halaman: 10 },
    { id: 37, soal: "Menurut perspektif interaksionis, mengapa perundungan di sekolah terjadi?", jawaban: "Karena pengalaman hidup seseorang yang pernah mengalami penyimpangan, sehingga dirinya pun melakukan penyimpangan. Misalnya, sosialisasi kurang sempurna di rumah karena orang tua sering melakukan kekerasan mendorong anak melakukan tindakan serupa di sekolah", halaman: 10 },

    // ── Hal. 11 — Tabel perbedaan perspektif; isu eksklusi sosial ──
    { id: 38, soal: "Berdasarkan tabel perbedaan perspektif, bagaimana cara pandang dan penyebab masalah sosial menurut perspektif FUNGSIONALIS?", jawaban: "Cara pandang: masyarakat sebagai organisme yang saling berhubungan; masalah sosial adalah gangguan dalam sistem, yaitu disfungsi dari berbagai sistem sosial\nPenyebab masalah: kegagalan ekspektasi sosial, ketidaknormalan, konflik budaya, dan kehancuran; juga beroperasinya lembaga-lembaga yang bersifat impersonal, baik masa sekarang maupun masa lalu", halaman: 11 },
    { id: 39, soal: "Berdasarkan tabel perbedaan perspektif, bagaimana cara pandang dan penyebab masalah sosial menurut perspektif KONFLIK?", jawaban: "Cara pandang: masyarakat ditandai dengan konflik akibat kesenjangan kelas, ras, etnis, gender, usia, dan perpecahan lain sehingga menghasilkan nilai-nilai yang bertentangan; masalah sosial adalah kondisi yang tidak sesuai dengan nilai-nilai masyarakat\nPenyebab masalah: kelompok dengan nilai-nilai berbeda serta jumlah kekuasaan berbeda saling bertemu dan bersaing", halaman: 11 },
    { id: 40, soal: "Berdasarkan tabel perbedaan perspektif, bagaimana cara pandang dan penyebab masalah sosial menurut perspektif INTERAKSIONIS?", jawaban: "Cara pandang: masalah sosial bersifat subjektif; orang menyimpang dan tidak menyimpang dibedakan bukan berdasarkan apa yang dilakukan, melainkan berdasarkan respons masyarakat terhadap apa yang dilakukan\nPenyebab masalah: masyarakat menjadi sadar akan adanya perilaku tertentu dan mengategorikannya sebagai masalah sosial", halaman: 11 },
    { id: 41, soal: "Mengapa masyarakat Indonesia berpotensi menimbulkan berbagai masalah sosial?", jawaban: "Karena masyarakat Indonesia sangat beragam dan hubungan sosial masyarakatnya bersifat dinamis", halaman: 11 },
    { id: 42, soal: "Sebutkan isu-isu utama dalam mengkaji masalah sosial!", jawaban: "1. Eksklusi dan segregasi sosial\n2. Partikularisme\n3. Perilaku menyimpang\n4. Isu-isu sosial lainnya", halaman: "11–12" },
    { id: 43, soal: "Eksklusi sosial mengarah pada…", jawaban: "Peminggiran kelompok-kelompok sosial tertentu", halaman: 11 },
    { id: 44, soal: "Apa pengertian eksklusi sosial (social exclusion) menurut Beall dan Piron (2005)?", jawaban: "Proses peminggiran sosial terhadap beberapa kelompok yang didiskriminasikan atas dasar etnis, ras, agama, orientasi seksual, kasta, keturunan, gender, usia, kecacatan, HIV, serta migran, atau berdasarkan lokasi di mana mereka tinggal (dirugikan karena lokasi tempat tinggalnya tidak tersentuh kegiatan pembangunan)", halaman: 11 },
    { id: 45, soal: "Siapa yang mengemukakan konsep eksklusi sosial, dan kapan?", jawaban: "Rene Lenoir, Sekretaris Negara untuk Urusan Aksi Sosial Pemerintah Prancis, pada tahun 1970-an", halaman: 11 },
    { id: 46, soal: "Secara luas, eksklusi sosial mencakup siapa saja?", jawaban: "Orang-orang yang tidak memiliki kemampuan, baik materiel maupun moral, dalam berpartisipasi di berbagai aspek kehidupan sosial masyarakat", halaman: 11 },
    { id: 47, soal: "Apa saja faktor terjadinya eksklusi sosial?", jawaban: "Berbagai aspek kehidupan sosial, tidak hanya aspek sensitivitas antarkelompok, tetapi juga faktor lemahnya kehadiran negara dalam memfasilitasi dan menjembatani masyarakat", halaman: 11 },
    { id: 48, soal: "Sebutkan indikator yang menyebabkan terjadinya eksklusi sosial!", jawaban: "1. Akses terhadap sumber daya yang tidak setara\n2. Partisipasi yang tidak setara\n3. Peniadaan peluang", halaman: 11 },

    // ── Hal. 12 — Segregasi, partikularisme, perilaku menyimpang, isu lainnya ──
    { id: 49, soal: "Apa pengertian segregasi, dan mengapa dilakukan?", jawaban: "Pemisahan kelompok-kelompok sosial dalam kategori tertentu (mengarah pada pengelompokan sosial). Dilakukan karena adanya pelabelan atau stigma yang melekat terhadap anggota masyarakat yang memiliki kesamaan tertentu, sehingga kelompok tersebut tidak bisa bersatu, membaur, atau setara dengan kelompok sosial lainnya", halaman: 12 },
    { id: 50, soal: "Berikan contoh segregasi di bidang gender!", jawaban: "Pembedaan posisi (horizontal atau terkait diferensiasi) dan upah pekerja (vertikal atau stratifikasi sosial) antara perempuan dan laki-laki", halaman: 12 },
    { id: 51, soal: "Ketimpangan merujuk pada apa? Apa yang dimaksud ketimpangan sosial?", jawaban: "Ketimpangan merujuk pada ketidaksetaraan, terutama dalam perbedaan status, hak, dan peluang. Ketimpangan sosial adalah kondisi masyarakat yang memiliki akses tidak setara terhadap sumber daya, layanan, dan posisi yang berharga", halaman: 12 },
    { id: 52, soal: "Sikap partikularisme timbul akibat…", jawaban: "Sikap eksklusivisme yang berlarut-larut", halaman: 12 },
    { id: 53, soal: "Apa pengertian partikularisme?", jawaban: "Pemahaman individu yang berkaitan dengan pemenuhan kepentingan pribadi tanpa mempertimbangkan dampaknya bagi orang lain", halaman: 12 },
    { id: 54, soal: "Bagaimana kecenderungan orang yang menganut paham partikularisme?", jawaban: "1. Tidak memedulikan apa saja yang terjadi di lingkungan sekitarnya; yang terpenting hanyalah kepentingan pribadinya terpenuhi atau tidak\n2. Mengutamakan orang-orang yang sepemahaman atau sekelompok dengannya\n3. Mengutamakan kepentingan yang berkaitan dengan bidang ekonomi, politik, dan sosial budaya", halaman: 12 },
    { id: 55, soal: "Apa pengertian perilaku menyimpang (deviant behavior)?", jawaban: "Perilaku-perilaku yang bertentangan dengan nilai, norma, keyakinan, atau ekspektasi dalam masyarakat", halaman: 12 },
    { id: 56, soal: "Dalam sudut pandang sosiologi, perilaku menyimpang dibedakan menjadi dua jenis, yaitu…", jawaban: "Positivis dan konstruksionis", halaman: 12 },
    { id: 57, soal: "Bagaimana perilaku menyimpang dipandang dalam perspektif positivis?", jawaban: "Sebagai objek yang nyata, dapat diamati, ditentukan, serta terjadi akibat hubungan sebab akibat", halaman: 12 },
    { id: 58, soal: "Bagaimana perilaku menyimpang dipandang dalam perspektif konstruksionis?", jawaban: "Sebagai relativitas yang sebagian besar terjadi karena adanya labelling dan pengalaman subjektif", halaman: 12 },
    { id: 59, soal: "Berdasarkan sifatnya, perilaku menyimpang terbagi menjadi…", jawaban: "Perilaku negatif dan perilaku positif", halaman: 12 },
    { id: 60, soal: "Apa yang dimaksud perilaku menyimpang yang bersifat positif?", jawaban: "Perilaku menyimpang yang memberikan maupun memiliki dampak positif pada kehidupan sosial, karena memiliki unsur yang inovatif dan ide yang muncul juga kreatif, sehingga dapat memperkaya wawasan masyarakat", halaman: 12 },
    { id: 61, soal: "Apa yang dimaksud perilaku menyimpang yang bersifat negatif?", jawaban: "Perilaku yang memberikan dampak negatif pada sistem sosial, sebab memiliki unsur yang sifatnya merendahkan dan akan menyebabkan hal buruk terjadi", halaman: 12 },
    { id: 62, soal: "Bagaimana jumlah populasi penduduk yang terlalu tinggi atau terlalu sedikit dapat menimbulkan masalah sosial?", jawaban: "Terlalu tinggi: pertumbuhan penduduk yang pesat menekan kapasitas lingkungan untuk menyediakan sumber daya, yang kemudian memicu konflik dan masalah sosial\nTerlalu rendah: menyebabkan tidak terawatnya fasilitas umum dan hilangnya dinamika sosial", halaman: 12 },
    { id: 63, soal: "Apa yang dimaksud warganet, dan bagaimana pengaruh aktivitasnya?", jawaban: "Masyarakat yang hidup di dunia digital dan berinteraksi melalui berbagai media sosial. Mereka memiliki identitas, komunitas, dan jaringan sosial yang dinamis. Aktivitas di dunia digital dapat berpengaruh pada dunia nyata, baik bagi individu maupun sosial", halaman: 12 },

    // ── Hal. 13 — Ragam masalah sosial; ketimpangan ekonomi & kemiskinan ──
    { id: 64, soal: "Masalah sosial apa yang paling sering terlihat di lingkungan sekitar?", jawaban: "Kesenjangan sosial: di satu sisi ada yang hidup serba berkecukupan dan dapat membeli apa pun dengan mudah, di sisi lain ada masyarakat yang untuk memenuhi kebutuhan pokoknya saja tidak mampu. Selain itu, ada juga masalah yang dipicu perbedaan latar belakang suku dan etnis", halaman: 13 },
    { id: 65, soal: "Sebutkan ragam masalah sosial yang ada di masyarakat!", jawaban: "1. Ketimpangan ekonomi dan kemiskinan\n2. Ketidaksetaraan ras dan etnik\n3. Ketidaksetaraan gender\n4. Intoleransi\n5. Korupsi, kolusi, dan nepotisme\n6. Penyalahgunaan NAPZA\n7. Hubungan seks pranikah\n8. Pengaruh negatif media sosial\n9. Pencemaran lingkungan", halaman: "13–18" },
    { id: 66, soal: "Mengapa kondisi ekonomi masyarakat di Indonesia tidaklah sama?", jawaban: "Karena masih adanya ketimpangan ekonomi dan kemiskinan yang dialami penduduknya", halaman: 13 },
    { id: 67, soal: "Apa pengertian ketimpangan?", jawaban: "Keadaan di mana terjadi perbedaan yang signifikan antara individu atau kelompok dalam hal distribusi sumber daya, kesempatan, maupun hasil. Ketimpangan mencerminkan adanya disparitas yang mengakibatkan sebagian pihak lebih diuntungkan dibandingkan pihak lain", halaman: 13 },
    { id: 68, soal: "Ketimpangan ekonomi terjadi ketika…", jawaban: "Distribusi pendapatan dan kekayaan dalam suatu masyarakat tidak merata", halaman: 13 },
    { id: 69, soal: "Apa indikator yang sering dipakai untuk mengukur ketimpangan ekonomi, dan bagaimana membacanya?", jawaban: "Koefisien gini (rasio gini)\nMendekati 0 → pendapatan penduduk makin merata\nMendekati 1 → pendapatan makin timpang", halaman: 13 },
    { id: 70, soal: "Apa pengertian kemiskinan?", jawaban: "Suatu keadaan di mana seseorang tidak sanggup memelihara dirinya sendiri sesuai dengan taraf kehidupan kelompok dan juga tidak mampu memanfaatkan tenaga mental maupun fisiknya dalam kelompok tersebut", halaman: 13 },
    { id: 71, soal: "Tingkat kemiskinan di masyarakat dapat diukur melalui dua pendekatan, yaitu…", jawaban: "Kemiskinan absolut dan kemiskinan relatif", halaman: 13 },
    { id: 72, soal: "Apa yang dimaksud kemiskinan absolut, dan apa risikonya?", jawaban: "Kondisi ketika masyarakat tidak memiliki sarana untuk memenuhi kebutuhan hidup paling dasar. Masyarakat yang mengalaminya (kemiskinan ekstrem) berisiko menderita kekurangan gizi kronis atau meninggal dunia karena penyakit yang berhubungan dengan kelaparan", halaman: 13 },

    // ── Hal. 14 — Kemiskinan menurut tokoh; ketidaksetaraan ras & etnik ──
    { id: 73, soal: "Apa yang dimaksud kemiskinan relatif?", jawaban: "Kondisi ketika masyarakat mampu memenuhi kebutuhan dasar seperti makanan, pakaian, dan tempat tinggal, tetapi tidak dapat mempertahankan standar hidup rata-rata dibandingkan anggota masyarakat lainnya", halaman: 14 },
    { id: 74, soal: "Bagaimana pandangan Georg Simmel mengenai kemiskinan?", jawaban: "Kemiskinan dibedakan menjadi dua:\n1. Kemiskinan individual: dialami seseorang yang secara absolut tidak bisa memenuhi kebutuhan hidupnya dan membutuhkan bantuan hidup\n2. Kemiskinan sosial: terjadi karena adanya pelabelan pada diri seseorang", halaman: 14 },
    { id: 75, soal: "Bagaimana pandangan Pierre Bourdieu dan Jean Claude Passeron mengenai kemiskinan?", jawaban: "Kemiskinan dilihat dari sudut pandang budaya, yaitu dipengaruhi oleh kurangnya cultural capital (modal budaya): aset sosial seperti nilai, keyakinan, sikap, kompetensi bahasa, dan budaya yang dipelajari di rumah untuk keberhasilan dan kemajuan sosial", halaman: 14 },
    { id: 76, soal: "Bagaimana pandangan Karl Marx mengenai kemiskinan?", jawaban: "Kemiskinan dilihat dari sudut pandang kelas dan kekuasaan. Kemiskinan berkaitan dengan ketimpangan kelas dan ketidakberpihakan politik, di mana kapitalisme dan elite politik yang korup melanggengkan ketidakadilan", halaman: 14 },
    { id: 77, soal: "Kemiskinan dapat memicu masalah sosial lain, seperti…", jawaban: "Kriminalitas, stunting, kekerasan dalam rumah tangga, atau disintegrasi sosial", halaman: 14 },
    { id: 78, soal: "Apa yang dimaksud ras?", jawaban: "Pengelompokan masyarakat berdasarkan karakteristik fisik seperti warna kulit, tekstur rambut, bentuk mata, atau atribut lainnya", halaman: 14 },
    { id: 79, soal: "Apa yang dimaksud etnik atau suku bangsa?", jawaban: "Pengelompokan masyarakat yang didasari oleh kesamaan budaya ataupun kebangsaan tertentu", halaman: 14 },
    { id: 80, soal: "Apa itu etnosentrisme, dan bagaimana pemahaman ini terbentuk?", jawaban: "Pandangan bahwa kelompok dan cara hidupnya lebih unggul dibandingkan kelompok lain (salah satu penyebab utama masalah sosial akibat keragaman ras dan etnik). Dibangun karena adanya prasangka (prejudice) negatif berdasarkan generalisasi atau stereotipe yang keliru, sehingga kelompok tertentu cenderung mendapat perlakuan diskriminatif", halaman: 14 },
    { id: 81, soal: "Dalam sosiologi, mayoritas dan minoritas merujuk pada apa?", jawaban: "Bukan pada faktor jumlah, tetapi lebih fokus pada hubungan kelompok dominan dan subordinat", halaman: 14 },
    { id: 82, soal: "Apa yang dimaksud kelompok dominan (mayoritas)?", jawaban: "Kelompok yang diuntungkan dan memiliki sumber daya dan hak yang unggul dalam suatu masyarakat", halaman: 14 },
    { id: 83, soal: "Apa yang dimaksud kelompok subordinat (minoritas)?", jawaban: "Kelompok yang anggotanya dirugikan dan mendapat perlakuan tidak setara dari kelompok mayoritas serta menganggap diri mereka sebagai objek diskriminasi kolektif karena karakteristik fisik atau budaya", halaman: 14 },

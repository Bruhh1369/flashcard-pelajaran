    { id: 104, soal: "Mengapa ba'du dibina dhammah?", jawaban: "Karena mudhaf ilaih-nya dibuang dan maknanya diniatkan (hal. 5)" },
    { id: 105, soal: "Apa mudhaf ilaih yang diniatkan pada ba'du?", jawaban: "Setelah shalawat dan salam yang telah disebut (hal. 5)" },
    { id: 106, soal: "Lafaz fahādzihi mengisyaratkan kepada apa?", jawaban: "Kepada yang mahsus jika khutbah ditulis setelah muqaddimah selesai, atau yang ma'qul jika khutbah ditulis lebih dulu (hal. 5)" },
    { id: 107, soal: "Muqaddimah dengan kasrah dal adalah bentuk apa?", jawaban: "Isim fa'il (yang mendahulukan) (hal. 5)" },
    { id: 108, soal: "Mengapa muqaddimah (kasrah dal) disebut demikian?", jawaban: "Karena mengetahuinya membuat pelajar nahwu punya pandangan jelas (bashirah), sehingga ia lebih dulu dari teman-temannya (hal. 5)" },
    { id: 109, soal: "Mengapa muqaddamah (fathah dal) disebut demikian?", jawaban: "Karena ia didahulukan di depan maksud (tujuan kitab) (hal. 5)" },
    { id: 110, soal: "Mana yang afshah: muqaddimah atau muqaddamah?", jawaban: "Muqaddimah (kasrah dal) (hal. 5)" },
    { id: 372, soal: "Bagaimana kedudukan bacaan muqaddamah (fathah dal)?", jawaban: "Bahasa yang sedikit (lughah qalilah) (hal. 5)" },
    { id: 111, soal: "Muqaddimah kitab diserupakan dengan apa?", jawaban: "Muqaddimatul jaisy, barisan depan pasukan yang mendahului untuk menyiapkan tempat (hal. 5)" },
    { id: 112, soal: "Apa manfaat mempelajari muqaddimah (Mutammimah) ini?", jawaban: "Bisa sampai ke kitab-kitab i'rab yang panjang, serta mengetahui i'rab yang sulit dan makna yang asing (hal. 5)" },
    { id: 113, soal: "Berapa jumlah ilmu-ilmu bahasa Arab ('ulūm al-'arabiyyah)?", jawaban: "12 ilmu (hal. 5)" },
    { id: 114, soal: "Sebutkan 12 ilmu bahasa Arab!", jawaban: "Lughah, tashrif, nahwu, ma'ani, bayan, badi', 'arudh, qawafi, qawanin kitabah, qawanin qira'ah, insya' rasa'il & khutbah, dan muhadharat (termasuk tarikh) (hal. 5)" },
    { id: 115, soal: "Apa yang dimaksud 'ilmu al-'arabiyyah' dalam matan Mutammimah?", jawaban: "Ilmu nahwu saja (hal. 5)" },
    { id: 116, soal: "Mengapa 'ilmu al-'arabiyyah' dalam Mutammimah hanya berarti nahwu?", jawaban: "Karena kitab ini hanya memuat ilmu nahwu (hal. 5)" },
    { id: 117, soal: "Mengapa nahwu disebut ilmu bahasa Arab yang paling bermanfaat?", jawaban: "Karena dengannya semua ilmu bahasa Arab dapat dipahami (hal. 5)" },
    { id: 118, soal: "Menurut as-Suyuthi, apa hubungan ilmu nahwu dengan ilmu lainnya?", jawaban: "Semua ilmu membutuhkan ilmu nahwu (hal. 5)" },
    { id: 119, soal: "Apa arti nahwu secara bahasa?", jawaban: "Al-qaṣd (maksud/tujuan) (hal. 5)" },
    { id: 120, soal: "Apa pengertian nahwu secara istilah?", jawaban: "Ilmu tentang kaidah-kaidah (ushul) untuk mengetahui keadaan akhir kalimat dari segi i'rab dan bina' (hal. 5)" },
    { id: 121, soal: "Apa yang dimaksud ushul dalam definisi ilmu nahwu?", jawaban: "Isim, fi'il, huruf, macam-macam i'rab, 'awamil, tawabi', dan sejenisnya (hal. 6)" },
    { id: 122, soal: "Apa faedah ilmu nahwu?", jawaban: "Mengetahui kalam yang benar dari yang salah, agar terjaga dari kesalahan lisan (hal. 6)" },
    { id: 123, soal: "Apa tujuan akhir (ghāyah) ilmu nahwu?", jawaban: "Membantu memahami makna kalam Allah dan Rasul-Nya (hal. 6)" },
    { id: 124, soal: "Memahami kalam Allah dan Rasul-Nya mengantarkan kepada apa?", jawaban: "Kebaikan dunia dan akhirat (hal. 6)" },
    { id: 125, soal: "Mengapa mengetahui ilmu nahwu wajib?", jawaban: "Karena dengannya seseorang bisa memahami makna kalam Allah dan Rasul-Nya (hal. 6)" },
    { id: 126, soal: "Mengapa ilmu nahwu lebih utama didahulukan daripada ilmu lainnya?", jawaban: "Karena kalam tanpa nahwu tidak bisa dipahami dengan benar, bahkan kadang tidak dipahami sama sekali (hal. 6)" },
    { id: 127, soal: "Siapa yang diisyaratkan Ali ra untuk menyusun ilmu nahwu?", jawaban: "Abul Aswad ad-Du'ali (hal. 6)" },
    { id: 128, soal: "Menurut ajaran Ali ra, apa definisi isim?", jawaban: "Kata yang menunjukkan musamma (yang dinamai) (hal. 6)" },
    { id: 129, soal: "Menurut ajaran Ali ra, apa definisi fi'il?", jawaban: "Kata yang menunjukkan gerak musamma (hal. 6)" },
    { id: 130, soal: "Menurut ajaran Ali ra, apa definisi huruf?", jawaban: "Kata yang menunjukkan makna pada selainnya (hal. 6)" },
    { id: 131, soal: "Menurut ajaran Ali ra, rafa', nashab, dan jar masing-masing untuk apa?", jawaban: "Rafa' untuk fa'il dan yang serupa, nashab untuk maf'ul dan yang dibawa padanya, jar untuk mudhaf dan yang sesuai (hal. 6)" },
    { id: 132, soal: "Apa ucapan Ali ra yang menjadi sebab ilmu ini dinamai nahwu?", jawaban: "Unḥu hādzan naḥwa yā Abal Aswad (ikutilah arah ini wahai Abul Aswad) (hal. 6)" },
    { id: 133, soal: "Mengapa ilmu ini diberi nama nahwu?", jawaban: "Untuk tabarruk dengan lafaz yang diucapkan peletaknya (Ali ra) (hal. 6)" },
    { id: 134, soal: "Apa arti Mutammimah dalam nama kitab?", jawaban: "Penyempurna muqaddimah, yaitu masalah-masalah al-Ajurrumiyyah (hal. 6)" },
    { id: 135, soal: "Al-Ajurrumiyyah dinisbatkan kepada siapa?", jawaban: "Syekh Muhammad bin Muhammad bin Dawud ash-Shanhaji, yang dikenal dengan Ibnu Ajurrum (hal. 6)" },
    { id: 136, soal: "Bagaimana cara membaca Ājurrūm menurut sebagian ulama (dari tulisan al-Jamal al-Muthib)?", jawaban: "Fathah hamzah mamdudah, dhammah jim takhfif, dan dhammah ra' tasydid (hal. 6)" },
    { id: 137, soal: "Apa arti Ajurrum dalam bahasa Barbar?", jawaban: "Al-faqīr aṣ-ṣūfī (orang fakir yang sufi) (hal. 6)" },
    { id: 138, soal: "Menurut Ibnu 'Anqa', apa sebenarnya Ajurrum?", jawaban: "Nama sebuah kabilah Barbar yang disebut Bani Ajurrum (hal. 6)" },
    { id: 139, soal: "Mengapa Ibnu 'Anqa' meragukan bahwa Ajurrum berarti fakir sufi?", jawaban: "Karena tidak ada seorang Barbar pun yang mengenal arti itu (hal. 6)" },
    { id: 140, soal: "Bagaimana pengucapan Ajurrumiyyah yang umum beredar di lisan orang?", jawaban: "Fathah hamzah, sukun jim, dan dhammah ra' tanpa tasydid (hal. 6)" },
    { id: 141, soal: "Mengapa cara baca Ajurrumiyyah boleh bermacam-macam?", jawaban: "Karena nama 'ajam (non-Arab) sulit diucapkan, sehingga diberi kelonggaran yang tidak diberikan pada nama Arab (hal. 6)" },
    { id: 142, soal: "Kapan Ibnu Ajurrum lahir dan wafat?", jawaban: "Lahir tahun 672 H, wafat bulan Shafar tahun 723 H (hal. 6)" },
    { id: 143, soal: "Di mana Ibnu Ajurrum wafat?", jawaban: "Di kota Fas, negeri Maghrib (hal. 6)" },
    { id: 144, soal: "Kitab Mutammimah menjadi perantara antara apa dan apa?", jawaban: "Antara al-Ajurrumiyyah dan kitab-kitab nahwu yang panjang (muthawwalāt) (hal. 6)" },
    { id: 145, soal: "Mengapa Mutammimah bisa menjadi perantara bagi kitab-kitab yang panjang?", jawaban: "Karena ia memuat faedah-faedah kitab asalnya (hal. 6)" },
    { id: 146, soal: "Meski ukurannya kecil, mengapa Mutammimah bisa menandingi kitab-kitab panjang?", jawaban: "Karena ilmunya padat (ghazārah) (hal. 6)" },
    { id: 147, soal: "Sebutkan kitab-kitab nahwu panjang yang paling bermanfaat!", jawaban: "Syarah-syarah Alfiyyah dan Tashil, serta syarah Kafiyah Ibnu Malik dan Kafiyah Ibnu Hajib (hal. 6)" },
    { id: 148, soal: "Kitab nahwu panjang apa yang paling bagus susunannya dan paling banyak ilmunya?", jawaban: "Mughnil Labib karya Ibnu Hisyam (hal. 6)" },
    { id: 149, soal: "Apa makna manfaat Mutammimah bagi pelajar di dunia?", jawaban: "Orang-orang sibuk mempelajarinya (hal. 6)" },
    { id: 150, soal: "Apa makna manfaat Mutammimah bagi pelajar di akhirat?", jawaban: "Menjadi sebab masuk surga (dārun na'īm) (hal. 6)" },
    { id: 151, soal: "Mengapa manfaat al-Ajurrumiyyah disebut nyata?", jawaban: "Karena jarang pelajar nahwu yang tidak memulai dengannya, sehingga berkahnya kembali kepadanya (hal. 6)" },
    { id: 152, soal: "Apa makna manfaat Mutammimah bagi pelajar semasa hidup (fil ḥayāh)?", jawaban: "Allah mengilhamkan perhatian padanya dan memberi karunia memahami ilmu bahasa Arab (hal. 6)" },
    { id: 153, soal: "Apa makna manfaat Mutammimah setelah mati (ba'dal mamāt)?", jawaban: "Menang (selamat) masuk Darus Salam (hal. 6)" },
    { id: 154, soal: "Apa makna innahu qarīb (Allah Maha Dekat)?", jawaban: "Dekat dengan ilmu-Nya kepada orang yang memohon dan berdoa kepada-Nya (hal. 6)" },
    { id: 155, soal: "Apa dalil Al-Qur'an tentang Allah Maha Dekat dengan yang berdoa?", jawaban: "Wa idzā sa'alaka 'ibādī 'annī fa innī qarīb (QS. Al-Baqarah: 186) (hal. 6)" },
    { id: 156, soal: "Bagaimana hukum memaknai dekatnya Allah sebagai dekat secara dzat?", jawaban: "Mustahil bagi Allah (hal. 6)" },
    { id: 157, soal: "Menurut hadits Tirmidzi, apa saja bentuk dikabulkannya doa?", jawaban: "Disegerakan di dunia, ditunda untuk akhirat, atau dihapus dosanya seukuran doanya (hal. 6)" },
    { id: 158, soal: "Menurut hadits Tirmidzi, kapan doa tidak dikabulkan?", jawaban: "Jika berdoa untuk dosa atau memutus silaturahmi, atau tergesa-gesa (hal. 6)" },
    { id: 159, soal: "Apa yang dimaksud tergesa-gesa dalam doa menurut hadits Tirmidzi?", jawaban: "Berkata: aku sudah berdoa tapi tidak dikabulkan (hal. 6)" },
    { id: 160, soal: "Apa status hadits Tirmidzi tentang dikabulkannya doa?", jawaban: "Hadits gharib (kata at-Tirmidzi) (hal. 6)" },
    { id: 161, soal: "Al pada lafaz al-kalām berfungsi sebagai apa?", jawaban: "Lil 'ahd, pengganti mudhaf ilaih yang dibuang (takdirnya: kalāmun naḥwiyyīn) (hal. 6)" },
    { id: 162, soal: "Bagaimana definisi kalam menurut Ibnu Malik dalam Alfiyyah?", jawaban: "Kalāmunā lafẓun mufīdun kastaqim (hal. 6)" },
    { id: 163, soal: "Bagaimana definisi kalam menurut al-'Imrithi?", jawaban: "Kalāmuhum lafẓun mufīdun musnadun (hal. 6)" },
    { id: 164, soal: "Secara bahasa, kalam bisa berarti kalam nafsi. Apa itu?", jawaban: "Kalam dalam hati yang tidak berupa huruf dan suara (hal. 6)" },
    { id: 165, soal: "Apa dalil kalam nafsi dari syair al-Akhthal?", jawaban: "Innal kalāma lafil fu'ādi wa innamā ju'ilal lisānu 'alal fu'ādi dalīlā (hal. 6)" },
    { id: 166, soal: "Secara bahasa, apakah kalam juga berarti lafaz yang tidak berfaedah?", jawaban: "Ya, kalam bisa berarti lafaz secara mutlak, berfaedah atau tidak, walau muhmal (hal. 6)" },
    { id: 167, soal: "Selain kalam nafsi dan lafaz, apa lagi makna kalam secara bahasa?", jawaban: "Tulisan, isyarat, lisanul hal, dan apa pun yang memahamkan maksud (hal. 6)" },
    { id: 168, soal: "Menurut pendapat azhar, semua makna kalam secara bahasa itu hakikat atau majaz?", jawaban: "Hakikat lughawi (hal. 6)" },
    { id: 169, soal: "Apa definisi kalam secara istilah nahwu (garis besar)?", jawaban: "Yang menghimpun empat qayd (batasan) (hal. 6–7)" },
    { id: 170, soal: "Sebutkan empat qayd kalam menurut Mutammimah!", jawaban: "Al-lafẓ, al-murakkab, al-mufīd, bil-waḍ' (hal. 7)" },
    { id: 171, soal: "Apa yang dimaksud al-lafzh (qayd pertama kalam)?", jawaban: "Suara yang memuat sebagian huruf hijaiyah (dari alif sampai ya') (hal. 7)" },
    { id: 172, soal: "Berikan contoh huruf hijaiyah yang ada dalam lafaz secara hakiki!", jawaban: "Zaid (hal. 7)" },
    { id: 373, soal: "Berikan contoh huruf hijaiyah yang ada dalam lafaz secara hukmi!", jawaban: "Dhamir mustatir dalam fi'il amr mufrad seperti qum (hal. 7)" },
    { id: 173, soal: "Apa arti lafzh secara bahasa?", jawaban: "Membuang atau melempar (hal. 7)" },
    { id: 174, soal: "Berikan contoh lafzh dalam arti bahasa (membuang)!", jawaban: "Akaltut tamrata wa lafaẓtun nawāh (aku makan kurma dan membuang bijinya) (hal. 7)" },
    { id: 175, soal: "Apa yang dimaksud al-murakkab (qayd kedua kalam)?", jawaban: "Tersusun dari dua kalimah atau lebih dengan susunan isnadi (hal. 7)" },
    { id: 176, soal: "Apa yang dimaksud al-mufīd (qayd ketiga kalam)?", jawaban: "Memberi makna yang membuat mutakallim baik diam, sehingga pendengar tidak menunggu lagi (hal. 7)" },
    { id: 177, soal: "Apakah kalam masih mufid jika butuh muta'alliqat seperti maf'ul?", jawaban: "Ya, tetap mufid (hal. 7)" },
    { id: 374, soal: "Mengapa kalam tetap mufid walaupun butuh muta'alliqat seperti maf'ul?", jawaban: "Karena kebutuhan itu tidak merusak kemufidannya (hal. 7)" },
    { id: 178, soal: "Apa yang dimaksud bil-wadh' (qayd keempat kalam)?", jawaban: "Dengan sengaja (al-qaṣd), yaitu mutakallim bermaksud memberi faedah kepada pendengar (hal. 7)" },
    { id: 179, soal: "Apa yang terjadi jika salah satu dari empat qayd kalam tidak ada?", jawaban: "Tidak disebut kalam nahwu (hal. 7)" },
    { id: 180, soal: "Apa yang dikeluarkan oleh qayd lafzh?", jawaban: "Tulisan, isyarat, dan sejenisnya (kalam lughawi yang bukan lafaz), walau berfaedah (hal. 7)" },
    { id: 181, soal: "Apa yang dikeluarkan oleh qayd murakkab?", jawaban: "Mufrad, seperti Zaid, dan murakkab yang tidak isnadi (hal. 7)" },
    { id: 182, soal: "Sebutkan contoh murakkab yang tidak isnadi!", jawaban: "Idhafi (Abdullah), mazji (Ba'labakk), dan isnadi yang dijadikan nama (Ta'abbaṭa Syarran) (hal. 7)" },
    { id: 183, soal: "Apa yang dikeluarkan oleh qayd mufid?", jawaban: "Yang tidak membuat mutakallim baik diam (hal. 7)" },
    { id: 184, soal: "Sebutkan contoh jumlah yang tidak mufid jika berdiri sendiri!", jawaban: "Jumlah shilah, sifat, hal, khabar, syarat, qasam, dan jawab (hal. 7)" },
    { id: 185, soal: "Mengapa in qāma Zaid tidak disebut kalam?", jawaban: "Karena faedahnya tidak tercapai (hal. 7)" },
    { id: 375, soal: "Dengan apa faedah kalimat syarat baru tercapai?", jawaban: "Dengan gabungan jumlah syarat dan jawabnya (hal. 7)" },
    { id: 186, soal: "Disebut apa in qāma Zaid jika bukan kalam?", jawaban: "Kalim (fathah kaf, kasrah lam) (hal. 7)" },
    { id: 187, soal: "Apa yang dikeluarkan oleh qayd wadh' (sengaja)?", jawaban: "Lafaz yang tidak disengaja (hal. 7)" },
    { id: 188, soal: "Berikan contoh lafaz yang tidak disengaja!", jawaban: "Ucapan orang tidur, orang lalai, dan orang mabuk (hal. 7)" },
    { id: 189, soal: "Apakah ucapan yang sudah pasti diketahui (as-samā'u fauqanā) termasuk kalam?", jawaban: "Ya, masuk dalam definisi kalam (hal. 7)" },
    { id: 190, soal: "Paling sedikit kalam tersusun dari apa?", jawaban: "Dua isim, atau fi'il dan isim (hal. 7)" },
    { id: 191, soal: "Berikan contoh kalam dari dua isim!", jawaban: "Zaidun qā'imun (mubtada' dan khabar) (hal. 7)" },
    { id: 192, soal: "Berikan contoh kalam dari fi'il dan isim!", jawaban: "Qāma Zaidun (hal. 7)" },
    { id: 193, soal: "Fi'il dan isim penyusun kalam bisa zhahir atau muqaddar. Berikan contoh yang muqaddar!", jawaban: "Na'am sebagai jawaban 'hal qāma Zaid?' (takdirnya na'am qāma Zaid), dan qum (fa'ilnya muqaddar) (hal. 7)" },
    { id: 194, soal: "Qā'im memuat dhamir fa'il, jadi Zaidun qā'im tersusun dari tiga isim. Bagaimana jawabannya?", jawaban: "Sifat bersama marfu' mustatirnya seperti isim mufrad, karena dhamirnya tidak tampak pada tatsniyah dan jamak (hal. 7)" },
    { id: 195, soal: "Apa bedanya dhamir pada qā'im dengan dhamir pada qum?", jawaban: "Dhamir pada qum adalah kalimah tersendiri, karena tampak pada tatsniyah dan jamak (qūmā, qūmū) (hal. 7)" },
    { id: 196, soal: "Mengapa kalam tidak bisa tersusun dari dua fi'il, dua huruf, huruf dan isim, atau fi'il dan huruf?", jawaban: "Karena kalam harus ada isnad, sedangkan musnad dan musnad ilaih hanya dari dua isim atau isim dan fi'il (hal. 7)" },
    { id: 197, soal: "Apa pengertian isnad?", jawaban: "Menisbatkan hukum kepada isim, baik ijab (positif) maupun salb (negatif) (hal. 7)" },
    { id: 198, soal: "Berikan contoh isnad ijab!", jawaban: "Qāma Zaid (hal. 7)" },
    { id: 376, soal: "Berikan contoh isnad salb!", jawaban: "Mā Zaidun qā'iman (hal. 7)" },
    { id: 199, soal: "Berikan contoh kalam dari fi'il dan dua isim!", jawaban: "Kāna Zaidun qā'iman (hal. 7)" },
    { id: 200, soal: "Berikan contoh kalam dari fi'il dan tiga isim!", jawaban: "Ẓanantu Zaidan qā'iman (hal. 7)" },
    { id: 201, soal: "Berikan contoh kalam dari fi'il dan empat isim!", jawaban: "A'lamtu Zaidan 'Amran qā'iman (hal. 7)" },
    { id: 202, soal: "Berikan contoh kalam dari fi'il qasam dan jawabnya!", jawaban: "Uqsimu billāhi inna Zaidan qā'imun (hal. 7)" },
    { id: 203, soal: "Berikan contoh kalam dari syarat dan jawabnya!", jawaban: "In qāma Zaidun qumtu (hal. 7)" },
    { id: 204, soal: "Yā Zaid itu berfaedah, padahal tersusun dari huruf dan isim. Bagaimana jawabannya?", jawaban: "Sebenarnya tersusun dari fi'il dan dua isim, takdirnya unādī Zaidan (hal. 7)" },
    { id: 205, soal: "Huruf yā pada yā Zaid berfungsi sebagai apa?", jawaban: "Pengganti fi'il (unādī) untuk tujuan insya' (hal. 7)" },
    { id: 206, soal: "Bagaimana cara baca kalimah yang paling fasih?", jawaban: "Fathah kaf, kasrah lam (kalimah) (hal. 7)" },
    { id: 207, soal: "Selain kalimah, bagaimana cara baca lain yang boleh?", jawaban: "Fathah atau kasrah kaf dengan sukun lam (kalmah, kilmah) (hal. 7)" },
    { id: 208, soal: "Apa arti kalimah secara bahasa?", jawaban: "Kalam yang berfaedah (hal. 7)" },
    { id: 209, soal: "Apa dalil hadits bahwa kalimah secara bahasa berarti kalam yang berfaedah?", jawaban: "Sabda Nabi ﷺ: kalimat paling benar yang diucapkan orang Arab adalah kalimat Labid: alā kullu syai'in mā khalallāha bāṭil (hal. 7)" },
    { id: 210, soal: "Selain kalam yang berfaedah, kalimah secara bahasa juga berarti apa?", jawaban: "Apa pun yang menunjukkan makna, walau bukan lafaz (hal. 7)" },
    { id: 211, soal: "Apa definisi kalimah secara istilah?", jawaban: "Qaul yang mufrad (hal. 7)" },
    { id: 212, soal: "Apa pengertian qaul?", jawaban: "Lafaz yang menunjukkan makna, seperti Zaid (hal. 7)" },
    { id: 213, soal: "Apakah lafaz muhmal (tidak bermakna) seperti daiz disebut qaul?", jawaban: "Tidak, karena tidak menunjukkan makna (hal. 7)" },
    { id: 214, soal: "Mana yang lebih umum: lafaz atau qaul?", jawaban: "Lafaz lebih umum dari qaul (hal. 7)" },
    { id: 215, soal: "Apa pengertian mufrad?", jawaban: "Yang bagiannya tidak menunjukkan bagian maknanya (hal. 7)" },
    { id: 216, soal: "Berikan contoh mufrad dan jelaskan!", jawaban: "Rajul: huruf-hurufnya jika dipisah tidak menunjukkan apa pun dari maknanya (hal. 7)" },
    { id: 217, soal: "Apa pengertian murakkab (lawan mufrad)?", jawaban: "Yang setiap bagiannya menunjukkan sebagian maknanya (hal. 7)" },
    { id: 218, soal: "Berikan contoh murakkab dan jelaskan!", jawaban: "Ghulāmu Zaid: ghulām menunjukkan yang dinisbatkan, Zaid menunjukkan yang dinisbati (hal. 7)" },
    { id: 219, soal: "Ada berapa macam kalimah?", jawaban: "Tiga: isim, fi'il, dan huruf (hal. 7)" },
    { id: 220, soal: "Apakah ada macam kalimah yang keempat?", jawaban: "Tidak ada (hal. 7–8)" },
    { id: 221, soal: "Apa dalil bahwa kalimah terbatas pada tiga macam?", jawaban: "Para ulama diam (tidak menyebut yang lain) ketika menjelaskannya (hal. 8)" },
    { id: 377, soal: "Seandainya ada macam kalimah yang keempat, apa yang terjadi?", jawaban: "Pasti ditemukan oleh para imam bidang ini (hal. 8)" },
    { id: 222, soal: "Apa definisi isim?", jawaban: "Kalimah yang menunjukkan makna pada dirinya dan tidak disertai salah satu dari tiga zaman (hal. 8)" },
    { id: 223, soal: "Mengapa isim dinamai isim (dari kata sumuw)?", jawaban: "Karena sumuw-nya, yaitu kedudukannya lebih tinggi dari dua saudaranya (fi'il dan huruf) (hal. 8)" },
    { id: 224, soal: "Mengapa isim lebih tinggi dari fi'il dan huruf?", jawaban: "Karena isim tidak butuh keduanya, sedangkan keduanya butuh isim (hal. 8)" },
    { id: 225, soal: "Mengapa isim didahulukan atas fi'il dan huruf?", jawaban: "Karena kedudukannya lebih tinggi dari keduanya (hal. 8)" },
    { id: 226, soal: "Menurut pendapat lain, isim berasal dari kata apa?", jawaban: "Dari al-wasm (tanda), karena isim adalah tanda bagi yang dinamainya (hal. 8)" },
    { id: 227, soal: "Apa definisi fi'il?", jawaban: "Kalimah yang menunjukkan makna pada dirinya dan disertai salah satu dari tiga zaman (hal. 8)" },
    { id: 228, soal: "Sebutkan tiga zaman fi'il beserta contohnya!", jawaban: "Hal (yaqūmu), istiqbal (qum), dan madhi (qāma) (hal. 8)" },
    { id: 229, soal: "Mengapa fi'il dinamai fi'il?", jawaban: "Karena mengandung fi'il lughawi, yaitu hadats (peristiwa) (hal. 8)" },
    { id: 230, soal: "Apa definisi huruf?", jawaban: "Kalimah yang tidak menunjukkan makna pada dirinya, tetapi pada selainnya, dan tidak disertai zaman (hal. 8)" },
    { id: 231, soal: "Mengapa huruf dinamai huruf (ḥarf = tepi)?", jawaban: "Karena ia berada di tepi: tidak menunjukkan makna pada dirinya dan tidak menjadi 'umdah (inti) dalam kalam (hal. 8)" },
    { id: 232, soal: "Waw 'athaf dalam 'isim, fi'il, dan huruf' bermakna menghimpun. Apakah berarti kalimah adalah gabungan ketiganya?", jawaban: "Tidak (hal. 8)" },
    { id: 378, soal: "Apa maksud waw 'athaf yang bermakna menghimpun dalam 'isim, fi'il, dan huruf'?", jawaban: "Ketiganya berkumpul dalam hukum yang sama (sama-sama disebut kalimah) (hal. 8)" },
    { id: 233, soal: "Apa fungsi qayd jā'a li-ma'nā pada huruf?", jawaban: "Untuk mengeluarkan huruf hijaiyah (tahajji), karena tidak menunjukkan makna sehingga bukan kalimah (hal. 8)" },
    { id: 234, soal: "Bagaimana pengarang Mutammimah mengubah ibarat kitab asalnya (Ajurrumiyyah) tentang isim, fi'il, huruf?", jawaban: "Menjadikan ketiganya bagian dari kalimah, bukan bagian dari kalam (hal. 8)" },
    { id: 235, soal: "Mengapa isim, fi'il, dan huruf tidak sah dijadikan bagian dari kalam?", jawaban: "Karena pembagian (taqsim) itu harus berupa pembagian kulli ke juz'iyyat atau ke ajza', dan keduanya tidak cocok untuk kalam (hal. 8)" },
    { id: 236, soal: "Apa yang dimaksud qismatul kulli ilā juz'iyyātihi?", jawaban: "Pembagian yang hakikat bagiannya ada pada setiap bagian, sehingga nama yang dibagi sah diberikan pada tiap bagian (hal. 8)" },
    { id: 237, soal: "Berikan contoh qismatul kulli ilā juz'iyyātihi!", jawaban: "Al-ismu kalimah, al-fi'lu kalimah, al-ḥarfu kalimah (hal. 8)" },
    { id: 238, soal: "Apa yang dimaksud qismatul kulli ilā ajzā'ihi?", jawaban: "Pembagian yang hakikatnya hanya ada jika semua bagian berkumpul, sehingga nama yang dibagi tidak sah diberikan pada tiap bagian (hal. 8)" },
    { id: 239, soal: "Berikan contoh qismatul kulli ilā ajzā'ihi!", jawaban: "Sakanjabīn terdiri dari madu, cuka, dan air (hal. 8)" },
    { id: 379, soal: "Dalam contoh sakanjabīn, bisakah madu saja disebut sakanjabīn?", jawaban: "Tidak bisa (hal. 8)" },
    { id: 240, soal: "Jika isim, fi'il, huruf dianggap juz'iyyat kalam, apa kesalahannya?", jawaban: "Berarti sah dikatakan isim itu kalam, padahal tidak (hal. 8)" },
    { id: 241, soal: "Jika isim, fi'il, huruf dianggap ajza' (bagian penyusun) kalam, apa kesalahannya?", jawaban: "Berarti qāma Zaid dan Zaidun qā'im bukan kalam karena tidak ada hurufnya, padahal keduanya kalam (hal. 8)" },
    { id: 242, soal: "Definisi apa yang tidak disebut oleh pengarang Mutammimah, padahal disebut Ibnu Malik?", jawaban: "Definisi kalim (dalam Alfiyyah: wasmun wa fi'lun tsumma ḥarfun al-kalim) (hal. 8)" },
    { id: 243, soal: "Apa definisi kalim menurut pendapat yang shahih?", jawaban: "Isim jenis jam'i untuk kalimah (hal. 8)" },
    { id: 244, soal: "Kalim digunakan untuk berapa kalimah?", jawaban: "Tiga kalimah ke atas, walaupun tidak berfaedah (hal. 8)" },
    { id: 245, soal: "Apa hubungan antara kalam dan kalim?", jawaban: "'Umum khushus min wajh (hal. 8)" },
    { id: 246, soal: "Berikan contoh yang hanya kalam (bukan kalim)!", jawaban: "Qāma Zaid (hal. 8)" },
    { id: 380, soal: "Berikan contoh yang hanya kalim (bukan kalam)!", jawaban: "In qāma Zaid (hal. 8)" },
    { id: 381, soal: "Berikan contoh yang kalam sekaligus kalim!", jawaban: "Qad qāma Zaid (hal. 8)" },
    { id: 247, soal: "Berapa jumlah tanda isim menurut sebagian ulama?", jawaban: "Sampai 30 tanda (hal. 8)" },
    { id: 248, soal: "Berapa tanda isim yang disebut pengarang Mutammimah?", jawaban: "Lima tanda (hal. 8)" },
    { id: 249, soal: "Apa tanda isim yang pertama dalam Mutammimah?", jawaban: "Al-isnād ilaih (disandari) (hal. 8)" },
    { id: 250, soal: "Menurut Ibnu Hisyam dalam Syarh Syudzur, apa pengertian isnad ilaih?", jawaban: "Dinisbatkan kepadanya sesuatu yang menyempurnakan faedah (hal. 8)" },
    { id: 251, soal: "Yang dinisbatkan kepada isim (dalam isnad ilaih) bisa berupa apa saja? Berikan contohnya!", jawaban: "Fi'il (qāma Zaid), isim (Zaidun akhūka), atau jumlah (anā qumtu) (hal. 8)" },
    { id: 252, soal: "Menurut Ibnu 'Anqa', apa pengertian isnad ilaih?", jawaban: "Dinisbatkan kepadanya sebagian hukum (hal. 8)" },
    { id: 253, soal: "Berikan contoh isnad ilaih menurut Ibnu 'Anqa'!", jawaban: "Menisbatkan jual beli dan pernikahan ke ta' (bi'tuka, zawwajtuka fulānah) dan iman ke anā (anā mu'min) (hal. 8)" },
    { id: 254, soal: "Tanda isim apa yang paling bermanfaat?", jawaban: "Isnad ilaih (hal. 8)" },
    { id: 255, soal: "Kata apa saja yang dibuktikan keisimannya dengan tanda isnad ilaih?", jawaban: "Ta' pada ḍarabtu, mā pada mā 'indakum yanfadu, serta ḥattā dan qāla dalam ucapan 'ḥattā ḥarfu jarrin, qāla fi'lun māḍin' (hal. 8)" },
    { id: 256, soal: "Kapan ḥattā menjadi huruf dan qāla menjadi fi'il?", jawaban: "Jika dipakai sesuai fungsi aslinya, seperti ḥattā maṭla'il fajr dan qāla rajulān (hal. 8)" },
    { id: 257, soal: "Kapan ḥattā dan qāla menjadi isim?", jawaban: "Jika yang dimaksud lafaznya (hikayah), seperti 'ḥattā ḥarfu jarr' dan 'qāla fi'lun māḍin' (hal. 8)" },
    { id: 258, soal: "Ketika ḥattā dan qāla menjadi isim, bagaimana i'rabnya?", jawaban: "I'rab taqdiri, karena akhirnya tertutup harakat hikayah (hal. 8–9)" },
    { id: 259, soal: "Ibnu Hajib menyelisihi pendapat i'rab taqdiri pada ḥattā dan qāla (hikayah). Apa pendapatnya?", jawaban: "Keduanya mabni (hal. 9)" },
    { id: 260, soal: "Mengapa tanda isnad ilaih khusus untuk isim?", jawaban: "Karena fi'il diletakkan hanya untuk menjadi musnad (yang disandarkan) (hal. 9)" },
    { id: 261, soal: "Bagaimana dengan tasma'u bil-Mu'aidiyyi khairun min an tarāh, padahal tasma'u fi'il yang disandari?", jawaban: "Tidak bertentangan, karena an mashdariyyah dibuang, sehingga khabar itu untuk mashdar (sama'uka) (hal. 9)" },
    { id: 262, soal: "Apa tanda isim yang kedua dalam Mutammimah?", jawaban: "Al-khafḍ (jar) (hal. 9)" },
    { id: 263, soal: "Apa istilah ulama Bashrah untuk al-khafdh?", jawaban: "Al-jarr (hal. 9)" },
    { id: 264, soal: "Apa pengertian al-khafdh?", jawaban: "Apa yang diakibatkan oleh 'amil khafdh di akhir kalimah, berupa kasrah atau penggantinya (hal. 9)" },
    { id: 265, soal: "Sebutkan pengganti kasrah sebagai tanda khafdh!", jawaban: "Fathah pada isim ghairu munsharif, serta ya' pada jamak mudzakkar salim, mutsanna, dan asma'ul khamsah (hal. 9)" },
    { id: 266, soal: "Mengapa khafdh khusus untuk isim?", jawaban: "Karena khafdh adalah tanda mudhaf ilaih, dan mudhaf ilaih hanya berupa isim (hal. 9)" },
    { id: 267, soal: "Mengapa mudhaf ilaih hanya berupa isim?", jawaban: "Karena secara makna ia mahkum 'alaih, dan mahkum 'alaih hanya berupa isim (hal. 9)" },
    { id: 268, soal: "Mengapa fi'il mudhari' tidak menerima jar walaupun ia mu'rab?", jawaban: "Karena asal i'rab adalah isim, dan mudhari' di-i'rab karena menyerupai isim (hal. 9)" },
    { id: 382, soal: "Mengapa jar dikhususkan untuk isim (tidak untuk mudhari')?", jawaban: "Agar asal dan cabang tidak sama (hal. 9)" },
    { id: 269, soal: "Apa tanda isim yang ketiga dalam Mutammimah?", jawaban: "At-tanwīn (hal. 9)" },
    { id: 270, soal: "Apa pengertian tanwin?", jawaban: "Nun tambahan yang sukun, mengikuti akhir isim secara lafaz dan tidak ditulis (hal. 9)" },
    { id: 271, soal: "Ada berapa macam tanwin?", jawaban: "Sepuluh macam (hal. 9)" },
    { id: 272, soal: "Sebutkan sepuluh macam tanwin!", jawaban: "Tamkin, tankir, 'iwadh, muqabalah, dharurah, ziyadah, taktsir (tanwin hamzah), hikayah, tarannum, dan ghuluw (hal. 9)" },
    { id: 273, soal: "Mengapa delapan tanwin pertama khusus untuk isim?", jawaban: "Karena tidak satu pun dari kedelapannya ada pada fi'il (hal. 9)" },
    { id: 274, soal: "Mengapa tanwin tarannum dan ghuluw disebut tanwin secara majaz?", jawaban: "Karena keduanya tidak khusus untuk isim, dan tetap ditulis (hal. 9)" },
    { id: 275, soal: "Apa nama lain tanwin tamkin?", jawaban: "Tanwin sharf (hal. 9)" },
    { id: 276, soal: "Apa pengertian tanwin tamkin?", jawaban: "Tanwin yang ada pada isim mu'rab yang munsharif (hal. 9)" },
    { id: 277, soal: "Mengapa disebut tanwin tamkin?", jawaban: "Karena menunjukkan kokohnya isim dalam keisiman dan i'rab, tidak menyerupai huruf (sehingga mabni) dan tidak menyerupai fi'il (sehingga tidak munsharif) (hal. 9)" },
    { id: 278, soal: "Apa pengertian tanwin tankir?", jawaban: "Tanwin pada sebagian isim mabni untuk membedakan ma'rifah dan nakirahnya (hal. 9)" },
    { id: 279, soal: "Berikan contoh tanwin tankir pada nama orang!", jawaban: "Marartu bi-Sībawaihin (dengan tanwin) = orang lain yang bernama Sibawaih (hal. 9)" },
    { id: 383, soal: "Apa makna marartu bi-Sībawaihi tanpa tanwin?", jawaban: "Imam nahwu yang masyhur (hal. 9)" },
    { id: 280, soal: "Berikan contoh tanwin tankir pada isim fi'il dan isim shaut!", jawaban: "Ṣah dan mah: tanwin membedakan yang tidak tertentu dari yang tertentu (hal. 9)" },
    { id: 281, soal: "Apa pengertian tanwin 'iwadh?", jawaban: "Tanwin di akhir isim mudhaf sebagai pengganti dari mudhaf ilaih (hal. 9)" },
    { id: 282, soal: "Tanwin 'iwadh bisa menggantikan apa saja? Berikan contohnya!", jawaban: "Huruf (jawārin, ghawāsyin), isim (kullun, ba'ḍun), atau jumlah (ḥīna'idzin, yauma'idzin) (hal. 9)" },
    { id: 283, soal: "Pada wa antum ḥīna'idzin tanẓurūn, tanwin pada idz menggantikan jumlah apa?", jawaban: "Idz balaghatir rūḥul ḥulqūm (ketika nyawa sampai di kerongkongan) (hal. 9)" },
    { id: 284, soal: "Pada yauma'idzin tuḥaddit akhbārahā, tanwin pada idz menggantikan jumlah apa?", jawaban: "Idz zulzilatil arḍu wa akhrajatil arḍu atsqālahā (hal. 9)" },
    { id: 285, soal: "Apa pengertian tanwin muqabalah?", jawaban: "Tanwin pada jamak muannats salim, sebagai imbangan nun pada jamak mudzakkar salim (hal. 9)" },
    { id: 286, soal: "Apa pengertian tanwin dharurah?", jawaban: "Tanwin pada munada mabni karena darurat syair, baik tetap dhammah maupun manshub (hal. 9)" },
    { id: 287, soal: "Berikan contoh tanwin dharurah yang tetap dhammah!", jawaban: "Salāmullāhi yā Maṭarun 'alaihā (hal. 9)" },
    { id: 288, soal: "Berikan contoh tanwin dharurah yang manshub!", jawaban: "Yā 'Adiyyan laqad waqatkal awāqī (hal. 9)" },
    { id: 289, soal: "Apa nama lain tanwin ziyadah?", jawaban: "Tanwin munasabah (hal. 9)" },
    { id: 290, soal: "Apa pengertian tanwin ziyadah?", jawaban: "Tanwin pada isim ghairu munsharif (hal. 9)" },
    { id: 291, soal: "Berikan contoh tanwin ziyadah!", jawaban: "Qira'ah Nafi': salāsilan wa aghlālan, dengan tanwin pada salāsilan padahal berwazan shighat muntahal jumu' (hal. 9)" },
    { id: 292, soal: "Apakah salāsilan yang ditanwin menjadi isim munsharif?", jawaban: "Tidak, hanya berbentuk munsharif (hal. 9)" },
    { id: 384, soal: "Apa hakikat lafaz salāsilan yang ditanwin?", jawaban: "Tetap ghairu munsharif (hal. 9)" },
    { id: 293, soal: "Apa nama lain tanwin taktsir?", jawaban: "Tanwin hamz (hal. 9)" },
    { id: 294, soal: "Apa pengertian tanwin taktsir?", jawaban: "Tanwin pada sebagian isim mabni untuk maksud memperbanyak (hal. 9)" },
    { id: 295, soal: "Berikan contoh tanwin taktsir!", jawaban: "Hā'ulā'in qaumuka, dengan tanwin pada hamzah akhirnya (hal. 9)" },
    { id: 296, soal: "Apa pengertian tanwin hikayah?", jawaban: "Tanwin pada sebagian contoh yang dipakai untuk menimbang (wazan) (hal. 9)" },
    { id: 297, soal: "Berikan contoh tanwin hikayah!", jawaban: "Miḍrābun wazannya mif'ālun, ḍāribatun wazannya fā'ilatun (hal. 9)" },
    { id: 298, soal: "Mengapa mif'āl dan fā'ilah seharusnya tidak ditanwin?", jawaban: "Karena keduanya ghairu munsharif sebab 'alamiyyah jinsiyyah dan ta'nits (hal. 9)" },
    { id: 385, soal: "Lalu mengapa mif'āl dan fā'ilah ditanwin?", jawaban: "Hanya untuk menghikayahkan lafaz yang ditimbang (hal. 9)" },
    { id: 299, soal: "Apa pengertian tanwin tarannum?", jawaban: "Tanwin pada qafiyah muthlaqah, yaitu yang akhirnya alif ithlaq (hal. 9)" },
    { id: 300, soal: "Berikan contoh tanwin tarannum!", jawaban: "Aqillil lauma 'ādzila wal 'itāban ... wa qūlī in aṣabtu laqad aṣāban (asalnya al-'itābā dan aṣābā) (hal. 9)" },
    { id: 301, soal: "Apa pengertian tanwin ghuluw?", jawaban: "Tanwin pada qafiyah muqayyadah, yang akhirnya huruf shahih sukun (hal. 9)" },
    { id: 302, soal: "Berikan contoh tanwin ghuluw!", jawaban: "Wa qātimil a'māqi khāwil mukhtaraqin (hal. 9)" },
    { id: 303, soal: "Mengapa disebut tanwin ghuluw?", jawaban: "Karena ia melampaui batas (bikin rusak) wazan syair (hal. 9)" },
    { id: 304, soal: "Mengapa pensyarah menyebut semua macam tanwin beserta contohnya?", jawaban: "Untuk menyempurnakan faedah (hal. 9)" },
    { id: 305, soal: "Berapa macam tanwin yang disebut al-Fakihi dan al-Khabishi al-Kirmani dalam syarahnya?", jawaban: "Empat yang pertama saja (hal. 9)" },
    { id: 306, soal: "Mengapa al-Fakihi dan al-Kirmani hanya menyebut empat tanwin pertama?", jawaban: "Karena disepakati keempatnya khusus untuk isim, sedangkan selainnya diperselisihkan (hal. 9)" },
    { id: 307, soal: "Menurut pendapat ashah, tanwin apa saja yang khusus untuk isim?", jawaban: "Semua kecuali dua yang terakhir (tarannum dan ghuluw) (hal. 9)" },
    { id: 308, soal: "Apa tanda isim yang keempat dalam Mutammimah?", jawaban: "Masuknya alif dan lam (hal. 9)" },
    { id: 309, soal: "Alif lam sebagai tanda isim bisa berupa apa saja?", jawaban: "Ma'rifah (ar-rajul, al-ghulām), zaidah, atau maushulah (hal. 9–10)" },
    { id: 310, soal: "Berikan contoh alif lam zaidah!", jawaban: "Ra'aitul Walīdabnal Yazīdi mubārakan (hal. 10)" },
    { id: 311, soal: "Berikan contoh alif lam maushulah!", jawaban: "Aḍ-ḍārib dan al-maḍrūb (hal. 10)" },
    { id: 312, soal: "Bagaimana hukum al maushulah masuk pada fi'il?", jawaban: "Tidak boleh kecuali darurat syair, berbeda dengan Ibnu Malik (hal. 10)" },
    { id: 313, soal: "Siapa yang berpendapat al maushulah bukan tanda isim?", jawaban: "Al-Fakihi (hal. 10)" },
    { id: 386, soal: "Siapa yang menyelisihi pendapat al-Fakihi bahwa al maushulah bukan tanda isim?", jawaban: "Ibnu 'Anqa' (hal. 10)" },
    { id: 314, soal: "Menurut Ibnu 'Anqa', al macam apa yang menjadi tanda isim?", jawaban: "Semua macam al kecuali al maushulah, menurut pendapat ashah (hal. 10)" },
    { id: 315, soal: "Mengapa alif lam khusus untuk isim?", jawaban: "Karena fungsinya menentukan (ta'yin) mahkum 'alaih, dan itu hanya isim (hal. 10)" },
    { id: 316, soal: "Apa yang semisal alif lam sebagai tanda isim?", jawaban: "Am, dalam bahasa sebagian orang Arab (hal. 10)" },
    { id: 317, soal: "Berikan contoh am pengganti al dari syair!", jawaban: "Dzāka khalīlī wa dzū yuwāṣilunī yarmī warā'ī bi-amsahmi wa amsalimah (hal. 10)" },
    { id: 318, soal: "Ungkapan mana yang semestinya dipakai: 'alif dan lam' atau 'al'?", jawaban: "Al (dan am) (hal. 10)" },
    { id: 387, soal: "Mengapa yang semestinya dipakai 'al', bukan 'alif dan lam'?", jawaban: "Karena lafaz dua huruf disebut dengan bentuknya, seperti tidak dikatakan 'ha' dan lam' untuk hal (hal. 10)" },
    { id: 319, soal: "Mengapa pengarang tetap boleh memakai ungkapan 'alif dan lam'?", jawaban: "Karena banyak khilaf tentang apa alat ta'rif itu (hal. 10)" },
    { id: 320, soal: "Menurut al-Khalil, apa alat ta'rif?", jawaban: "Al, hamzahnya hamzah qath' yang diwashalkan untuk meringankan (hal. 10)" },
    { id: 321, soal: "Menurut Sibawaih, apa alat ta'rif?", jawaban: "Al, hamzahnya hamzah washal (hal. 10)" },
    { id: 322, soal: "Menurut jumhur, apa alat ta'rif?", jawaban: "Lam saja, hamzahnya tambahan (hal. 10)" },
    { id: 323, soal: "Menurut al-Mubarrid, apa alat ta'rif?", jawaban: "Hamzah saja (hal. 10)" },
    { id: 324, soal: "Mengapa ungkapan 'alif dan lam' tidak boleh dipakai untuk kata selain alat ta'rif?", jawaban: "Karena tidak suka memperpanjang (hal. 10)" },
    { id: 325, soal: "Menurut Ibnu Hisyam dalam al-Mughni, mana yang lebih qiyasi: 'al' atau 'alif dan lam'?", jawaban: "Al (hal. 10)" },
    { id: 388, soal: "Siapa ulama yang tetap memakai ungkapan 'alif dan lam'?", jawaban: "Al-Khalil dan Sibawaih (hal. 10)" },
    { id: 326, soal: "Apa tanda isim yang kelima dalam Mutammimah?", jawaban: "Masuknya huruf khafdh (huruf jar) di awalnya (hal. 10)" },
    { id: 327, soal: "Berikan contoh huruf jar masuk pada isim!", jawaban: "Minal baiti ilal masjid (hal. 10)" },
    { id: 328, soal: "Pada 'ajibtu min an qumta, huruf jar masuk ke fi'il qumta. Bagaimana jawabannya?", jawaban: "Secara zhahir bukan isim, tapi takdirnya isim karena bermakna qiyāmika (hal. 10)" },
    { id: 329, soal: "Mengapa huruf jar khusus untuk isim?", jawaban: "Karena diletakkan untuk menarik makna fi'il yang tidak bisa muta'addi sendiri kepada isim (hal. 10)" },
    { id: 330, soal: "Berikan contoh huruf jar yang masuk ke isim setelah fi'il yang ada secara lafaz!", jawaban: "Marartu bi-Zaid (hal. 10)" },
    { id: 389, soal: "Berikan contoh huruf jar yang masuk ke isim setelah fi'il yang ada secara taqdir!", jawaban: "Bismillāhirraḥmānirraḥīm (takdirnya ibtadi') (hal. 10)" },
    { id: 331, soal: "Berapa tanda fi'il yang disebut pengarang Mutammimah?", jawaban: "Tiga tanda, mengikuti kitab asalnya (hal. 10)" },
    { id: 332, soal: "Mengapa tiga tanda fi'il itu tidak memuat tanda fi'il amr?", jawaban: "Karena mengikuti ulama Kufah: fi'il hanya madhi dan mudhari', dan amr termasuk mudhari' (hal. 10)" },
    { id: 333, soal: "Apa dalil ulama Kufah bahwa amr termasuk mudhari'?", jawaban: "Amr dipotong dari mudhari', buktinya amr dibina sesuai tanda i'rab mudhari'-nya (hal. 10)" },
    { id: 334, soal: "Apa tanda fi'il yang pertama dalam Mutammimah?", jawaban: "Qad (hal. 10)" },
    { id: 335, soal: "Qad termasuk tanda fi'il yang khusus atau musytarak?", jawaban: "Musytarak: kadang masuk ke madhi, kadang ke mudhari' (hal. 10)" },
    { id: 336, soal: "Apa makna qad jika masuk ke fi'il madhi?", jawaban: "Taqrib (mendekatkan ke masa sekarang) atau tahqiq (hal. 10)" },
    { id: 337, soal: "Berikan contoh qad untuk taqrib pada fi'il madhi!", jawaban: "Qad qāmatiṣ ṣalāh (hal. 10)" },
    { id: 390, soal: "Berikan contoh qad untuk tahqiq pada fi'il madhi!", jawaban: "Wa na'lama an qad ṣadaqtanā (hal. 10)" },
    { id: 338, soal: "Apa makna qad jika masuk ke fi'il mudhari'?", jawaban: "Tahqiq atau taqlil (hal. 10)" },
    { id: 339, soal: "Berikan contoh qad untuk tahqiq pada fi'il mudhari'!", jawaban: "Qad ya'lamullāh (hal. 10)" },
    { id: 391, soal: "Berikan contoh qad untuk taqlil pada fi'il mudhari'!", jawaban: "Innal kadzūba qad yaṣduq (hal. 10)" },
    { id: 340, soal: "Mengapa qad khusus untuk fi'il?", jawaban: "Karena makna-makna itu (taqrib, tahqiq, taqlil) khusus pada fi'il, tidak tergambar ada pada selainnya (hal. 10)" },
    { id: 341, soal: "Apa tanda fi'il yang kedua dalam Mutammimah?", jawaban: "As-sīn dan saufa (hal. 10)" },
    { id: 342, soal: "As-sin dan saufa khusus untuk fi'il apa?", jawaban: "Fi'il mudhari' (hal. 10)" },
    { id: 343, soal: "Apa fungsi as-sin dan saufa pada fi'il mudhari'?", jawaban: "Memurnikan maknanya untuk masa yang akan datang (istiqbal) (hal. 10)" },
    { id: 344, soal: "Berikan contoh as-sin dan saufa!", jawaban: "Sayaqūmu dan saufa yaqūmu (hal. 10)" },
    { id: 345, soal: "Mengapa as-sin dan saufa khusus untuk mudhari'?", jawaban: "Karena diletakkan untuk menunda makna fi'il dari masa sekarang ke masa depan (hal. 10)" },
    { id: 346, soal: "Menurut al-Fakihi, apa beda saufa dengan as-sin?", jawaban: "Saufa menunjukkan penundaan dan kelonggaran waktu yang lebih jauh, karena banyaknya huruf menunjukkan banyaknya makna (hal. 10)" },
    { id: 347, soal: "Menurut Ibnu 'Anqa', apakah tanfis dengan as-sin sama dengan saufa?", jawaban: "Tidak, tanfis dengan as-sin lebih sedikit dari saufa (berbeda dengan Ibnu Hisyam) (hal. 10)" },
    { id: 348, soal: "Apa tanda fi'il yang ketiga dalam Mutammimah?", jawaban: "Ta' ta'nits yang sukun (hal. 10)" },
    { id: 349, soal: "Ta' ta'nits sukun khusus untuk fi'il apa?", jawaban: "Fi'il madhi (hal. 10)" },
    { id: 350, soal: "Apa fungsi ta' ta'nits sukun pada fi'il madhi?", jawaban: "Menunjukkan fa'ilnya muannats (hal. 10)" },
    { id: 351, soal: "Berikan contoh ta' ta'nits sukun!", jawaban: "Qāmat Hindun (hal. 10)" },
    { id: 352, soal: "Kapan ta' ta'nits sukun dibaca kasrah?", jawaban: "Untuk menghindari bertemunya dua sukun, seperti qālatimra'atul 'Azīz (hal. 10)" },
    { id: 353, soal: "Mengapa ta' ta'nits disyaratkan sukun?", jawaban: "Untuk mengeluarkan ta' yang asalnya berharakat, karena ta' itu masuk pada isim (qā'imah, Fāṭimah) (hal. 10)" },
    { id: 354, soal: "Ta' ta'nits bisa masuk pada sebagian huruf. Berikan contohnya!", jawaban: "Rubbat, tsummat, dan lāta, hanya untuk ta'nits lafaz (hal. 10)" },
    { id: 355, soal: "Bagaimana harakat ta' ta'nits pada lāta?", jawaban: "Fathah (hal. 10)" },
    { id: 392, soal: "Bagaimana harakat ta' ta'nits pada rubbat dan tsummat?", jawaban: "Boleh fathah atau sukun (hal. 10)" },
    { id: 356, soal: "Ada berapa macam fi'il menurut ulama Bashrah?", jawaban: "Tiga macam (hal. 10)" },
    { id: 357, soal: "Ada berapa macam fi'il menurut ulama Kufah?", jawaban: "Dua macam, karena mereka tidak menghitung fi'il amr (hal. 10)" },
    { id: 358, soal: "Mengapa fi'il ada tiga macam?", jawaban: "Karena hadats (peristiwa) bisa sebelum waktu pengabaran, bersamaan, atau sesudahnya (hal. 10)" },
    { id: 359, soal: "Hadats yang terjadi sebelum waktu pengabaran menjadi fi'il apa?", jawaban: "Madhi (hal. 10)" },
    { id: 393, soal: "Hadats yang terjadi bersamaan dengan waktu pengabaran menjadi fi'il apa?", jawaban: "Mudhari' (hal. 10)" },
    { id: 394, soal: "Hadats yang terjadi sesudah waktu pengabaran menjadi fi'il apa?", jawaban: "Amr (hal. 10)" },
    { id: 360, soal: "Apa asal lafaz māḍin?", jawaban: "Māḍī (hal. 10)" },
    { id: 395, soal: "Bagaimana māḍī berubah menjadi māḍin?", jawaban: "Ya'-nya dibuang dan diganti tanwin (hal. 10)" },
    { id: 361, soal: "Apa definisi fi'il madhi?", jawaban: "Kata yang menunjukkan hadats yang terjadi pada masa lampau secara wadh' (asal peletakan) (hal. 10)" },
    { id: 362, soal: "Apa yang dikeluarkan oleh qayd 'secara wadh'' pada definisi madhi?", jawaban: "Madhi yang maknanya berubah menjadi masa sekarang (hal. 10)" },
    { id: 363, soal: "Berikan contoh madhi yang maknanya berubah menjadi masa sekarang!", jawaban: "Shighat akad (bi'tu, wahabtu) dan madhi yang dinafikan dengan laisa atau mā (hal. 10)" },
    { id: 364, soal: "Mengapa fi'il madhi didahulukan atas mudhari' dan amr?", jawaban: "Karena ia sesuai asal, yaitu mabni menurut ijma' (hal. 10)" },
    { id: 365, soal: "Mengapa fi'il madhi tidak langsung diikuti fi'il amr dalam urutan?", jawaban: "Untuk menjaga pendapat ulama Kufah bahwa asal amr adalah mudhari' (hal. 10)" },
    { id: 366, soal: "Mengapa tanda ta' ta'nits sukun paling bermanfaat untuk fi'il madhi?", jawaban: "Karena ia masuk pada madhi yang mutasharrif maupun yang jamid (hal. 10)" },
    { id: 367, soal: "Berikan contoh ta' ta'nits sukun pada madhi mutasharrif!", jawaban: "Qāmat dan qa'adat (hal. 10)" },
    { id: 368, soal: "Mengapa pengarang mencontohkan dengan qāmat dan qa'adat, bukan qāma dan qa'ada?", jawaban: "Untuk menunjukkan bentuk fi'il setelah dimasuki ta' ta'nits, dan itu lebih utama (hal. 10)" },
    { id: 369, soal: "Berikan contoh fi'il madhi jamid yang menerima ta' ta'nits sukun!", jawaban: "Ni'ma dan bi'sa, seperti ni'matil mar'atu Hindun dan bi'satil mar'atu ḥammālatul ḥaṭab (hal. 10)" },
  ],
  "Tarikh": [
    // Sumber: Nurul Yaqin fi Sirati Sayyidil Mursalin (Muhammad al-Khudhari) — full halaman, catatan kaki dipakai sebagai penjelas
    { id: 1, soal: "Siapa pengarang kitab Nurul Yaqin?", jawaban: "Muhammad al-Khudhari, putra almarhum Syekh 'Afifi al-Bajuri (hal. 2)" },
    { id: 2, soal: "Sejak kecil, pengarang Nurul Yaqin merasa senang membaca apa?", jawaban: "Sejarah orang-orang terdahulu dan kisah umat-umat yang telah lalu (hal. 2)" },
    { id: 3, soal: "Menurut pengarang Nurul Yaqin, sejarah bagi akal manusia adalah apa?", jawaban: "Pendidik terbaik dan guru yang paling tulus memberi nasihat (hal. 2)" },
    { id: 4, soal: "Apa yang pengarang lihat dalam sejarah Nabi ﷺ?", jawaban: "Gangguan kaumnya ketika beliau mengajak mereka kepada kebenaran, dan besarnya kesabaran beliau hingga hijrah meninggalkan tanah airnya (hal. 2)" },
    { id: 5, soal: "Menurut pengarang, sejarah Nabi ﷺ menjadi apa bagi pemikiran kaum muslimin?", jawaban: "Pendidik terbesar (hal. 2)" },
    { id: 6, soal: "Mengapa sejarah Nabi ﷺ menjadi pendidik terbesar bagi kaum muslimin?", jawaban: "Karena menunjukkan apa yang wajib diikuti dan apa yang harus dijauhi, agar mereka memimpin sebagaimana para pendahulu mereka memimpin (hal. 2)" },
    { id: 7, soal: "Pelajaran apa dari sirah Nabi ﷺ yang khusus berkaitan dengan para penguasa?", jawaban: "Cara menarik hati yang menjauh dan menyatukan hati-hati yang berselisih (hal. 2)" },
    { id: 8, soal: "Pelajaran apa dari sirah Nabi ﷺ yang khusus berkaitan dengan para panglima pasukan?", jawaban: "Cara menyusun pasukan dan menyiapkan perlengkapan hingga meraih kemenangan atas musuh (hal. 2)" },
    { id: 9, soal: "Pelajaran apa dari sirah Nabi ﷺ yang berkaitan dengan masyarakat umum?", jawaban: "Persatuan hati mereka, sehingga menjadi satu kekuatan menghadapi selain mereka (hal. 2)" },
    { id: 10, soal: "Mengapa pengarang Nurul Yaqin sering merasa sedih?", jawaban: "Karena kaum muslimin meninggalkan bacaan sirah (hal. 2)" },
    { id: 217, soal: "Menurut pengarang Nurul Yaqin, bagaimana sikap kaum muslimin terhadap ilmu sirah?", jawaban: "Jarang ada yang menyibukkan diri dengannya (hal. 2)" },
    { id: 11, soal: "Apa alasan pengarang memaklumi kaum muslimin yang jarang membaca sirah?", jawaban: "Panjangnya kitab-kitab sirah yang sudah ditulis (hal. 2)" },
    { id: 12, soal: "Di kota mana pengarang Nurul Yaqin bertemu Mahmud Bek Salim?", jawaban: "Kota al-Manshurah (hal. 3)" },
    { id: 13, soal: "Siapa Mahmud Bek Salim?", jawaban: "Seorang hakim (qadhi) di Mahkamah Campuran (al-Mukhtalithah) al-Manshurah (hal. 3)" },
    { id: 14, soal: "Bagaimana pengarang menggambarkan ilmu agama Mahmud Bek Salim dibanding tokoh-tokoh besar?", jawaban: "Tokoh-tokoh besar tidak mampu menandinginya (hal. 3)" },
    { id: 218, soal: "Bagaimana kemampuan Mahmud Bek Salim dalam menjawab masalah agama?", jawaban: "Jarang ada masalah agama yang tidak bisa ia jawab dengan jelas (hal. 3)" },
    { id: 15, soal: "Bagaimana pengarang menggambarkan ilmu sirah Mahmud Bek Salim?", jawaban: "Ia memiliki kabar yang yakin (al-khabar al-yaqīn) tentang sirah Rasulullah ﷺ (hal. 3)" },
    { id: 16, soal: "Apa keinginan Mahmud Bek Salim terkait kitab sirah?", jawaban: "Dibuatkan sirah yang bebas dari tambahan yang tidak perlu (ḥasyw) dan kerumitan (ta'qīd), yang bermanfaat bagi kaum muslimin umum (hal. 3)" },
    { id: 17, soal: "Mengapa pengarang awalnya merasa tidak mampu memenuhi keinginan Mahmud Bek?", jawaban: "Karena kedudukan tugas itu agung dan kesulitannya lebih besar lagi (hal. 3)" },
    { id: 18, soal: "Selain Mahmud Bek, siapa lagi yang banyak berharap kitab Nurul Yaqin dibuat?", jawaban: "Para pembesar kota al-Manshurah (hal. 3)" },
    { id: 19, soal: "Bagaimana pengarang menggambarkan hasil kitab Nurul Yaqin?", jawaban: "Mudah didapat dan segar sumbernya (hal. 3)" },
    { id: 219, soal: "Bagi siapa kitab Nurul Yaqin bermanfaat?", jawaban: "Bagi orang umum (hal. 3)" },
    { id: 220, soal: "Bagi siapa kitab Nurul Yaqin menjadi rujukan?", jawaban: "Bagi orang khusus (hal. 3)" },
    { id: 20, soal: "Apa sumber utama pengarang dalam menyusun Nurul Yaqin?", jawaban: "Al-Qur'an dan hadits sahih riwayat Imam Bukhari dan Muslim (hal. 3)" },
    { id: 21, soal: "Kapan pengarang Nurul Yaqin keluar dari riwayat Bukhari dan Muslim?", jawaban: "Hanya untuk hal yang perlu dijelaskan ungkapannya (tafhīmul 'ibārāt) (hal. 3)" },
    { id: 22, soal: "Sebutkan kitab-kitab yang membantu pengarang menyusun Nurul Yaqin!", jawaban: "Asy-Syifa', as-Sirah al-Halabiyyah, al-Mawahib al-Laduniyyah, dan Ihya' 'Ulumiddin (hal. 3)" },
    { id: 23, soal: "Siapa pengarang kitab asy-Syifa'?", jawaban: "Al-Qadhi 'Iyadh (hal. 3)" },
    { id: 24, soal: "Siapa pengarang kitab al-Mawahib al-Laduniyyah?", jawaban: "Al-Qasthalani (hal. 3)" },
    { id: 25, soal: "Siapa pengarang kitab Ihya' 'Ulumiddin?", jawaban: "Al-Ghazali (hal. 3)" },
    { id: 26, soal: "Apa doa pengarang di akhir muqaddimah Nurul Yaqin?", jawaban: "Agar para imam dan pemimpin diberi taufik meneladani Rasulullah ﷺ dan menghidupkan syiar agamanya (hal. 3)" },
    { id: 27, soal: "Siapa nama Nabi ﷺ beserta ayahnya?", jawaban: "Muhammad bin Abdullah (hal. 4)" },
    { id: 28, soal: "Siapa ibu Nabi Muhammad ﷺ?", jawaban: "Aminah binti Wahb az-Zuhriyyah al-Qurasyiyyah (hal. 4)" },
    { id: 29, soal: "Aminah disebut az-Zuhriyyah. Dari kabilah mana ia berasal?", jawaban: "Dari Bani Zuhrah bin Kilab, dari Quraisy (hal. 4)" },
    { id: 30, soal: "Siapa ayah Abdullah (ayah Nabi ﷺ)?", jawaban: "Abdul Muththalib (hal. 4)" },
    { id: 31, soal: "Siapa ibu Abdullah (nenek Nabi ﷺ dari pihak ayah)?", jawaban: "Fathimah binti 'Amr al-Makhzumiyyah al-Qurasyiyyah (hal. 4)" },
    { id: 32, soal: "Fathimah binti 'Amr disebut al-Makhzumiyyah. Dari kabilah mana ia berasal?", jawaban: "Dari Bani Makhzum bin Yaqazhah bin Murrah, dari Quraisy (hal. 4)" },
    { id: 33, soal: "Bagaimana kedudukan Abdul Muththalib di kalangan Quraisy?", jawaban: "Syekh (tokoh) yang diagungkan di Quraisy (hal. 4)" },
    { id: 34, soal: "Bagaimana sikap Quraisy terhadap Abdul Muththalib?", jawaban: "Mereka mengikuti pendapatnya dalam berbagai masalah dan mendahulukannya dalam urusan-urusan penting (hal. 4)" },
    { id: 35, soal: "Siapa ayah Abdul Muththalib?", jawaban: "Hasyim (hal. 4)" },
    { id: 36, soal: "Siapa ibu Abdul Muththalib?", jawaban: "Salma binti 'Amr an-Najjariyyah al-Khazrajiyyah (hal. 4)" },
    { id: 37, soal: "Salma binti 'Amr disebut an-Najjariyyah. Dari kabilah mana ia berasal?", jawaban: "Dari Bani an-Najjar, dari suku Khazraj (hal. 4)" },
    { id: 38, soal: "Apa itu suku Khazraj?", jawaban: "Salah satu dari dua kabilah yang tinggal di Madinah (hal. 4)" },
    { id: 39, soal: "Apa dua kabilah yang tinggal di Madinah?", jawaban: "Aus dan Khazraj, yang keduanya bersaudara (hal. 4)" },
    { id: 40, soal: "Aus dan Khazraj dinamai apa oleh Rasulullah ﷺ?", jawaban: "Anshar (hal. 4)" },
    { id: 41, soal: "Siapa ayah Hasyim?", jawaban: "Abdu Manaf (hal. 4)" },
    { id: 42, soal: "Siapa ibu Hasyim?", jawaban: "'Atikah binti Murrah as-Sulamiyyah (hal. 4)" },
    { id: 43, soal: "'Atikah binti Murrah disebut as-Sulamiyyah. Dari kabilah mana ia berasal?", jawaban: "Dari Bani Sulaim bin Manshur, salah satu kabilah Qais 'Ailan bin Mudhar (hal. 4)" },
    { id: 44, soal: "Siapa ayah Abdu Manaf?", jawaban: "Qushay (hal. 4)" },
    { id: 45, soal: "Siapa ibu Abdu Manaf?", jawaban: "Hubba binti Hulail al-Khuza'iyyah (hal. 4)" },
    { id: 46, soal: "Hubba binti Hulail disebut al-Khuza'iyyah. Dari kabilah mana ia berasal?", jawaban: "Dari Bani Khuza'ah bin 'Amr, salah satu kabilah Qam'ah bin Ilyas bin Mudhar (hal. 4)" },
    { id: 47, soal: "Apa peran Bani Khuza'ah sebelum Quraisy?", jawaban: "Mereka yang mengurus Ka'bah (al-Bait) sebelum Quraisy (hal. 4)" },
    { id: 48, soal: "Jabatan apa saja yang dipegang Qushay di masa jahiliah?", jawaban: "Hijabah, siqayah, rifadah, nadwah, dan liwa' (hal. 4)" },
    { id: 49, soal: "Apa yang dimaksud hijabah al-Bait?", jawaban: "Tugas menjaga (memegang kunci) Ka'bah (hal. 4)" },
    { id: 50, soal: "Apa yang dimaksud siqayah al-hajj?", jawaban: "Tugas memberi minum jamaah haji (hal. 4)" },
    { id: 51, soal: "Apa yang dimaksud rifadah?", jawaban: "Tugas memberi makan jamaah haji (hal. 4)" },
    { id: 52, soal: "Apa yang dimaksud nadwah?", jawaban: "Musyawarah (syura) (hal. 4)" },
    { id: 53, soal: "Bagaimana kedudukan Qushay dalam nadwah?", jawaban: "Tidak ada urusan yang diputuskan kecuali di rumahnya (hal. 4)" },
    { id: 54, soal: "Apa yang dimaksud liwa'?", jawaban: "Bendera perang (hal. 4)" },
    { id: 221, soal: "Bagaimana kedudukan Qushay dalam urusan liwa'?", jawaban: "Bendera perang tidak diikat kecuali oleh tangannya (hal. 4)" },
    { id: 55, soal: "Menjelang wafat, kepada siapa Qushay menyerahkan semua jabatannya?", jawaban: "Kepada salah satu anaknya, Abdud Dar (hal. 4)" },
    { id: 56, soal: "Apa yang disepakati Bani Abdu Manaf setelah jabatan Qushay diberikan ke Abdud Dar?", jawaban: "Tidak membiarkan sepupu mereka, Bani Abdud Dar, memonopoli kebanggaan-kebanggaan itu (hal. 4)" },
    { id: 57, soal: "Apa yang hampir terjadi akibat perselisihan Bani Abdu Manaf dan Bani Abdud Dar?", jawaban: "Hampir terjadi peperangan (hal. 4)" },
    { id: 58, soal: "Bagaimana perselisihan Bani Abdu Manaf dan Bani Abdud Dar diselesaikan?", jawaban: "Orang-orang berakal dari kedua pihak menengahi (hal. 4)" },
    { id: 222, soal: "Dalam perdamaian dengan Bani Abdud Dar, apa yang diberikan kepada Bani Abdu Manaf?", jawaban: "Siqayah dan rifadah (hal. 4)" },
    { id: 59, soal: "Siqayah dan rifadah terus berada di tangan Bani Abdu Manaf hingga sampai kepada siapa?", jawaban: "Al-'Abbas bin Abdul Muththalib, lalu anak-anaknya setelahnya (hal. 4)" },
    { id: 60, soal: "Setelah perdamaian, hijabah tetap di tangan siapa?", jawaban: "Bani Abdud Dar (hal. 5)" },
    { id: 61, soal: "Bagaimana kedudukan hijabah Bani Abdud Dar setelah datangnya Islam?", jawaban: "Diakui syariat, dan tetap berada di tangan mereka sampai sekarang (hal. 5)" },
    { id: 62, soal: "Siapa keturunan Bani Abdud Dar yang memegang hijabah sampai sekarang?", jawaban: "Bani Syaibah bin Utsman bin Abi Thalhah bin Abdul 'Uzza bin Utsman bin Abdud Dar (hal. 5)" },
    { id: 63, soal: "Sampai kapan liwa' (bendera perang) berada di tangan Bani Abdud Dar?", jawaban: "Sampai Islam menghapusnya (hal. 5)" },
    { id: 64, soal: "Setelah dihapus Islam, liwa' menjadi hak siapa?", jawaban: "Hak khalifah kaum muslimin, yang memberikannya kepada siapa yang ia pandang layak (hal. 5)" },
    { id: 65, soal: "Selain liwa', jabatan apa lagi yang juga dihapus Islam?", jawaban: "Nadwah (hal. 5)" },
    { id: 66, soal: "Siapa ayah Qushay?", jawaban: "Kilab (hal. 5)" },
    { id: 67, soal: "Siapa ibu Qushay?", jawaban: "Fathimah binti Sa'd, dari Yaman, dari Azd Syanu'ah (hal. 5)" },
    { id: 68, soal: "Siapa ayah Kilab?", jawaban: "Murrah (hal. 5)" },
    { id: 69, soal: "Siapa ibu Kilab?", jawaban: "Hind binti Surair, dari Bani Fihr bin Malik (hal. 5)" },
    { id: 70, soal: "Siapa ayah Murrah?", jawaban: "Ka'b (hal. 5)" },
    { id: 71, soal: "Siapa ibu Murrah?", jawaban: "Wahsyiyyah binti Syaiban, juga dari Bani Fihr (hal. 5)" },
    { id: 72, soal: "Siapa ayah Ka'b?", jawaban: "Lu'ay (hal. 5)" },
    { id: 73, soal: "Siapa ibu Ka'b?", jawaban: "Ummu Ka'b Mariyah binti Ka'b, dari Qudha'ah (hal. 5)" },
    { id: 74, soal: "Siapa ayah Lu'ay?", jawaban: "Ghalib (hal. 5)" },
    { id: 75, soal: "Siapa ibu Lu'ay?", jawaban: "Ummu Lu'ay Salma binti 'Amr al-Khuza'i (hal. 5)" },
    { id: 76, soal: "Siapa ayah Ghalib?", jawaban: "Fihr (hal. 5)" },
    { id: 77, soal: "Siapa ibu Ghalib?", jawaban: "Ummu Ghalib Laila binti Sa'd, dari Hudzail (hal. 5)" },
    { id: 78, soal: "Menurut kebanyakan ulama, siapa yang disebut Quraisy?", jawaban: "Fihr (hal. 5)" },
    { id: 79, soal: "Ada berapa kabilah Quraisy?", jawaban: "12 kabilah (hal. 5)" },
    { id: 80, soal: "Sebutkan 12 kabilah Quraisy!", jawaban: "Bani Abdu Manaf, Abdud Dar, Asad bin Abdul 'Uzza, Zuhrah, Makhzum, Taim bin Murrah, 'Adi, Sahm, 'Amir bin Lu'ay, Taim bin Ghalib, al-Harits bin Fihr, dan Muharib bin Fihr (hal. 5)" },
    { id: 81, soal: "Kabilah Quraisy yang tinggal di Makkah disebut apa?", jawaban: "Quraisy al-Biṭāḥ (hal. 5)" },
    { id: 82, soal: "Kabilah Quraisy yang tinggal di pinggiran Makkah disebut apa?", jawaban: "Quraisy aẓ-Ẓawāhir (hal. 5)" },
    { id: 83, soal: "Siapa ayah Fihr?", jawaban: "Malik (hal. 5)" },
    { id: 84, soal: "Siapa ibu Fihr?", jawaban: "Jandalah binti al-Harits, dari Jurhum (hal. 5)" },
    { id: 85, soal: "Siapa ayah Malik?", jawaban: "An-Nadhr (hal. 5)" },
    { id: 86, soal: "Siapa ibu Malik?", jawaban: "'Atikah binti 'Adwan, dari Qais 'Ailan (hal. 5)" },
    { id: 87, soal: "Siapa ayah an-Nadhr?", jawaban: "Kinanah (hal. 5)" },
    { id: 88, soal: "Siapa ibu an-Nadhr?", jawaban: "Barrah binti Murr bin Udd (hal. 5)" },
    { id: 89, soal: "Siapa ayah Kinanah?", jawaban: "Khuzaimah (hal. 5)" },
    { id: 90, soal: "Siapa ibu Kinanah?", jawaban: "'Awanah binti Sa'd, dari Qais 'Ailan (hal. 5)" },
    { id: 91, soal: "Siapa ayah Khuzaimah?", jawaban: "Mudrikah (hal. 5)" },
    { id: 92, soal: "Siapa ibu Khuzaimah?", jawaban: "Salma binti Aslam, dari Qudha'ah (hal. 5)" },
    { id: 93, soal: "Siapa ayah Mudrikah?", jawaban: "Ilyas (hal. 6)" },
    { id: 94, soal: "Siapa ibu Mudrikah?", jawaban: "Khindif (hal. 6)" },
    { id: 95, soal: "Khindif (ibu Mudrikah) dijadikan perumpamaan dalam hal apa?", jawaban: "Dalam kemuliaan dan kekuatan (al-man'ah) (hal. 6)" },
    { id: 96, soal: "Siapa ayah Ilyas?", jawaban: "Mudhar (hal. 6)" },
    { id: 97, soal: "Siapa ibu Ilyas?", jawaban: "Ar-Rabab binti Jandah bin Ma'add (hal. 6)" },
    { id: 98, soal: "Dalam kitab Subulul Huda war Rasyad, nama Jandah (kakek Ilyas dari pihak ibu) disebut apa?", jawaban: "Haidah (hal. 6)" },
    { id: 99, soal: "Siapa ayah Mudhar?", jawaban: "Nizar (hal. 6)" },
    { id: 100, soal: "Siapa ibu Mudhar?", jawaban: "Saudah binti 'Akk (hal. 6)" },
    { id: 101, soal: "Siapa ayah Nizar?", jawaban: "Ma'add (hal. 6)" },
    { id: 102, soal: "Siapa ibu Nizar?", jawaban: "Mu'anah binti Jausyam, dari Jurhum (hal. 6)" },
    { id: 103, soal: "Siapa ayah Ma'add?", jawaban: "'Adnan (hal. 6)" },
    { id: 104, soal: "Sampai siapa nasab Nabi ﷺ yang disepakati kesahihannya oleh ulama tarikh dan hadits?", jawaban: "Sampai 'Adnan (hal. 6)" },
    { id: 105, soal: "Bagaimana status nasab Nabi ﷺ di atas 'Adnan?", jawaban: "Tidak ada jalur yang sahih (hal. 6)" },
    { id: 106, soal: "Apa yang disepakati (ijma') ulama tentang ujung nasab Rasulullah ﷺ?", jawaban: "Nasab beliau berujung pada Isma'il bin Ibrahim (hal. 6)" },
    { id: 107, soal: "Nabi Isma'il bin Ibrahim disebut sebagai bapak siapa?", jawaban: "Bapak al-'Arab al-Musta'ribah (hal. 6)" },
    { id: 108, soal: "Bagaimana gambaran ayah-ayah dan ibu-ibu Nabi ﷺ dalam nasabnya?", jawaban: "Ayah-ayah yang suci dan ibu-ibu yang suci (hal. 6)" },
    { id: 109, soal: "Bagaimana perpindahan Nabi ﷺ dalam nasab yang suci?", jawaban: "Beliau terus berpindah dari sulbi para ayah ke rahim para ibu, hingga Allah memilihnya sebagai pemberi petunjuk yang diberi petunjuk (hal. 6)" },
    { id: 110, soal: "Dari nasab Arab yang seperti apa Nabi ﷺ berasal?", jawaban: "Dari orang Arab yang paling tengah (paling baik) nasabnya (hal. 6)" },
    { id: 111, soal: "Nabi ﷺ berasal dari inti kabilah apa?", jawaban: "Inti (shamim) Quraisy (hal. 6)" },
    { id: 112, soal: "Bagaimana kedudukan Quraisy di antara bangsa Arab?", jawaban: "Memiliki kedudukan pertama dalam kemuliaan dan ketinggian derajat di antara bangsa Arab (hal. 6)" },
    { id: 113, soal: "Bagaimana keadaan para ayah dalam silsilah Nabi ﷺ?", jawaban: "Semuanya mulia, tidak ada yang hina (hal. 6)" },
    { id: 223, soal: "Apa kedudukan para ayah dalam silsilah Nabi ﷺ di tengah kaumnya?", jawaban: "Semuanya pemimpin dan panutan (hal. 6)" },
    { id: 114, soal: "Bagaimana keadaan ibu-ibu para leluhur Nabi ﷺ?", jawaban: "Berasal dari kabilah-kabilah yang paling tinggi kedudukannya (hal. 6)" },
    { id: 115, soal: "Apa yang termasuk syarat kenabian terkait nasab?", jawaban: "Kemuliaan nasab dan kesucian kelahiran (hal. 6)" },
    { id: 116, soal: "Bagaimana status setiap pernikahan ayah-ayah dan ibu-ibu Nabi ﷺ?", jawaban: "Sah secara syar'i menurut aturan-aturan Arab (hal. 6)" },
    { id: 117, soal: "Apakah nasab Nabi ﷺ tersentuh perzinaan jahiliah?", jawaban: "Tidak, Allah menyucikan nasab beliau dari perzinaan (sifāḥ) jahiliah (hal. 6)" },
    { id: 118, soal: "Bagaimana kedudukan Abdullah di mata ayahnya, Abdul Muththalib?", jawaban: "Anak yang paling dicintai Abdul Muththalib (hal. 6)" },
    { id: 119, soal: "Siapa yang dinikahkan Abdul Muththalib dengan Abdullah?", jawaban: "Aminah binti Wahb bin Abdu Manaf bin Zuhrah bin Kilab (hal. 6)" },
    { id: 120, soal: "Berapa usia Abdullah ketika menikah dengan Aminah?", jawaban: "18 tahun (hal. 6)" },
    { id: 121, soal: "Bagaimana kedudukan Aminah di kalangan wanita Quraisy saat itu?", jawaban: "Wanita Quraisy yang paling utama nasab dan kedudukannya (hal. 6)" },
    { id: 122, soal: "Berapa lama setelah Aminah mengandung, Abdullah wafat?", jawaban: "Dua bulan setelah kehamilan (hal. 6)" },
    { id: 123, soal: "Di mana Abdullah (ayah Nabi ﷺ) dimakamkan?", jawaban: "Di Madinah, di dekat paman-paman dari pihak ibunya, Bani 'Adi bin an-Najjar (hal. 7)" },
    { id: 124, soal: "Bagaimana kisah wafatnya Abdullah (ayah Nabi ﷺ)?", jawaban: "Ia pergi berdagang ke Syam, lalu wafat di Madinah ketika dalam perjalanan pulang (hal. 7)" },
    { id: 125, soal: "Setelah Aminah melahirkan, bagaimana sambutan dunia?", jawaban: "Dunia bergembira dengan kelahiran bayi mulia ini, yang menebarkan ruh adab dan menyempurnakan akhlak mulia (hal. 7)" },
    { id: 126, soal: "Siapa yang meneliti (mentahqiq) tanggal kelahiran Nabi ﷺ?", jawaban: "Almarhum Mahmud Basya al-Falaki (hal. 7)" },
    { id: 127, soal: "Kapan Nabi ﷺ lahir menurut tahqiq Mahmud Basya al-Falaki (hari dan tanggal Hijriah)?", jawaban: "Senin pagi, 9 Rabi'ul Awwal (hal. 7)" },
    { id: 128, soal: "Kelahiran Nabi ﷺ bertepatan dengan tanggal berapa dalam kalender Masehi?", jawaban: "20 April 571 M (hal. 7)" },
    { id: 129, soal: "Kelahiran Nabi ﷺ bertepatan dengan tahun berapa dari peristiwa gajah?", jawaban: "Tahun pertama peristiwa gajah (hal. 7)" },
    { id: 130, soal: "Di mana Nabi ﷺ dilahirkan?", jawaban: "Di rumah Abu Thalib, di Syi'b Bani Hasyim (hal. 7)" },
    { id: 131, soal: "Siapa bidan yang membantu kelahiran Nabi ﷺ?", jawaban: "Asy-Syifa', ibu Abdurrahman bin 'Auf (hal. 7)" },
    { id: 132, soal: "Setelah Nabi ﷺ lahir, apa yang dilakukan Aminah?", jawaban: "Mengutus seseorang kepada kakeknya (Abdul Muththalib) untuk memberi kabar gembira (hal. 7)" },
    { id: 133, soal: "Bagaimana sikap Abdul Muththalib saat mendengar kelahiran Nabi ﷺ?", jawaban: "Ia datang dengan gembira dan menamainya Muhammad (hal. 7)" },
    { id: 134, soal: "Apakah nama Muhammad sudah populer di kalangan Arab sebelum Nabi ﷺ?", jawaban: "Tidak, nama itu belum populer sebelumnya (hal. 7)" },
    { id: 135, soal: "Mengapa kakek Nabi ﷺ diilhami menamainya Muhammad?", jawaban: "Karena Allah ingin mewujudkan apa yang telah Dia takdirkan dan sebutkan dalam kitab para nabi, seperti Taurat dan Injil (hal. 7)" },
    { id: 136, soal: "Siapa pengasuh (hāḍinah) Nabi ﷺ?", jawaban: "Ummu Aiman Barakah al-Habasyiyyah, budak milik ayah beliau, Abdullah (hal. 7)" },
    { id: 137, soal: "Siapa wanita yang pertama kali menyusui Nabi ﷺ?", jawaban: "Tsuwaibah, budak milik paman beliau, Abu Lahab (hal. 7)" },
    { id: 138, soal: "Apa kebiasaan bangsa Arab terkait penyusuan bayi mereka?", jawaban: "Mencari wanita-wanita penyusu untuk bayi-bayi mereka di pedalaman (bādiyah) (hal. 7–8)" },
    { id: 139, soal: "Bagaimana sikap bangsa Arab terhadap peristiwa gajah?", jawaban: "Peristiwa terkenal di Makkah yang mereka banggakan dan jadikan patokan tahun dalam sejarah (hal. 7)" },
    { id: 140, soal: "Di surah apa Al-Qur'an menyebut peristiwa gajah?", jawaban: "Surah al-Fil (hal. 7)" },
    { id: 141, soal: "Siapa yang menyerang Makkah dalam peristiwa gajah?", jawaban: "Salah seorang raja Habasyah yang menguasai Yaman setelah Himyar (hal. 7)" },
    { id: 142, soal: "Apa tujuan raja Habasyah menyerang Makkah dalam peristiwa gajah?", jawaban: "Menghancurkan Ka'bah (hal. 7)" },
    { id: 143, soal: "Apa yang dibawa raja Habasyah ketika menyerang Makkah?", jawaban: "Seekor gajah besar yang belum pernah dilihat bangsa Arab (hal. 7)" },
    { id: 144, soal: "Mengapa Allah menggagalkan serangan pasukan gajah?", jawaban: "Sebagai pemuliaan bagi Nabi yang dinanti dan kecemburuan (penjagaan) atas Rumah-Nya yang mulia (hal. 7)" },
    { id: 145, soal: "Bagaimana Allah menghancurkan pasukan gajah?", jawaban: "Mengirim burung Ababil yang melempari mereka dengan batu dari sijjil, sehingga mereka seperti daun yang dimakan ulat (hal. 7)" },
    { id: 146, soal: "Apa dampak hancurnya pasukan gajah bagi Quraisy?", jawaban: "Quraisy terbebas dari kepayahan melawan mereka (hal. 7)" },
    { id: 147, soal: "Mengapa orang Arab mencarikan penyusu bagi bayi mereka di pedalaman?", jawaban: "Agar anak lebih unggul (lebih baik tumbuh kembangnya) (hal. 8)" },
    { id: 148, soal: "Menurut orang Arab, bagaimana keadaan anak yang dibesarkan di kota?", jawaban: "Tumpul pikirannya dan lemah tekadnya (hal. 8)" },
    { id: 149, soal: "Siapa yang datang ke Makkah mencari bayi untuk disusui?", jawaban: "Para wanita dari Bani Sa'd bin Bakr (hal. 8)" },
    { id: 150, soal: "Siapa yang mendapat bagian menyusui Nabi ﷺ?", jawaban: "Halimah binti Abi Dzu'aib as-Sa'diyyah (hal. 8)" },
    { id: 151, soal: "Siapa nama suami Halimah as-Sa'diyyah?", jawaban: "Abu Kabsyah (hal. 8)" },
    { id: 152, soal: "Mengapa Quraisy menisbatkan Rasulullah ﷺ kepada Abu Kabsyah?", jawaban: "Untuk mengejek beliau (hal. 8)" },
    { id: 153, soal: "Apa ejekan Quraisy kepada Rasulullah ﷺ dengan menyebut Abu Kabsyah?", jawaban: "Hādzā ibnu Abī Kabsyah yukallamu minas samā' (ini anak Abu Kabsyah diajak bicara dari langit) (hal. 8)" },
    { id: 154, soal: "Apa yang dialami keluarga Halimah selama Nabi ﷺ tinggal bersama mereka?", jawaban: "Keberkahan melimpah kepada keluarga yang menyusuinya (hal. 8)" },
    { id: 155, soal: "Berapa lama Nabi ﷺ tinggal bersama keluarga Halimah?", jawaban: "Lebih dari empat tahun (hal. 8)" },
    { id: 156, soal: "Kisah keberkahan Nabi ﷺ di keluarga Halimah dikutip dari kitab apa?", jawaban: "As-Sirah al-Halabiyyah (hal. 8)" },
    { id: 157, soal: "Peristiwa penting apa yang dialami Nabi ﷺ ketika tinggal di Bani Sa'd?", jawaban: "Peristiwa pembelahan dada (syaqqush shadr) (hal. 8)" },
    { id: 158, soal: "Apa yang terjadi dalam peristiwa pembelahan dada Nabi ﷺ?", jawaban: "Dada beliau dibelah dan bagian setan dikeluarkan darinya (hal. 8)" },
    { id: 159, soal: "Apa dampak peristiwa pembelahan dada bagi Halimah?", jawaban: "Halimah merasa takut, lalu mengembalikan Nabi ﷺ kepada ibunya (hal. 8)" },
    { id: 160, soal: "Menurut cerita Halimah, di mana Nabi ﷺ berada saat peristiwa pembelahan dada?", jawaban: "Bersama saudara (sesusuan)-nya menggembala anak kambing di belakang rumah mereka (hal. 8)" },
    { id: 161, soal: "Siapa yang pertama kali mengabarkan peristiwa pembelahan dada kepada Halimah?", jawaban: "Saudara sesusuan Nabi ﷺ, yang datang sambil berlari (hal. 8)" },
    { id: 162, soal: "Apa kata saudara sesusuan Nabi ﷺ kepada Halimah dan suaminya?", jawaban: "Saudaraku yang Quraisy itu diambil dua orang berbaju putih, lalu mereka membaringkannya dan membelah perutnya (hal. 8)" },
    { id: 163, soal: "Apa arti yasūṭānihi dalam kisah pembelahan dada?", jawaban: "Keduanya mengaduk/menggerakkannya, seperti dengan cambuk (sauth) (hal. 8)" },
    { id: 164, soal: "Bagaimana keadaan Nabi ﷺ ketika Halimah dan suaminya menemukannya?", jawaban: "Wajahnya pucat (muntaqi'an launuh) (hal. 8)" },
    { id: 165, soal: "Apa arti muntaqi'an launuh?", jawaban: "Warnanya berubah pucat, menyerupai warna debu (naq') (hal. 8)" },
    { id: 166, soal: "Apa yang dilakukan Halimah dan suaminya saat menemukan Nabi ﷺ?", jawaban: "Memeluknya dan bertanya: Ada apa denganmu, wahai anakku? (hal. 8)" },
    { id: 167, soal: "Menurut Nabi ﷺ kecil, apa yang dikatakan salah satu dari dua laki-laki berbaju putih?", jawaban: "Ia bertanya kepada temannya: Apakah ini dia? Temannya menjawab: Ya (hal. 8)" },
    { id: 168, soal: "Menurut cerita Nabi ﷺ kecil, apa yang dilakukan dua laki-laki berbaju putih itu?", jawaban: "Membaringkannya, membelah perutnya, mencari sesuatu di dalamnya, lalu mengambil dan membuangnya (hal. 8)" },
    { id: 169, soal: "Apakah Nabi ﷺ kecil tahu apa yang diambil dari perutnya?", jawaban: "Tidak, beliau berkata: aku tidak tahu apa itu (hal. 8)" },
    { id: 170, soal: "Setelah dikembalikan Halimah, ke mana Aminah membawa Nabi ﷺ?", jawaban: "Ke Madinah, untuk mengunjungi paman-paman ayahnya dari pihak ibu, Bani 'Adi bin an-Najjar (hal. 9)" },
    { id: 171, soal: "Di mana Aminah wafat?", jawaban: "Di al-Abwa', dalam perjalanan pulang dari Madinah (hal. 9)" },
    { id: 172, soal: "Apa itu al-Abwa'?", jawaban: "Desa di antara Makkah dan Madinah, lebih dekat ke Madinah (hal. 9)" },
    { id: 173, soal: "Setelah Aminah wafat, siapa yang mengasuh dan siapa yang menanggung Nabi ﷺ?", jawaban: "Diasuh Ummu Aiman, ditanggung (kafalah) kakeknya Abdul Muththalib (hal. 9)" },
    { id: 174, soal: "Bagaimana sikap Abdul Muththalib kepada Nabi ﷺ?", jawaban: "Sangat sayang melebihi kepada anak-anaknya sendiri, dan memuliakannya dengan semulia-mulianya (hal. 9)" },
    { id: 175, soal: "Mengapa Abdul Muththalib sangat menyayangi Nabi ﷺ?", jawaban: "Karena tampak pada beliau tanda-tanda bahwa beliau akan punya kedudukan agung di masa depan (hal. 9)" },
    { id: 176, soal: "Pada usia berapa Nabi ﷺ ketika Abdul Muththalib wafat?", jawaban: "Delapan tahun (hal. 9)" },
    { id: 177, soal: "Setelah Abdul Muththalib wafat, siapa yang menanggung Nabi ﷺ?", jawaban: "Abu Thalib, saudara kandung ayah beliau (hal. 9)" },
    { id: 178, soal: "Bagaimana sikap Abu Thalib kepada Nabi ﷺ?", jawaban: "Penyayang dan sangat melindungi (ghayūr) beliau (hal. 9)" },
    { id: 179, soal: "Bagaimana keadaan harta Abu Thalib?", jawaban: "Sedikit hartanya, lalu Allah memberkahi hartanya yang sedikit itu (hal. 9)" },
    { id: 180, soal: "Selama dalam tanggungan pamannya, Nabi ﷺ menjadi teladan dalam hal apa?", jawaban: "Qana'ah, dan menjauhi hal-hal remeh yang biasa menyibukkan anak-anak (hal. 9)" },
    { id: 181, soal: "Siapa yang meriwayatkan sikap qana'ah Nabi ﷺ di masa kecil?", jawaban: "Ummu Aiman, pengasuh beliau (hal. 9)" },
    { id: 182, soal: "Bagaimana sikap Nabi ﷺ kecil ketika waktu makan tiba?", jawaban: "Anak-anak lain berebut, sedangkan beliau qana'ah (merasa cukup) dengan apa yang Allah mudahkan untuknya (hal. 9)" },
    { id: 183, soal: "Pada usia berapa Nabi ﷺ ikut pamannya berdagang ke Syam?", jawaban: "12 tahun (hal. 9)" },
    { id: 184, soal: "Mengapa Abu Thalib akhirnya membawa Nabi ﷺ ke Syam?", jawaban: "Karena Nabi ﷺ merasa berat berpisah dengannya, sehingga Abu Thalib iba dan membawanya (hal. 9)" },
    { id: 185, soal: "Perjalanan Nabi ﷺ bersama Abu Thalib ke Syam disebut perjalanan ke berapa?", jawaban: "Perjalanan (rihlah) pertama (hal. 9)" },
    { id: 186, soal: "Berapa lama kafilah Abu Thalib tinggal di Syam?", jawaban: "Hanya sebentar (hal. 9)" },
    { id: 187, soal: "Siapa yang mendatangi kafilah Abu Thalib di dekat Bushra?", jawaban: "Buhaira ar-Rahib (seorang rahib/pendeta) (hal. 9)" },
    { id: 188, soal: "Apa itu Bushra?", jawaban: "Desa di perbatasan antara negeri Syam dan negeri Arab (hal. 9)" },
    { id: 189, soal: "Apa yang ditanyakan Buhaira ar-Rahib kepada kafilah?", jawaban: "Ia menanyakan apa yang ia lihat dalam kitab-kitab suci mereka (hal. 9–10)" },
    { id: 190, soal: "Apa yang dikatakan Buhaira tentang isi kitab-kitab sucinya?", jawaban: "Akan diutus seorang nabi dari bangsa Arab di zaman ini, yang belum muncul sampai sekarang (hal. 10)" },
    { id: 191, soal: "Siapa yang sering membicarakan kabar akan diutusnya nabi dari Arab sebelum Nabi ﷺ diutus?", jawaban: "Ahli Kitab, dari Yahudi dan Nasrani (hal. 10)" },
    { id: 192, soal: "Ayat apa yang menunjukkan Ahli Kitab mengingkari Nabi ﷺ padahal sudah mengenalnya?", jawaban: "Falammā jā'ahum mā 'arafū kafarū bih, fala'natullāhi 'alal kāfirīn (QS. Al-Baqarah: 89) (hal. 10)" },
    { id: 193, soal: "Pada usia berapa Nabi ﷺ ikut Perang Fijar?", jawaban: "20 tahun (hal. 10)" },
    { id: 194, soal: "Antara siapa Perang Fijar terjadi?", jawaban: "Antara Kinanah bersama Quraisy, melawan Qais (hal. 10)" },
    { id: 195, soal: "Apa sebab awal Perang Fijar?", jawaban: "An-Nu'man bin al-Mundzir punya kafilah dagang yang dikirim setiap tahun ke pasar 'Ukazh untuk dijual (hal. 10)" },
    { id: 196, soal: "Siapa an-Nu'man bin al-Mundzir?", jawaban: "Raja Arab di al-Hirah (hal. 10)" },
    { id: 197, soal: "Apa itu al-Hirah?", jawaban: "Kota di sebelah barat Sungai Eufrat, tempat tinggal raja Arab yang tunduk pada raja-raja Persia (hal. 10)" },
    { id: 198, soal: "Siapa yang menaklukkan al-Hirah, dan kapan?", jawaban: "Khalid bin al-Walid, pada tahun ke-12 Hijriah (hal. 10)" },
    { id: 199, soal: "Apa itu pasar 'Ukazh?", jawaban: "Pasar yang diadakan bangsa Arab setiap tahun untuk memamerkan dagangan dan syair-syair kebanggaan para penyair fasih (hal. 10)" },
    { id: 200, soal: "Pasar 'Ukazh diserupakan dengan apa di masa sekarang?", jawaban: "Pameran-pameran di Eropa sekarang (hal. 10)" },
    { id: 201, soal: "Bagaimana cara an-Nu'man mengirim kafilah dagangnya ke 'Ukazh?", jawaban: "Di bawah jaminan keamanan seorang yang kuat dan terpandang di kaumnya (hal. 10)" },
    { id: 202, soal: "Siapa yang berada di dekat an-Nu'man ketika ia mencari penjamin kafilah?", jawaban: "Al-Barradh bin Qais al-Kinani dan 'Urwah bin 'Utbah ar-Rahhal (hal. 10)" },
    { id: 203, soal: "Bagaimana sifat al-Barradh bin Qais al-Kinani?", jawaban: "Seorang perusak (fātik) yang dibuang kaumnya karena banyak kejahatannya (hal. 10)" },
    { id: 204, soal: "Apa pertanyaan an-Nu'man kepada al-Barradh dan 'Urwah?", jawaban: "Siapa yang mau menjamin kafilah dagangku ini sampai ke 'Ukazh? (hal. 10)" },
    { id: 205, soal: "Apa jawaban al-Barradh atas pertanyaan an-Nu'man?", jawaban: "Aku menjaminnya dari (gangguan) Bani Kinanah (hal. 10)" },
    { id: 206, soal: "Apa tanggapan an-Nu'man atas jawaban al-Barradh?", jawaban: "Aku hanya ingin orang yang menjaminnya dari seluruh manusia (hal. 10)" },
    { id: 207, soal: "Apa arti abaital la'n (ucapan 'Urwah kepada an-Nu'man)?", jawaban: "Salam penghormatan Arab, artinya: engkau menolak melakukan segala yang pantas dicela (hal. 10)" },
    { id: 208, soal: "Apa ucapan 'Urwah yang merendahkan al-Barradh?", jawaban: "Anjing yang terbuang (dari kaumnya) ini yang akan menjaminnya untukmu? (hal. 10)" },
    { id: 209, soal: "'Urwah sanggup menjamin kafilah an-Nu'man dari siapa?", jawaban: "Dari ahlusy syīḥ wal qaiṣūm (penduduk pedalaman) dari Najd dan Tihamah (hal. 10)" },
    { id: 210, soal: "Apa itu Najd?", jawaban: "Dataran tinggi negeri Arab, yaitu bagian tengahnya (hal. 10)" },
    { id: 211, soal: "Apa itu Tihamah?", jawaban: "Dataran rendah di pesisir negeri Arab (hal. 10)" },
    { id: 212, soal: "Apa yang memisahkan Najd dan Tihamah?", jawaban: "Hijaz di barat dan Yamamah di timur (hal. 10)" },
    { id: 213, soal: "Bagian timur Tihamah disebut apa?", jawaban: "Bahrain (hal. 10)" },
    { id: 214, soal: "Apa pertanyaan al-Barradh kepada 'Urwah?", jawaban: "Apakah engkau juga menjaminnya dari Kinanah, wahai 'Urwah? (hal. 10)" },
    { id: 215, soal: "Apa jawaban 'Urwah kepada al-Barradh?", jawaban: "Ya, dan dari seluruh manusia (hal. 10)" },
    { id: 216, soal: "Bagaimana sikap al-Barradh setelah dihina 'Urwah?", jawaban: "Ia memendam dendam dalam hatinya dan menunggu kesempatan sampai 'Urwah keluar membawa kafilah dagang (hal. 10–11)" },
  ],
  "PKN": [
    // Sumber: TNT Pendidikan Pancasila XI (GPP) Semester 1
    { id: 1, soal: "Pancasila merupakan dasar tatanan negara Indonesia. Disebut juga sebagai apa?", jawaban: "Dasar hukum negara bangsa Indonesia (hal. 7)" },
    { id: 2, soal: "Pancasila adalah suatu ideologi yang menjadi apa bagi bangsa Indonesia?", jawaban: "Pedoman utama bagi bangsa Indonesia dalam menjalankan kehidupan (hal. 7)" },
    { id: 3, soal: "Selain simbol persatuan dan kebanggaan bangsa, Pancasila juga merupakan apa?", jawaban: "Acuan kehidupan berbangsa dan bernegara seluruh masyarakat Indonesia (hal. 7)" },
    { id: 4, soal: "Karena Pancasila acuan kehidupan berbangsa, apa kewajiban kita?", jawaban: "Wajib mengamalkan nilai-nilai Pancasila dalam kehidupan sehari-hari (hal. 7)" },
    { id: 5, soal: "Apa saja tujuan pengamalan nilai-nilai Pancasila dalam kehidupan sehari-hari?", jawaban: "1) Mempertahankan persatuan dan kesatuan RI\n2) Menjaga kedaulatan negara RI\n3) Menegakkan keadilan sosial\n4) Membangun perilaku berakhlak dan bermoral\n5) Menghubungkan rasa tanggung jawab antara masyarakat dan pemerintah (hal. 7)" },
    { id: 6, soal: "Apa saja nilai-nilai dasar dalam Pancasila?", jawaban: "Ketuhanan Yang Maha Esa, kemanusiaan, persatuan, kerakyatan, dan keadilan (hal. 7)" },
    { id: 7, soal: "Mengapa sila-sila Pancasila tidak dapat dipisahkan?", jawaban: "Karena setiap sila selalu berkaitan antara satu dengan lainnya (hal. 7)" },
    { id: 8, soal: "Secara etimologi, Pancasila berasal dari bahasa apa?", jawaban: "Bahasa Sanskerta (hal. 8)" },
    { id: 9, soal: "Apa arti kata panca?", jawaban: "Lima (hal. 8)" },
    { id: 308, soal: "Apa arti kata sila?", jawaban: "Dasar (hal. 8)" },
    { id: 10, soal: "Siapa yang memprakarsai istilah Pancasila?", jawaban: "Soekarno (hal. 8)" },
    { id: 11, soal: "Kapan dan di mana istilah Pancasila diprakarsai oleh Soekarno?", jawaban: "Pada sidang BPUPKI tanggal 1 Juni 1945 (hal. 8)" },
    { id: 12, soal: "Untuk apa Soekarno memprakarsai istilah Pancasila?", jawaban: "Untuk memberi nama atas lima prinsip dasar negara (hal. 8)" },
    { id: 13, soal: "Lima dasar dalam Pancasila berisi apa?", jawaban: "Pedoman atau aturan yang harus dijalankan untuk mewujudkan kehidupan berbangsa yang baik (hal. 8)" },
    { id: 14, soal: "Di mana saja simbol-simbol Pancasila terdapat?", jawaban: "Dalam lambang Garuda Pancasila dan Pembukaan UUD NRI Tahun 1945 (hal. 8)" },
    { id: 15, soal: "Simbol bintang pada perisai Garuda melambangkan sila ke berapa?", jawaban: "Sila pertama: Ketuhanan Yang Maha Esa (hal. 8)" },
    { id: 16, soal: "Simbol rantai pada perisai Garuda melambangkan sila ke berapa?", jawaban: "Sila kedua: Kemanusiaan yang adil dan beradab (hal. 8)" },
    { id: 17, soal: "Simbol pohon beringin pada perisai Garuda melambangkan sila ke berapa?", jawaban: "Sila ketiga: Persatuan Indonesia (hal. 8)" },
    { id: 18, soal: "Simbol kepala banteng pada perisai Garuda melambangkan sila ke berapa?", jawaban: "Sila keempat: Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan (hal. 8)" },
    { id: 19, soal: "Simbol padi dan kapas pada perisai Garuda melambangkan sila ke berapa?", jawaban: "Sila kelima: Keadilan sosial bagi seluruh rakyat Indonesia (hal. 8)" },
    { id: 20, soal: "Bagaimana bunyi penggalan Pembukaan UUD NRI 1945 yang menyebutkan Pancasila?", jawaban: "…Negara Republik Indonesia yang berkedaulatan rakyat dengan berdasar kepada Ketuhanan Yang Maha Esa, Kemanusiaan yang adil dan beradab, Persatuan Indonesia, dan Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan, serta dengan mewujudkan suatu Keadilan sosial bagi seluruh rakyat Indonesia (hal. 8)" },
    { id: 21, soal: "Bagaimana kelima sila Pancasila biasanya dibaca?", jawaban: "Satu per satu secara berurutan (hal. 8)" },
    { id: 22, soal: "Peraturan apa yang menyatakan pelafalan Pancasila dibaca berurutan (Satu: …, Dua: …)?", jawaban: "Instruksi Presiden Nomor 12 Tahun 1968 (hal. 8)" },
    { id: 23, soal: "Semua sila dalam Pancasila bersifat apa?", jawaban: "Organis atau saling terkait (hal. 8)" },

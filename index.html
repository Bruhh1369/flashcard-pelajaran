    { id: 24, soal: "Apa maksud sila-sila Pancasila bersifat organis?", jawaban: "Setiap unsur memiliki fungsi masing-masing, tetapi masih terkait satu sama lain (hal. 8)" },
    { id: 25, soal: "Pancasila merupakan satu kesatuan yang bagaimana?", jawaban: "Majemuk tunggal (hal. 8)" },
    { id: 26, soal: "Apa akibat Pancasila merupakan kesatuan majemuk tunggal?", jawaban: "Sila satu dengan yang lainnya saling terkait dan tidak mungkin bertentangan (hal. 8)" },
    { id: 27, soal: "Selain saling berkaitan, susunan Pancasila juga bersifat apa?", jawaban: "Hierarki dan berbentuk piramidal (hal. 8)" },
    { id: 28, soal: "Apa maksud susunan Pancasila bersifat hierarki dan piramidal?", jawaban: "Masing-masing sila saling berurutan dari segi kuantitas dan kualitasnya serta saling mengikat (hal. 8)" },
    { id: 29, soal: "Mengapa rumusan Pancasila disebut satu kesatuan yang saling berhubungan?", jawaban: "Karena hubungan antarsila saling mengisi antara satu dan lainnya (hal. 8)" },
    { id: 30, soal: "Setiap sila Pancasila mengandung apa?", jawaban: "Keempat sila lainnya (hal. 8)" },
    { id: 31, soal: "Sila ke berapa yang menjadi dasar bagi sila lainnya?", jawaban: "Sila kesatu (hal. 8)" },
    { id: 32, soal: "Sila kelima Pancasila dilandasi oleh sila apa saja?", jawaban: "Sila kesatu, kedua, ketiga, dan keempat (hal. 8)" },
    { id: 33, soal: "Apakah kelima sila Pancasila bisa ditambah atau dikurangi?", jawaban: "Tidak bisa (hal. 8)" },
    { id: 34, soal: "Apa akibat menghilangkan satu nilai dari Pancasila?", jawaban: "Berarti menghilangkan makna dan arti Pancasila itu sendiri (hal. 9)" },
    { id: 35, soal: "Menurut Hatta, mengapa pemaknaan dan penerapan Pancasila tidak bisa dipisah-pisah?", jawaban: "Karena Pancasila adalah lima asas atau prinsip yang merupakan dasar dan ideologi negara (hal. 9)" },
    { id: 36, soal: "Menurut Hatta, sila Ketuhanan Yang Maha Esa hadir menjadi sila yang bagaimana?", jawaban: "Sila yang memimpin atau menjiwai seluruh sila-sila lainnya (hal. 9)" },
    { id: 37, soal: "Menurut Hatta, apakah pengamalan sila ketuhanan hanya sebatas peribadatan?", jawaban: "Tidak, lebih luas: mengasihi sesama, membangun persatuan, aktif berdemokrasi, hingga mewujudkan kesejahteraan bersama (hal. 9)" },
    { id: 38, soal: "Menurut Hatta, pengamalan sila kedua sampai kelima mesti dilihat sebagai apa?", jawaban: "Bentuk keimanan dan ketakwaan kepada Tuhan Yang Maha Esa sebagaimana diajarkan sila pertama (hal. 9)" },
    { id: 39, soal: "Sila pertama mengandung nilai apa?", jawaban: "Nilai ketuhanan (hal. 9)" },
    { id: 40, soal: "Sila kedua mengandung nilai apa?", jawaban: "Nilai kemanusiaan (hal. 9)" },
    { id: 41, soal: "Bagaimana keterkaitan sila pertama dengan sila kedua?", jawaban: "Pancasila menghendaki setiap orang meyakini dan menjalankan ajaran agamanya, serta mengamalkannya dalam bentuk kasih sayang kepada sesama manusia (hal. 9)" },
    { id: 42, soal: "Menurut hubungan sila pertama dan kedua, kasih sayang pada sesama manusia harus dilandasi apa?", jawaban: "Keimanan kepada Tuhan Yang Maha Esa (hal. 9)" },
    { id: 43, soal: "Hubungan sila pertama dan ketiga memunculkan prinsip apa?", jawaban: "Prinsip ketuhanan yang diimani dan diamalkan dalam bentuk rasa cinta kepada tanah air dan bangsa Indonesia (hal. 9)" },
    { id: 44, soal: "Sebutkan contoh upaya cinta tanah air dalam hubungan sila pertama dan ketiga!", jawaban: "Menjaga kelestarian alam dan merawat persatuan bangsa di tengah keberagaman suku, agama, bahasa, dan budaya (hal. 9)" },
    { id: 45, soal: "Dalam kaitan sila pertama dan ketiga, ajaran ketuhanan semua agama harus dilihat sebagai apa?", jawaban: "Ajaran yang memupuk rasa cinta tanah air dan bangsa kepada para pemeluknya (hal. 9)" },
    { id: 46, soal: "Menurut pidato Soekarno 1 Juni 1945, Pancasila menghendaki keseimbangan status apa (hubungan sila kedua dan ketiga)?", jawaban: "Keseimbangan status manusia Indonesia antara menjadi bagian dari umat manusia (global) dan bagian dari bangsa Indonesia (hal. 9)" },
    { id: 47, soal: "Dalam hubungan sila kedua dan ketiga, identitas kebangsaan merupakan bagian dari apa?", jawaban: "Bagian dari identitas kemanusiaan secara universal (hal. 9)" },
    { id: 48, soal: "Menurut hubungan sila kedua dan ketiga, bagaimana bangsa Indonesia memandang bangsa lain?", jawaban: "Tidak menganggap dirinya lebih tinggi dari bangsa lain, dan mengakui dirinya bagian dari seluruh umat manusia (hal. 9)" },
    { id: 49, soal: "Menurut hubungan sila kedua dan ketiga, bangsa Indonesia dituntut hidup bagaimana?", jawaban: "Hidup harmonis dalam relasi yang setara sebagai sesama makhluk Tuhan Yang Maha Esa (hal. 9)" },
    { id: 50, soal: "Dalam hubungan sila ketiga dan keempat, prinsip kebangsaan harus dipahami sebagai apa?", jawaban: "Paham yang di dalamnya memiliki nilai-nilai demokrasi atau kedaulatan rakyat (hal. 9)" },
    { id: 51, soal: "Menurut hubungan sila ketiga dan keempat, upaya atas nama bangsa tidak boleh bertentangan dengan apa?", jawaban: "Hak-hak asasi manusia yang tertanam dalam prinsip demokrasi (hal. 9)" },
    { id: 52, soal: "Selain soal HAM, hubungan sila ketiga dan keempat juga menghendaki apa?", jawaban: "Semua orang Indonesia dilihat dalam posisi setara dan sama-sama bisa berperan memajukan negara (hal. 10)" },
    { id: 53, soal: "Menurut pidato Soekarno 1 Juni 1945, negara Indonesia dijalankan oleh siapa?", jawaban: "Oleh semua dan untuk semua bangsa Indonesia, bukan oleh sebagian kelompok tertentu (hal. 10)" },
    { id: 54, soal: "Dalam hubungan sila keempat dan kelima, demokrasi tidak boleh dimaknai sempit dalam aspek apa?", jawaban: "Aspek politik (hal. 10)" },
    { id: 55, soal: "Sebutkan contoh demokrasi dalam aspek politik!", jawaban: "Penggunaan hak suara rakyat dalam pemilu, atau menyuarakan aspirasi di ruang publik (hal. 10)" },
    { id: 56, soal: "Dalam hubungan sila keempat dan kelima, demokrasi juga harus mengikutsertakan aspek apa?", jawaban: "Kesetaraan di bidang sosial ekonomi (hal. 10)" },
    { id: 57, soal: "Kesetaraan sosial ekonomi dalam demokrasi berujung pada apa?", jawaban: "Terciptanya kesejahteraan hidup seluruh masyarakat Indonesia (hal. 10)" },
    { id: 58, soal: "Selain kebebasan dan kedaulatan rakyat, pelaksanaan demokrasi juga mengarah pada apa?", jawaban: "Terwujudnya pembangunan oleh pemerintah untuk mencapai keadilan sosial atau kesejahteraan rakyat (hal. 10)" },
    { id: 59, soal: "Keadilan sosial atau kesejahteraan rakyat merupakan bagian dari hak apa?", jawaban: "Hak sosial-ekonomi warga negara (hal. 10)" },
    { id: 60, soal: "Apa maksud Pancasila bersifat majemuk tunggal?", jawaban: "Setiap sila tidak bisa berdiri sendiri dan tidak saling bertolakan atau bertentangan (hal. 10)" },
    { id: 61, soal: "Apa makna sifat piramidal dalam Pancasila?", jawaban: "Dilihat dari urutannya, tingkat luas dan isi sifat setiap sila merupakan pengkhususan dari sila sebelumnya (hal. 10)" },
    { id: 62, soal: "Selain pengkhususan, apa lagi sifat hubungan antarsila dalam susunan piramidal?", jawaban: "Setiap sila saling mengisi dan mengualifikasi (hal. 10)" },
    { id: 63, soal: "Satu sila Pancasila bisa mengonfirmasi apa?", jawaban: "Makna empat sila lainnya (hal. 10)" },
    { id: 64, soal: "Bolehkah menganggap satu sila lebih tinggi atau lebih baik dari sila lainnya?", jawaban: "Tidak boleh, karena kelimanya merupakan satu kesatuan yang bulat dan utuh (hal. 10)" },
    { id: 65, soal: "Makna sila-sila Pancasila dijadikan pedoman di lingkungan mana saja?", jawaban: "Lingkungan sekolah, masyarakat, bangsa, dan negara (hal. 10)" },
    { id: 66, soal: "Nilai ketuhanan menjadi apa bagi kehidupan bangsa?", jawaban: "Sumber pokok nilai kehidupan bangsa (hal. 10)" },
    { id: 67, soal: "Menurut makna sila pertama, segala aspek penyelenggaraan negara harus memuat apa?", jawaban: "Nilai-nilai yang berasal dari Tuhan (hal. 10)" },
    { id: 68, soal: "Nilai ketuhanan pada sila pertama memiliki maksud apa?", jawaban: "Indonesia adalah negara beragama, sehingga setiap rakyat Indonesia memiliki agama yang dipercaya (hal. 10)" },
    { id: 69, soal: "Apa makna sila pertama Pancasila?", jawaban: "Bangsa Indonesia bertakwa kepada Tuhan Yang Maha Esa (hal. 10)" },
    { id: 70, soal: "Negara Indonesia didirikan atas landasan apa?", jawaban: "Landasan moral luhur, yaitu Ketuhanan Yang Maha Esa (hal. 10)" },
    { id: 71, soal: "Apa konsekuensi negara berdasarkan Ketuhanan Yang Maha Esa?", jawaban: "Negara menjamin warga negara dan penduduknya untuk memeluk dan beribadah sesuai agama dan kepercayaannya (hal. 10)" },
    { id: 72, soal: "Jaminan kebebasan beragama tertuang dalam pasal berapa UUD 1945?", jawaban: "Pasal 29 ayat (1) dan (2) (hal. 10)" },
    { id: 73, soal: "Bagaimana bunyi Pasal 29 ayat (1) UUD 1945?", jawaban: "Negara berdasar atas Ketuhanan Yang Maha Esa (hal. 10)" },
    { id: 74, soal: "Bagaimana bunyi Pasal 29 ayat (2) UUD 1945?", jawaban: "Negara menjamin kemerdekaan tiap-tiap penduduk untuk memeluk agamanya masing-masing dan untuk beribadat menurut agamanya dan kepercayaannya itu (hal. 10)" },
    { id: 75, soal: "Apakah Indonesia negara agama atau negara sekuler?", jawaban: "Bukan keduanya (hal. 11)" },
    { id: 309, soal: "Indonesia adalah negara yang bagaimana (bukan negara agama maupun sekuler)?", jawaban: "Negara yang berketuhanan (hal. 11)" },
    { id: 76, soal: "Apa maksud Indonesia negara yang berketuhanan?", jawaban: "Nilai-nilai ketuhanan menjiwai atau menjadi roh bagi seluruh kehidupan bermasyarakat, berbangsa, dan bernegara (hal. 11)" },
    { id: 77, soal: "Kalimat apa dalam Pembukaan UUD 1945 alinea ketiga yang menunjukkan nilai ketuhanan?", jawaban: "Atas berkat rahmat Allah Yang Maha Kuasa… (hal. 11)" },
    { id: 78, soal: "Sebutkan nilai-nilai yang terkandung dalam sila pertama Pancasila!", jawaban: "a. Bertakwa kepada Tuhan YME\nb. Mensyukuri segala yang ada di alam semesta sebagai anugerah Tuhan\nc. Mengakui kebebasan memeluk agama dan menjalankan ibadah masing-masing\nd. Menghormati dan saling menjaga kerukunan antarpemeluk agama (hal. 11)" },
    { id: 79, soal: "Sila pertama menjadi sumber utama nilai kehidupan bangsa yang berfungsi bagaimana terhadap sila lainnya?", jawaban: "Menjiwai, mendasari, serta membimbing perwujudan sila kedua sampai kelima (hal. 11)" },
    { id: 80, soal: "Nilai ketuhanan mengajarkan apa?", jawaban: "Meyakini ajaran agama atau aliran kepercayaan yang dianut dengan penuh ketaatan menjalankan perintah Tuhan Yang Maha Esa (hal. 11)" },
    { id: 81, soal: "Sila pertama menjadi dasar bangsa Indonesia untuk apa?", jawaban: "Saling menghormati antarumat beragama (hal. 11)" },
    { id: 82, soal: "Mengimani Tuhan Yang Maha Esa akan menggerakkan orang untuk apa?", jawaban: "Memeluk nilai-nilai kemanusiaan (hal. 11)" },
    { id: 83, soal: "Secara kultural, Pancasila sebagai dasar negara merupakan apa? (Info Khusus)", jawaban: "Hasil budaya bangsa (hal. 11)" },
    { id: 84, soal: "Karena Pancasila hasil budaya bangsa, bagaimana cara mewariskannya? (Info Khusus)", jawaban: "Diwariskan kepada generasi muda melalui pendidikan (hal. 11)" },
    { id: 85, soal: "Apa akibat jika Pancasila tidak diwariskan kepada generasi muda? (Info Khusus)", jawaban: "Negara dan bangsa akan kehilangan kultur yang penting (hal. 11)" },
    { id: 86, soal: "Bangsa yang besar adalah bangsa yang bagaimana? (Info Khusus)", jawaban: "Bangsa yang memiliki kepedulian kepada pewarisan budaya luhur bangsanya (hal. 11)" },
    { id: 87, soal: "Secara filosofis, nilai-nilai Pancasila merupakan apa? (Info Khusus)", jawaban: "Pandangan hidup bangsa Indonesia (hal. 11)" },
    { id: 88, soal: "Tatanan nilai Pancasila secara filosofis dipengaruhi oleh apa saja? (Info Khusus)", jawaban: "Potensi, kondisi bangsa, alam, dan cita-cita masyarakat (hal. 11)" },
    { id: 89, soal: "Dalam kehidupan berbangsa dan bernegara, Pancasila diakui sebagai apa? (Info Khusus)", jawaban: "Filsafat hidup yang berkembang dalam sosial budaya Indonesia (hal. 11)" },
    { id: 90, soal: "Kata kemanusiaan berasal dari kata apa, dan apa artinya?", jawaban: "Dari kata manusia, yakni makhluk ciptaan Tuhan Yang Maha Esa (hal. 11)" },
    { id: 91, soal: "Manusia memiliki potensi apa saja?", jawaban: "Pikir, rasa, karsa, dan cipta (hal. 11)" },
    { id: 92, soal: "Apa makna kata adil dalam sila kedua?", jawaban: "Keputusan dan tindakan didasarkan pada ukuran/norma yang objektif dan tidak subjektif (hal. 11)" },
    { id: 93, soal: "Apa akibat keputusan didasarkan pada norma yang objektif?", jawaban: "Tidak sewenang-wenang (hal. 11)" },
    { id: 94, soal: "Kata beradab berasal dari kata apa, dan apa artinya?", jawaban: "Dari kata adab, artinya budaya (hal. 11)" },
    { id: 95, soal: "Apa arti berbudaya (beradab)?", jawaban: "Sikap hidup, keputusan, dan tindakan yang selalu dilandasi nilai-nilai budaya, terutama norma sosial dan kesusilaan/moral (hal. 11)" },
    { id: 96, soal: "Kemanusiaan merupakan wujud dari apa?", jawaban: "Reaksi antarmasyarakat yang saling menghormati satu sama lain (hal. 11)" },
    { id: 97, soal: "Apa pengertian kemanusiaan yang adil dan beradab?", jawaban: "Kesadaran sikap dan perbuatan manusia yang didasarkan pada potensi budi rohani dalam hubungannya dengan norma dan kebudayaan (hal. 11)" },
    { id: 98, soal: "Kesadaran sikap dalam kemanusiaan yang adil dan beradab diwujudkan pada siapa saja?", jawaban: "Pada diri pribadi, sesama manusia, maupun alam sekitar/lingkungan (hal. 11)" },
    { id: 99, soal: "Apa maksud manusia yang adil dan beradab?", jawaban: "Manusia adalah makhluk ciptaan Tuhan yang memiliki derajat paling tinggi, sehingga harus mewujudkannya melalui sikap adil dan beradab (hal. 11)" },
    { id: 100, soal: "Sebutkan contoh sikap adil dan beradab!", jawaban: "Menghargai, menghormati, dan mencintai satu sama lain (hal. 11)" },
    { id: 101, soal: "Apa arti nilai kemanusiaan pada sila kedua?", jawaban: "Seluruh manusia diperlakukan sesuai harkat dan martabatnya selaku makhluk Tuhan yang sama derajat, hak, dan kewajibannya (hal. 11)" },
    { id: 102, soal: "Menurut nilai kemanusiaan, manusia diperlakukan tanpa membedakan apa saja?", jawaban: "Agama, suku, ras, dan golongan (hal. 11)" },
    { id: 103, soal: "Sebutkan nilai-nilai yang terdapat dalam sila kedua!", jawaban: "a. Mengakui persamaan derajat antarsesama manusia\nb. Mengakui persamaan hak dan kewajiban\nc. Mengembangkan sikap tenggang rasa\nd. Saling menyayangi sesama manusia\ne. Gemar melakukan kegiatan kemanusiaan (hal. 11)" },
    { id: 104, soal: "Sila kedua mengajarkan bangsa Indonesia untuk apa?", jawaban: "Memiliki sikap hormat terhadap sesama serta menjamin terselenggaranya hak asasi manusia (hal. 12)" },
    { id: 105, soal: "Dasar kemanusiaan yang adil dan beradab menjadi kelanjutan perbuatan dari sila apa?", jawaban: "Sila pertama, Ketuhanan Yang Maha Esa (hal. 12)" },
    { id: 106, soal: "Istilah persatuan dalam sila ketiga berasal dari kata apa?", jawaban: "Dari kata satu, yang artinya utuh, tidak terpecah-pecah (hal. 12)" },
    { id: 107, soal: "Apa pengertian persatuan?", jawaban: "Bersatunya macam-macam corak yang beraneka ragam menjadi satu kebulatan (hal. 12)" },
    { id: 108, soal: "Persatuan bangsa Indonesia dilambangkan dengan apa?", jawaban: "Bhinneka Tunggal Ika (hal. 12)" },
    { id: 109, soal: "Apa arti Bhinneka Tunggal Ika?", jawaban: "Berbeda-beda tetapi tetap satu tujuan (hal. 12)" },
    { id: 110, soal: "Persatuan Indonesia menjadi faktor apa dalam kehidupan bangsa?", jawaban: "Salah satu faktor yang dinamis (hal. 12)" },
    { id: 111, soal: "Apa yang dapat diwujudkan melalui persatuan?", jawaban: "Perdamaian antarmasyarakat (hal. 12)" },
    { id: 112, soal: "Semangat persatuan merupakan kunci dari apa?", jawaban: "Terbentuknya Indonesia yang merdeka (hal. 12)" },
    { id: 113, soal: "Mengapa persatuan harus ditingkatkan?", jawaban: "Demi kelangsungan hidup bangsa yang aman dan damai (hal. 12)" },
    { id: 114, soal: "Apa makna nilai persatuan?", jawaban: "Meskipun masyarakat Indonesia terdiri dari beragam etnis, suku bangsa, agama, ras, dan sebagainya, persatuan tetap harus dijunjung (hal. 12)" },
    { id: 115, soal: "Nilai apa yang juga terkandung dalam nilai persatuan?", jawaban: "Nilai patriotisme dan cinta tanah air (hal. 12)" },
    { id: 116, soal: "Sebutkan nilai-nilai yang terkandung dalam sila ketiga!", jawaban: "a. Bekerja sama demi kepentingan bangsa dan negara di atas kepentingan pribadi dan golongan\nb. Rela berkorban demi kepentingan bangsa dan negara\nc. Mengembangkan rasa bangga dan cinta tanah air dan bangsa\nd. Mengembangkan persatuan Indonesia atas dasar Bhinneka Tunggal Ika (hal. 12)" },
    { id: 117, soal: "Apa arti permusyawaratan dalam sila keempat?", jawaban: "Menggunakan musyawarah untuk memutuskan dan merumuskan suatu hal berdasarkan kehendak rakyat (hal. 12)" },
    { id: 118, soal: "Apa arti perwakilan dalam sila keempat?", jawaban: "Melaksanakan kehendak rakyat dalam kehidupan bernegara melalui badan perwakilan rakyat (hal. 12)" },
    { id: 119, soal: "Sila keempat mengandung nilai apa?", jawaban: "Nilai kerakyatan (hal. 12)" },
    { id: 120, soal: "Nilai kerakyatan merupakan cerminan dari apa?", jawaban: "Adanya demokrasi di Indonesia, di mana kedaulatan berada di tangan rakyat (hal. 12)" },
    { id: 121, soal: "Mengapa dalam demokrasi kedaulatan berada di tangan rakyat?", jawaban: "Sebab demokrasi berasal dari rakyat, oleh rakyat, dan untuk rakyat (hal. 12)" },
    { id: 122, soal: "Sebutkan nilai-nilai yang terkandung dalam sila keempat!", jawaban: "a. Mengutamakan kepentingan negara dan masyarakat\nb. Tidak memaksakan kehendak kepada orang lain\nc. Mengutamakan musyawarah dalam mengambil keputusan untuk kepentingan bersama\nd. Menerima dan melaksanakan hasil musyawarah dengan rasa tanggung jawab\ne. Melaksanakan musyawarah dengan akal sehat dan sesuai hati nurani yang luhur (hal. 12)" },
    { id: 123, soal: "Menurut Mohammad Hatta, demokrasi bangsa Indonesia berjalan di atas apa?", jawaban: "Kebenaran, keadilan, kebaikan, kejujuran, kesucian, dan keindahan (hal. 12)" },
    { id: 124, soal: "Demokrasi di Indonesia hendaknya didasari apa?", jawaban: "Pancasila, yaitu demokrasi yang ditopang oleh sila ketuhanan, kemanusiaan, persatuan, dan keadilan sosial (hal. 12)" },
    { id: 125, soal: "Jaminan hak manusia dalam pelaksanaan demokrasi terdapat pada pasal berapa?", jawaban: "Pasal 28 UUD NRI Tahun 1945 (hal. 12)" },
    { id: 126, soal: "Bagaimana bunyi Pasal 28 UUD NRI Tahun 1945?", jawaban: "Kemerdekaan berserikat dan berkumpul, mengeluarkan pikiran dengan lisan dan tulisan dan sebagainya ditetapkan dengan undang-undang (hal. 12)" },
    { id: 127, soal: "Apa makna sila kelima Pancasila?", jawaban: "Pelaksanaan kehidupan berbangsa dan bernegara untuk mewujudkan kehidupan seluruh masyarakat Indonesia yang adil dan makmur (hal. 12)" },
    { id: 128, soal: "Apa makna nilai keadilan?", jawaban: "Masyarakat berhak mendapat kesamaan kesejahteraan (hal. 12)" },
    { id: 129, soal: "Mengapa masyarakat berhak mendapat kesamaan kesejahteraan?", jawaban: "Karena itu tujuan bangsa Indonesia, yaitu menyejahterakan seluruh rakyatnya (hal. 12)" },
    { id: 130, soal: "Sila kelima sebenarnya menjadi apa bagi negara Indonesia?", jawaban: "Dasar sekaligus cita-cita yang hendak diwujudkan oleh negara Indonesia (hal. 12)" },
    { id: 131, soal: "Sebutkan nilai-nilai yang terdapat dalam sila kelima!", jawaban: "a. Bersikap adil\nb. Menjaga keseimbangan antara hak dan kewajiban\nc. Menghormati hak-hak orang lain\nd. Suka memberi pertolongan kepada orang lain\ne. Tidak bersifat boros dan bergaya hidup mewah\nf. Tidak melakukan perbuatan yang merugikan kepentingan umum\ng. Menghargai hasil karya orang lain (hal. 13)" },
    { id: 132, soal: "Nilai-nilai Pancasila tidak hanya untuk dipahami, tetapi juga untuk apa?", jawaban: "Diwujudkan melalui tindakan nyata dalam berbagai lingkungan kehidupan (hal. 13)" },
    { id: 133, soal: "Sebutkan contoh lingkungan kehidupan tempat nilai Pancasila diwujudkan!", jawaban: "Sekolah, keluarga, dan masyarakat (hal. 13)" },
    { id: 134, soal: "Apa arti Pancasila dalam tindakan?", jawaban: "Menerapkan nilai-nilai seperti saling menghormati, peduli terhadap sesama, bekerja sama, bermusyawarah, dan berlaku adil dalam kehidupan sehari-hari (hal. 13)" },
    { id: 135, soal: "Dari mana tindakan yang mencerminkan Pancasila dapat terlihat?", jawaban: "Dari cara seseorang bersikap, berbicara, dan mengambil keputusan dalam berbagai situasi (hal. 13)" },
    { id: 136, soal: "Menyatunya Pancasila dalam diri bangsa Indonesia salah satunya terlihat saat apa?", jawaban: "Saat ada pertandingan antarnegara (hal. 13)" },
    { id: 137, soal: "Sebutkan contoh pertandingan antarnegara yang menunjukkan menyatunya Pancasila!", jawaban: "Pertandingan bola antarnegara atau pertandingan bulu tangkis antarnegara (hal. 13)" },
    { id: 138, soal: "Bagaimana cara suporter mendukung atlet Indonesia saat bertanding?", jawaban: "Mengibarkan bendera Merah Putih dan menyanyikan berbagai lagu yang menambah semangat dalam pertandingan (hal. 13)" },
    { id: 139, soal: "Sebutkan lagu-lagu yang sering dinyanyikan untuk mendukung timnas!", jawaban: "Garuda Pancasila dan Garuda di Dadaku (hal. 13)" },
    { id: 140, soal: "Siapa pencipta lagu Garuda Pancasila?", jawaban: "Sudharnoto (hal. 13)" },
    { id: 141, soal: "Lagu Garuda di Dadaku dipopulerkan oleh siapa?", jawaban: "Grup band Netral (NTRL) (hal. 13)" },
    { id: 142, soal: "Dukungan suporter kepada timnas menunjukkan apa?", jawaban: "Pancasila dalam tindakan telah hidup dan dipraktikkan oleh masyarakat, terutama generasi muda (hal. 13)" },
    { id: 143, soal: "Apa dampak tantangan Pancasila di era globalisasi?", jawaban: "Dapat mengancam eksistensi bangsa Indonesia (hal. 13)" },
    { id: 144, soal: "Karena tantangan globalisasi, apa yang harus mampu dilakukan bangsa Indonesia?", jawaban: "Beradaptasi dan mencegah perubahan buruk atau kehilangan jati diri dan budaya bangsa akibat globalisasi (hal. 13)" },
    { id: 145, soal: "Bagaimana cara generasi milenial memaknai Pancasila?", jawaban: "Memiliki cara berbeda dibanding generasi pendahulunya (hal. 13)" },
    { id: 146, soal: "Pemahaman terhadap Pancasila dari aspek apa saja yang tidak bisa diabaikan?", jawaban: "Aspek historis, idealisme, dan tantangannya (hal. 14)" },
    { id: 147, soal: "Pancasila merupakan hasil musyawarah para pendiri bangsa yang disepakati sebagai apa?", jawaban: "\"Perjanjian luhur\", sebuah \"piagam\" yang harus dihormati dan dijalankan (hal. 14)" },
    { id: 148, soal: "Siapa yang dimaksud dengan istilah para pendiri bangsa?", jawaban: "Para pejuang kemerdekaan dari berbagai latar belakang agama, etnis, dan suku (hal. 14)" },
    { id: 149, soal: "Apakah perumusan Pancasila didominasi kelompok tertentu?", jawaban: "Tidak, tetapi atas kerja sama dari berbagai kalangan (hal. 14)" },
    { id: 150, soal: "Mengapa Pancasila disebut perjanjian luhur bangsa Indonesia?", jawaban: "Karena digali dari sosio-budaya bangsa sendiri dan disepakati bersama oleh seluruh rakyat sebagai milik bangsa yang harus diamalkan dan dilestarikan (hal. 14)" },
    { id: 151, soal: "Karena Pancasila perjanjian luhur bangsa, bagaimana sikap setiap generasi?", jawaban: "Harus bangga dengan Pancasila (hal. 14)" },
    { id: 152, soal: "Apakah Pancasila sesuatu yang baru atau asing bagi bangsa Indonesia?", jawaban: "Bukan (hal. 14)" },
    { id: 310, soal: "Sejak kapan Pancasila tertanam dalam sanubari dan budaya Indonesia?", jawaban: "Jauh sebelum Indonesia merdeka (hal. 14)" },
    { id: 153, soal: "Kapan dan di mana Soekarno menyatakan dirinya bukan pencipta Pancasila?", jawaban: "Dalam pidato di depan Kongres Rakyat Jawa Timur, 24 September 1955 (hal. 14)" },
    { id: 154, soal: "Menurut Soekarno, siapa pencipta Pancasila?", jawaban: "Bangsa Indonesia sendiri (hal. 14)" },
    { id: 311, soal: "Menurut Soekarno, apa perannya terhadap Pancasila?", jawaban: "Ia hanya menggali Pancasila dari bumi bangsa Indonesia (hal. 14)" },
    { id: 155, soal: "Menurut pidato Soekarno, berapa lama Pancasila terbenam di bumi Indonesia?", jawaban: "350 tahun (hal. 14)" },
    { id: 156, soal: "Pancasila merupakan jalan tengah bagi negara yang bagaimana?", jawaban: "Negara yang di dalamnya memiliki keragaman etnis, suku, dan agama (hal. 14)" },
    { id: 157, soal: "Apa pengertian tanggung jawab dalam Pendidikan Antikorupsi?", jawaban: "Melaksanakan tugas dan kewajiban yang seharusnya dilakukan terhadap diri sendiri, masyarakat, lingkungan (alam, sosial, budaya), negara, dan Tuhan YME (hal. 14)" },
    { id: 158, soal: "Kekompakan suporter mendukung timnas menunjukkan nilai apa saja?", jawaban: "Optimisme, patriotisme, nasionalisme, dan hal-hal positif lainnya (hal. 14)" },
    { id: 159, soal: "Mengapa internalisasi nilai Pancasila dalam tindakan sehari-hari sangat penting?", jawaban: "Untuk melestarikan nilai-nilai Pancasila (hal. 14)" },
    { id: 160, soal: "Pancasila merupakan sistem nilai yang dieksplorasi dari apa?", jawaban: "Nilai-nilai luhur rakyat Indonesia, berbasis kearifan lokal Nusantara (hal. 14)" },
    { id: 161, soal: "Selain cita-cita bangsa, Pancasila juga menjadi puncak dari apa?", jawaban: "Puncak pemikiran peradaban bangsa Indonesia (hal. 14)" },
    { id: 162, soal: "Salah satu upaya membudayakan nilai Pancasila adalah apa?", jawaban: "Internalisasi Pancasila kepada generasi muda selaku generasi penerus bangsa (hal. 14)" },
    { id: 163, soal: "Mengapa internalisasi nilai Pancasila menjadi kebutuhan mendasar dalam berbangsa?", jawaban: "Karena hanya bangsa yang memiliki nilai Pancasila dan jati diri kuat yang akan maju dan berkembang (hal. 14)" },
    { id: 164, soal: "Apa pengertian internalisasi nilai-nilai Pancasila?", jawaban: "Proses memasukkan nilai Pancasila ke dalam diri individu sehingga menjadi bagian dari pemikiran dan tindakan sehari-hari (hal. 14)" },
    { id: 165, soal: "Internalisasi membuat nilai Pancasila bukan hanya dikenal, tetapi juga apa?", jawaban: "Diterima dan diterapkan dalam kehidupan sehari-hari (hal. 14)" },
    { id: 166, soal: "Bagaimana internalisasi Pancasila diberikan kepada generasi muda agar budaya tidak luntur?", jawaban: "Menanamkan rasa nasionalisme melalui pembelajaran Pendidikan Pancasila di lembaga pendidikan, sejak SD sampai Perguruan Tinggi (hal. 14)" },
    { id: 167, soal: "Apa pengertian Pendidikan Pancasila?", jawaban: "Usaha sadar untuk mencerdaskan kehidupan bangsa dan menumbuhkan jati diri bangsa (hal. 14)" },
    { id: 168, soal: "Sebutkan contoh praktik sehari-hari untuk menanamkan rasa nasionalisme!", jawaban: "Pelaksanaan upacara bendera, dan memperingati hari Pahlawan, hari Sumpah Pemuda, dan hari besar lainnya (hal. 14)" },
    { id: 169, soal: "Menurut Juliardi, dengan cara apa saja internalisasi Pancasila dalam pembelajaran Pendidikan Pancasila?", jawaban: "a. Melalui teori dalam Pendidikan Pancasila\nb. Melalui proses pembelajaran (kegiatan pembuka, inti, dan penutup)\nc. Melalui evaluasi (hal. 14–15)" },
    { id: 170, soal: "Bagaimana cara menanamkan rasa cinta tanah air?", jawaban: "a. Pembiasaan menyanyikan lagu wajib nasional sebelum pembelajaran\nb. Melihat pertunjukan seni bertajuk semangat juang (hal. 15)" },
    { id: 171, soal: "Apa manfaat melihat pertunjukan seni bertajuk semangat juang?", jawaban: "Tumbuh rasa nasionalisme dan rasa cinta budaya bangsa (hal. 15)" },
    { id: 172, soal: "Dengan menanamkan nasionalisme dan cinta tanah air, generasi muda bisa bagaimana?", jawaban: "Lebih selektif dalam menghadapi perubahan akibat globalisasi (hal. 15)" },
    { id: 173, soal: "Apa yang dibuktikan sejarah bangsa sejak proklamasi 17 Agustus 1945 tentang Pancasila?", jawaban: "Pancasila mampu menyesuaikan diri dengan perubahan dinamika bangsa Indonesia (hal. 15)" },
    { id: 174, soal: "Apa salah satu sikap menghargai nilai-nilai Pancasila?", jawaban: "Mempertahankan Pancasila (hal. 15)" },
    { id: 175, soal: "Apa saja arti mempertahankan Pancasila?", jawaban: "a. Melaksanakan dan mengamalkan nilai luhur Pancasila sehari-hari\nb. Tidak mengubah, menghapus, dan mengganti dasar negara Pancasila\nc. Mempertahankan NKRI (hal. 15)" },
    { id: 176, soal: "Mempertahankan Pancasila merupakan tanggung jawab siapa?", jawaban: "Tanggung jawab bersama antara pemerintah dan seluruh rakyat Indonesia (hal. 15)" },
    { id: 177, soal: "Apa akibat jika ada yang ingin mengganti Pancasila?", jawaban: "Berarti mengancam keberadaan negara Indonesia (hal. 15)" },
    { id: 178, soal: "Apa akibat jika dasar negara diganti?", jawaban: "Runtuhlah bangunan negara Indonesia (hal. 15)" },
    { id: 179, soal: "Apa salah satu upaya mempertahankan Pancasila?", jawaban: "Mengamalkan nilai-nilai Pancasila dalam kehidupan sehari-hari (hal. 15)" },
    { id: 180, soal: "Pelaksanaan Pancasila dalam kehidupan sehari-hari memerlukan apa?", jawaban: "Kesadaran (hal. 15)" },
    { id: 181, soal: "Apa pengertian kesadaran?", jawaban: "Hasil perbuatan akal seorang individu, yakni melakukan pengamalan mengenai keadaan-keadaan yang ada dalam diri (hal. 15)" },
    { id: 182, soal: "Apa arti bersikap positif terhadap Pancasila sebagai pandangan hidup bangsa?", jawaban: "Melaksanakan Pancasila sehari-hari dan menggunakannya sebagai petunjuk agar mencapai kesejahteraan dan kebahagiaan lahir batin (hal. 15)" },
    { id: 183, soal: "Kapan seseorang dikatakan melaksanakan Pancasila dalam hidup sehari-hari?", jawaban: "1) Sikap mental, pola pikir, dan tingkah lakunya dijiwai sila-sila Pancasila secara bulat\n2) Bersumber pada Pembukaan dan Batang Tubuh UUD 1945\n3) Tidak bertentangan dengan norma agama, kesusilaan, sopan santun, adat kebiasaan, dan norma hukum (hal. 15)" },
    { id: 184, soal: "Mengapa pembiasaan perilaku sesuai nilai Pancasila sangat penting?", jawaban: "Karena Pancasila merupakan identitas dan jati diri bangsa Indonesia (hal. 15)" },
    { id: 185, soal: "Sebutkan perilaku sesuai nilai Pancasila di lingkungan keluarga!", jawaban: "1) Taat dan patuh pada orang tua\n2) Membantu pekerjaan orang tua\n3) Menghormati dan menghargai pendapat anggota keluarga\n4) Saling menyayangi antaranggota keluarga\n5) Membiasakan menyelesaikan masalah dengan musyawarah (hal. 15)" },
    { id: 186, soal: "Sebutkan perilaku sesuai nilai Pancasila di lingkungan pergaulan!", jawaban: "1) Berbicara sopan dan santun\n2) Menghargai pendapat teman\n3) Bergaul tanpa membeda-bedakan teman\n4) Tidak membedakan orang kaya dan miskin\n5) Hidup sederhana dan tidak bergaya hidup mewah (hal. 15)" },
    { id: 187, soal: "Mengapa nilai-nilai Pancasila perlu diterapkan di lingkungan sekolah?", jawaban: "Karena di sekolah terdapat keragaman latar belakang sosial, budaya, dan agama (hal. 16)" },
    { id: 188, soal: "Sebutkan perilaku sesuai nilai Pancasila di lingkungan sekolah!", jawaban: "1) Menaati tata tertib sekolah\n2) Menengok teman yang sakit\n3) Menghargai hasil karya orang lain\n4) Menghormati seluruh warga sekolah\n5) Menghormati teman yang melakukan ibadah (hal. 16)" },
    { id: 189, soal: "Sebutkan perilaku sesuai nilai Pancasila di lingkungan masyarakat!", jawaban: "1) Menjalin kerja sama dengan orang lain\n2) Tidak mengganggu ibadah orang lain\n3) Melaksanakan ajaran agama yang diyakini\n4) Ikut serta dalam kerja bakti\n5) Membiasakan bekerja keras (hal. 16)" },
    { id: 190, soal: "Apa yang diperlukan setiap negara untuk mengatur kehidupan berbangsa dan bernegara?", jawaban: "Seperangkat nilai dan cita-cita yang disepakati bersama (hal. 16)" },
    { id: 191, soal: "Nilai dan cita-cita yang disepakati bersama dalam negara berfungsi sebagai apa?", jawaban: "Pedoman menentukan arah, tujuan, serta cara mengelola kehidupan nasional (hal. 16)" },
    { id: 192, soal: "Seperangkat nilai yang menjadi pedoman kehidupan nasional sering disebut apa?", jawaban: "Ideologi negara (hal. 16)" },
    { id: 193, soal: "Bagaimana ideologi setiap negara diterapkan?", jawaban: "Sesuai kondisi negaranya (hal. 16)" },
    { id: 194, soal: "Apa ideologi bangsa Indonesia dari awal berdiri yang tidak dapat diubah?", jawaban: "Pancasila (hal. 16)" },
    { id: 195, soal: "Ideologi berasal dari bahasa apa, dan dari kata apa?", jawaban: "Bahasa Yunani, dari kata idea dan logos (hal. 16)" },
    { id: 196, soal: "Apa arti idea?", jawaban: "Ide, gagasan, buah pikir, atau konsep (hal. 16)" },
    { id: 312, soal: "Apa arti logos?", jawaban: "Hasil pemikiran (hal. 16)" },
    { id: 197, soal: "Berdasarkan bahasa, apa arti ideologi?", jawaban: "Ilmu yang mencakup kajian asal mula dan hakikat buah pikir atau gagasan (hal. 16)" },
    { id: 198, soal: "Apa arti umum istilah ideologi?", jawaban: "Seperangkat pengetahuan, nilai, keyakinan, dan pandangan dunia yang menjadi landasan pemikiran dan tindakan dalam bidang politik, sosial, ekonomi, dan budaya (hal. 16)" },
    { id: 199, soal: "Menurut Franz Magnis Suseno, apa arti ideologi secara luas?", jawaban: "Segala kelompok cita-cita, pedoman normatif (hal. 16)" },
    { id: 200, soal: "Menurut Franz Magnis Suseno, apa arti ideologi secara sempit?", jawaban: "Gagasan atau teori menyeluruh tentang makna hidup dan nilai yang mau menentukan dengan mutlak bagaimana manusia harus hidup dan bertindak (hal. 16)" },
    { id: 201, soal: "Menurut M. Sastrapratedja, apa pengertian ideologi?", jawaban: "Seperangkat gagasan atau pemikiran yang berorientasi pada tindakan yang diorganisasi menjadi suatu sistem yang teratur (hal. 16)" },
    { id: 202, soal: "Menurut M. Sastrapratedja, ideologi memuat tiga unsur apa saja?", jawaban: "Penafsiran atau pemahaman, seperangkat nilai atau preskripsi moral, dan orientasi pada tindakan (hal. 16)" },
    { id: 203, soal: "Menurut Koento Wibisono, apa tiga unsur esensial dalam ideologi?", jawaban: "Keyakinan, mitos, dan loyalitas (hal. 17)" },
    { id: 204, soal: "Menurut Koento Wibisono, apa arti unsur keyakinan dalam ideologi?", jawaban: "Ideologi menunjuk gagasan vital yang sudah diyakini kebenarannya untuk dijadikan dasar dan strategi mencapai tujuan (hal. 17)" },
    { id: 205, soal: "Menurut Koento Wibisono, apa arti unsur mitos dalam ideologi?", jawaban: "Ideologi memitoskan suatu ajaran yang secara optimistis pasti menjamin tercapainya tujuan melalui cara-cara yang telah ditentukan (hal. 17)" },
    { id: 206, soal: "Menurut Koento Wibisono, apa arti unsur loyalitas dalam ideologi?", jawaban: "Ideologi menuntut keterlibatan optimal atas dasar loyalitas dari para subjek pendukungnya (hal. 17)" },
    { id: 207, soal: "Menurut Soerjanto Poespowardoyo, apa pengertian ideologi?", jawaban: "Konsep pengetahuan dan nilai yang menjadi landasan untuk memahami jagat raya dan bumi seisinya serta menentukan sikap dasar untuk mengolahnya (hal. 17)" },
    { id: 208, soal: "Menurut Mubyarto, apa pengertian ideologi?", jawaban: "Sejumlah doktrin kepercayaan dan simbol sekelompok masyarakat atau bangsa yang menjadi pegangan dan pedoman kerja atau perjuangan untuk mencapai tujuan (hal. 17)" },
    { id: 209, soal: "Menurut Padmo Wahjono, apa pengertian ideologi?", jawaban: "Kesatuan bulat dan utuh dari ide-ide dasar sebagai kelanjutan atau konsekuensi logis dari pandangan hidup bangsa (hal. 17)" },
    { id: 210, soal: "Menurut Padmo Wahjono, ideologi berupa apa?", jawaban: "Seperangkat tata nilai yang dicita-citakan akan direalisasikan dalam kehidupan berkelompok (hal. 17)" },
    { id: 211, soal: "Sebutkan fungsi ideologi secara umum!", jawaban: "1) Tanda pengenal sebuah bangsa\n2) Menuntun memahami dan berperilaku terhadap dunia dan sesamanya\n3) Alat pencegah konflik dalam masyarakat\n4) Pemersatu bangsa (hal. 17)" },
    { id: 212, soal: "Apa tujuan ideologi sebagai alat pencegahan konflik?", jawaban: "Agar masyarakat hidup tenteram sekaligus memiliki rasa solidaritas yang tinggi (hal. 17)" },
    { id: 213, soal: "Apa yang dimaksud fungsi kognitif ideologi?", jawaban: "Ideologi dijadikan landasan bagi suatu bangsa dalam berkehidupan dunia (hal. 17)" },
    { id: 214, soal: "Apa yang dimaksud fungsi orientasi ideologi?", jawaban: "Ideologi menjadi sumber wawasan dan makna bagi rakyat, serta pembimbing rakyat dalam mencapai tujuan (hal. 17)" },
    { id: 215, soal: "Apa ciri ideologi 'mengandung nilai dan tujuan'?", jawaban: "Ideologi selalu mengandung nilai dan tujuan yang ingin dicapai atau diwujudkan (hal. 17)" },
    { id: 216, soal: "Sebutkan contoh nilai yang biasanya dikandung ideologi!", jawaban: "Kebangsaan, kemanusiaan, keadilan, kebebasan, kesetaraan, dan keamanan (hal. 17)" },
    { id: 217, soal: "Apa ciri ideologi 'berpandangan dunia'?", jawaban: "Ideologi memberi cara pandang terhadap manusia, masyarakat, budaya, ekonomi, agama, dan kekuasaan secara konsisten, terpadu, dan menyeluruh (hal. 17)" },
    { id: 218, soal: "Apa ciri ideologi 'pemberi dan pembeda identitas'?", jawaban: "Ideologi menjadi sumber identitas dan pembeda bagi individu atau kelompok dengan yang lainnya (hal. 17)" },
    { id: 219, soal: "Apa ciri ideologi 'berpengaruh pada kebijakan'?", jawaban: "Ideologi memengaruhi pembentukan kebijakan dan keputusan politik yang menyangkut hajat hidup orang banyak (hal. 18)" },
    { id: 220, soal: "Sebutkan contoh pengaruh ideologi pada kebijakan!", jawaban: "Bentuk dan peran pemerintahan, pembagian kekuasaan, distribusi kesejahteraan, pengelolaan lingkungan, dan pemanfaatan sumber daya alam (hal. 18)" },
    { id: 221, soal: "Apa ciri ideologi 'bersifat adaptif dan kontekstual'?", jawaban: "Ideologi tidak kebal terhadap perubahan dan mampu merespons tantangan tanpa berubah menjadi sesuatu yang lain (hal. 18)" },
    { id: 222, soal: "Apa ciri ideologi 'pendorong perubahan sosial'?", jawaban: "Ideologi dapat menjadi landasan bagi gerakan sosial atau politik yang ingin mewujudkan perubahan dalam masyarakat (hal. 18)" },
    { id: 223, soal: "Apa arti Pancasila dijadikan ideologi negara Indonesia?", jawaban: "Setiap peraturan dan perundang-undangan negara harus berpedoman pada nilai-nilai Pancasila (hal. 18)" },
    { id: 224, soal: "Bolehkah peraturan dan kebijakan pemerintah bertentangan dengan Pancasila?", jawaban: "Tidak boleh (hal. 18)" },
    { id: 225, soal: "Selain ideologi negara, Pancasila juga berkedudukan sebagai apa?", jawaban: "Sumber hukum di atas sumber hukum negara (hal. 18)" },
    { id: 226, soal: "Bagaimana definisi negara menurut Miriam Budiardjo?", jawaban: "Organisasi yang menguasai wilayah dan menata masyarakat (hal. 18)" },
    { id: 227, soal: "Sebutkan empat unsur penting suatu negara!", jawaban: "1) Wilayah yang memiliki batas\n2) Rakyat yang mendiami wilayah\n3) Pemerintahan yang berdaulat\n4) Kemampuan berhubungan dengan negara berdaulat lainnya (hal. 18)" },
    { id: 228, soal: "Mengapa Indonesia memerlukan sebuah ideologi?", jawaban: "Karena wilayahnya luas dan penduduknya terdiri dari berbagai etnis, suku, budaya, bahasa, agama, dan kepercayaan (hal. 18)" },
    { id: 229, soal: "Apa tujuan didirikannya negara Republik Indonesia secara umum?", jawaban: "Mewujudkan masyarakat yang adil dan makmur (hal. 18)" },
    { id: 230, soal: "Sebutkan tujuan NKRI dalam Pembukaan UUD 1945!", jawaban: "1) Melindungi segenap bangsa dan seluruh tumpah darah Indonesia\n2) Memajukan kesejahteraan umum\n3) Mencerdaskan kehidupan bangsa\n4) Ikut melaksanakan ketertiban dunia berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial (hal. 18)" },
    { id: 231, soal: "Mengapa Pancasila berkedudukan sebagai ideologi negara Indonesia?", jawaban: "Karena Pancasila merupakan kepribadian bangsa Indonesia (hal. 18)" },
    { id: 232, soal: "Di mana nilai-nilai Pancasila tercermin sejak lama di Nusantara?", jawaban: "Dalam ekspresi budaya, corak perekonomian, kehidupan sosial, dan spiritualitas masyarakat (hal. 18)" },
    { id: 233, soal: "Apa akibat jika Indonesia menjadikan ideologi selain Pancasila sebagai ideologi negara?", jawaban: "Tujuan negara tidak akan tercapai (hal. 18)" },
    { id: 234, soal: "Mengapa memakai ideologi selain Pancasila membuat tujuan negara tidak tercapai?", jawaban: "Sebab sama halnya mengingkari kepribadian, keberadaan, dan tujuan negara Indonesia itu sendiri (hal. 18)" },
    { id: 235, soal: "Sebagai ideologi negara, Pancasila merupakan apa?", jawaban: "Gagasan atau ide yang dijadikan pedoman atau arah dalam mencapai cita-cita bangsa (hal. 18)" },
    { id: 236, soal: "Mengapa setiap bangsa memiliki ideologi yang berbeda?", jawaban: "Karena disesuaikan dengan nilai-nilai yang ada dalam kehidupan bangsa (hal. 19)" },
    { id: 237, soal: "Pancasila sebagai ideologi negara merupakan ciri khas atau identitas bangsa yang perlu apa?", jawaban: "Dipertahankan dan terus dijadikan pedoman dalam menentukan arah dan tujuan, yang diwujudkan dalam sikap dan perilaku bangsa Indonesia (hal. 19)" },
    { id: 238, soal: "Sebutkan makna Pancasila sebagai ideologi negara!", jawaban: "1) Nilai-nilai Pancasila dijadikan acuan dalam mencapai cita-cita yang berkaitan dengan aktivitas kehidupan bernegara\n2) Nilai-nilai Pancasila berupa kesepakatan bersama dan menjadi sarana pemersatu bangsa (hal. 19)" },
    { id: 239, soal: "Apa peran Pancasila sebagai ideologi negara bagi masyarakat?", jawaban: "Memberi bimbingan kepada masyarakat Indonesia dalam menentukan sikap dan tingkah laku (hal. 19)" },
    { id: 240, soal: "Nilai-nilai dalam kelima asas Pancasila dijadikan apa oleh bangsa Indonesia?", jawaban: "Patokan aturan dalam berbuat di kehidupan bermasyarakat dan bernegara (hal. 19)" },
    { id: 241, soal: "Sebutkan fungsi Pancasila sebagai ideologi negara!", jawaban: "1) Memberi identitas agar masyarakat bisa mengembangkan sekaligus memelihara identitas bangsa\n2) Mengawasi perilaku masyarakat dan bersikap kritis terhadap berbagai usaha agar cita-cita bangsa terwujud\n3) Mengarahkan bangsa mencapai tujuan, terutama cita-cita bangsa dan negara\n4) Memelihara, memperkuat, dan menyatukan bangsa agar persatuan terjaga dan konflik berkurang\n5) Pedoman kehidupan berbangsa dan bernegara agar kehidupan bermasyarakat harmonis (hal. 19)" },
    { id: 242, soal: "Apa akibat jika nilai Pancasila tidak diterapkan dalam kehidupan sehari-hari?", jawaban: "Bangsa Indonesia akan kehilangan jati dirinya (hal. 19)" },
    { id: 243, soal: "Sebagai suatu sistem pemikiran, ideologi wajar mengambil sumber dari mana?", jawaban: "Dari pandangan dan falsafah hidup bangsa (hal. 19)" },
    { id: 244, soal: "Apa akibat ideologi mengambil sumber dari pandangan dan falsafah hidup bangsa?", jawaban: "Ideologi berkembang sesuai perkembangan masyarakat dan kecerdasan kehidupan bangsa (hal. 19)" },
    { id: 245, soal: "Apa arti ideologi bersifat terbuka?", jawaban: "Ideologi senantiasa mendorong perkembangan pemikiran baru tentang ideologi tersebut, tanpa harus kehilangan jati dirinya (hal. 19)" },
    { id: 246, soal: "Sebutkan ciri khas ideologi terbuka!", jawaban: "1) Nilai dan cita-citanya tidak dipaksakan dari luar, melainkan digali dari kekayaan rohani, moral, dan budaya masyarakat itu sendiri\n2) Dasarnya dari konsensus masyarakat, tidak diciptakan oleh negara, melainkan ditemukan dalam masyarakat sendiri (hal. 19)" },
    { id: 247, soal: "Mengapa Pancasila memenuhi prasyarat menjadi ideologi terbuka?", jawaban: "Karena Pancasila berakar pada pandangan hidup bangsa dan falsafah bangsa (hal. 19)" },
    { id: 248, soal: "Apa pengertian keterbukaan Pancasila?", jawaban: "Pancasila senantiasa mampu berinteraksi secara dinamis (hal. 19)" },
    { id: 249, soal: "Dalam ideologi terbuka, apakah nilai Pancasila berubah?", jawaban: "Tidak, nilainya tetap (hal. 19)" },
    { id: 313, soal: "Dalam ideologi terbuka, apa yang disesuaikan dari Pancasila?", jawaban: "Pelaksanaannya, disesuaikan dengan kebutuhan dan tantangan nyata setiap waktu (hal. 19)" },
    { id: 250, soal: "Sebagai ideologi terbuka, Pancasila bersifat apa saja?", jawaban: "Aktual, dinamis, antisipatif, dan mampu menyesuaikan diri dengan perkembangan zaman, IPTEK, serta dinamika aspirasi masyarakat (hal. 19)" },
    { id: 251, soal: "Secara sederhana, apa arti Pancasila sebagai ideologi terbuka?", jawaban: "Pandangan hidup yang dinamis, beradaptasi dengan perkembangan zaman, dan dihasilkan dari kesepakatan masyarakat (hal. 19)" },
    { id: 252, soal: "Pancasila sebagai ideologi terbuka mengandung nilai apa saja?", jawaban: "Nilai dasar dan nilai instrumental yang dapat berinteraksi dengan perkembangan zaman dan dinamika secara internal (hal. 19)" },
    { id: 253, soal: "Apa pengertian ideologi terbuka?", jawaban: "Ideologi yang tidak dimutlakkan dan terlahir dari hasil kesepakatan masyarakat (hal. 19)" },
    { id: 254, soal: "Keterbukaan ideologi Pancasila harus memperhatikan hal apa saja?", jawaban: "1) Stabilitas nasional yang dinamis\n2) Larangan memasukkan pemikiran marxisme, leninisme, dan komunisme\n3) Mencegah berkembangnya paham liberal\n4) Larangan pandangan ekstrem yang menggelisahkan masyarakat\n5) Penciptaan norma harus melalui kesepakatan (hal. 20)" },
    { id: 255, soal: "Cita-cita kehidupan bernegara berdasarkan Pancasila tertuang dalam apa?", jawaban: "Ketetapan MPR tentang visi Indonesia di masa depan (hal. 20)" },
    { id: 256, soal: "Apa yang dimaksud visi ideal dalam Ketetapan MPR?", jawaban: "Cita-cita luhur bangsa Indonesia seperti yang tercantum dalam UUD 1945 (hal. 20)" },
    { id: 257, soal: "Apa yang dimaksud visi antara dalam Ketetapan MPR?", jawaban: "Visi bangsa Indonesia hingga tahun 2020 (hal. 20)" },
    { id: 258, soal: "Apa yang dimaksud visi lima tahunan dalam Ketetapan MPR?", jawaban: "Visi seperti yang telah tercantum dalam GBHN (hal. 20)" },
    { id: 259, soal: "Lembaga apa yang menetapkan visi Indonesia 2045?", jawaban: "Kementerian Perencanaan Pembangunan Nasional/Badan Perencanaan Pembangunan Nasional (Bappenas) (hal. 20)" },
    { id: 260, soal: "Apa bunyi visi Indonesia 2045?", jawaban: "Indonesia 2045, Berdaulat, Maju, Adil, dan Makmur (hal. 20)" },
    { id: 261, soal: "Mengapa tahun 2045 penting bagi Indonesia?", jawaban: "Indonesia genap 100 tahun merdeka (hal. 20)" },
    { id: 262, soal: "Apa harapan bagi Indonesia di tahun 2045?", jawaban: "Menjadi negara dengan kualitas manusia unggul, masyarakat maju lewat penguasaan IPTEK, serta semakin adil dan makmur (hal. 20)" },
    { id: 263, soal: "Visi Indonesia 2045 menyiratkan Indonesia berada dalam kepemimpinan siapa?", jawaban: "Generasi emas (hal. 20)" },
    { id: 264, soal: "Bagaimana gambaran generasi emas?", jawaban: "a. Generasi yang memiliki kecerdasan produktif dan inovatif, berkarakter kuat, dan berjiwa gotong royong\nb. Generasi yang sadar akan alam sekitarnya, yang melakukan pembangunan tanpa merusak alam (hal. 20)" },
    { id: 265, soal: "Visi Indonesia 2045 dibangun dengan empat pilar berdasarkan apa?", jawaban: "Pancasila dan UUD 1945 sebagai dasar berbangsa, bernegara, dan konstitusi (hal. 20)" },
    { id: 266, soal: "Sebutkan empat pilar visi Indonesia 2045!", jawaban: "a. Pembangunan manusia serta penguasaan IPTEK\nb. Pembangunan ekonomi berkelanjutan\nc. Pemerataan pembangunan\nd. Pemantapan ketahanan nasional dan tata kelola kepemerintahan (hal. 20)" },
    { id: 267, soal: "Apa nama proyeksi kehidupan masyarakat Indonesia pada tahun 2085?", jawaban: "Impian Indonesia (hal. 20)" },
    { id: 268, soal: "Sebutkan kondisi yang diharapkan dalam Impian Indonesia 2085!", jawaban: "a. SDM Indonesia cerdas mengungguli bangsa lain\nb. Indonesia pusat pendidikan, teknologi, dan peradaban dunia\nc. Masyarakat dan aparatur bebas korupsi\nd. Infrastruktur merata di seluruh Indonesia\ne. Indonesia mandiri dan paling berpengaruh di Asia\nf. Indonesia barometer pertumbuhan ekonomi dunia (hal. 20)" },
    { id: 269, soal: "Visi Indonesia 2045 dan Impian Indonesia 2085 menunjukkan apa tentang Pancasila?", jawaban: "Pancasila sebagai ideologi negara senantiasa menuntun arah dan tujuan pembangunan Indonesia ke depan (hal. 20)" },
    { id: 270, soal: "Apa tugas kita terhadap Pancasila sebagai ideologi negara?", jawaban: "Mengamalkannya, karena Pancasila harus dijadikan tuntunan (hal. 20)" },
    { id: 271, soal: "Mewujudkan Pancasila sebagai cita-cita bangsa berarti menciptakan bangsa yang bagaimana?", jawaban: "Taat beragama, penuh kemanusiaan, demokratis, penuh persatuan, adil, serta sejahtera (hal. 20)" },
    { id: 272, soal: "Pancasila merupakan panduan bagi bangsa dalam menjaga apa?", jawaban: "Keutuhan, persatuan, dan kesatuan Republik Indonesia (hal. 20)" },
    { id: 273, soal: "Kapan bangsa Indonesia memperingati hari lahir Pancasila?", jawaban: "Setiap tanggal 1 Juni (hal. 20)" },
    { id: 274, soal: "Menurut Soekarno dalam pidato 1 Juni 1945, Pancasila memiliki dua sisi apa?", jawaban: "Meja statis dan leitstar (bintang penuntun) dinamis (hal. 20)" },
    { id: 275, soal: "Apa fungsi Pancasila sebagai meja statis?", jawaban: "Mempersatukan segenap elemen bangsa Indonesia (hal. 21)" },
    { id: 276, soal: "Apa fungsi Pancasila sebagai leitstar dinamis?", jawaban: "Penuntun dalam membawa Indonesia kepada gerbang kemajuan dan kemakmuran (hal. 21)" },
    { id: 277, soal: "Pancasila merupakan hasil perjuangan dan pengalaman bangsa dalam menghadapi apa?", jawaban: "Penjajahan, kolonialisme, dan imperialisme (hal. 21)" },
    { id: 278, soal: "Apa arti Pancasila sebagai meja statis?", jawaban: "Pancasila sebagai dasar negara atau fondasi bernegara yang statis, kukuh, dan sudah final, tidak berubah sampai kapan pun (hal. 21)" },
    { id: 279, soal: "Sebagai meja statis, Pancasila juga menjadi titik yang bagaimana?", jawaban: "Titik yang mempertemukan dan mempersatukan keragaman bangsa serta mendasari ideologi dan norma negara (hal. 21)" },
    { id: 280, soal: "Sebagai meja statis, nilai Pancasila menjadi titik temu keragaman apa saja?", jawaban: "Suku, agama, ras, adat istiadat, dan corak berpikir (hal. 21)" },
    { id: 281, soal: "Sebutkan peran Pancasila sebagai meja statis!", jawaban: "1) Menjaga keutuhan NKRI (ditunjukkan sila ketiga)\n2) Menyatukan masyarakat yang berbeda suku, agama, budaya, bahasa, dan ideologi untuk membangun bangsa\n3) Memberi arah dan tujuan bersama mencapai kesejahteraan dan kemakmuran (ditunjukkan sila keempat dan kelima) (hal. 21)" },
    { id: 282, soal: "Sila apa yang menunjukkan peran Pancasila sebagai meja statis dalam menjaga keutuhan NKRI?", jawaban: "Sila ketiga, Persatuan Indonesia (hal. 21)" },
    { id: 283, soal: "Sila apa yang menunjukkan Pancasila mendorong partisipasi, aspirasi, dan pemerataan pembangunan?", jawaban: "Sila keempat dan kelima (hal. 21)" },
    { id: 284, soal: "Mengapa Pancasila disebut leitstar dinamis?", jawaban: "Karena unsurnya tersusun dari berbagai pandangan hidup masyarakat Indonesia sendiri (hal. 21)" },
    { id: 285, soal: "Pandangan hidup apa yang diadopsi dalam Pancasila?", jawaban: "Nilai adat istiadat, nilai kebudayaan, dan nilai religius (hal. 21)" },
    { id: 286, soal: "Kata leitstar berasal dari bahasa apa, dan apa artinya?", jawaban: "Dari bahasa Jerman leitstern, artinya bintang penuntun (hal. 21)" },
    { id: 287, soal: "Sebagai leitstar, apa yang disediakan Pancasila?", jawaban: "Cita-cita, kemauan, dan kemampuan untuk mewujudkannya (hal. 21)" },
    { id: 288, soal: "Nilai ketuhanan mencita-citakan masyarakat yang bagaimana?", jawaban: "Masyarakat religius yang berpegang teguh pada kesetaraan dalam kebebasan beribadah, serta hidup rukun dan harmonis dalam keragaman (hal. 21)" },
    { id: 289, soal: "Nilai kemanusiaan mencita-citakan masyarakat yang bagaimana?", jawaban: "Masyarakat yang memperlakukan sesamanya secara adil dan beradab (hal. 21)" },
    { id: 290, soal: "Nilai kebangsaan mencita-citakan masyarakat yang bagaimana?", jawaban: "Masyarakat berwatak persatuan, gotong royong, dan mencintai tanah air (hal. 21)" },
    { id: 291, soal: "Nilai kerakyatan/demokrasi mencita-citakan apa?", jawaban: "Kedaulatan rakyat dengan asas permusyawaratan melalui lembaga perwakilan (hal. 21)" },
    { id: 292, soal: "Nilai keadilan sosial mencita-citakan masyarakat yang bagaimana?", jawaban: "Masyarakat yang adil dan makmur (hal. 21)" },
    { id: 293, soal: "Kapan cita-cita Pancasila akan terwujud sepenuhnya?", jawaban: "Jika seluruh masyarakat Indonesia senantiasa berpikir dan bertindak selaras dengan Pancasila (hal. 21)" },
    { id: 294, soal: "Apa kemampuan Pancasila sebagai leitstar dinamis?", jawaban: "Membuat Indonesia mengatasi tantangan dan tuntutan, serta adaptif terhadap tantangan zaman tanpa meninggalkan prinsip dan cita-citanya (hal. 21)" },
    { id: 295, soal: "Apa peran Pancasila sebagai leitstar dinamis?", jawaban: "Penuntun hidup bangsa dalam mencapai cita-cita nasional, serta menjadikan bangsa sejahtera, adil, dan makmur (hal. 22)" },
    { id: 296, soal: "Sebagai leitstar, Pancasila harus bersifat bagaimana?", jawaban: "Dinamis dan selalu senapas dengan perkembangan zaman (hal. 22)" },
    { id: 297, soal: "Apa alasan pertama Pancasila harus dinamis?", jawaban: "Pancasila harus bisa melakukan appeal (ajakan/seruan) agar rakyat terus mengikuti panggilannya (hal. 22)" },
    { id: 298, soal: "Apa kata Bung Karno tentang Pancasila sebagai appeal?", jawaban: "Pancasila harus bisa menggerakkan rakyat untuk berjuang menggapai cita-cita (hal. 22)" },
    { id: 299, soal: "Agar menjadi appeal, Pancasila tidak boleh menjadi apa?", jawaban: "Doktrin yang kaku dan disakralkan (hal. 22)" },
    { id: 300, soal: "Agar menjadi appeal, Pancasila harus tampil sebagai apa?", jawaban: "Perangkat gagasan atau pengetahuan yang senapas dengan perkembangan zaman (hal. 22)" },
    { id: 301, soal: "Apa alasan kedua Pancasila harus dinamis?", jawaban: "Pancasila harus bisa menjawab persoalan kebangsaan setiap zaman (hal. 22)" },
    { id: 302, soal: "Dalam menjawab persoalan kebangsaan, Pancasila diharapkan tidak menjadi apa?", jawaban: "Seperangkat gagasan yang hanya menjadi wacana, tetapi bisa dipraktikkan sekaligus menjawab persoalan kebangsaan (hal. 22)" },
    { id: 303, soal: "Sebagai leitstar dinamis, Pancasila tidak perlu dipertentangkan dengan apa?", jawaban: "Setiap upaya menggali dan memperkaya Pancasila dengan gagasan yang memajukan dan lebih praksis (hal. 22)" },
    { id: 304, soal: "Sebutkan manfaat menjadikan Pancasila sebagai penuntun hidup!", jawaban: "1) Penuntun pemecahan masalah\n2) Bangsa berdiri kukuh sebagai bangsa merdeka dan berdaulat\n3) Penuntun dalam membangun diri dan berinteraksi dengan bangsa lain\n4) Penuntun dan petunjuk arah di seluruh kegiatan dan kehidupan berbagai bidang\n5) Kerangka acuan menata kehidupan pribadi, interaksi antarmanusia, kehidupan bermasyarakat, dan alam sekitar (hal. 22)" },
    { id: 305, soal: "Apa arti internalisasi? (Glosarium)", jawaban: "Penghayatan terhadap suatu ajaran, doktrin, atau nilai sehingga merupakan keyakinan dan kesadaran akan kebenarannya yang diwujudkan dalam sikap dan perilaku (hal. 22)" },
    { id: 306, soal: "Apa arti kognitif? (Glosarium)", jawaban: "Berdasar kepada pengetahuan faktual yang empiris (hal. 22)" },
    { id: 307, soal: "Apa arti universal? (Glosarium)", jawaban: "Umum (berlaku untuk semua orang atau seluruh dunia), bersifat melingkupi seluruh dunia (hal. 22)" },
  ],
  "Bahasa Inggris": [
    // Sumber: TNT Bahasa Inggris XI (GPP) Semester 1 — soal Indonesia, jawaban Inggris; hanya materi teori
    { id: 1, soal: "Apa judul Chapter 1 buku Bahasa Inggris XI semester 1?", jawaban: "Digital Literacies and My Identities (hal. 7)" },
    { id: 2, soal: "Untuk apa subject questions digunakan? (gambaran awal)", jawaban: "To find out whom or what performs the action (hal. 7)" },
    { id: 3, soal: "Sebutkan contoh ungkapan untuk menanyakan pendapat yang disebut di apersepsi!", jawaban: "What do you think of ...? (hal. 7)" },
    { id: 4, soal: "Untuk apa ungkapan agreement dan disagreement biasanya digunakan?", jawaban: "To show our response toward someone's opinion (hal. 7)" },
    { id: 5, soal: "Apa pengertian opinion and thought?", jawaban: "A view or judgement not necessarily based on fact or knowledge (hal. 8)" },
    { id: 6, soal: "Opinion berkaitan dengan thought. Apa pengertian thought?", jawaban: "An idea produced by thinking or occurring suddenly in the mind (hal. 8)" },
    { id: 7, soal: "Sebutkan ungkapan untuk menanyakan pendapat (asking for opinion/thought)!", jawaban: "• What do you think of/about ...?\n• What is your opinion about/toward ...?\n• What are your ideas/views?\n• What's your reaction to that?\n• What do you think?\n• Do you think that ...?\n• Do you have any thoughts on that?\n• How do you feel about that?\n• Any comments? (hal. 8)" },
    { id: 8, soal: "Sebutkan ungkapan untuk menyatakan pendapat (stating opinion/thought)!", jawaban: "• I think ....\n• I don't think ....\n• In my opinion, ....\n• For me, ....\n• I believe/feel (that) ....\n• Personally, I think ....\n• I suppose ....\n• I guess .... (hal. 8)" },
    { id: 9, soal: "Apa pengertian agreement?", jawaban: "A condition when we have the same opinion as other person does, or when we approve or accept something (hal. 8)" },
    { id: 10, soal: "Apa pengertian disagreement?", jawaban: "A condition when we have different opinion, or we object other's opinion (hal. 8)" },
    { id: 11, soal: "Sebutkan ungkapan untuk menanyakan persetujuan (asking for agreement)!", jawaban: "• Don't you think that ...?\n• Do you agree with me/my idea?\n• Do you agree or disagree?\n• Don't you think so?\n• Wouldn't you say (that) ...?\n• Will you agree with ...?\n• How/What do you think/feel about it?\n• Wouldn't you agree (that) ...? (hal. 8)" },

/* ════════════════════════════════════════════════════════════════
   SRS — port dari nihongo-cards (lib/srs/algorithm.ts, SM-2 satu arah)
   ════════════════════════════════════════════════════════════════ */
const EASE_INIT = 2.5, EASE_MIN = 1.3, EASE_MAX = 4.0;
const EASY_BONUS = 1.3, SUSAH_FACTOR = 0.6;
const EASE_DELTA_LUPA = -0.20, EASE_DELTA_SUSAH = -0.15, EASE_DELTA_OKE = +0.15;
const RELEARN_OKE_FACTOR = 0.5, RELEARN_GAMPANG_FACTOR = 0.7;

/** 'YYYY-MM-DD' di zona waktu PERANGKAT (bukan toISOString yang UTC). */
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function todayStr() { return localDateStr(new Date()); }
function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + Math.max(1, days));
  return localDateStr(d);
}
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function newCard() {
  return { state: 'new', due_date: todayStr(), interval: 0, ease_factor: EASE_INIT, lapses: 0, reps: 0 };
}

function computeNextSM2(card, rating) {
  const base = { reps: card.reps + 1 };
  if (card.state === 'new' || card.state === 'learning') {
    if (rating === 'lupa' || rating === 'susah') return { ...base, state: 'learning', due_date: addDays(1), interval: 0 };
    if (rating === 'oke') return { ...base, state: 'review', due_date: addDays(1), interval: 1 };
    return { ...base, state: 'review', due_date: addDays(4), interval: 4 };
  }
  if (card.state === 'review') {
    if (rating === 'lupa') return {
      ...base, state: 'relearning', due_date: addDays(1), interval: 1,
      ease_factor: clamp(card.ease_factor + EASE_DELTA_LUPA, EASE_MIN, EASE_MAX),
      lapses: card.lapses + 1,
    };
    if (rating === 'susah') {
      const ni = Math.max(1, Math.ceil(card.interval * SUSAH_FACTOR));
      return { ...base, state: 'review', due_date: addDays(ni), interval: ni,
        ease_factor: clamp(card.ease_factor + EASE_DELTA_SUSAH, EASE_MIN, EASE_MAX) };
    }
    if (rating === 'oke') {
      const ni = Math.ceil(card.interval * card.ease_factor);
      return { ...base, state: 'review', due_date: addDays(ni), interval: ni };
    }
    const ni = Math.ceil(card.interval * card.ease_factor * EASY_BONUS);
    return { ...base, state: 'review', due_date: addDays(ni), interval: ni,
      ease_factor: clamp(card.ease_factor + EASE_DELTA_OKE, EASE_MIN, EASE_MAX) };
  }
  // relearning
  if (rating === 'lupa' || rating === 'susah') return { ...base, state: 'relearning', due_date: addDays(1), interval: 1 };
  if (rating === 'oke') {
    const ni = Math.max(1, Math.ceil(card.interval * RELEARN_OKE_FACTOR));
    return { ...base, state: 'review', due_date: addDays(ni), interval: ni };
  }
  const ni = Math.max(1, Math.ceil(card.interval * RELEARN_GAMPANG_FACTOR));
  return { ...base, state: 'review', due_date: addDays(ni), interval: ni };
}

function previewIntervals(card) {
  if (!card || card.state === 'new' || card.state === 'learning')
    return { lupa: 'besok', oke: '1 hr', gampang: '4 hr' };
  if (card.state === 'review') return {
    lupa: 'besok',
    oke: `${Math.ceil(card.interval * card.ease_factor)} hr`,
    gampang: `${Math.ceil(card.interval * card.ease_factor * EASY_BONUS)} hr`,
  };
  return { lupa: 'besok', oke: '1 hr', gampang: '2 hr' };
}

/** Label pil di sidebar, sama dengan dueDateLabel() nihongo-cards. */
function dueDateLabel(due) {
  const today = todayStr();
  if (due <= today) return 'Hari ini';
  if (due === addDays(1)) return 'Besok';
  const [y1, m1, d1] = today.split('-').map(Number);
  const [y2, m2, d2] = due.split('-').map(Number);
  return `${Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000)} hr`;
}

const RATINGS = [
  { key: 'lupa',    label: '❌ Lupa',         cls: 'rate-btn--lupa' },
  { key: 'oke',     label: '✅ Oke',          cls: 'rate-btn--oke' },
  { key: 'gampang', label: '⭐ Sangat Mudah', cls: 'rate-btn--gampang' },
];
const STATE_LABEL = { new: 'Baru', learning: 'Belajar', review: 'Review', relearning: 'Ulang' };

/* ════════════════════════════════════════════════════════════════
   STORAGE (localStorage)
   ════════════════════════════════════════════════════════════════ */
const KEY_CARDS = 'fp_srs_cards';     // { "Mapel:id": {state, due_date, …} }
const KEY_SESSION = 'fp_session';     // { mapel, queue:[id], total, retry:[id] }
const KEY_CONFIG = 'fp_config';       // { perMapel: { [mapel]: { newPerSession, reviewPerSession } } }
const KEY_LAST_BACKUP = 'fp_last_backup'; // 'YYYY-MM-DD' backup terakhir
const BACKUP_STALE_DAYS = 7;
const DEFAULT_CONFIG = { newPerSession: 30, reviewPerSession: 20 };
// config = { perMapel: { [mapel]: { newPerSession, reviewPerSession } } } — mapel tanpa entri pakai DEFAULT_CONFIG.

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error('Gagal menyimpan', e); }
}

let cards = load(KEY_CARDS, {});
let config = normalizeConfig(load(KEY_CONFIG, {}));

function clampCount(v, fallback) {
  const n = typeof v === 'number' ? v : parseInt(v, 10);
  return Number.isFinite(n) ? Math.max(0, Math.min(999, Math.floor(n))) : fallback;
}
/** Bentuk lama { newPerSession, reviewPerSession } (global) diabaikan → semua mapel mulai dari default (2A). */
function normalizeConfig(raw) {
  const perMapel = {};
  const src = raw && typeof raw.perMapel === 'object' && raw.perMapel ? raw.perMapel : {};
  for (const [m, c] of Object.entries(src)) {
    if (!c || typeof c !== 'object') continue;
    perMapel[m] = {
      newPerSession: clampCount(c.newPerSession, DEFAULT_CONFIG.newPerSession),
      reviewPerSession: clampCount(c.reviewPerSession, DEFAULT_CONFIG.reviewPerSession),
    };
  }
  return { perMapel };
}
const cfgFor = (mapel) => config.perMapel[mapel] ?? DEFAULT_CONFIG;
let session = null;   // { mapel, queue:[id], total }
let flipped = false;
let today = todayStr();
let search = '';
const openMapel = new Set();

const cardKey = (mapel, id) => `${mapel}:${id}`;
const getCard = (mapel, id) => cards[cardKey(mapel, id)] ?? null;
const itemOf = (mapel, id) => (DATA[mapel] || []).find((it) => it.id === id) ?? null;

/* ════════════════════════════════════════════════════════════════
   ANTRIAN — hanya kartu jatuh tempo + kartu baru (sisanya tidak disentuh)
   ════════════════════════════════════════════════════════════════ */
/** Kartu review yang due_date <= hari ini, paling telat dulu, dipotong jatah. */
function getDueIds(mapel, max) {
  if (max <= 0) return [];
  return (DATA[mapel] || [])
    .map((it) => ({ id: it.id, c: getCard(mapel, it.id) }))
    .filter(({ c }) => c && c.state !== 'new' && c.due_date <= today)
    .sort((a, b) => (a.c.due_date < b.c.due_date ? -1 : a.c.due_date > b.c.due_date ? 1 : 0))
    .slice(0, max)
    .map(({ id }) => id);
}
/** Kartu yang belum pernah dijawab, berurutan dari atas, dipotong jatah. */
function getNewIds(mapel, max) {
  if (max <= 0) return [];
  const out = [];
  for (const it of DATA[mapel] || []) {
    const c = getCard(mapel, it.id);
    if (!c || c.state === 'new') { out.push(it.id); if (out.length >= max) break; }
  }
  return out;
}
function mapelStats(mapel) {
  const cfg = cfgFor(mapel);
  const due = getDueIds(mapel, cfg.reviewPerSession);
  const fresh = getNewIds(mapel, cfg.newPerSession);
  const learned = (DATA[mapel] || []).filter((it) => { const c = getCard(mapel, it.id); return c && c.state !== 'new'; }).length;
  return { due, fresh, learned, total: (DATA[mapel] || []).length };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ════════════════════════════════════════════════════════════════
   SESI
   ════════════════════════════════════════════════════════════════ */
function startSession(mapel) {
  const { due, fresh } = mapelStats(mapel);
  const queue = shuffle([...due, ...fresh]);
  if (queue.length === 0) return;
  session = { mapel, queue, total: queue.length, retry: [] };
  flipped = false;
  save(KEY_SESSION, session);
  closeSidebar();
  renderAll(true);
}

function endSession() {
  session = null;
  flipped = false;
  localStorage.removeItem(KEY_SESSION);
  renderAll(true);
}

function answer(rating) {
  if (!session || !flipped) return;
  const id = session.queue[0];
  const { mapel } = session;
  const isRetry = session.retry.includes(id);

  // Hanya jawaban PERTAMA yang menentukan jadwal SRS. Kartu ulangan = latihan murni.
  if (!isRetry) {
    const before = getCard(mapel, id) ?? newCard();
    cards[cardKey(mapel, id)] = { ...before, ...computeNextSM2(before, rating) };
    save(KEY_CARDS, cards);
    if (persistGranted === false) requestPersist(); // browser lebih mau memberi izin setelah ada interaksi
  }

  if (rating === 'lupa') {
    // Lupa → lempar ke belakang antrian, muncul lagi sebelum sesi kelar (jadwal besok tetap tercatat).
    session.queue = [...session.queue.slice(1), id];
    if (!isRetry) session.retry = [...session.retry, id];
  } else {
    // Oke / Sangat Mudah → keluar dari sesi.
    session.queue = session.queue.slice(1);
    session.retry = session.retry.filter((x) => x !== id);
  }
  if (session.queue.length === 0) { endSession(); return; }
  save(KEY_SESSION, session);
  flipped = false;
  renderAll(true);
}

function flip() {
  if (!session) return;
  flipped = !flipped;
  renderCard(false);
  renderActions();
}

/** Pulihkan sesi setelah refresh — buang id yang sudah tidak ada di DATA. */
function restoreSession() {
  const s = load(KEY_SESSION, null);
  if (!s || !DATA[s.mapel] || !Array.isArray(s.queue)) { localStorage.removeItem(KEY_SESSION); return; }
  const queue = s.queue.filter((id) => itemOf(s.mapel, id));
  if (queue.length === 0) { localStorage.removeItem(KEY_SESSION); return; }
  const retry = Array.isArray(s.retry) ? s.retry.filter((id) => queue.includes(id)) : [];
  session = { mapel: s.mapel, queue, total: Math.max(s.total || 0, queue.length), retry };
}

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) n.append(c);
  return n;
}

function renderWarnings() {
  const problems = [];
  for (const [mapel, items] of Object.entries(DATA)) {
    const seen = new Set();
    for (const it of items) {
      if (it.id == null) problems.push(`${mapel}: ada soal tanpa id ("${String(it.soal).slice(0, 30)}…")`);
      else if (seen.has(it.id)) problems.push(`${mapel}: id ${it.id} dipakai lebih dari sekali`);
      seen.add(it.id);
    }
  }
  $('warnBox').replaceChildren(problems.length
    ? el('div', { class: 'warn', role: 'alert' }, '⚠️ Data bermasalah — progres kartu bisa ketuker:', el('br'), problems.join(' · '))
    : '');
}

   ════════════════════════════════════════════════════════════════ */
function midnightCountdown() {
  const now = new Date();
  const mid = new Date(now); mid.setHours(24, 0, 0, 0);
  const diff = mid - now;
  const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
  return [h, m, s].map((x) => String(x).padStart(2, '0')).join(':');
}
function checkDayChange() {
  const t = todayStr();
  if (t !== today) { today = t; renderAll(); }
}
setInterval(() => {
  checkDayChange();
  const cd = $('countdown');
  if (cd) cd.textContent = midnightCountdown();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayChange(); });

/* ════════════════════════════════════════════════════════════════
   BACKUP & RESTORE — satu-satunya pengaman kalau data browser dihapus
   ════════════════════════════════════════════════════════════════ */
function daysSince(dateStr) {
  const [y1, m1, d1] = dateStr.split('-').map(Number);
  const [y2, m2, d2] = todayStr().split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function lastBackupLabel() {
  const last = localStorage.getItem(KEY_LAST_BACKUP);
  if (!last) return null;
  const d = daysSince(last);
  return d <= 0 ? 'hari ini' : d === 1 ? 'kemarin' : `${d} hari lalu`;
}
/** Teks pengingat di sidebar — null kalau belum perlu diingatkan. */
function backupNudgeText() {
  if (Object.keys(cards).length === 0) return null; // belum ada progres, belum ada yang perlu diamankan
  const last = localStorage.getItem(KEY_LAST_BACKUP);
  if (!last) return '💾 Progres belum pernah di-backup';
  return daysSince(last) >= BACKUP_STALE_DAYS ? `💾 Backup terakhir ${lastBackupLabel()}` : null;
}
function renderBackupStatus() {
  const s = $('backupStatus');
  const label = lastBackupLabel();
  const stale = !!backupNudgeText();
  s.className = 'backup-status' + (stale ? ' backup-status--stale' : '');
  s.textContent = label
    ? `Backup terakhir: ${label}. Simpan file backup di Drive/WA biar aman.`
    : 'Belum pernah backup. Simpan file backup di Drive/WA biar aman.';
}

function exportBackup() {
  const payload = {
    app: 'flashcard-pelajaran',
    version: 1,
    exportedAt: new Date().toISOString(),
    cards,
    config,
  };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `flashcard-backup-${todayStr()}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  localStorage.setItem(KEY_LAST_BACKUP, todayStr());
  renderBackupStatus();
  renderFooter();
}

const VALID_STATES = new Set(['new', 'learning', 'review', 'relearning']);
function isValidCard(c) {
  return c && typeof c === 'object'
    && VALID_STATES.has(c.state)
    && /^\d{4}-\d{2}-\d{2}$/.test(c.due_date)
    && [c.interval, c.ease_factor, c.lapses, c.reps].every((n) => typeof n === 'number' && Number.isFinite(n));
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { data = null; }
    if (!data || data.app !== 'flashcard-pelajaran' || typeof data.cards !== 'object' || data.cards === null) {
      confirmDialog('File tidak valid', 'Ini bukan file backup Flashcard Pelajaran. Pilih file flashcard-backup-….json.', () => {}, { infoOnly: true });
      return;
    }
    const valid = Object.entries(data.cards).filter(([, c]) => isValidCard(c));
    const date = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : 'tanggal tidak diketahui';
    confirmDialog(
      'Restore backup?',
      `Backup ${date} berisi ${valid.length} kartu. Progres yang ada sekarang akan DIGANTI dengan isi backup ini.`,
      () => {
        cards = Object.fromEntries(valid);
        save(KEY_CARDS, cards);
        if (data.config && typeof data.config === 'object') {
          config = normalizeConfig(data.config);
          save(KEY_CONFIG, config);
        }
        // File yang barusan di-restore = salinan aman, jadi hitung sebagai backup.
        localStorage.setItem(KEY_LAST_BACKUP, todayStr());
        if (session) endSession(); else renderAll();
        renderBackupStatus();
        renderResetList();
      },
      { yesLabel: 'Ganti Progres' },
    );
  };
  reader.readAsText(file);
}

$('btnExport').addEventListener('click', exportBackup);
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importBackup(f);
  e.target.value = ''; // supaya file yang sama bisa dipilih lagi
});

/* ════════════════════════════════════════════════════════════════
   PENYIMPANAN PERMANEN — minta browser tidak membuang data saat memori penuh
   ════════════════════════════════════════════════════════════════ */
let persistGranted = null; // null = tidak didukung
async function requestPersist() {
  if (!navigator.storage || !navigator.storage.persist) return;
  try {
    persistGranted = await navigator.storage.persisted();
    if (!persistGranted) persistGranted = await navigator.storage.persist();
  } catch { persistGranted = null; }
  renderPersistStatus();
}
function renderPersistStatus() {
  $('persistStatus').textContent = persistGranted === null
    ? '🔒 Penyimpanan permanen: tidak didukung browser ini — andalkan backup.'
    : persistGranted
      ? '🔒 Penyimpanan permanen: aktif (data tidak dibuang saat memori penuh).'
      : '🔓 Penyimpanan permanen: belum diizinkan browser. Biasanya aktif sendiri setelah sering dipakai.';
}

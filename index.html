    { id: 283, soal: "Jelaskan gambaran kesenjangan sosial di lingkungan sekitar!", jawaban: "Di satu sisi ada yang hidup serba berkecukupan dan dapat membeli apa pun dengan mudah, di sisi lain ada masyarakat yang untuk memenuhi kebutuhan pokoknya saja tidak mampu (hal. 13)" },
    { id: 212, soal: "Selain kesenjangan sosial, masalah sosial apa lagi yang sering terlihat di lingkungan sekitar?", jawaban: "Masalah yang dipicu perbedaan latar belakang suku dan etnis (hal. 13)" },
    { id: 65, soal: "Sebutkan ragam masalah sosial yang ada di masyarakat!", jawaban: "1. Ketimpangan ekonomi dan kemiskinan\n2. Ketidaksetaraan ras dan etnik\n3. Ketidaksetaraan gender\n4. Intoleransi\n5. Korupsi, kolusi, dan nepotisme\n6. Penyalahgunaan NAPZA\n7. Hubungan seks pranikah\n8. Pengaruh negatif media sosial\n9. Pencemaran lingkungan (hal. 13–18)" },
    { id: 66, soal: "Mengapa kondisi ekonomi masyarakat di Indonesia tidaklah sama?", jawaban: "Karena masih adanya ketimpangan ekonomi dan kemiskinan yang dialami penduduknya (hal. 13)" },
    { id: 67, soal: "Apa pengertian ketimpangan?", jawaban: "Keadaan di mana terjadi perbedaan yang signifikan antara individu atau kelompok dalam hal distribusi sumber daya, kesempatan, maupun hasil (hal. 13)" },
    { id: 213, soal: "Ketimpangan mencerminkan apa?", jawaban: "Adanya disparitas yang mengakibatkan sebagian pihak lebih diuntungkan dibandingkan pihak lain (hal. 13)" },
    { id: 68, soal: "Ketimpangan ekonomi terjadi ketika…", jawaban: "Distribusi pendapatan dan kekayaan dalam suatu masyarakat tidak merata (hal. 13)" },
    { id: 69, soal: "Apa indikator yang sering dipakai untuk mengukur ketimpangan ekonomi?", jawaban: "Koefisien gini (rasio gini) (hal. 13)" },
    { id: 214, soal: "Apa arti koefisien gini yang mendekati 0?", jawaban: "Pendapatan penduduk makin merata (hal. 13)" },
    { id: 215, soal: "Apa arti koefisien gini yang mendekati 1?", jawaban: "Pendapatan makin timpang (hal. 13)" },
    { id: 70, soal: "Apa pengertian kemiskinan?", jawaban: "Suatu keadaan di mana seseorang tidak sanggup memelihara dirinya sendiri sesuai dengan taraf kehidupan kelompok dan juga tidak mampu memanfaatkan tenaga mental maupun fisiknya dalam kelompok tersebut (hal. 13)" },
    { id: 71, soal: "Tingkat kemiskinan di masyarakat dapat diukur melalui dua pendekatan, yaitu…", jawaban: "Kemiskinan absolut dan kemiskinan relatif (hal. 13)" },
    { id: 72, soal: "Apa yang dimaksud kemiskinan absolut?", jawaban: "Kondisi ketika masyarakat tidak memiliki sarana untuk memenuhi kebutuhan hidup paling dasar (hal. 13)" },
    { id: 216, soal: "Apa risiko yang dihadapi masyarakat yang mengalami kemiskinan absolut (ekstrem)?", jawaban: "Berisiko menderita kekurangan gizi kronis atau meninggal dunia karena penyakit yang berhubungan dengan kelaparan (hal. 13)" },

    // ── Hal. 14 — Kemiskinan menurut tokoh; ketidaksetaraan ras & etnik ──
    { id: 73, soal: "Apa yang dimaksud kemiskinan relatif?", jawaban: "Kondisi ketika masyarakat mampu memenuhi kebutuhan dasar, tetapi tidak dapat mempertahankan standar hidup rata-rata dibandingkan anggota masyarakat lainnya (hal. 14)" },
    { id: 284, soal: "Sebutkan contoh kebutuhan dasar dalam pengertian kemiskinan relatif!", jawaban: "Makanan, pakaian, dan tempat tinggal (hal. 14)" },
    { id: 74, soal: "Menurut Georg Simmel, kemiskinan dibedakan menjadi berapa?", jawaban: "Dua: kemiskinan individual dan kemiskinan sosial (hal. 14)" },
    { id: 217, soal: "Apa yang dimaksud kemiskinan individual menurut Georg Simmel?", jawaban: "Kemiskinan yang dialami seseorang yang secara absolut tidak bisa memenuhi kebutuhan hidupnya dan membutuhkan bantuan hidup (hal. 14)" },
    { id: 218, soal: "Apa yang dimaksud kemiskinan sosial menurut Georg Simmel?", jawaban: "Kemiskinan yang terjadi karena adanya pelabelan pada diri seseorang (hal. 14)" },
    { id: 75, soal: "Menurut Pierre Bourdieu dan Jean Claude Passeron, kemiskinan dilihat dari sudut pandang apa dan dipengaruhi oleh apa?", jawaban: "Dari sudut pandang budaya, yaitu dipengaruhi oleh kurangnya cultural capital (modal budaya) (hal. 14)" },
    { id: 219, soal: "Apa yang dimaksud cultural capital (modal budaya) menurut Bourdieu dan Passeron?", jawaban: "Aset sosial yang dipelajari di rumah untuk keberhasilan dan kemajuan sosial (hal. 14)" },
    { id: 285, soal: "Sebutkan contoh aset sosial dalam cultural capital!", jawaban: "Nilai, keyakinan, sikap, kompetensi bahasa, dan budaya (hal. 14)" },
    { id: 76, soal: "Menurut Karl Marx, kemiskinan dilihat dari sudut pandang apa?", jawaban: "Dari sudut pandang kelas dan kekuasaan (hal. 14)" },
    { id: 220, soal: "Menurut Karl Marx, kemiskinan berkaitan dengan apa?", jawaban: "Ketimpangan kelas dan ketidakberpihakan politik, di mana kapitalisme dan elite politik yang korup melanggengkan ketidakadilan (hal. 14)" },
    { id: 77, soal: "Kemiskinan dapat memicu masalah sosial lain, seperti…", jawaban: "Kriminalitas, stunting, kekerasan dalam rumah tangga, atau disintegrasi sosial (hal. 14)" },
    { id: 78, soal: "Apa yang dimaksud ras?", jawaban: "Pengelompokan masyarakat berdasarkan karakteristik fisik (hal. 14)" },
    { id: 286, soal: "Sebutkan contoh karakteristik fisik dalam pengelompokan ras!", jawaban: "Warna kulit, tekstur rambut, bentuk mata, atau atribut lainnya (hal. 14)" },
    { id: 79, soal: "Apa yang dimaksud etnik atau suku bangsa?", jawaban: "Pengelompokan masyarakat yang didasari oleh kesamaan budaya ataupun kebangsaan tertentu (hal. 14)" },
    { id: 80, soal: "Apa itu etnosentrisme?", jawaban: "Pandangan bahwa kelompok dan cara hidupnya lebih unggul dibandingkan kelompok lain (salah satu penyebab utama masalah sosial akibat keragaman ras dan etnik) (hal. 14)" },
    { id: 221, soal: "Bagaimana pemahaman etnosentrisme terbentuk?", jawaban: "Dibangun karena adanya prasangka (prejudice) negatif berdasarkan generalisasi atau stereotipe yang keliru (hal. 14)" },
    { id: 287, soal: "Apa akibat pemahaman etnosentrisme?", jawaban: "Kelompok tertentu cenderung mendapat perlakuan diskriminatif (hal. 14)" },
    { id: 81, soal: "Dalam sosiologi, mayoritas dan minoritas merujuk pada apa?", jawaban: "Bukan pada faktor jumlah, tetapi lebih fokus pada hubungan kelompok dominan dan subordinat (hal. 14)" },
    { id: 82, soal: "Apa yang dimaksud kelompok dominan (mayoritas)?", jawaban: "Kelompok yang diuntungkan dan memiliki sumber daya dan hak yang unggul dalam suatu masyarakat (hal. 14)" },
    { id: 83, soal: "Apa yang dimaksud kelompok subordinat (minoritas)?", jawaban: "Kelompok yang anggotanya dirugikan dan mendapat perlakuan tidak setara dari kelompok mayoritas (hal. 14)" },
    { id: 288, soal: "Kelompok subordinat menganggap diri mereka sebagai apa, dan karena apa?", jawaban: "Sebagai objek diskriminasi kolektif, karena karakteristik fisik atau budaya (hal. 14)" },
    { id: 84, soal: "Jelaskan contoh ketidaksetaraan ras dan etnik pada kasus politik Apartheid di Afrika Selatan!", jawaban: "Ras kulit putih secara jumlah lebih sedikit dibandingkan kulit hitam, tetapi posisi mereka adalah kelompok dominan yang memiliki pengaruh dan kendali terhadap berbagai aspek kehidupan masyarakat (hal. 14)" },

    // ── Hal. 15 — Ketidaksetaraan gender ──
    { id: 85, soal: "Apa yang dimaksud gender?", jawaban: "Karakteristik laki-laki dan perempuan yang didasari oleh pemahaman, keyakinan, atau konstruksi sosial budaya masyarakat (hal. 15)" },
    { id: 222, soal: "Bagaimana gender terbentuk?", jawaban: "Karena pengaruh nilai, norma, kepercayaan, dan budaya melalui proses sosialisasi (hal. 15)" },
    { id: 86, soal: "Ketidaksetaraan gender termasuk isu dalam agenda apa?", jawaban: "Tujuan Pembangunan Berkelanjutan atau SDGs (hal. 15)" },
    { id: 223, soal: "Apa artinya isu kesetaraan gender masuk dalam agenda SDGs?", jawaban: "Isu kesetaraan gender menjadi masalah sosial yang menjadi perhatian dunia (hal. 15)" },
    { id: 87, soal: "Apa pengertian ketidaksetaraan gender?", jawaban: "Fenomena sosial di mana orang tidak diperlakukan secara setara berdasarkan gender (hal. 15)" },
    { id: 88, soal: "Sebutkan faktor penyebab ketidaksetaraan gender!", jawaban: "1. Adanya norma dan budaya patriarki, yaitu sistem yang lebih mengutamakan laki-laki dan membatasi peran perempuan\n2. Pandangan bahwa perbedaan fisik menentukan peran sosial\n3. Adanya stereotipe gender, yaitu anggapan yang tertanam tentang peran laki-laki dan perempuan (hal. 15)" },
    { id: 89, soal: "Sebutkan bentuk-bentuk ketidaksetaraan gender!", jawaban: "1. Subordinasi\n2. Marginalisasi\n3. Stereotipe\n4. Beban ganda\n5. Kekerasan (hal. 15)" },
    { id: 90, soal: "Apa yang dimaksud subordinasi dalam ketidaksetaraan gender?", jawaban: "Sikap menempatkan satu gender di posisi yang lebih rendah dan dianggap kurang penting (hal. 15)" },
    { id: 91, soal: "Apa yang dimaksud marginalisasi dalam ketidaksetaraan gender?", jawaban: "Peminggiran dari akses sumber daya ekonomi dan kesempatan (hal. 15)" },
    { id: 92, soal: "Apa yang dimaksud stereotipe dalam ketidaksetaraan gender?", jawaban: "Pelabelan atau penandaan terhadap suatu kelompok tertentu yang sering kali merugikan dan menimbulkan ketidakadilan (hal. 15)" },
    { id: 224, soal: "Berikan contoh stereotipe gender yang membatasi potensi!", jawaban: "Perempuan lemah atau hanya untuk urusan domestik (hal. 15)" },
    { id: 93, soal: "Apa yang dimaksud beban ganda dalam ketidaksetaraan gender?", jawaban: "Beban kerja yang lebih panjang dan lebih banyak pada salah satu gender (hal. 15)" },
    { id: 225, soal: "Berikan contoh beban ganda dalam ketidaksetaraan gender!", jawaban: "Perempuan dianggap memelihara dan rajin sehingga pekerjaan domestik menjadi tanggung jawabnya (hal. 15)" },
    { id: 226, soal: "Bagaimana beban ganda dialami perempuan yang bekerja di luar rumah?", jawaban: "Tetap dituntut menjalankan dan menomorsatukan pekerjaan rumah tangga (hal. 15)" },
    { id: 289, soal: "Apa akibat beban ganda bagi perempuan yang bekerja di luar rumah?", jawaban: "Menanggung pekerjaan domestik dan produktif secara tidak proporsional (hal. 15)" },
    { id: 94, soal: "Apa yang dimaksud kekerasan dalam ketidaksetaraan gender?", jawaban: "Serangan terhadap fisik maupun integritas mental psikologis seseorang (hal. 15)" },
    { id: 227, soal: "Kekerasan terhadap perempuan sering identik dengan apa?", jawaban: "Kekerasan berbasis gender (hal. 15)" },
    { id: 228, soal: "Berikan contoh kekerasan dalam ketidaksetaraan gender!", jawaban: "Kekerasan dalam rumah tangga yang lekat dengan anggapan bahwa perempuan berkedudukan lebih rendah dari laki-laki (hal. 15)" },
    { id: 95, soal: "Sebutkan dampak negatif ketidaksetaraan gender!", jawaban: "1. Menghambat kemajuan individu dan masyarakat di berbagai sektor (pendidikan, kesehatan, ekonomi)\n2. Menyebabkan perempuan memiliki partisipasi kerja lebih rendah, upah lebih rendah, dan risiko kesehatan lebih tinggi (hal. 15)" },

    // ── Hal. 16 — Intoleransi; korupsi, kolusi, dan nepotisme ──
    { id: 96, soal: "Apa pengertian intoleransi menurut Cohen?", jawaban: "Tindakan yang disengaja oleh aktor dengan berprinsip menahan diri dari campur tangan (menentang) perilaku mereka dalam situasi keragaman, sekalipun aktor percaya dia memiliki kekuatan untuk mengganggu (hal. 16)" },
    { id: 97, soal: "Bagaimana pandangan Charles A. Ellwood mengenai intoleransi?", jawaban: "Intoleransi merupakan sikap yang berbahaya karena menjadi sumber perpecahan bagi masyarakat (hal. 16)" },
    { id: 98, soal: "Secara umum, apa pengertian intoleransi?", jawaban: "Ketidakmauan atau ketidakmampuan seseorang untuk menerima keberadaan perbedaan dalam lingkungannya (hal. 16)" },
    { id: 290, soal: "Intoleransi merupakan kebalikan dari apa?", jawaban: "Kebalikan dari semua prinsip dalam toleransi (hal. 16)" },
    { id: 99, soal: "Sebutkan tiga komponen intoleransi!", jawaban: "1. Ketidakmampuan menahan diri tidak suka kepada orang lain\n2. Sikap mencampuri dan/atau menentang sikap atau keyakinan orang lain\n3. Sengaja mengganggu orang lain (hal. 16)" },
    { id: 100, soal: "Apa penyebab intoleransi?", jawaban: "Biasanya disebabkan oleh pandangan yang ekstrem, seperti menganggap pemahamannya paling benar (hal. 16)" },
    { id: 229, soal: "Intoleransi berkaitan dengan sikap apa?", jawaban: "Eksklusivisme (hal. 16)" },
    { id: 230, soal: "Bagaimana kecenderungan sikap eksklusivisme dalam intoleransi?", jawaban: "Cenderung mengabaikan kepentingan orang lain dan lebih mementingkan kepercayaan kelompok sendiri (hal. 16)" },
    { id: 101, soal: "Sebutkan contoh sikap intoleransi!", jawaban: "1. Membeda-bedakan orang atau diskriminasi terhadap suku, agama, gender, ras, dll.\n2. Tidak menghormati dan menghargai hak milik orang lain\n3. Memaksakan kehendak orang lain\n4. Mengganggu kebebasan orang lain dalam memiliki keyakinan politik, kelompok, dan memilih agama\n5. Membenci dan menyakiti perasaan orang lain yang berbeda pandangan\n6. Mementingkan kelompok sendiri atau menganggapnya lebih baik\n7. Tidak mau bergaul dan bersikap tidak baik kepada orang yang keyakinannya berbeda (hal. 16)" },
    { id: 102, soal: "Bagaimana cara menyikapi intoleransi?", jawaban: "1. Membangun kesadaran melalui introspeksi diri\n2. Penegakan hukum dan HAM\n3. Membiasakan diri dengan perbedaan dan keterbukaan informasi\n4. Moderasi beragama (hal. 16)" },
    { id: 103, soal: "Apa yang dimaksud moderasi beragama?", jawaban: "Cara pandang, sikap, dan perilaku yang selalu mengambil poros di tengah-tengah, selalu bertindak adil, dan tidak ekstrem dalam beragama (moderasi = sikap memilih jalan tengah, adil dan berimbang, tidak berlebih-lebihan) (hal. 16)" },
    { id: 231, soal: "Moderasi beragama merupakan kunci terciptanya apa?", jawaban: "Toleransi dan kerukunan (hal. 16)" },
    { id: 104, soal: "Sebutkan tanda-tanda perilaku yang moderat!", jawaban: "Cinta tanah air, punya toleransi tinggi, antikekerasan, dan akomodatif terhadap budaya lokal (hal. 16)" },
    { id: 105, soal: "Apa pengertian korupsi?", jawaban: "Tindak penyelewengan atau penyalahgunaan yang dapat merugikan (hal. 16)" },
    { id: 232, soal: "Apa saja bentuk korupsi?", jawaban: "Penggelapan uang serta penyalahgunaan wewenang, sarana, dan jabatan oleh seseorang ataupun kelompok (hal. 16)" },
    { id: 233, soal: "Apa tujuan tindakan korupsi?", jawaban: "Menguntungkan kepentingan pribadi atau golongannya sendiri (hal. 16)" },
    { id: 106, soal: "Apa pengertian kolusi?", jawaban: "Permufakatan atau kerja sama secara melawan hukum antarpenyelenggara negara, atau antara penyelenggara negara dan pihak lain yang merugikan orang lain, masyarakat, dan/atau negara (hal. 16)" },
    { id: 107, soal: "Apa pengertian nepotisme?", jawaban: "Perbuatan/tindakan atau pengambilan keputusan secara subjektif dengan terlebih dahulu mengangkat atau memberikan jalan dalam bentuk apa pun bagi keluarga/kelompok/golongannya untuk suatu kedudukan atau jabatan tertentu (hal. 16)" },
    { id: 108, soal: "Bagaimana cara menghindari korupsi?", jawaban: "Menghindarkan diri dari sikap yang mengarah pada korupsi (hal. 16)" },
    { id: 291, soal: "Sebutkan contoh sikap yang perlu dibiasakan agar terhindar dari korupsi!", jawaban: "Disiplin, tanggung jawab, jujur, dan amanah (hal. 16)" },
    { id: 234, soal: "Bagaimana cara ikut memberantas korupsi?", jawaban: "Mencegah dan melaporkannya kepada pihak berwenang (hal. 16)" },

    // ── Hal. 17 — Penyalahgunaan NAPZA; hubungan seks pranikah ──
    { id: 109, soal: "Mengapa penyalahgunaan NAPZA atau narkoba disebut penyimpangan perilaku?", jawaban: "Karena melanggar norma hukum yang berlaku di masyarakat (hal. 17)" },
    { id: 110, soal: "Dalam bidang apa narkoba biasanya digunakan secara benar, dan bagaimana aturannya?", jawaban: "Dalam bidang kedokteran, diatur dalam seperangkat peraturan yang sifatnya formal (hal. 17)" },
    { id: 235, soal: "Bagaimana seharusnya penggunaan narkoba dalam bidang kedokteran?", jawaban: "Harus di bawah pengawasan ketat, misalnya oleh dokter sebagai pengobatan atau pembiusan (hal. 17)" },
    { id: 111, soal: "Sebutkan alasan banyak orang menyalahgunakan narkoba menurut beberapa penelitian!", jawaban: "1. Melupakan masalah atau kesulitan hidupnya meski sementara\n2. Menghilangkan rasa takut (merasa jadi pribadi yang berani)\n3. Menghilangkan rasa malu atau meningkatkan kepercayaan diri\n4. Sebagai gaya hidup (life style)\n5. Awalnya hanya coba-coba, lama-kelamaan ketagihan (hal. 17)" },
    { id: 112, soal: "Apa dampak langsung penyalahgunaan NAPZA terhadap kejiwaan?", jawaban: "Depresi mental, gangguan jiwa berat, dan tindak kejahatan lain (hal. 17)" },
    { id: 236, soal: "Apa dampak langsung penyalahgunaan NAPZA terhadap tubuh?", jawaban: "Gangguan jantung, otak, kulit, tulang, pembuluh darah, paru-paru, sistem saraf dan pencernaan, dll. (hal. 17)" },
    { id: 113, soal: "Sebutkan dampak tidak langsung penyalahgunaan NAPZA!", jawaban: "Keluar uang banyak untuk perawatan dan pengobatan, dikucilkan masyarakat, keluarga menanggung malu, hilangnya kesempatan studi, tidak dipercaya, dan berlawanan dengan ajaran agama (hal. 17)" },
    { id: 114, soal: "Perubahan BIOLOGIS apa yang terjadi pada masa pubertas remaja?", jawaban: "Organ-organ reproduksi mulai matang dan bagian tubuh lainnya mulai berkembang (hal. 17)" },
    { id: 237, soal: "Perubahan PSIKOLOGIS apa yang terjadi pada masa pubertas remaja?", jawaban: "Perubahan emosi, sikap mental, sensitivitas, dan mulai mencari jati diri (hal. 17)" },
    { id: 115, soal: "Perilaku seks pranikah melanggar norma apa saja?", jawaban: "Norma hukum (dapat dijerat hukum pidana perzinaan), norma agama, dan norma sosial (hal. 17)" },
    { id: 116, soal: "Sebutkan faktor yang menyebabkan remaja melakukan hubungan seks pranikah!", jawaban: "1. Pengaruh media sosial, seperti konten pornografi dan informasi yang tidak terfilter dari internet atau media elektronik\n2. Pemahaman agama yang kurang\n3. Pengetahuan dan pendidikan seks yang kurang\n4. Kurangnya perhatian dan pengawasan orang tua\n5. Lingkungan atau pergaulan yang salah (hal. 17)" },
    { id: 117, soal: "Sebutkan dampak perilaku seks pranikah bagi pelakunya!", jawaban: "1. Pengucilan (eksklusi sosial), stigmatisasi dari masyarakat, hingga terputusnya pendidikan akibat kehamilan tidak diinginkan\n2. Risiko tinggi penularan Penyakit Menular Seksual (PMS) seperti HIV/AIDS, sifilis, dan gonore, serta risiko komplikasi akibat aborsi ilegal\n3. Timbulnya perasaan bersalah, depresi, stres, dan rendahnya harga diri (hal. 17)" },
    { id: 118, soal: "Apa yang harus dilakukan remaja agar terhindar dari perilaku seks pranikah?", jawaban: "Pandai memilih lingkungan pertemanan yang baik, tidak mudah percaya dengan orang lain, serta membentengi diri dengan keimanan dan ketekunan dalam meraih cita-cita (hal. 17)" },

    // ── Hal. 18 — Pengaruh negatif media sosial; pencemaran lingkungan; Hari Energi Sedunia ──
    { id: 119, soal: "Sebutkan dampak positif adanya media sosial!", jawaban: "1. Dapat dengan cepat dan mudah mengakses dan membagikan informasi\n2. Berkembangnya marketplace\n3. Berkembangnya economic sharing resources (hal. 18)" },
    { id: 120, soal: "Apa dampak negatif media sosial terkait berita?", jawaban: "Tersebarnya hoaks (berita bohong), false news (berita yang salah), dan fake news (berita palsu) (hal. 18)" },
    { id: 238, soal: "Apa akibat tersebarnya hoaks, false news, dan fake news di media sosial?", jawaban: "Banyak orang menyerap informasi keliru yang memengaruhi persepsi dan tindakannya (hal. 18)" },
    { id: 292, soal: "Berikan contoh dampak hoaks terhadap tindakan seseorang!", jawaban: "Menjadi intoleran dan ikut menyebarkan ujaran kebencian (hal. 18)" },
    { id: 293, soal: "Selain memengaruhi persepsi dan tindakan, apa risiko lain dari hoaks?", jawaban: "Berisiko tertipu hingga kehilangan harta benda (hal. 18)" },
    { id: 121, soal: "Apa dampak penggunaan media sosial yang berlebihan secara FISIK?", jawaban: "Memengaruhi penglihatan, insomnia, dan fungsi tubuh lain karena aktivitas gerak yang minim (hal. 18)" },
    { id: 239, soal: "Apa dampak penggunaan media sosial yang berlebihan secara MENTAL?", jawaban: "Kecanduan sehingga meningkatkan kecemasan diri (hal. 18)" },
    { id: 294, soal: "Berikan contoh kecemasan diri akibat penggunaan media sosial berlebihan!", jawaban: "Takut ketinggalan berita terkini, cemas mengenai komentar orang lain, dan selalu ingin diperhatikan orang lain (hal. 18)" },
    { id: 122, soal: "Kapan pencemaran lingkungan menjadi masalah sosial?", jawaban: "Secara jangka panjang, jika sudah terlalu mengganggu kehidupan orang banyak (hal. 18)" },
    { id: 240, soal: "Apa penyebab pencemaran lingkungan?", jawaban: "Masalah sampah dan limbah industri, serta perilaku manusia itu sendiri (hal. 18)" },
    { id: 123, soal: "Sebutkan dampak pencemaran lingkungan!", jawaban: "1. Mengganggu kesehatan tubuh manusia (racun, zat kimia, radiasi yang masuk ke tubuh)\n2. Kepunahan flora dan fauna akibat habitat yang terus berkurang dan tercemar\n3. Ketahanan pangan dan ekonomi terganggu akibat penurunan kesuburan dan cuaca ekstrem\n4. Keseimbangan alam terganggu (pemanasan global dan perubahan iklim) (hal. 18)" },
    { id: 124, soal: "Mengapa sampah menjadi masalah serius bagi masyarakat kota dan daerah padat penduduk?", jawaban: "Karena masyarakat kota dan daerah padat penduduk menghasilkan banyak sekali sampah (hal. 18)" },
    { id: 295, soal: "Mengapa masyarakat kota dan daerah padat penduduk menghasilkan banyak sampah?", jawaban: "Akibat banyaknya proses produksi dan konsumsi (hal. 18)" },
    { id: 241, soal: "Bagaimana masalah sampah bagi masyarakat perdesaan?", jawaban: "Sampah mungkin belum menjadi masalah serius (hal. 18)" },
    { id: 125, soal: "Siapa yang bertanggung jawab mengelola sampah?", jawaban: "Pemerintah yang diwakili oleh Dinas Kebersihan (hal. 18)" },
    { id: 126, soal: "Sampah yang menumpuk dapat menjadi sumber penyakit menular apa saja?", jawaban: "Muntaber, penyakit kulit, dan gangguan pernapasan (hal. 18)" },
    { id: 127, soal: "Apa akibat kebiasaan membuang sampah ke sungai dan saluran air?", jawaban: "Saluran menjadi mampet sehingga sering terjadi banjir saat hujan lebat (hal. 18)" },
    { id: 242, soal: "Mengapa banjir skala besar mengganggu kehidupan kota?", jawaban: "Karena aktivitas terhenti (hal. 18)" },
    { id: 296, soal: "Selain aktivitas terhenti, apa dampak banjir skala besar bagi warga kota?", jawaban: "Banyak orang terpaksa mengungsi atau kehilangan harta benda (hal. 18)" },
    { id: 128, soal: "Kapan Hari Energi Sedunia diperingati?", jawaban: "Setiap tanggal 22 Oktober (hal. 18)" },
    { id: 243, soal: "Untuk apa Hari Energi Sedunia diperingati?", jawaban: "Untuk meningkatkan kesadaran tentang masalah terkait energi global (hal. 18)" },
    { id: 297, soal: "Selain kesadaran tentang energi global, Hari Energi Sedunia juga menekankan pentingnya apa?", jawaban: "Membuat dan mengimplementasikan kebijakan yang meningkatkan efisiensi energi dan melestarikan sumber daya alam (hal. 18)" },
    { id: 129, soal: "Kapan dan di mana Hari Energi Sedunia pertama kali dicanangkan?", jawaban: "22 Juli 2012 di World Energy Forum 2012 (hal. 18)" },
    { id: 244, soal: "Apa tujuan dicanangkannya Hari Energi Sedunia?", jawaban: "Menunjukkan dampak dari pilihan energi yang dibuat terkait produksi dan penggunaannya terhadap lingkungan secara luas (hal. 18)" },

    // ── Hal. 19 — Gerakan sadar lingkungan; penelitian berbasis pemecahan masalah sosial ──
    { id: 130, soal: "Mengapa perlu dilakukan gerakan sadar lingkungan?", jawaban: "Karena kerusakan lingkungan tidak terlepas dari campur tangan manusia (hal. 19)" },
    { id: 298, soal: "Dalam gerakan sadar lingkungan, alam bukan hanya untuk dinikmati hari ini, tetapi untuk apa?", jawaban: "Untuk diwariskan kepada generasi selanjutnya (hal. 19)" },
    { id: 245, soal: "Sebutkan contoh gerakan sadar lingkungan!", jawaban: "1. Mengurangi penggunaan sampah plastik\n2. Mengurangi penggunaan kendaraan pribadi\n3. Melakukan gerakan hemat energi\n4. Menggunakan produk ramah lingkungan dalam kehidupan sehari-hari (hal. 19)" },
    { id: 131, soal: "Apa pengertian pemecahan masalah?", jawaban: "Proses kognitif perilaku mandiri individu atau kelompok dengan mencoba mengidentifikasi atau menemukan solusi yang efektif atas masalah tertentu yang dihadapi dalam kehidupan sehari-hari (hal. 19)" },
    { id: 246, soal: "Bagaimana sifat pemecahan masalah dilakukan?", jawaban: "Secara sadar dan rasional, serta berorientasi pada tujuan (hal. 19)" },
    { id: 299, soal: "Apa tujuan dari pemecahan masalah?", jawaban: "Mengubah situasi yang bermasalah menjadi lebih baik (hal. 19)" },
    { id: 132, soal: "Suatu permasalahan sosial di masyarakat membutuhkan proses penyelesaian seperti apa?", jawaban: "Proses penyelesaian yang sistematis melalui penelitian sosial (hal. 19)" },
    { id: 133, soal: "Apa yang dimaksud penelitian sosial?", jawaban: "Pada prinsipnya, serangkaian langkah sistematis dan ilmiah yang dirancang untuk memperoleh suatu kebenaran (hal. 19)" },
    { id: 247, soal: "Apa yang diberikan oleh penelitian sosial?", jawaban: "Solusi secara praktis ataupun teoretis terkait penanganan permasalahan sosial dalam masyarakat (hal. 19)" },
    { id: 134, soal: "Apa yang dimaksud penelitian berbasis pemecahan masalah sosial?", jawaban: "Jenis penelitian yang fokus pada identifikasi, analisis, dan penyelesaian masalah sosial di dalam masyarakat (hal. 19)" },
    { id: 248, soal: "Apa tujuan utama penelitian berbasis pemecahan masalah sosial?", jawaban: "Menghasilkan pemahaman mendalam tentang akar permasalahan sosial (hal. 19)" },
    { id: 300, soal: "Selain memahami akar masalah, apa lagi tujuan utama penelitian berbasis pemecahan masalah sosial?", jawaban: "Mengembangkan solusi yang dapat diimplementasikan untuk meningkatkan kondisi sosial (hal. 19)" },
    { id: 135, soal: "Sebutkan langkah-langkah penelitian dalam pemecahan masalah sosial (berdasarkan bagan)!", jawaban: "1. Permasalahan sosial dalam masyarakat\n2. Mengidentifikasi dan merumuskan fokus masalah (bolak-balik dengan membaca berbagai literatur, yang didahului prasurvei lapangan)\n3. Membuat desain penelitian\n4. Mengumpulkan data\n5. Menganalisis data\n6. Melaporkan data/mengomunikasikan hasil penelitian\n7. Rekomendasi penyelesaian masalah (kembali ke permasalahan sosial dalam masyarakat) (hal. 19)" },
    { id: 136, soal: "Apa yang dilakukan pada tahap awal penelitian sosial (mengidentifikasi dan merumuskan fokus masalah)?", jawaban: "Merefleksikan permasalahan sosial di lingkungan sekitar ataupun menelusurinya melalui berbagai sumber (hal. 19)" },
    { id: 249, soal: "Setelah merefleksikan permasalahan sosial, dalam bentuk apa fokus penelitian dirumuskan?", jawaban: "Dalam bentuk pertanyaan, yaitu pertanyaan penelitian yang terkait dengan fenomena atau objek yang ingin diteliti serta tujuan yang ingin dicapai (hal. 19)" },

    // ── Hal. 20 — Objek penelitian, studi pustaka, desain, pengumpulan & analisis data ──
    { id: 137, soal: "Objek penelitian dapat berupa apa?", jawaban: "Berupa manusia atau grup program (hal. 20)" },
    { id: 250, soal: "Bagaimana peneliti meneliti objek penelitian?", jawaban: "Melakukan investigasi terhadap objek yang diteliti dengan berbagai macam metode pengumpulan data (hal. 20)" },
    { id: 301, soal: "Untuk apa peneliti melakukan investigasi terhadap objek penelitian?", jawaban: "Untuk menjawab pertanyaan penelitian yang muncul (hal. 20)" },
    { id: 138, soal: "Pertanyaan penelitian kualitatif menekankan pada apa?", jawaban: "Kerangka konsep yang holistik dalam lingkungan sosialnya, di mana penelitian berlangsung (hal. 20)" },
    { id: 251, soal: "Mengapa dalam penelitian kualitatif peneliti perlu memahami konteks dan melakukan analisis yang holistik?", jawaban: "Karena peneliti terdorong memahami fenomena secara menyeluruh (hal. 20)" },
    { id: 252, soal: "Laporan penelitian kualitatif biasanya disertai apa?", jawaban: "Sintesis dan kesimpulan dari peneliti (hal. 20)" },
    { id: 139, soal: "Mengapa peneliti melakukan studi pustaka?", jawaban: "Untuk mencari dan melihat apakah telah dilakukan penelitian serupa serta bagaimana hasil akhirnya (hal. 20)" },
    { id: 253, soal: "Bahan yang didapat dari studi pustaka digunakan untuk apa?", jawaban: "Menjadi acuan untuk mencapai tujuan penelitian (hal. 20)" },
    { id: 254, soal: "Apa fungsi tinjauan pustaka bagi peneliti?", jawaban: "Wacana bagi peneliti untuk menentukan pertanyaan penelitian (hal. 20)" },
    { id: 302, soal: "Selain untuk menentukan pertanyaan penelitian, tinjauan pustaka menjadi apa?", jawaban: "Titik awal mencari informasi terkait pertanyaan penelitian (hal. 20)" },
    { id: 140, soal: "Bagaimana syarat kasus yang dipilih dalam penelitian?", jawaban: "Tiap kasus memiliki keunikan tersendiri dan kasus yang dipilih dapat merepresentasikan sebagian besar populasi (hal. 20)" },
    { id: 255, soal: "Berdasarkan apa masalah yang diangkat dalam penelitian kasus dapat dilihat?", jawaban: "Berdasarkan kesamaan geografi, tipe yang sama, atau parameter lain yang sama (hal. 20)" },
    { id: 141, soal: "Apa yang dilakukan pada tahap mendesain penyelidikan masalah?", jawaban: "Setelah menentukan fokus masalah, peneliti mendalami kembali literatur dan teori yang sesuai untuk menganalisis fenomena yang dipilih (hal. 20)" },
    { id: 303, soal: "Pada tahap mendesain penyelidikan, apa yang dilakukan peneliti setelah mendalami literatur dan teori?", jawaban: "Mendesain metode penelitian yang relevan untuk menyelidiki hingga menganalisis data (hal. 20)" },
    { id: 142, soal: "Apa yang dimaksud unit (subjek) penelitian?", jawaban: "Unit yang akan diteliti, dapat berupa individu, keluarga, organisasi, ataupun kejadian tertentu (hal. 20)" },
    { id: 256, soal: "Apa landasan dalam menentukan subjek/sampel penelitian?", jawaban: "Tujuan yang jelas dari suatu penelitian (hal. 20)" },
    { id: 143, soal: "Hal penting apa yang perlu diingat dalam desain penelitian studi kasus?", jawaban: "Adanya suatu kesatuan yang holistik pada desain ini: penelitian mengevaluasi suatu fenomena sebagai suatu kesatuan dilihat dari perspektif secara global (individu atau grup) (hal. 20)" },
    { id: 144, soal: "Mengapa instrumen pengumpulan data perlu diteliti, dipelajari, dan dianalisis lebih mendalam?", jawaban: "Agar tercipta validitas penelitian yang baik (hal. 20)" },
    { id: 257, soal: "Instrumen penelitian harus sesuai dengan apa?", jawaban: "Harus sesuai dengan tujuan penelitian (hal. 20)" },
    { id: 258, soal: "Apa yang dapat dijadikan informasi dalam mendesain instrumen penelitian?", jawaban: "Kesimpulan dari penelitian terdahulu, agar instrumen sesuai dengan pertanyaan penelitian (hal. 20)" },
    { id: 145, soal: "Apa akibat instrumen penelitian yang tidak valid?", jawaban: "Menimbulkan hasil yang tidak sesuai dengan tujuan penelitian sehingga menimbulkan bias (hal. 20)" },
    { id: 259, soal: "Bagaimana mencegah instrumen penelitian yang tidak valid?", jawaban: "Peneliti perlu memperhatikan evidence ataupun penelitian terdahulu sebagai acuan dalam menentukan instrumen (hal. 20)" },
    { id: 146, soal: "Sebutkan metode dalam penelitian kasus!", jawaban: "Survei, interview, dan observasi (hal. 20)" },
    { id: 147, soal: "Metode apa yang sering digunakan dalam penelitian sosial untuk mencapai kualitas data yang lebih mendalam?", jawaban: "Wawancara mendalam (in depth interview) (hal. 20)" },
    { id: 260, soal: "Metode pengumpulan data apa yang sering digunakan dalam penelitian sosial?", jawaban: "Wawancara mendalam dan kuesioner (hal. 20)" },
    { id: 148, soal: "Penelitian kualitatif berfokus pada apa?", jawaban: "Tidak berfokus pada kuantitas data, tetapi pada kualitas data yang diperoleh (hal. 20)" },
    { id: 261, soal: "Penelitian kualitatif didasarkan pada apa?", jawaban: "Interpretasi atau pengertian akan suatu fenomena dari subjek/partisipan yang terlibat dalam penelitian (hal. 20)" },
    { id: 149, soal: "Sebutkan langkah-langkah analisis data dalam penelitian kualitatif!", jawaban: "1. Mengumpulkan semua data dan menyajikannya dalam bentuk transkrip\n2. Reduksi/eliminasi jawaban informan yang tidak relevan dan mengelompokkannya berdasarkan konsep tertentu, serta memeriksa kembali kelengkapan informasi tiap informan\n3. Menyajikan hasil temuan lapangan dalam bentuk matriks atau bagan\n4. Menarik kesimpulan dan mengaitkannya dengan teori (hal. 20–21)" },

    // ── Hal. 21 — Laporan penelitian; upaya mengatasi masalah sosial ──
    { id: 150, soal: "Hasil akhir penelitian umumnya dibuat dalam bentuk apa?", jawaban: "Dalam bentuk tulisan (hal. 21)" },
    { id: 262, soal: "Sebutkan saran Denzin dan Lincoln untuk laporan akhir penelitian!", jawaban: "1. Mendeskripsikan masalah atau isu penelitian sehingga diperoleh konsep yang jelas dari tujuan penelitian\n2. Mendeskripsikan secara detail konteks dan lokasi penelitian sehingga pembaca memperoleh gambaran jelas dan dapat menjadi bahan penelitian selanjutnya\n3. Menjabarkan secara lengkap proses penelitian kasus, dari perumusan masalah sampai analisis dan hasil akhir\n4. Mendiskusikan hasil akhir penelitian sehingga diperoleh gambaran dan pemahaman yang jelas mengenai fenomena yang diteliti (hal. 21)" },
    { id: 151, soal: "Apa yang dimaksud kerangka laporan penelitian?", jawaban: "Gambaran atau rangkaian pembuatan laporan penelitian (hal. 21)" },
    { id: 263, soal: "Apa guna kerangka laporan penelitian?", jawaban: "Mempermudah penulisan laporan penelitian (hal. 21)" },
    { id: 152, soal: "Sebutkan bentuk upaya untuk mengatasi masalah sosial dalam masyarakat!", jawaban: "1. Upaya preventif\n2. Upaya kuratif\n3. Upaya campuran (hal. 21)" },
    { id: 153, soal: "Apa yang dimaksud upaya preventif?", jawaban: "Upaya yang dilakukan untuk mencegah terjadinya masalah sosial (hal. 21)" },
    { id: 264, soal: "Sebutkan contoh upaya preventif dalam mengatasi masalah sosial!", jawaban: "Sosialisasi, edukasi, pengawasan, dan meningkatkan kerja sama antarpihak (hal. 21)" },
    { id: 154, soal: "Apa yang dimaksud upaya kuratif?", jawaban: "Penanganan setelah kejadian (hal. 21)" },
    { id: 265, soal: "Sebutkan contoh upaya kuratif dalam mengatasi masalah sosial!", jawaban: "Pendampingan/konseling, penegakan hukum, dan rehabilitasi (hal. 21)" },
    { id: 155, soal: "Apa yang dimaksud upaya campuran?", jawaban: "Kombinasi pencegahan dan penanganan setelah terjadi masalah sosial (hal. 21)" },

    // ── Hal. 22–27 — Glosarium & Penilaian Sumatif Bab 1 ──
    { id: 156, soal: "Apa arti norma? (Glosarium)", jawaban: "Aturan, ukuran, atau kaidah yang dipakai sebagai tolok ukur untuk menilai atau memperbandingkan sesuatu (hal. 22)" },
    { id: 157, soal: "Apa arti sosialisasi? (Glosarium)", jawaban: "Upaya memasyarakatkan sesuatu sehingga menjadi dikenal, dipahami, dihayati oleh masyarakat (hal. 22)" },
    { id: 266, soal: "Apa sinonim kata sosialisasi menurut glosarium?", jawaban: "Permasyarakatan (hal. 22)" },
    { id: 158, soal: "Mana yang termasuk masalah sosial (berdampak pada masyarakat luas): asap pabrik yang menyebabkan gangguan pernapasan, pelaku tabrak lari tertangkap, anak mengambil uang orang tua, atau anak berbohong karena takut dimarahi? (Sumatif)", jawaban: "Asap pabrik yang pekat dapat menyebabkan gangguan pernapasan (hal. 22)" },
    { id: 304, soal: "Mengapa asap pabrik yang menyebabkan gangguan pernapasan termasuk masalah sosial? (Sumatif)", jawaban: "Karena dampaknya dirasakan masyarakat luas (pilihan lain masalah pribadi) (hal. 22)" },
    { id: 159, soal: "Permasalahan sosial dapat digolongkan menjadi masalah nyata dan tersembunyi. Manakah contoh masalah yang NYATA: rasa tidak puas pada kebijakan, keinginan cepat kaya, malas bekerja keras, atau tingkat pendidikan masyarakat masih rendah? (Sumatif)", jawaban: "Tingkat pendidikan masyarakat masih rendah (hal. 22)" },
    { id: 305, soal: "Mengapa tingkat pendidikan yang rendah termasuk masalah sosial NYATA? (Sumatif)", jawaban: "Karena dapat diamati dan diukur secara langsung (pilihan lain berupa sikap/keinginan yang tersembunyi) (hal. 22)" },
    { id: 160, soal: "Sikap apa yang harus dimiliki untuk mencegah keretakan sosial akibat berita bohong (hoaks)? (Sumatif)", jawaban: "Membandingkan informasi yang diperoleh dengan sumber tepercaya lain sebelum disebarkan (hal. 23)" },
    { id: 161, soal: "Setelah pemilu, banyak orang mengidap gangguan jiwa akibat tidak terpilih menjadi anggota DPR. Ini masalah sosial dari faktor apa? (Sumatif)", jawaban: "Faktor psikologis (hal. 23)" },
    { id: 162, soal: "Contoh kejahatan white collar crime (kejahatan kerah putih) adalah… (Sumatif)", jawaban: "Korupsi (hal. 23)" },
    { id: 163, soal: "Contoh masalah sosial yang berkaitan dengan remaja adalah… (Sumatif)", jawaban: "Membolos, apatisme, dan bullying (hal. 23)" },
    { id: 164, soal: "Perbedaan kepentingan antarkelompok dalam masyarakat dapat mengakibatkan… (Sumatif)", jawaban: "Hubungan antaranggota masyarakat retak (hal. 23)" },
    { id: 165, soal: "Menurut teori pelabelan, suatu kondisi sosial kelompok/masyarakat dianggap bermasalah apabila… (Sumatif)", jawaban: "Seseorang atau kelompok memberi stigma buruk terhadap anggota masyarakat lainnya (hal. 24)" },
    { id: 166, soal: "Faktor penyebab korupsi, kolusi, dan nepotisme (KKN) yang paling sesuai adalah… (Sumatif)", jawaban: "Sikap tamak atau serakah untuk mendapatkan sesuatu dengan cara ilegal (hal. 24)" },
    { id: 167, soal: "Dari pernyataan: (1) pendapatan per kapita rendah, (2) persebaran penduduk tidak merata, (3) penerapan program usaha kecil mandiri, (4) pembangunan tidak merata, (5) stabilitas politik akuntabel — mana yang menjadi faktor pendorong munculnya kemiskinan? (Sumatif)", jawaban: "Nomor 1, 2, dan 4 (hal. 24)" },
    { id: 168, soal: "Kehamilan remaja dikaitkan dengan rendahnya pendidikan dan kemiskinan. Upaya preventif yang relevan untuk kasus ini adalah… (Sumatif)", jawaban: "Mengintegrasikan pendidikan seks untuk remaja dalam kurikulum (hal. 24)" },
    { id: 169, soal: "Urutkan tahapan penelitian: (1) mencari topik, (2) memilih metode, (3) mempresentasikan hasil, (4) merumuskan masalah, (5) membuat laporan, (6) mengumpulkan & mengolah data! (Sumatif)", jawaban: "1 → 4 → 2 → 6 → 5 → 3\n(mencari topik, merumuskan masalah, memilih metode, mengumpulkan & mengolah data, membuat laporan, mempresentasikan hasil) (hal. 25)" },
    { id: 170, soal: "Peneliti harus bersikap objektif. Apa artinya? (Sumatif)", jawaban: "Dapat memisahkan keinginan sendiri dalam data (data tidak dipengaruhi kepentingan/pendapat pribadi peneliti) (hal. 25)" },
    { id: 171, soal: "Urutan langkah penelitian dalam pemecahan masalah sosial adalah… (Sumatif)", jawaban: "Merumuskan tujuan → mendesain langkah → mengambil data → analisis → merumuskan rekomendasi (hal. 25)" },
    { id: 172, soal: "Kasus bullying viral, kenakalan remaja, pengangguran, kesenjangan pendapatan perkotaan, dan demo ricuh. Pernyataan mana yang BENAR tentang gejala masalah sosialnya? (Sumatif, PG kompleks)", jawaban: "• Perundungan dan kenakalan remaja adalah gejala sosial yang disebabkan perubahan nilai dan norma\n• Kesenjangan ekonomi dan pengangguran termasuk masalah sosial karena menimbulkan ketidakstabilan dan ketidakpuasan\n• Demo ricuh adalah manifestasi masalah sosial akibat ketidaksesuaian antara harapan dan kenyataan sosial (hal. 25)" },
    { id: 267, soal: "Pada kasus bullying viral, pengangguran, dan demo ricuh, pernyataan mana yang SALAH tentang gejala masalah sosialnya? (Sumatif, PG kompleks)", jawaban: "• Masalah sosial tidak berdampak signifikan pada integrasi\n• Penyebab masalah sosial hanya biologis & psikologis (hal. 25)" },
    { id: 173, soal: "Warga asli desa membatasi interaksi dengan pendatang beda suku, menolak melibatkan mereka dalam adat, dan mempersulit akses bansos. Apa bentuk/dampak eksklusi sosialnya? (Sumatif, PG kompleks)", jawaban: "• Terjadi diskriminasi berdasarkan suku dan budaya\n• Kelompok pendatang mengalami marginalisasi dari kehidupan masyarakat umum\n• Adanya pembatasan akses terhadap sumber daya dan partisipasi sosial\n(Bukan: konflik fisik terbuka, bukan asimilasi) (hal. 26)" },
    { id: 174, soal: "Kasus desa yang mengucilkan pendatang — Benar atau Salah?\n1) Membatasi interaksi & akses bansos = diskriminasi dan eksklusi sosial\n2) Menolak melibatkan pendatang dalam adat berpotensi menghambat integrasi sosial\n3) Situasi tersebut menunjukkan asimilasi budaya yang harmonis (Sumatif)", jawaban: "1) Benar\n2) Benar\n3) Salah (hal. 26)" },
    { id: 176, soal: "Penyebab utama kenakalan remaja dari lingkungan keluarga adalah… (Sumatif)", jawaban: "Kemiskinan keluarga (perkiraan, kunci tidak tersedia) (hal. 23)" },
    { id: 177, soal: "Orang kaya selalu diutamakan dalam fasilitas & pelayanan kesehatan, sedangkan masyarakat miskin hanya menikmati pelayanan ala kadarnya. Ini ketidakadilan dalam aspek… (Sumatif)", jawaban: "Diskriminasi (perkiraan, kunci tidak tersedia) (hal. 23)" },
    { id: 178, soal: "Subsidi untuk masyarakat kurang mampu sering salah sasaran atau diselewengkan. Dampak permasalahan sosial tersebut adalah… (Sumatif)", jawaban: "Memicu konflik antara masyarakat miskin, kaya, dan pemerintah (perkiraan, kunci tidak tersedia) (hal. 24)" },
    { id: 179, soal: "Sebelum sekolah, Herman dinasihati ibunya agar memakai helm dan membawa STNK serta SIM. Tindakan ibu Herman merupakan bentuk pengendalian sosial… (Sumatif)", jawaban: "Preventif (hal. 24)" },
    { id: 306, soal: "Mengapa nasihat ibu Herman (pakai helm, bawa STNK & SIM) termasuk pengendalian sosial preventif? (Sumatif)", jawaban: "Karena dilakukan sebelum terjadi pelanggaran (perkiraan) (hal. 24)" },
    { id: 307, soal: "Dari sisi caranya, nasihat ibu Herman (pakai helm, bawa STNK & SIM) termasuk pengendalian sosial apa? (Sumatif)", jawaban: "Persuasif (perkiraan) (hal. 24)" },
    { id: 180, soal: "Berikut yang TIDAK termasuk cara menanggulangi permasalahan sosial: meningkatkan kesadaran sosial, membentuk SDM andal, meningkatkan mutu & pemerataan pendidikan, meningkatkan pemerataan pembangunan, atau membangun komunikasi yang efektif? (Sumatif)", jawaban: "Membangun komunikasi yang efektif (perkiraan, kunci tidak tersedia) (hal. 25)" },
    { id: 181, soal: "Penanganan masalah sosial tidak hanya menekankan pada dorongan terhadap perubahan, tetapi juga harus memperhatikan… (Sumatif)", jawaban: "Dampak negatif yang akan terjadi (perkiraan, kunci tidak tersedia) (hal. 25)" },
    { id: 182, soal: "Unggahan viral berisi perdebatan sengit, data tidak valid, ancaman fisik; di sisi lain tagar #PeduliSesama berhasil menggalang dana tapi dipertanyakan keabsahan donaturnya. Pernyataan yang tepat tentang pengaruh media sosial terhadap masalah sosial? (Sumatif, PG kompleks)", jawaban: "• Media sosial mempercepat penyebaran informasi, baik yang valid maupun hoaks, memicu konflik sosial dan polarisasi\n• Kemudahan berbagi konten dapat mendorong aksi sosial positif seperti penggalangan dana, namun juga berpotensi merusak reputasi dan memicu cyberbullying\n(perkiraan, kunci tidak tersedia) (hal. 26)" },
    { id: 175, soal: "Kasus sampah Desa Sukamaju (penelitian kualitatif → rekomendasi TPS & pelatihan kompos) — Benar atau Salah?\n1) Penelitian bertujuan memahami fenomena secara ilmiah dan merumuskan solusi, bukan sekadar mengumpulkan data\n2) Masalah sampah itu masalah sosial karena hanya memengaruhi sebagian kecil individu dan tidak berdampak pada lingkungan\n3) Temuan kebutuhan TPS & pelatihan kompos adalah bagian analisis data sebagai dasar rekomendasi (Sumatif)", jawaban: "1) Benar\n2) Salah (justru berdampak luas: banjir dan bau)\n3) Benar (hal. 27)" },
  ],

  // Sumber: TNT Ekonomi XI (GPP) Semester 1 — Bab 1 Pertumbuhan Ekonomi dan Kemiskinan
  "Ekonomi": [
    // ── Hal. 7 — Apersepsi ──
    { id: 1, soal: "Pertumbuhan ekonomi seperti apa yang lebih efektif dalam mengurangi kemiskinan (apersepsi Bab 1)?", jawaban: "Pertumbuhan yang disertai peningkatan kesempatan kerja, penguatan UMKM, dan akses masyarakat terhadap pendidikan serta layanan kesehatan (hal. 7)" },
    { id: 153, soal: "Bagaimana penurunan kemiskinan jika pertumbuhan ekonomi didorong sektor padat modal?", jawaban: "Cenderung berjalan lambat, karena sektor padat modal tidak banyak menyerap tenaga kerja (hal. 7)" },

    // ── Hal. 8 — Definisi, manfaat, tujuan & faktor pendapatan nasional ──
    { id: 2, soal: "Apa pengertian pendapatan nasional?", jawaban: "Pendapatan yang diterima oleh semua orang dalam satu negara (hal. 8)" },
    { id: 154, soal: "Pendapatan nasional adalah nilai barang dan jasa yang… (lengkapi definisinya)", jawaban: "Diproduksi masyarakat suatu negara dalam satu periode waktu tertentu (hal. 8)" },
    { id: 155, soal: "Dengan kata lain, pendapatan nasional adalah…", jawaban: "Nilai bersih dari semua kegiatan ekonomi suatu negara selama satu tahun yang diukur dengan satuan mata uang tertentu (hal. 8)" },
    { id: 3, soal: "Sebutkan hal-hal yang perlu diperhatikan dari pengertian pendapatan nasional!", jawaban: "1. Nilai total barang dan jasa akhir (untuk menghindari penghitungan berganda/double counting)\n2. Suatu perekonomian (batasan suatu negara atau penduduk dari suatu negara)\n3. Suatu periode (agar perhitungan dapat dibandingkan, umumnya selama satu tahun) (hal. 8)" },
    { id: 4, soal: "Sebutkan manfaat pendapatan nasional bagi suatu negara!", jawaban: "1. Mengetahui dan menganalisis struktur ekonomi suatu negara (industri, agraris, atau jasa)\n2. Membandingkan keadaan perekonomian dari waktu ke waktu\n3. Membandingkan perekonomian antarnegara di dunia\n4. Pedoman bagi pemerintah untuk mengambil kebijakan pembangunan ekonomi nasional (hal. 8)" },
    { id: 5, soal: "Sebutkan tujuan penghitungan pendapatan nasional!", jawaban: "1. Memperoleh taksiran nilai barang dan jasa secara akurat\n2. Mengetahui perekonomian suatu negara\n3. Membantu membuat rencana dan melaksanakan program pembangunan berjangka guna mencapai tujuan pembangunan nasional\n4. Menganalisis faktor-faktor yang memengaruhi kemajuan ekonomi suatu negara (hal. 8)" },
    { id: 6, soal: "Sebutkan faktor-faktor yang memengaruhi pendapatan nasional!", jawaban: "1. Keseluruhan permintaan dan penawaran (aggregate demand and supply)\n2. Investasi\n3. Konsumsi dan tabungan (hal. 8)" },
    { id: 7, soal: "Apa yang dimaksud aggregate demand?", jawaban: "Keseluruhan permintaan masyarakat terhadap barang maupun jasa pada tingkat harga tertentu (hal. 8)" },
    { id: 156, soal: "Apa yang dimaksud aggregate supply?", jawaban: "Keseluruhan penawaran barang maupun jasa yang ditawarkan produsen pada tingkat harga tertentu (hal. 8)" },
    { id: 157, soal: "Bagaimana pengaruh aggregate demand dan aggregate supply terhadap pendapatan nasional?", jawaban: "Keduanya dapat meningkatkan pendapatan nasional (hal. 8)" },
    { id: 8, soal: "Bagaimana investasi memengaruhi pendapatan nasional?", jawaban: "Investasi berdampak besar terhadap pertambahan pendapatan nasional (hal. 8)" },
    { id: 158, soal: "Apa akibat peningkatan investasi dalam negeri terhadap pendapatan nasional?", jawaban: "Meningkatkan produksi nasional, yang memengaruhi tingkat pendapatan nasional selama periode tertentu (hal. 8)" },
    { id: 9, soal: "Apa yang dimaksud konsumsi (dalam pendapatan nasional)?", jawaban: "Bagian pendapatan masyarakat yang digunakan untuk membeli barang dan jasa sebagai pemenuhan kebutuhan hidup (hal. 8)" },
    { id: 159, soal: "Apa yang dimaksud tabungan (dalam pendapatan nasional)?", jawaban: "Pendapatan masyarakat yang tidak dibelanjakan untuk konsumsi (hal. 8)" },
    { id: 160, soal: "Bagaimana pengaruh konsumsi dan tabungan terhadap pendapatan nasional?", jawaban: "Naiknya konsumsi dan tabungan dapat meningkatkan pendapatan nasional (hal. 8)" },

    // ── Hal. 9 — Metode penghitungan pendapatan nasional ──
    { id: 10, soal: "Penghitungan pendapatan nasional dapat dilakukan dengan tiga pendekatan, yaitu…", jawaban: "1. Pendekatan produksi (nilai tambah)\n2. Pendekatan penerimaan (pendapatan)\n3. Pendekatan pengeluaran (hal. 9)" },
    { id: 11, soal: "Bagaimana cara menghitung pendapatan nasional dengan pendekatan penerimaan (pendapatan)?", jawaban: "Menjumlahkan semua balas jasa yang diterima pemilik faktor-faktor produksi (hal. 9)" },
    { id: 161, soal: "Tuliskan rumus pendapatan nasional dengan pendekatan penerimaan (pendapatan)!", jawaban: "Y = r + w + i + p\nY = pendapatan nasional, r = sewa tanah, w = upah/gaji, i = pendapatan bunga, p = laba/keuntungan (hal. 9)" },
    { id: 12, soal: "Bagaimana cara menghitung pendapatan nasional dengan pendekatan pengeluaran?", jawaban: "Menjumlahkan semua pengeluaran yang dilakukan para pelaku atau rumah tangga ekonomi (hal. 9)" },
    { id: 162, soal: "Tuliskan rumus pendapatan nasional dengan pendekatan pengeluaran!", jawaban: "Y = C + I + G + (X − M)\nC = konsumsi, I = investasi, G = pengeluaran pemerintah, X = ekspor, M = impor (hal. 9)" },
    { id: 13, soal: "Bagaimana cara menghitung pendapatan nasional dengan pendekatan produksi?", jawaban: "Menjumlahkan nilai tambah (value added) dari seluruh faktor produksi selama satu periode tertentu (hal. 9–10)" },
    { id: 163, soal: "Tuliskan rumus pendapatan nasional dengan pendekatan produksi!", jawaban: "Y = (Q₁ × P₁) + (Q₂ × P₂) + … + (Qₙ × Pₙ)\nQ = jumlah barang, P = harga barang (hal. 9–10)" },

    // ── Hal. 10 — Komponen pendapatan nasional (PDB, PNB, NNP, NNI) ──
    { id: 14, soal: "Apa pengertian Produk Domestik Bruto (PDB) atau Gross Domestic Product (GDP)?", jawaban: "Jumlah seluruh produksi barang dan jasa yang dihasilkan suatu negara selama satu tahun, termasuk yang dihasilkan orang asing dan perusahaan asing yang beroperasi di dalam negeri (hal. 10)" },
    { id: 164, soal: "Apa yang TIDAK termasuk dalam perhitungan PDB?", jawaban: "Barang dan jasa dari warga negara itu yang bekerja di luar negeri (misalnya TKI/TKW) (hal. 10)" },
    { id: 15, soal: "Sebutkan tiga sektor dalam komposisi lapangan usaha yang termasuk dalam perhitungan PDB!", jawaban: "1. Sektor primer: pertanian, perikanan, dan pertambangan\n2. Sektor sekunder: manufaktur, listrik, gas, air bersih, dan bangunan/konstruksi\n3. Sektor tersier: perdagangan, perbankan, dan jasa (hal. 10)" },
    { id: 16, soal: "Apa pengertian Produk Nasional Bruto (PNB) atau Gross National Product (GNP)?", jawaban: "Seluruh produk barang dan jasa yang dihasilkan masyarakat suatu negara dalam satu tahun, termasuk yang dihasilkan warga negara tersebut yang berada di luar negeri (hal. 10)" },
    { id: 165, soal: "Tuliskan rumus Produk Nasional Bruto (PNB)!", jawaban: "PNB = PDB + pendapatan neto terhadap luar negeri (pendapatan WNI di luar negeri ditambah, pendapatan WNA di dalam negeri dikurangi) (hal. 10)" },
    { id: 17, soal: "Apa pengertian Produk Nasional Neto (NNP)?", jawaban: "Nilai pasar semua benda dan jasa yang dihasilkan dalam jangka waktu satu tahun dikurangi penyusutan (depreciation) (hal. 10)" },
    { id: 246, soal: "Dalam NNP, untuk apa penyusutan (depreciation) dikurangkan?", jawaban: "Untuk mengganti barang-barang modal (hal. 10)" },
    { id: 166, soal: "Tuliskan rumus Produk Nasional Neto (NNP)!", jawaban: "NNP = PNB − penyusutan barang modal (hal. 10)" },
    { id: 18, soal: "Apa pengertian Pendapatan Nasional Neto (NNI)?", jawaban: "Jumlah seluruh penerimaan yang diterima masyarakat dalam periode tertentu (biasanya satu tahun), setelah dikurangi pajak tidak langsung (hal. 10–11)" },
    { id: 167, soal: "Tuliskan rumus Pendapatan Nasional Neto (NNI)!", jawaban: "NNI = NNP − pajak tidak langsung (hal. 10–11)" },

    // ── Hal. 11 — PI, DI, pendapatan per kapita ──
    { id: 19, soal: "Apa pengertian Personal Income (PI)?", jawaban: "Semua pendapatan yang diterima oleh semua individu atau rumah tangga di suatu negara secara kolektif (hal. 11)" },
    { id: 247, soal: "Mengapa tidak semua pendapatan dibagikan menjadi Personal Income?", jawaban: "Karena ada komponen yang ditahan (hal. 11)" },
    { id: 168, soal: "Tuliskan rumus Personal Income (PI)!", jawaban: "PI = (NNI + transfer payment + pendapatan bunga) − (iuran jaminan sosial + iuran asuransi + laba ditahan + pajak perseroan) (hal. 11)" },
    { id: 20, soal: "Apa pengertian Disposable Income (DI)?", jawaban: "Pendapatan yang siap digunakan masyarakat setelah dikurangi pajak langsung (hal. 11)" },
    { id: 169, soal: "Tuliskan rumus Disposable Income (DI)!", jawaban: "DI = PI − pajak langsung (hal. 11)" },
    { id: 21, soal: "Apa yang dimaksud pajak langsung?", jawaban: "Pajak yang pembebanannya tidak dapat dilimpahkan kepada orang lain (hal. 11)" },
    { id: 170, soal: "Berikan contoh pajak langsung!", jawaban: "Pajak penghasilan (PPh) (hal. 11)" },
    { id: 22, soal: "Apa pengertian pendapatan per kapita?", jawaban: "Pendapatan rata-rata penduduk pada suatu negara di waktu tertentu (hal. 11)" },
    { id: 23, soal: "Bagaimana hubungan jumlah penduduk terhadap pendapatan per kapita?", jawaban: "Berbanding terbalik (penduduk tinggi → per kapita rendah, dan sebaliknya) (hal. 11)" },
    { id: 171, soal: "Bagaimana hubungan pendapatan nasional terhadap pendapatan per kapita?", jawaban: "Sebanding (pendapatan nasional tinggi → per kapita besar, dan sebaliknya) (hal. 11)" },
    { id: 24, soal: "Tuliskan rumus pendapatan per kapita!", jawaban: "Pendapatan per kapita = Pendapatan nasional bruto ÷ Jumlah penduduk (hal. 11)" },
    { id: 25, soal: "Sebutkan fungsi pendapatan per kapita bagi negara!", jawaban: "1. Mencerminkan situasi ekonomi masyarakat dan negara dalam waktu tertentu\n2. Dasar pengambilan kebijakan di masa mendatang\n3. Mengetahui tingkat kemakmuran negara dan masyarakatnya\n4. Mengukur kelancaran pelaksanaan aktivitas ekonomi negara (hal. 11)" },
    { id: 26, soal: "Sebutkan manfaat menghitung pendapatan per kapita!", jawaban: "1. Memastikan kekayaan suatu daerah atau sebaliknya\n2. Dimanfaatkan pengusaha untuk menentukan daerah/wilayah sasaran pasarnya\n3. Menilai keterjangkauan harga rata-rata di daerah (hal. 11)" },

    // ── Hal. 12 — Latihan; definisi pertumbuhan ekonomi ──
    { id: 27, soal: "Diketahui: laba pengusaha Rp75 triliun, bunga modal Rp35 triliun, sewa tanah Rp40 triliun, upah tenaga kerja Rp150 triliun. Berapa pendapatan nasional dengan metode pendapatan? (Mari Berlatih)", jawaban: "Y = r + w + i + p\nY = 40 + 150 + 35 + 75 = Rp300 triliun (hal. 12)" },
    { id: 28, soal: "Tahun 2025, negara X: GNP Rp600 triliun, penduduk 150 juta jiwa. Negara Y: GNP Rp400 triliun, penduduk 80 juta jiwa. Negara mana yang lebih sejahtera? (Mari Berlatih)", jawaban: "Pendapatan per kapita X = 600 triliun ÷ 150 juta = Rp4.000.000\nPendapatan per kapita Y = 400 triliun ÷ 80 juta = Rp5.000.000\nJadi negara Y lebih sejahtera (hal. 12)" },
    { id: 29, soal: "Apa yang digambarkan pertumbuhan ekonomi dalam analisis ekonomi makro?", jawaban: "Perubahan positif dalam kinerja perekonomian suatu negara selama periode tertentu (hal. 12)" },
    { id: 172, soal: "Mengapa analisis pertumbuhan ekonomi penting?", jawaban: "Karena menjadi dasar penilaian kondisi ekonomi suatu negara (hal. 12)" },
    { id: 248, soal: "Selain kondisi ekonomi, analisis pertumbuhan ekonomi juga menilai kemampuan negara dalam hal apa?", jawaban: "Kemampuan menciptakan lapangan kerja dan meningkatkan taraf hidup masyarakat (hal. 12)" },
    { id: 30, soal: "Pertumbuhan menunjukkan perubahan apa?", jawaban: "Perubahan secara kuantitatif: jika output perekonomian makin bertambah dari waktu ke waktu, telah terjadi pertumbuhan (hal. 12)" },
    { id: 173, soal: "Apa maksud pertumbuhan menunjukkan perubahan ke arah 'kematangan'?", jawaban: "Perubahan kualitatif yang saling terkait dan saling memengaruhi (hal. 12)" },
    { id: 249, soal: "Sebutkan contoh perubahan kualitatif ke arah 'kematangan'!", jawaban: "Sikap, kelembagaan, dan perubahan struktural (hal. 12)" },
    { id: 31, soal: "Apa pengertian pertumbuhan ekonomi menurut Schumpeter?", jawaban: "Peningkatan output masyarakat yang disebabkan semakin banyaknya jumlah faktor produksi yang digunakan dalam proses produksi tanpa perubahan teknologi produksi itu sendiri (hal. 12)" },
    { id: 32, soal: "Apa pengertian pertumbuhan ekonomi menurut Simon Kuznets?", jawaban: "Kenaikan kapasitas dalam jangka panjang dari negara yang bersangkutan untuk menyediakan berbagai barang ekonomi bagi penduduknya (hal. 12)" },
    { id: 33, soal: "Jadi, apa pengertian pertumbuhan ekonomi (economic growth)?", jawaban: "Perkembangan kegiatan dalam perekonomian yang menyebabkan barang dan jasa yang diproduksi dalam masyarakat bertambah dan kemakmuran masyarakat meningkat dalam jangka panjang (hal. 12)" },

    // ── Hal. 13 — Teori pertumbuhan ekonomi; faktor barang modal ──
    { id: 34, soal: "Perkembangan pertumbuhan ekonomi ditandai dengan apa?", jawaban: "Kenaikan GDP (Gross Domestic Product) suatu negara, tanpa memandang kenaikan itu lebih besar atau lebih kecil dari pertumbuhan penduduk, dan tanpa memandang apakah ada perubahan dalam struktur perekonomian atau tidak (hal. 13)" },
    { id: 35, soal: "Apakah pertumbuhan ekonomi (economic growth) sama dengan pembangunan ekonomi (economic development)?", jawaban: "Tidak, keduanya memiliki arti yang berbeda (hal. 13)" },
    { id: 174, soal: "Apa persamaan pertumbuhan ekonomi dan pembangunan ekonomi?", jawaban: "Sama-sama menjelaskan tentang perkembangan ekonomi suatu negara (hal. 13)" },
    { id: 36, soal: "Sebutkan teori-teori pertumbuhan ekonomi!", jawaban: "1. Teori jumlah penduduk optimal\n2. Teori Schumpeter\n3. Teori pertumbuhan neo-klasik\n4. Teori Harrod-Domar (hal. 13)" },
    { id: 37, soal: "Menurut teori jumlah penduduk optimal, apa akibat berlakunya the law of diminishing returns?", jawaban: "Tidak semua penduduk dapat dilibatkan dalam proses produksi (hal. 13)" },
    { id: 250, soal: "Menurut teori jumlah penduduk optimal, apa yang terjadi jika semua penduduk dipaksakan terlibat dalam produksi?", jawaban: "Output akan menurun (hal. 13)" },
    { id: 175, soal: "Menurut teori jumlah penduduk optimal, apa yang harus dilakukan agar penambahan tenaga kerja dapat meningkatkan output?", jawaban: "Harus dilakukan investasi barang modal dan sumber daya manusia yang menunda terjadinya gejala the law of diminishing returns (hal. 13)" },
    { id: 38, soal: "Menurut teori Schumpeter, pertumbuhan ekonomi disebabkan oleh apa?", jawaban: "Inovasi dan pengusaha (hal. 13)" },
    { id: 176, soal: "Menurut teori Schumpeter, apa arti inovasi? Berikan contohnya!", jawaban: "Perbaikan teknologi dalam arti luas, misalnya penemuan produk baru dan pembukaan pasar baru (hal. 13)" },
    { id: 177, soal: "Menurut teori Schumpeter, inovasi menyangkut apa dan bersumber dari mana?", jawaban: "Menyangkut perbaikan kuantitatif dari sistem ekonomi yang bersumber dari kreativitas para wirausahanya (hal. 13)" },
    { id: 39, soal: "Apa fokus pembahasan teori pertumbuhan neo-klasik?", jawaban: "Akumulasi stok barang modal dan keterkaitannya dengan keputusan masyarakat untuk menabung atau melakukan investasi (hal. 13)" },
    { id: 40, soal: "Sebutkan asumsi-asumsi teori pertumbuhan neo-klasik!", jawaban: "1. Tingkat teknologi dianggap konstan (tidak ada kemajuan teknologi)\n2. Tingkat depresiasi dianggap konstan\n3. Tidak ada perdagangan luar negeri atau aliran keluar masuk barang modal\n4. Tidak ada sektor pemerintah\n5. Tingkat pertambahan penduduk (tenaga kerja) juga dianggap konstan (hal. 13)" },
    { id: 41, soal: "Siapa yang mengembangkan teori Harrod-Domar?", jawaban: "Dikembangkan secara terpisah dalam periode yang bersamaan oleh E. S. Domar dan R. F. Harrod (hal. 13)" },
    { id: 178, soal: "Apa pokok pandangan teori Harrod-Domar?", jawaban: "Pentingnya investasi terhadap pertumbuhan ekonomi (hal. 13)" },
    { id: 251, soal: "Menurut Harrod-Domar, mengapa investasi penting bagi pertumbuhan ekonomi?", jawaban: "Sebab investasi meningkatkan stok barang modal yang memungkinkan peningkatan output (hal. 13)" },
    { id: 179, soal: "Menurut teori Harrod-Domar, dari mana sumber dana domestik untuk investasi?", jawaban: "Dari bagian produksi (pendapatan nasional) yang ditabung (hal. 13)" },
    { id: 42, soal: "Sebutkan asumsi yang digunakan dalam teori Harrod-Domar!", jawaban: "1. Semua barang modal dalam perekonomian sudah sepenuhnya digunakan\n2. Perekonomian hanya terdiri atas dua sektor, yaitu rumah tangga dan perusahaan\n3. Tabungan rumah tangga sebanding dengan pendapatan nasional (fungsi tabungan dimulai dari titik nol)\n4. Rasio modal produksi (Capital Output Ratio/COR), yaitu perbandingan pertambahan modal dan pertambahan produksi, adalah tetap (hal. 13)" },
    { id: 43, soal: "Sebutkan faktor-faktor yang memengaruhi pertumbuhan ekonomi!", jawaban: "1. Barang modal\n2. Tenaga kerja\n3. Teknologi\n4. Uang\n5. Manajemen\n6. Kewirausahaan (entrepreneurship)\n7. Informasi (hal. 13–14)" },
    { id: 44, soal: "Bagaimana barang modal memengaruhi pertumbuhan ekonomi?", jawaban: "Stok barang modal harus ditambah melalui investasi (hal. 13)" },
    { id: 180, soal: "Kapan pertumbuhan ekonomi baru dimungkinkan terkait investasi neto?", jawaban: "Jika investasi neto lebih besar dari nol (hal. 13)" },
    { id: 252, soal: "Jika investasi neto sama dengan nol, apa yang terjadi pada perekonomian?", jawaban: "Perekonomian hanya dapat berproduksi pada tingkat sebelumnya (hal. 13)" },

    // ── Hal. 14 — Faktor pertumbuhan lainnya; pengukuran pertumbuhan ekonomi ──
    { id: 45, soal: "Bagaimana tenaga kerja memengaruhi pertumbuhan ekonomi?", jawaban: "Di negara sedang berkembang, tenaga kerja masih merupakan faktor produksi yang sangat dominan (hal. 14)" },
    { id: 253, soal: "Di negara sedang berkembang, bagaimana pengaruh penambahan tenaga kerja terhadap output?", jawaban: "Umumnya sangat berpengaruh terhadap peningkatan output (hal. 14)" },
    { id: 181, soal: "Bagaimana teknologi memengaruhi pertumbuhan ekonomi?", jawaban: "Penggunaan teknologi yang semakin tinggi sangat memacu pertumbuhan ekonomi, jika hanya dilihat dari peningkatan output (hal. 14)" },
    { id: 46, soal: "Bagaimana peran uang dalam perekonomian modern?", jawaban: "Uang memegang peranan dan fungsi sentral (hal. 14)" },
    { id: 182, soal: "Bagaimana hubungan jumlah uang yang digunakan dalam produksi dengan output?", jawaban: "Semakin banyak uang yang digunakan dalam proses produksi, makin besar output (hal. 14)" },
    { id: 183, soal: "Dengan jumlah uang yang sama, kapan output yang dihasilkan bisa lebih besar?", jawaban: "Jika penggunaannya efisien (hal. 14)" },
    { id: 47, soal: "Bagaimana manajemen memengaruhi pertumbuhan ekonomi?", jawaban: "Manajemen adalah peralatan yang sangat dibutuhkan untuk mengelola perekonomian modern (hal. 14)" },
    { id: 254, soal: "Manajemen terutama dibutuhkan oleh perekonomian modern yang mengandalkan apa?", jawaban: "Mekanisme pasar (hal. 14)" },
    { id: 184, soal: "Perekonomian seperti apa yang mampu mempertahankan pertumbuhan ekonomi tinggi berkat manajemen?", jawaban: "Perekonomian yang tidak terlalu mengandalkan teknologi tinggi, namun dengan manajemen yang baik (hal. 14)" },
    { id: 48, soal: "Bagaimana kewirausahaan memengaruhi pertumbuhan ekonomi?", jawaban: "Pengusaha memiliki perkiraan matang bahwa input yang dikombinasikan akan menghasilkan barang/jasa yang dibutuhkan masyarakat (hal. 14)" },
    { id: 185, soal: "Kemampuan mengombinasikan input disebut kemampuan apa?", jawaban: "Kemampuan inovasi (hal. 14)" },
    { id: 186, soal: "Apa syarat pasar berfungsi efisien terkait informasi?", jawaban: "Informasi yang sempurna dan seimbang (hal. 14)" },
    { id: 187, soal: "Bagaimana informasi memengaruhi pertumbuhan ekonomi?", jawaban: "Semakin banyak, benar, dan seimbang arus informasi, pelaku ekonomi dapat mengambil keputusan lebih cepat dan lebih baik (hal. 14)" },
    { id: 49, soal: "Untuk mengukur pertumbuhan ekonomi, nilai PDB apa yang digunakan?", jawaban: "PDB berdasarkan harga konstan (PDB riil) (hal. 14)" },
    { id: 188, soal: "Mengapa pertumbuhan ekonomi diukur dengan PDB harga konstan (PDB riil)?", jawaban: "Agar angka pertumbuhan yang dihasilkan merupakan pertumbuhan riil (hal. 14)" },
    { id: 255, soal: "Pertumbuhan riil terjadi karena apa, dan bukan karena apa?", jawaban: "Karena tambahan produksi, bukan karena pengaruh perubahan harga (hal. 14)" },
    { id: 50, soal: "Apa tujuan utama penghitungan pertumbuhan ekonomi?", jawaban: "Melihat apakah kondisi perekonomian semakin membaik (hal. 14)" },
    { id: 189, soal: "Dari mana ukuran baik atau buruknya pertumbuhan ekonomi dapat dilihat?", jawaban: "Dari struktur produksi maupun dari sisi pengeluaran (hal. 14)" },
    { id: 190, soal: "Apa yang dapat diketahui dari struktur produksi dalam penghitungan pertumbuhan ekonomi?", jawaban: "Apakah ada sektor yang terlalu tinggi atau terlalu lambat pertumbuhannya (hal. 14)" },
    { id: 51, soal: "Tuliskan rumus tingkat pertumbuhan ekonomi jika selang waktunya hanya satu periode!", jawaban: "Gₜ = (PDBₜ − PDBₜ₋₁) ÷ PDBₜ₋₁ × 100%\nGₜ = pertumbuhan ekonomi periode t (triwulanan/tahunan)\nPDBₜ = PDB periode t (harga konstan)\nPDBₜ₋₁ = PDB satu periode sebelumnya (hal. 14)" },
    { id: 52, soal: "Berdasarkan data PDB Indonesia (2023: 1.579,6; 2024: 1.656,8 triliun rupiah), berapa tingkat pertumbuhan ekonomi 2024?", jawaban: "(1.656,8 − 1.579,6) ÷ 1.579,6 × 100% = 4,9% (hal. 14–15)" },
    { id: 191, soal: "Berdasarkan data PDB Indonesia (2024: 1.656,8; 2025: 1.749,5 triliun rupiah), berapa tingkat pertumbuhan ekonomi 2025?", jawaban: "(1.749,5 − 1.656,8) ÷ 1.656,8 × 100% = 5,6% (hal. 14–15)" },
    { id: 192, soal: "Berdasarkan data PDB Indonesia 2023–2025 (pertumbuhan 2024 = 4,9%, 2025 = 5,6%), berapa rata-rata pertumbuhan ekonominya?", jawaban: "5,25% per tahun (hal. 14–15)" },

    // ── Hal. 15 — Rumus multi-periode; latihan; kesenjangan ekonomi ──
    { id: 53, soal: "Tuliskan persamaan pertumbuhan ekonomi jika interval waktunya lebih dari satu periode!", jawaban: "PDBₜ = PDB₀ (1 + r)ᵗ\nPDBₜ = PDB periode t\nPDB₀ = PDB periode awal\nr = tingkat pertumbuhan\nt = jarak periode (hal. 15)" },
    { id: 54, soal: "PDB negara Y tahun 2024 sebesar Rp75 triliun, tahun 2025 meningkat menjadi Rp81 triliun. Berapa tingkat pertumbuhan ekonomi negara Y? (Mari Berlatih)", jawaban: "G = (81 − 75) ÷ 75 × 100% = 8% (hal. 15)" },
    { id: 55, soal: "Mengapa ketimpangan distribusi pendapatan menjadi masalah serius di Indonesia?", jawaban: "Meskipun pertumbuhan ekonomi terus meningkat, hasil pembangunan belum dirasakan merata oleh seluruh lapisan masyarakat (hal. 15)" },
    { id: 193, soal: "Bagaimana gambaran ketimpangan distribusi pendapatan di Indonesia?", jawaban: "Sebagian menikmati pendapatan tinggi serta akses baik ke pendidikan dan kesehatan, sementara sebagian lain masih hidup dengan pendapatan rendah dan fasilitas terbatas (hal. 15)" },
    { id: 56, soal: "Kesenjangan ekonomi tidak hanya berkaitan dengan perbedaan pendapatan, tetapi juga dengan…", jawaban: "Ketidakmerataan kesempatan dan kualitas hidup masyarakat (hal. 15)" },
    { id: 57, soal: "Bagaimana upaya pemerintah untuk mengurangi kesenjangan ekonomi?", jawaban: "Pemerataan pembangunan infrastruktur, peningkatan akses pendidikan dan kesehatan, serta penciptaan lapangan kerja yang merata di berbagai daerah (hal. 15)" },

    // ── Hal. 16 — Pengertian & penyebab kesenjangan ekonomi ──
    { id: 58, soal: "Kesenjangan ekonomi (kesenjangan pendapatan) mengacu pada apa?", jawaban: "Persebaran ukuran ekonomi di antara individu dalam kelompok, kelompok dalam populasi, atau antarnegara (hal. 16)" },
    { id: 59, soal: "Apa pengertian kesenjangan ekonomi menurut Max Weber?", jawaban: "Salah satu tindakan sosial akan menilai ketimpangan sosial sebagai hasil dari perbedaan kepentingan masing-masing individu yang diekspresikan dalam sistem perilaku dan tindakan (hal. 16)" },
    { id: 60, soal: "Apa pengertian kesenjangan ekonomi menurut Robert Chambers?", jawaban: "Suatu gejala yang timbul dalam masyarakat karena adanya perbedaan batas kemampuan finansial dan yang lainnya di antara masyarakat yang hidup di suatu wilayah tertentu (hal. 16)" },
    { id: 61, soal: "Jadi, apa pengertian kesenjangan ekonomi?", jawaban: "Kondisi tidak seimbang yang terjadi di masyarakat berdasarkan aspek ekonomi, terlihat dari tidak seimbangnya pendapatan masyarakat (hal. 16)" },
    { id: 194, soal: "Apa tiga ukuran kesenjangan ekonomi menurut para ekonom?", jawaban: "Kekayaan, pendapatan, dan konsumsi (hal. 16)" },
    { id: 62, soal: "Sebutkan faktor yang memengaruhi kesenjangan ekonomi!", jawaban: "1. Pendapatan yang tidak merata\n2. Kondisi demografi\n3. Kurangnya lapangan kerja\n4. Pembangunan yang tidak merata\n5. Kondisi pendidikan (hal. 16–17)" },
    { id: 63, soal: "Bagaimana pendapatan yang tidak merata menyebabkan kesenjangan ekonomi? Berikan contohnya!", jawaban: "Tingkat pendapatan antardaerah berbeda, misalnya upah perdesaan dan perkotaan tidak sama (hal. 16)" },
    { id: 195, soal: "Masyarakat mana yang berkesempatan mendapat upah lebih tinggi?", jawaban: "Masyarakat perkotaan/industri dibanding perdesaan (hal. 16)" },
    { id: 196, soal: "Bagaimana pengaruh tinggi-rendahnya pendapatan terhadap pemenuhan kebutuhan?", jawaban: "Pendapatan tinggi memudahkan pemenuhan kebutuhan, sedangkan pendapatan rendah menyulitkan (hal. 16)" },
    { id: 64, soal: "Bagaimana kondisi demografi memengaruhi kesenjangan ekonomi?", jawaban: "Kondisi dan komposisi penduduk (jumlah penduduk usia produktif) tiap daerah berbeda (hal. 16)" },
    { id: 197, soal: "Berikan contoh kondisi demografi yang memengaruhi kesenjangan ekonomi!", jawaban: "Banyak masyarakat merantau ke Pulau Jawa, sehingga persebaran penduduk cenderung terpusat di Pulau Jawa (hal. 16)" },
    { id: 256, soal: "Mengapa banyak masyarakat merantau ke Pulau Jawa?", jawaban: "Karena dianggap memberi peluang kerja yang layak (hal. 16)" },
    { id: 65, soal: "Sebutkan penyebab tingginya angka pengangguran!", jawaban: "1. Jumlah angkatan kerja terlalu tinggi di satu wilayah, sedangkan lapangan kerja yang tersedia sangat minim\n2. Rendahnya kualitas sumber daya manusia (lapangan kerja tersedia, tetapi tidak ada SDM yang memenuhi kompetensi) (hal. 16)" },
    { id: 66, soal: "Bagaimana kurangnya lapangan kerja memengaruhi kesenjangan ekonomi?", jawaban: "Ketidaksesuaian jumlah lapangan kerja dengan peminatnya menyebabkan masalah ekonomi (hal. 16)" },
    { id: 257, soal: "Apa akibat sempitnya lapangan kerja?", jawaban: "Memunculkan pengangguran (hal. 16)" },
    { id: 198, soal: "Apa akibatnya jika suatu daerah tidak mampu menciptakan lapangan kerja?", jawaban: "Kesenjangan ekonomi semakin besar (hal. 16)" },

    // ── Hal. 17 — Pembangunan, pendidikan; ketimpangan pendapatan ──
    { id: 67, soal: "Apa manfaat pembangunan infrastruktur yang merata?", jawaban: "Membuat masyarakat di setiap wilayah dapat berkegiatan ekonomi dengan efisien (hal. 17)" },
    { id: 199, soal: "Bagaimana pembangunan yang tidak merata menimbulkan kesenjangan ekonomi?", jawaban: "Rendahnya kemampuan pelaku ekonomi mengakibatkan rendahnya pendapatan, memicu ketidakmampuan memenuhi kebutuhan, sehingga timbul kesenjangan ekonomi (hal. 17)" },
    { id: 68, soal: "Pendidikan diibaratkan sebagai apa dalam meningkatkan kualitas hidup?", jawaban: "Elevator untuk meningkatkan kualitas hidup (hal. 17)" },
    { id: 200, soal: "Bagaimana kondisi pendidikan memengaruhi kesenjangan ekonomi?", jawaban: "Kualitas pendidikan tiap daerah berbeda, sehingga menghasilkan perbedaan kualitas SDM (hal. 17)" },
    { id: 258, soal: "Mengapa kualitas pendidikan tiap daerah berbeda?", jawaban: "Karena perbedaan fasilitas dan mutu (hal. 17)" },
    { id: 201, soal: "Apa peran SDM berkualitas dalam ekonomi?", jawaban: "Menjadi modal menghasilkan standar ekonomi yang tinggi (hal. 17)" },
    { id: 69, soal: "Apa pengertian ketimpangan pendapatan?", jawaban: "Perbedaan pendapatan yang dihasilkan masyarakat sehingga terjadi perbedaan pendapatan yang mencolok dalam masyarakat (hal. 17)" },
    { id: 70, soal: "Bagaimana tingkat ketimpangan pendapatan di negara berkembang?", jawaban: "Ketimpangan lebih besar terjadi di negara yang baru memulai pembangunannya (hal. 17)" },
    { id: 202, soal: "Bagaimana tingkat ketimpangan pendapatan di negara maju (berpendapatan lebih tinggi)?", jawaban: "Pendapatan cenderung lebih merata atau tingkat ketimpangannya rendah (hal. 17)" },
    { id: 71, soal: "Menurut Sukirno, apa yang dimaksud ketimpangan absolut?", jawaban: "Konsep pengukuran ketimpangan yang menggunakan parameter dengan suatu nilai mutlak (hal. 17)" },
    { id: 203, soal: "Menurut Sukirno, apa yang dimaksud ketimpangan relatif?", jawaban: "Konsep pengukuran ketimpangan distribusi pendapatan yang membandingkan pendapatan seseorang/sekelompok anggota masyarakat dengan total pendapatan masyarakat secara keseluruhan (hal. 17)" },
    { id: 72, soal: "Mengapa ketimpangan pendapatan menjadi dimensi penting untuk mengukur kesejahteraan negara menurut Bank Dunia?", jawaban: "Karena implikasinya pada kemampuan untuk mengurangi kemiskinan (hal. 17)" },
    { id: 73, soal: "Menurut Hajiji (2010), ketimpangan pendapatan ditentukan oleh apa?", jawaban: "Tingkat pembangunan suatu negara, heterogenitas etnis, serta adanya kediktatoran dan pemerintahan yang gagal di suatu negara (hal. 17)" },
    { id: 74, soal: "Sebutkan delapan faktor penyebab ketimpangan pendapatan menurut Arsyad (2010)!", jawaban: "1. Pertumbuhan penduduk yang tinggi → pendapatan per kapita menurun\n2. Ketidakmerataan pembangunan antardaerah\n3. Investasi sangat banyak dalam proyek padat modal (capital intensive), sehingga pengangguran bertambah\n4. Inflasi (pendapatan uang bertambah tanpa diikuti pertambahan produksi secara proporsional)\n5. Rendahnya mobilitas sosial\n6. Kebijakan industri substitusi impor yang menaikkan harga barang industri untuk melindungi golongan kapitalis\n7. Memburuknya nilai tukar (term of trade) negara sedang berkembang terhadap negara maju\n8. Hancurnya industri kerajinan rakyat (pertukangan, industri rumah tangga, dll.) (hal. 17–18)" },

    // ── Hal. 18 — Distribusi pendapatan; koefisien Gini ──
    { id: 75, soal: "Apa pengertian distribusi pendapatan?", jawaban: "Suatu ukuran yang digunakan untuk melihat penyebaran pendapatan ataupun pemerataan hasil pembangunan di suatu daerah ataupun negara (hal. 18)" },
    { id: 76, soal: "Sebutkan tujuan penerapan konsep distribusi pendapatan!", jawaban: "1. Memberikan hak dan keadilan bagi setiap warga negara untuk menikmati fasilitas yang sama dan setara\n2. Meningkatkan taraf hidup masyarakat sehingga dapat membangun kesejahteraan umum\n3. Menumbuhkan rasa solidaritas dan sosial yang tinggi antarmasyarakat, seperti penyaluran bantuan\n4. Menurunkan risiko kriminalitas (perampokan, penipuan, pencucian uang) karena setiap orang mampu memenuhi kebutuhannya (hal. 18)" },
    { id: 77, soal: "Sebutkan faktor-faktor yang memengaruhi distribusi pendapatan!", jawaban: "1. Perubahan perdagangan internasional dan perpindahan pekerjaan ke negara dengan biaya tenaga kerja lebih rendah\n2. Otomatisasi dan inovasi yang mengubah struktur pekerjaan dan memengaruhi pendapatan\n3. Diskriminasi yang berujung pada perbedaan pendapatan antara gender dan ras\n4. Tingkat pendidikan yang lebih tinggi sering dikaitkan dengan pendapatan yang lebih tinggi (hal. 18)" },
    { id: 78, soal: "Sebutkan indikator untuk mengetahui ketimpangan distribusi pendapatan!", jawaban: "Koefisien Gini dan kurva Lorenz (hal. 18)" },
    { id: 79, soal: "Apa itu koefisien Gini?", jawaban: "Koefisien atau angka untuk menunjukkan tingkat ketimpangan distribusi pendapatan, bernilai 0 sampai 1 (hal. 18)" },
    { id: 204, soal: "Apa arti koefisien Gini bernilai 0?", jawaban: "Distribusi pendapatan merata sempurna (hal. 18)" },
    { id: 205, soal: "Apa arti koefisien Gini bernilai 1?", jawaban: "Tidak merata secara sempurna (hanya satu pihak yang menerima seluruh pendapatan nasional) (hal. 18)" },
    { id: 80, soal: "Sebutkan manfaat koefisien (indeks) Gini!", jawaban: "1. Mengukur tingkat ketidakmerataan distribusi pendapatan penduduk di berbagai sektor dan negara\n2. Menunjukkan perubahan distribusi pendapatan suatu negara selama periode tertentu (peningkatan atau penurunan ketimpangan)\n3. Menunjukkan ketidaksetaraan melalui alat analisis rasio seperti pendapatan per kapita dan produk domestik bruto (hal. 18)" },

    // ── Hal. 19 — Kurva Lorenz, klasifikasi Bank Dunia, dampak & upaya kesenjangan ──
    { id: 81, soal: "Apa pengertian kurva Lorenz?", jawaban: "Kurva yang menunjukkan hubungan antara persentase pendapatan dengan persentase penerima pendapatan selama kurun waktu tertentu (biasanya diukur dalam waktu setahun) (hal. 19)" },
    { id: 82, soal: "Pada kurva Lorenz, sisi tegak dan sisi dasar bujur sangkar menunjukkan apa?", jawaban: "Sisi tegak = persentase kumulatif pendapatan nasional\nSisi dasar = persentase kumulatif penduduk (hal. 19)" },
    { id: 206, soal: "Apa artinya jika kurva Lorenz semakin dekat ke diagonal (semakin lurus)?", jawaban: "Distribusi pendapatan semakin merata (diagonal = garis kemerataan sempurna) (hal. 19)" },
    { id: 207, soal: "Apa artinya jika kurva Lorenz semakin jauh dari diagonal (semakin lengkung)?", jawaban: "Distribusi pendapatan semakin timpang atau tidak merata (hal. 19)" },
    { id: 83, soal: "Bagaimana Bank Dunia mengukur ketimpangan pendapatan?", jawaban: "Dengan menghitung persentase jumlah pendapatan kelompok berpendapatan rendah dibanding total pendapatan penduduk (hal. 19)" },
    { id: 208, soal: "Sebutkan tiga klasifikasi ketimpangan pendapatan menurut Bank Dunia!", jawaban: "1. Ketimpangan tinggi: 40% penduduk berpendapatan rendah menerima < 12% total pendapatan\n2. Ketimpangan sedang: menerima 12%–17%\n3. Ketimpangan rendah: menerima > 17% (hal. 19)" },
    { id: 84, soal: "Bagaimana dampak kesenjangan ekonomi secara EKONOMI?", jawaban: "Menghambat pertumbuhan karena mengurangi daya beli sebagian masyarakat (hal. 19)" },
    { id: 209, soal: "Bagaimana dampak kesenjangan ekonomi secara SOSIAL?", jawaban: "Memicu konflik, menurunkan kepercayaan sosial, dan melemahkan solidaritas komunitas (hal. 19)" },
    { id: 85, soal: "Sebutkan dampak kesenjangan ekonomi!", jawaban: "1. Meningkatnya angka pengangguran dan kemiskinan\n2. Meningkatnya angka kriminalitas\n3. Target pasar yang tidak menentu\n4. Susah mencari karyawan yang berkualitas, karena latar belakang pendidikan (hal. 19)" },
    { id: 86, soal: "Upaya mengurangi kesenjangan ekonomi melibatkan reformasi struktural seperti apa?", jawaban: "Penguatan sistem perpajakan, peningkatan akses terhadap pendidikan, dan kebijakan yang mendukung pemerataan kesempatan ekonomi (hal. 19)" },
    { id: 87, soal: "Sebutkan upaya mengatasi kesenjangan ekonomi!", jawaban: "1. Menjadikan pendidikan sebagai prioritas\n2. Akses terhadap kesempatan ekonomi\n3. Menyediakan infrastruktur yang memadai\n4. Memperbanyak jumlah lapangan kerja\n5. Subsidi\n6. Menerapkan kebijakan fiskal (hal. 19–20)" },
    { id: 210, soal: "Upaya mengatasi kesenjangan ekonomi merupakan tugas siapa?", jawaban: "Bukan hanya tugas pemerintah, tetapi juga masyarakat (hal. 19–20)" },
    { id: 88, soal: "Mengapa menjadikan pendidikan sebagai prioritas dapat mengatasi kesenjangan ekonomi?", jawaban: "Karena salah satu penyebab kesenjangan adalah pendidikan yang tidak merata (hal. 19)" },
    { id: 259, soal: "Apa solusi kesenjangan ekonomi dari sisi pendidikan?", jawaban: "Meningkatkan kualitas pendidikan secara merata (hal. 19)" },
    { id: 211, soal: "Apa peran pendidikan bagi perekonomian?", jawaban: "Faktor penting untuk memperkuat fondasi perekonomian (hal. 19)" },

    // ── Hal. 20 — Upaya lanjutan; latihan ──
